  // ---------- Brewhouse (Beef's Brewhouse, the deckbuilder) ----------
  // A second Supabase client for Brewhouse's own project, signed in with your Brewhouse account and
  // used only to read your deck list (deckbuilder_list_decks). A deck imported from there keeps its
  // Brewhouse id as `brewhouseDeckId`; Brewhouse then reads this app's brewhouse_deck_records() with
  // your Pairings login to show each deck's tournament record. Its session lives under its own
  // storage key and is dropped whenever you sign out of Pairings.
  const BREWHOUSE_STORAGE_KEY = 'pairings-brewhouse-auth';
  const BREWHOUSE_GAMES = { riftbound: 'Riftbound', onepiece: 'One Piece Card Game', pokemon: 'Pokémon TCG', mtg: 'Magic: The Gathering', yugioh: 'Yu-Gi-Oh!' };
  let brewhouseClient = null;
  function getBrewhouseClient(){
    if(!brewhouseClient){
      brewhouseClient = window.supabase.createClient(BREWHOUSE_SUPABASE_URL, BREWHOUSE_ANON_KEY, {
        auth: { storageKey: BREWHOUSE_STORAGE_KEY, persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
      });
    }
    return brewhouseClient;
  }
  async function brewhouseSession(){
    try{
      const { data } = await getBrewhouseClient().auth.getSession();
      return (data && data.session) || null;
    }catch(e){ return null; }
  }
  async function forgetBrewhouse(){
    // scope 'local': only this browser's Brewhouse session. The default ('global') would also sign
    // you out of Brewhouse and Pawmodoro on every other device.
    if(brewhouseClient){ try{ await brewhouseClient.auth.signOut({ scope: 'local' }); }catch(e){} }
    try{ localStorage.removeItem(BREWHOUSE_STORAGE_KEY); }catch(e){}
  }
  function brewhouseDeckUrl(id){ return BREWHOUSE_APP_URL + '?deck=' + encodeURIComponent(id); }
  function countBrewhouseCards(data){
    let n = 0;
    const zones = data && typeof data.zones === 'object' && data.zones ? data.zones : {};
    Object.values(zones).forEach(list=>{ (Array.isArray(list) ? list : []).forEach(e=>{ const q = e && Number(e.quantity); if(Number.isFinite(q)) n += q; }); });
    return n;
  }
  // Brewhouse's rows are another app's data: check every field before it goes into ours.
  function normalizeBrewhouseDeck(row){
    const data = (row && row.data && typeof row.data === 'object') ? row.data : {};
    const summary = (data.summary && typeof data.summary === 'object') ? data.summary : {};
    const count = Number(row.card_count);
    return {
      id: String(row.id),
      game: BREWHOUSE_GAMES[row.game_id] || 'Other',
      name: (typeof data.name === 'string' && data.name.trim()) || tr('importedDeckDefault'),
      leader: typeof summary.leader === 'string' ? summary.leader : '',
      colors: Array.isArray(summary.colors) ? summary.colors.filter(c=>typeof c === 'string') : [],
      cardCount: Number.isFinite(count) && count > 0 ? count : null,
      format: typeof summary.formatLabel === 'string' ? summary.formatLabel : '',
      // A fingerprint of the card list (Brewhouse 0.20+); a change starts a new deck version here.
      listHash: typeof summary.listHash === 'string' ? summary.listHash.slice(0, 64) : '',
    };
  }
  async function fetchBrewhouseDecks(){
    const client = getBrewhouseClient();
    let { data, error } = await client.rpc('deckbuilder_list_decks');
    if(error && (error.code === 'PGRST202' || /deckbuilder_list_decks/.test(error.message || ''))){
      // Brewhouse's cloud schema not updated yet: the full sync pull has the same decks (and more).
      const pulled = await client.rpc('deckbuilder_sync_pull');
      if(pulled.error) throw pulled.error;
      data = ((pulled.data && pulled.data.decks) || []).map(r=>({ ...r, card_count: countBrewhouseCards(r && r.data) }));
      error = null;
    }
    if(error) throw error;
    return (Array.isArray(data) ? data : []).filter(r=>r && r.id).map(normalizeBrewhouseDeck);
  }
  // Returns whether anything changed. The name follows Brewhouse unless you renamed the deck here:
  // `brewhouseName` is the name last copied from Brewhouse, so a different current name is yours.
  function applyBrewhouseDeck(d, b){
    const snapshot = ()=>JSON.stringify([d.name, d.game, d.legend, d.colors, d.cardCount, d.brewhouseFormat, d.brewhouseHash, d.versions]);
    const before = snapshot();
    // A deck linked before brewhouseName existed (1.13.0) has no record of the name it was imported
    // with, so a name that differs from Brewhouse's is treated as yours rather than reverted.
    const renamedHere = d.brewhouseName != null ? d.name !== d.brewhouseName : (d.name !== b.name && !!d.name);
    d.brewhouseDeckId = b.id;
    if(!renamedHere) d.name = b.name;
    d.brewhouseName = b.name;
    d.game = b.game;
    d.legend = b.leader;
    d.colors = b.colors;
    d.cardCount = b.cardCount;
    d.brewhouseFormat = b.format;
    // The card list changed since the last sync: a new version (or, if nothing was logged with the
    // current one yet, that one takes the change). `brewhouseHash` is also what Brewhouse reads back
    // (brewhouse_deck_records) to remind you when Pairings hasn't seen your latest edit.
    if(b.listHash){
      if(d.brewhouseHash && d.brewhouseHash !== b.listHash) startDeckVersion(d, { cardCount: b.cardCount || undefined });
      d.brewhouseHash = b.listHash;
    }
    return snapshot() !== before;
  }
  // Every linked deck follows its Brewhouse copy; one gone from Brewhouse is left as is. Returns how many changed.
  function applyBrewhouseDecks(list){
    let changed = 0;
    decks.forEach(d=>{
      const b = d.brewhouseDeckId && list.find(x=>x.id === d.brewhouseDeckId);
      if(b && applyBrewhouseDeck(d, b)) changed++;
    });
    return changed;
  }
  // At start-up, if you're still logged in to Brewhouse, pick up deck changes (and new versions)
  // without opening Decks. Quiet: a failure just waits for next time.
  async function refreshBrewhouseDecksQuietly(){
    try{
      if(!userDataLoaded || !decks.some(d=>d.brewhouseDeckId)) return;
      if(!(await brewhouseSession())) return;
      const list = await fetchBrewhouseDecks();
      const changed = applyBrewhouseDecks(list);
      if(changed){
        await saveDecks();
        render();
        showToast(changed === 1 ? tr('bhAutoSyncedOne') : trf('bhAutoSyncedMany', { n: changed }));
      }
    }catch(e){ /* not reachable now; Decks retries when opened */ }
  }

  function openDecksModal(){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `<div class="modal"><h2>${tr('yourDecks')}</h2><div id="decksBody"></div></div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };

    function deckRow(d){
      const metaBits = [d.game || tr('noGameSet')];
      if(d.legend) metaBits.push((d.game && d.game !== 'Riftbound' ? tr('leaderLabel') : tr('legendLabel'))+': '+d.legend);
      if(d.brewhouseFormat) metaBits.push(d.brewhouseFormat);
      if(d.cardCount) metaBits.push(trf('deckCards', { n: d.cardCount }));
      // Decks imported from Piltover Archive before that import was removed keep their link.
      const links = [
        `<a href="#" data-deck-stats="${d.id}" style="color:var(--teal);font-size:11.5px;">📊 ${tr('deckStatsLink')}${deckVersions(d).length > 1 ? ' · ' + trf('versionN', { n: currentDeckVersion(d) }) : ''}</a>`,
        d.brewhouseDeckId ? `<a href="${safeHref(brewhouseDeckUrl(d.brewhouseDeckId))}" target="_blank" rel="noopener" style="color:var(--teal);font-size:11.5px;">${tr('bhOpen')}</a>` : '',
        safeUrl(d.viewLink) ? `<a href="${safeHref(d.viewLink)}" target="_blank" rel="noopener" style="color:var(--teal);font-size:11.5px;">${tr('xDecklist')}</a>` : '',
      ].filter(Boolean);
      return `
        <div class="list-item" id="deckrow-${d.id}">
          <div class="info">
            <div class="n" data-view="${d.id}">${escapeHtml(d.name)}</div>
            <div class="m">${escapeHtml(metaBits.join(' · '))}</div>
            ${links.length ? `<div style="margin-top:4px;display:flex;gap:10px;">${links.join('')}</div>` : ''}
          </div>
          <div style="display:flex;gap:6px;">
            ${d.brewhouseDeckId ? `<button class="mini-btn" data-resync="${d.id}">🔄 ${tr('resync')}</button>` : ''}
            <button class="mini-btn" data-rename="${d.id}">${tr('rename')}</button>
            <button class="mini-btn" data-toggle="${d.id}">${d.active ? tr('retire') : tr('reactivate')}</button>
            <button class="mini-btn decline" data-delete="${d.id}">${tr('delete')}</button>
          </div>
        </div>`;
    }

    function groupByGame(list){
      const groups = {};
      list.forEach(d=>{
        const key = d.game || 'No game set';
        groups[key] = groups[key] || [];
        groups[key].push(d);
      });
      return Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0]));
    }
    function renderGroupedDecks(list){
      if(!list.length) return '';
      const groups = groupByGame(list);
      if(groups.length === 1) return list.map(deckRow).join('');
      return groups.map(([gameName, ds])=>`
        <div style="font-size:12px;color:var(--text-dim);font-weight:600;margin:10px 0 6px;">${gameIcon(gameName)} ${escapeHtml(gameName)}</div>
        ${ds.map(deckRow).join('')}
      `).join('');
    }

    // The Brewhouse box: signed out, loading, failed, or the Brewhouse decks not linked here yet.
    // Kept apart from draw() so it can fill in when the network answers without redrawing the list.
    let bh = { status: 'loading', email: '', decks: [] };
    async function loadBrewhouse(){
      bh = { status: 'loading', email: '', decks: [] };
      drawBrewhouse();
      const sess = await brewhouseSession();
      if(!sess){ bh = { status: 'signedout', email: '', decks: [] }; drawBrewhouse(); return; }
      bh.email = (sess.user && sess.user.email) || '';
      try{ bh.decks = await fetchBrewhouseDecks(); bh.status = 'ready'; }
      catch(e){ bh.status = 'error'; }
      if(bh.status === 'ready'){
        // Linked decks follow their Brewhouse copy without a 🔄 each.
        const changed = applyBrewhouseDecks(bh.decks);
        if(changed){
          await saveDecks();
          draw();
          showToast(changed === 1 ? tr('bhAutoSyncedOne') : trf('bhAutoSyncedMany', { n: changed }));
          return;
        }
      }
      drawBrewhouse();
    }
    function drawBrewhouse(){
      const box = overlay.querySelector('#bhBox');
      if(!box) return;
      const title = `<div class="lbl">🍺 ${tr('bhTitle')}</div><div class="hint" style="margin-bottom:8px;">${tr('bhAbout')} <a href="${safeHref(BREWHOUSE_APP_URL)}" target="_blank" rel="noopener" style="color:var(--teal);">${tr('bhGet')}</a></div>`;
      if(bh.status === 'signedout'){
        box.innerHTML = `${title}
          <div class="hint" style="margin-bottom:6px;">${tr('bhSignInHint')}</div>
          <form id="bhForm" class="field" style="display:flex;flex-wrap:wrap;gap:8px;">
            <input id="bhEmail" type="email" autocomplete="email" placeholder="${escapeAttr(tr('bhEmail'))}" style="flex:1 1 160px;"/>
            <input id="bhPassword" type="password" autocomplete="current-password" placeholder="${escapeAttr(tr('bhPassword'))}" style="flex:1 1 160px;"/>
            <button class="parse-btn" id="bhConnectBtn" type="submit" style="margin-top:0;white-space:nowrap;">${tr('bhConnect')}</button>
          </form>`;
        box.querySelector('#bhForm').onsubmit = async (e)=>{
          e.preventDefault();
          const email = box.querySelector('#bhEmail').value.trim();
          const password = box.querySelector('#bhPassword').value;
          if(!email || !password) return;
          const btn = box.querySelector('#bhConnectBtn');
          btn.disabled = true; btn.textContent = tr('bhConnecting');
          const { error } = await getBrewhouseClient().auth.signInWithPassword({ email, password });
          if(error){ showToast(tr('bhSignInFailed') + (error.message ? ': ' + error.message : '')); btn.disabled = false; btn.textContent = tr('bhConnect'); return; }
          loadBrewhouse();
        };
        return;
      }
      const account = bh.email ? `<div class="hint" style="display:flex;gap:10px;align-items:center;margin-bottom:6px;">${escapeHtml(trf('bhConnectedAs', { email: bh.email }))} <button class="mini-btn" id="bhDisconnect" type="button">${tr('bhDisconnect')}</button></div>` : '';
      let list;
      if(bh.status === 'loading') list = `<div class="modal-sub">${tr('bhLoading')}</div>`;
      else if(bh.status === 'error') list = `<div class="modal-sub">${tr('bhLoadFailed')} <button class="mini-btn" id="bhRetry" type="button">${tr('bhRetry')}</button></div>`;
      else {
        const linked = new Set(decks.map(d=>d.brewhouseDeckId).filter(Boolean));
        const unlinked = bh.decks.filter(b=>!linked.has(b.id));
        if(!bh.decks.length) list = `<div class="modal-sub">${tr('bhNoDecks')}</div>`;
        else if(!unlinked.length) list = `<div class="modal-sub">${tr('bhAllLinked')}</div>`;
        else list = unlinked.map(b=>`
          <div class="list-item">
            <div class="info">
              <div class="n">${escapeHtml(b.name)}</div>
              <div class="m">${escapeHtml([b.game, b.leader, b.format, b.cardCount ? trf('deckCards', { n: b.cardCount }) : ''].filter(Boolean).join(' · '))}</div>
            </div>
            <button class="mini-btn" data-bh-import="${escapeAttr(b.id)}" type="button">${tr('importBtn')}</button>
          </div>`).join('');
      }
      box.innerHTML = title + account + list;
      const disc = box.querySelector('#bhDisconnect');
      if(disc) disc.onclick = async ()=>{ await forgetBrewhouse(); loadBrewhouse(); };
      const retry = box.querySelector('#bhRetry');
      if(retry) retry.onclick = ()=>loadBrewhouse();
      box.querySelectorAll('[data-bh-import]').forEach(btn=>{
        btn.onclick = async ()=>{
          const b = bh.decks.find(x=>x.id === btn.dataset.bhImport);
          if(!b || decks.some(d=>d.brewhouseDeckId === b.id)) return;
          const d = { id: deckUid(), notes: '', active: true, createdAt: Date.now() };
          applyBrewhouseDeck(d, b);
          decks.push(d);
          await saveDecks();
          draw();
          showToast(tr('bhImported'));
        };
      });
    }

    function draw(){
      const body = overlay.querySelector('#decksBody');
      const current = decks.filter(d=>d.active);
      const past = decks.filter(d=>!d.active);
      body.innerHTML = `
        <div class="paste-box" id="bhBox"></div>
        <div class="field">
          <label>${tr('orAddManually')}</label>
          <div class="row2">
            <input id="newDeckName" placeholder="${tr('deckName')}" list="legendOptionsGlobal"/>
            <input id="newDeckGame" list="gameOptions" placeholder="${escapeAttr(tr('gameOptional'))}"/>
          </div>
          <datalist id="gameOptions">${GAMES.map(g=>`<option value="${escapeAttr(g)}">`).join('')}</datalist>
          <datalist id="legendOptionsGlobal">${RIFTBOUND_LEGENDS.map(l=>`<option value="${escapeAttr(l)}">`).join('')}</datalist>
          <button class="mini-btn" id="addDeckBtn" style="margin-top:8px;">+ ${tr('addDeck')}</button>
        </div>
        <div class="section-label">${tr('currentDecks')} (${current.length})</div>
        ${current.length ? renderGroupedDecks(current) : `<div class="modal-sub">${tr('noCurrentDecks')}</div>`}
        <div class="section-label">${tr('pastDecks')} (${past.length})</div>
        ${past.length ? renderGroupedDecks(past) : `<div class="modal-sub">${tr('nothingRetired')}</div>`}
        <div class="modal-actions"><button class="btn-secondary" id="closeDecks" style="flex:1;">${tr('close')}</button></div>
      `;
      drawBrewhouse();

      body.querySelector('#addDeckBtn').onclick = async ()=>{
        const name = body.querySelector('#newDeckName').value.trim();
        const game = body.querySelector('#newDeckGame').value.trim();
        if(!name){ showToast(tr('giveDeckName')); return; }
        decks.push({ id: deckUid(), name, game, notes:'', active:true, createdAt: Date.now() });
        await saveDecks();
        draw();
        showToast(tr('deckAdded'));
      };
      body.querySelectorAll('[data-deck-stats]').forEach(a=>a.onclick = (e)=>{ e.preventDefault(); openDeckStatsModal(a.dataset.deckStats); });
      body.querySelectorAll('[data-resync]').forEach(btn=>{
        btn.onclick = async ()=>{
          const d = decks.find(x=>x.id===btn.dataset.resync);
          if(!d || !d.brewhouseDeckId) return;
          if(!(await brewhouseSession())){ showToast(tr('bhSignInFirst')); return; }
          btn.disabled = true;
          btn.textContent = '🔄 …';
          try{
            const list = await fetchBrewhouseDecks();
            bh = { status: 'ready', email: bh.email, decks: list };
            const b = list.find(x=>x.id === d.brewhouseDeckId);
            if(!b){ showToast(tr('bhGone')); btn.disabled=false; btn.textContent='🔄 ' + tr('resync'); return; }
            applyBrewhouseDeck(d, b);
            await saveDecks();
            draw();
            showToast(tr('bhSynced'));
          }catch(e){ showToast(tr('couldNotSync')); btn.disabled=false; btn.textContent='🔄 ' + tr('resync'); }
        };
      });
      body.querySelectorAll('[data-rename]').forEach(btn=>{
        btn.onclick = async ()=>{
          const d = decks.find(x=>x.id===btn.dataset.rename);
          if(!d) return;
          const newName = prompt(tr('renameDeck'), d.name);
          if(newName === null) return;
          const trimmed = newName.trim();
          if(!trimmed){ showToast(tr('nameEmpty')); return; }
          d.name = trimmed;
          await saveDecks();
          draw();
          showToast(tr('deckRenamed'));
        };
      });
      body.querySelectorAll('[data-toggle]').forEach(btn=>{
        btn.onclick = async ()=>{
          const d = decks.find(x=>x.id===btn.dataset.toggle);
          if(!d) return;
          d.active = !d.active;
          draw();
          showToast(d.active ? tr('deckCurrent') : tr('deckRetired'));
          await saveDecks();
        };
      });
      body.querySelectorAll('[data-delete]').forEach(btn=>{
        btn.onclick = async ()=>{
          if(!confirm(tr('confirmDeleteDeck'))) return;
          markDeleted('decks', btn.dataset.delete);
          decks = decks.filter(x=>x.id!==btn.dataset.delete);
          await saveDecks();
          draw();
          showToast(tr('deckDeleted'));
        };
      });
      body.querySelector('#closeDecks').onclick = ()=>overlay.remove();
    }
    draw();
    loadBrewhouse();
  }

  // ---------- Account modal ----------
  // Player Card — your IDs in one place, big enough to read out or show a
  // clerk at registration, with one-tap copy for each.
  // ---------- Pokémon events near you (data from pokedata.ovh) ----------
  // Reads ONLY from our own cached table — never calls pokedata directly
  // from the browser. See the sync-pokedata Edge Function for the fetch.
  function haversineKm(lat1, lng1, lat2, lng2){
    const R = 6371, toRad = d => d*Math.PI/180;
    const dLat = toRad(lat2-lat1), dLng = toRad(lng2-lng1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.sqrt(a));
  }

  // ---------- Result cards ----------
  // A shareable 1080×1350 image of one finished result (Instagram feed size; fine in
  // Discord and stories too), drawn on a canvas in the current theme's colours, with a
  // small link to the app at the bottom. Works for any past result, recurring or not,
  // from before this feature existed too: it only reads what the result form saves.
  const CARD_W = 1080, CARD_H = 1350;

  // Every finished result, newest first (all history, not just the Past tab's window).
  function allLoggedResults(){
    const today = todayStr(), out = [];
    tournaments.forEach(t=>{
      if(!isRepeating(t)){
        if(t.result && t.date) out.push({ t, date: t.date, result: t.result });
      } else {
        Object.entries(t.occurrences || {}).forEach(([date, o])=>{ if(o && o.result && !o.skip) out.push({ t, date, result: o.result }); });
      }
    });
    return out.filter(r => !r.result.inProgress && r.date <= today).sort((a,b)=> b.date.localeCompare(a.date));
  }
  function isShareableResult(result){
    return !!(result && !result.inProgress && (result.placement || result.record || (result.matches && result.matches.length)));
  }
  // Record as typed, else counted from the rounds ("3-1", "2-1-1").
  function resultRecordText(result){
    if(result.record) return String(result.record).trim();
    const n = { W:0, L:0, D:0 };
    (result.matches || []).forEach(m=>{ if(n[m.outcome] != null) n[m.outcome]++; });
    if(!n.W && !n.L && !n.D) return '';
    return n.W + '-' + n.L + (n.D ? '-' + n.D : '');
  }
  function resultCardData(t, date, result){
    const base = {
      name: t.name || tr('untitledEvent'), where: [t.store, t.city].filter(Boolean).join(' · '),
      date: new Date(date + 'T00:00:00').toLocaleDateString(dateLocale(), { weekday:'short', month:'short', day:'numeric', year:'numeric' }),
      placement: String(result.placement || '').trim(), record: resultRecordText(result),
    };
    const pieceDeckName = r => { const d = r.deckId && decks.find(x=>x.id===r.deckId); return d ? d.name : (r.deck || ''); };
    const pieceLeader = r => String(r.leader || deckLeaderName(r.deckId && decks.find(x=>x.id===r.deckId)) || '').trim();
    if(isMixedResult(result)){
      // A session with several decks: every deck on the card, each round labelled with its own,
      // and the picture of the one played the most.
      const pieces = resultPieces(t, result).filter(p => p.result.matches.some(m => m.opponent || m.outcome));
      const games = [...new Set(pieces.map(p=>p.game).filter(Boolean))];
      const deckNames = [...new Set(pieces.map(p=>pieceDeckName(p.result)).filter(Boolean))];
      const labelOf = new Map();
      pieces.forEach(p=>{ const label = pieceDeckName(p.result) || pieceLeader(p.result); p.result.matches.forEach(m=>labelOf.set(m, label)); });
      const top = pieces.filter(p=>pieceLeader(p.result) && leaderGameKey(p.game)).sort((a,b)=>b.result.matches.length - a.result.matches.length)[0];
      return { ...base,
        game: games.join(' / '), icon: games.length === 1 ? gameIcon(games[0]) : '🎴',
        deck: deckNames.join(' · '), decksLabel: deckNames.length > 1, leader: '',
        artGame: top ? top.game : '', artLeader: top ? pieceLeader(top.result) : '',
        matches: (result.matches || []).filter(m => m.opponent || m.outcome).map(m => ({ ...m, deckLabel: labelOf.get(m) || '' })),
      };
    }
    const leader = pieceLeader(result);
    return { ...base,
      game: t.game || '', icon: t.game ? gameIcon(t.game) : '🎴',
      deck: pieceDeckName(result), leader,
      artGame: t.game || '', artLeader: leader,
      matches: (result.matches || []).filter(m => m.opponent || m.outcome),
    };
  }

  // The leader/legend's card picture, for the result card. The card sites (Riot's CDN, optcgapi)
  // send no CORS header, so a canvas that drew their pictures straight could no longer be saved;
  // they come through wsrv.nl, a free image proxy that adds one (Brewhouse does the same), which
  // only ever sees the card picture's address. Resolves to a loaded image, or null (no picture,
  // offline, or nothing after 6 s), and the card is drawn without one.
  const CARD_ART_PROXY = 'https://wsrv.nl/?url=';
  async function loadCardArt(gameKey, leader){
    const url = await leaderImageUrl(gameKey, leader).catch(()=>'');
    if(!url) return null;
    return new Promise(resolve=>{
      const img = new Image();
      const done = ok => { clearTimeout(timer); img.onload = img.onerror = null; resolve(ok && img.naturalWidth ? img : null); };
      const timer = setTimeout(()=>done(false), 6000);
      img.crossOrigin = 'anonymous';
      img.onload = ()=>done(true);
      img.onerror = ()=>done(false);
      img.src = CARD_ART_PROXY + encodeURIComponent(url) + '&w=800&output=jpg';
    });
  }
  // '#rrggbb' / '#rgb' with an alpha, for gradients over the art.
  function colorWithAlpha(color, a){
    let h = String(color || '').trim().replace(/^#/, '');
    if(h.length === 3) h = h.split('').map(c=>c+c).join('');
    if(!/^[0-9a-f]{6}$/i.test(h)) return `rgba(16,14,26,${a})`;
    return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`;
  }
  // The card's art (its top part, where the illustration is) across the whole background,
  // slightly blurred and faded into the theme's background so the text stays readable. One Piece
  // scans carry a "SAMPLE" mark across the middle (every public source has it), so only the part
  // above it is used.
  function drawCardArtBackground(ctx, img, bg, gameKey){
    const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
    const sh = ih * (gameKey === 'onepiece' ? 0.4 : 0.58), sy = ih * (gameKey === 'onepiece' ? 0.02 : 0.04);
    const sw = Math.min(iw, sh * CARD_W / CARD_H), sx = (iw - sw) / 2;
    const bleed = 40;   // drawn past the edges so the blur doesn't fade them
    if('filter' in ctx){
      ctx.save(); ctx.filter = 'blur(7px)';
      ctx.drawImage(img, sx, sy, sw, sh, -bleed, -bleed, CARD_W + bleed * 2, CARD_H + bleed * 2);
      ctx.restore();
    } else {
      // Safari has no canvas filters: drawing it small and scaling it back up blurs it about as much.
      const small = document.createElement('canvas');
      small.width = Math.round(CARD_W / 6); small.height = Math.round(CARD_H / 6);
      small.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, small.width, small.height);
      ctx.save(); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(small, -bleed, -bleed, CARD_W + bleed * 2, CARD_H + bleed * 2);
      ctx.restore();
    }
    const fade = ctx.createLinearGradient(0, 0, 0, CARD_H);
    fade.addColorStop(0, colorWithAlpha(bg, 0.55));
    fade.addColorStop(0.35, colorWithAlpha(bg, 0.72));
    fade.addColorStop(0.7, colorWithAlpha(bg, 0.9));
    fade.addColorStop(1, colorWithAlpha(bg, 0.96));
    ctx.fillStyle = fade; ctx.fillRect(0, 0, CARD_W, CARD_H);
  }
  // The whole card, small and slightly tilted, in the top-right corner.
  function drawCornerCard(ctx, img, box, line){
    ctx.save();
    ctx.translate(box.x + box.w / 2, box.y + box.h / 2);
    ctx.rotate(4 * Math.PI / 180);
    const x = -box.w / 2, y = -box.h / 2, r = box.w * 0.05;
    const shape = ()=>{ ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x, y, box.w, box.h, r); else ctx.rect(x, y, box.w, box.h); };
    ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18;
    shape(); ctx.fillStyle = '#000'; ctx.fill();
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    shape(); ctx.save(); ctx.clip(); ctx.drawImage(img, x, y, box.w, box.h); ctx.restore();
    shape(); ctx.lineWidth = 3; ctx.strokeStyle = line; ctx.stroke();
    ctx.restore();
  }

  function drawResultCard(canvas, d, art){
    canvas.width = CARD_W; canvas.height = CARD_H;
    const ctx = canvas.getContext('2d');
    const css = getComputedStyle(document.documentElement);
    const v = name => (css.getPropertyValue('--' + name) || '').trim();
    const C = { bg: v('void') || '#100e1a', panel: v('panel-2') || '#1f1b33', line: v('line') || '#2c2745',
      text: v('text') || '#eeeaf7', dim: v('text-dim') || '#a49bc4', accent: v('rift-2') || '#c084fc',
      teal: v('teal') || '#2dd9c1', rose: v('rose') || '#f0678a', amber: v('amber') || '#f5b656', rift: v('rift') || '#8b5cf6' };
    const HEAD = "'Space Grotesk', 'Inter', sans-serif", BODY = "'Inter', sans-serif";
    const P = 84, maxW = CARD_W - P * 2;

    // Background (the leader's card art when there is one) with the app's two soft glows.
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, CARD_W, CARD_H);
    if(art) drawCardArtBackground(ctx, art, C.bg, leaderGameKey(d.artGame));
    const glow = (x, y, r, color, a)=>{
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      ctx.globalAlpha = a; g.addColorStop(0, color); g.addColorStop(1, 'transparent');
      ctx.fillStyle = g; ctx.fillRect(0, 0, CARD_W, CARD_H); ctx.globalAlpha = 1;
    };
    glow(120, -60, 820, C.rift, 0.30);
    glow(CARD_W + 60, CARD_H + 60, 760, C.teal, 0.16);
    // The card itself in the corner; the text beside it is kept narrower until it's past it.
    let cardBox = null;
    if(art){
      const w = 250, h = Math.round(w * ((art.naturalHeight || art.height) / (art.naturalWidth || art.width) || 1.4));
      cardBox = { x: CARD_W - P - w + 6, y: P + 86, w, h };
      drawCornerCard(ctx, art, cardBox, C.line);
    }
    const widthAt = top => cardBox && top < cardBox.y + cardBox.h + 30 ? maxW - cardBox.w - 44 : maxW;

    const fit = (text, font, width)=>{   // one line, shortened with … if needed
      ctx.font = font; let s = String(text);
      if(ctx.measureText(s).width <= width) return s;
      while(s.length > 1 && ctx.measureText(s + '…').width > width) s = s.slice(0, -1);
      return s.trimEnd() + '…';
    };
    const wrap = (text, font, width, maxLines)=>{
      ctx.font = font; const words = String(text).split(/\s+/); const lines = []; let line = '';
      words.forEach(w=>{ const tryLine = line ? line + ' ' + w : w; if(ctx.measureText(tryLine).width <= width || !line) line = tryLine; else { lines.push(line); line = w; } });
      if(line) lines.push(line);
      if(lines.length > maxLines){ lines.length = maxLines; lines[maxLines-1] = fit(lines[maxLines-1] + ' …', font, width); }
      return lines.map(l => fit(l, font, width));
    };

    let y = P + 10;
    // Game and date.
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = C.dim; ctx.font = `600 34px ${BODY}`;
    ctx.fillText(fit((d.icon ? d.icon + '  ' : '') + d.game, `600 34px ${BODY}`, maxW * 0.55), P, y + 30);
    ctx.textAlign = 'right'; ctx.font = `500 32px ${BODY}`; ctx.fillText(d.date, CARD_W - P, y + 30); ctx.textAlign = 'left';
    y += 150;

    // Event name and place.
    ctx.fillStyle = C.text;
    wrap(d.name, `700 76px ${HEAD}`, widthAt(y - 70), 2).forEach(l=>{ ctx.font = `700 76px ${HEAD}`; ctx.fillText(l, P, y); y += 88; });
    if(d.where){ ctx.fillStyle = C.dim; ctx.font = `500 36px ${BODY}`; ctx.fillText(fit(d.where, ctx.font, widthAt(y - 36)), P, y); y += 20; }
    y += 70;

    // The result: placement big in the accent gradient, record beside or below it.
    const big = d.placement || d.record;
    const small = d.placement ? d.record : '';
    if(big){
      const bigFont = `700 ${big.length > 7 ? 120 : 170}px ${HEAD}`;
      const bigW = widthAt(y);
      ctx.font = bigFont;
      const bigText = fit(big, bigFont, bigW);
      const bw = ctx.measureText(bigText).width;
      const g = ctx.createLinearGradient(P, 0, P + Math.max(bw, 1), 0);
      g.addColorStop(0, C.accent); g.addColorStop(1, C.teal);
      ctx.fillStyle = g; ctx.fillText(bigText, P, y + 130);
      if(small){
        ctx.font = `700 76px ${HEAD}`;
        const sw = ctx.measureText(small).width;
        ctx.fillStyle = C.text;
        if(bw + 50 + sw <= bigW) ctx.fillText(small, P + bw + 50, y + 130);
        else { y += 100; ctx.fillText(fit(small, ctx.font, maxW), P, y + 130); }
      }
      y += 200;
    }

    // Deck and leader.
    const deckLine = [d.deck, d.leader && d.leader !== d.deck ? d.leader : ''].filter(Boolean).join(' · ');
    if(deckLine){
      ctx.fillStyle = C.dim; ctx.font = `600 30px ${BODY}`; ctx.fillText(tr(d.decksLabel ? 'cardDecks' : 'cardDeck').toUpperCase(), P, y); y += 50;
      ctx.fillStyle = C.text; ctx.font = `600 44px ${BODY}`; ctx.fillText(fit(deckLine, ctx.font, widthAt(y - 44)), P, y); y += 70;
    }

    // Rounds, as many as fit above the footer.
    const footerTop = CARD_H - P - 40;
    if(d.matches.length){
      y += 10;
      ctx.fillStyle = C.dim; ctx.font = `600 30px ${BODY}`; ctx.fillText(tr('cardRounds').toUpperCase(), P, y); y += 24;
      const rowH = d.matches.length > 6 ? 58 : 66, room = Math.max(0, Math.floor((footerTop - 30 - y) / rowH));
      const shown = d.matches.length > room ? d.matches.slice(0, Math.max(0, room - 1)) : d.matches;
      const oc = { W: [C.teal, tr('cardW')], L: [C.rose, tr('cardL')], D: [C.amber, tr('cardD')] };
      shown.forEach((m, i)=>{
        const top = y + i * rowH;
        ctx.fillStyle = C.panel; ctx.beginPath();
        if(ctx.roundRect) ctx.roundRect(P, top, maxW, rowH - 12, 14); else ctx.rect(P, top, maxW, rowH - 12);
        ctx.fill();
        const mid = top + (rowH - 12) / 2 + 12;
        ctx.fillStyle = C.dim; ctx.font = `600 30px ${BODY}`; ctx.fillText(tr('cardRoundShort') + (i + 1), P + 26, mid);
        ctx.fillStyle = C.text; ctx.font = `500 34px ${BODY}`;
        const vs = m.opponent ? tr('cardVs') + ' ' + m.opponent : '—';
        ctx.fillText(fit(m.deckLabel ? m.deckLabel + ' ' + vs : vs, ctx.font, maxW - 280), P + 110, mid);
        if(oc[m.outcome]){ ctx.fillStyle = oc[m.outcome][0]; ctx.font = `700 34px ${HEAD}`; ctx.textAlign = 'right'; ctx.fillText(oc[m.outcome][1], CARD_W - P - 26, mid); ctx.textAlign = 'left'; }
      });
      if(shown.length < d.matches.length){
        ctx.fillStyle = C.dim; ctx.font = `500 30px ${BODY}`;
        ctx.fillText(trf('cardMoreRounds', { n: d.matches.length - shown.length }), P + 26, y + shown.length * rowH + 30);
      }
    }

    // Footer: a small, quiet link to the app.
    const host = location.host.replace(/^www\./, '');
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = C.dim; ctx.font = `500 26px ${BODY}`; ctx.textAlign = 'right';
    ctx.fillText('Pairings · ' + host, CARD_W - P, CARD_H - P + 20);
    ctx.textAlign = 'left'; ctx.globalAlpha = 1;
  }

  async function openResultCardModal(t, date, result){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <div class="modal">
        <h2>📸 ${tr('cardTitle')}</h2>
        <div class="modal-sub">${tr('cardSub')}</div>
        <canvas id="resultCanvas" role="img" aria-label="${escapeAttr(tr('cardTitle') + ': ' + (t.name || ''))}" style="width:100%;height:auto;border-radius:12px;border:1px solid var(--line);display:block;"></canvas>
        <div class="modal-actions">
          <button class="btn-secondary" id="cardSave" style="flex:1;">⬇️ ${tr('cardSave')}</button>
          <button class="btn-primary" id="cardShare" style="flex:1;">${tr('cardShare')}</button>
        </div>
        <div class="modal-actions" style="margin-top:0;"><button class="btn-secondary" id="cardClose" style="flex:1;">${tr('close')}</button></div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
    overlay.querySelector('#cardClose').onclick = ()=>overlay.remove();
    const canvas = overlay.querySelector('#resultCanvas');
    // The canvas needs the web fonts loaded, or it draws in a fallback font.
    try{ if(document.fonts) await Promise.race([Promise.all([
      document.fonts.load("700 76px 'Space Grotesk'"), document.fonts.load("600 34px 'Inter'"), document.fonts.load("500 34px 'Inter'")
    ]), new Promise(r => setTimeout(r, 2500))]); }catch(_){}
    const data = resultCardData(t, date, result);
    try{ drawResultCard(canvas, data); }catch(e){ showToast(tr('cardFailed')); return; }
    // The leader's card art arrives in the background; the card is drawn again with it.
    let withArt = false;
    const artKey = leaderGameKey(data.artGame);
    if(artKey && data.artLeader) loadCardArt(artKey, data.artLeader).then(img=>{
      if(!img || !overlay.isConnected) return;
      try{ drawResultCard(canvas, data, img); withArt = true; }catch(_){ drawResultCard(canvas, data); }
    });

    const fileName = ('pairings-' + (t.name || 'result') + '-' + date).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.png';
    const blobOf = ()=> new Promise(res => { try{ canvas.toBlob(b => res(b), 'image/png'); }catch(_){ res(null); } });
    // If the browser won't export the art after all, the plain card still saves.
    const toBlob = async ()=>{
      let b = await blobOf();
      if(!b && withArt){ withArt = false; drawResultCard(canvas, data); b = await blobOf(); }
      return b;
    };
    const save = async ()=>{
      const blob = await toBlob();
      if(!blob){ showToast(tr('cardFailed')); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fileName; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      trackFeature('result_card_save');
    };
    overlay.querySelector('#cardSave').onclick = save;
    const shareBtn = overlay.querySelector('#cardShare');
    shareBtn.onclick = async ()=>{
      const blob = await toBlob();
      if(!blob){ showToast(tr('cardFailed')); return; }
      const file = new File([blob], fileName, { type: 'image/png' });
      if(navigator.canShare && navigator.canShare({ files: [file] })){
        try{ await navigator.share({ files: [file], title: data.name }); trackFeature('result_card_share'); }
        catch(e){ if(e && e.name !== 'AbortError') save(); }
      } else {
        // Desktop browsers mostly can't share files: save it instead.
        await save();
        showToast(tr('cardSavedInstead'));
      }
    };
  }

  // ---------- Themes ----------
  // Colour themes are CSS-variable overrides on <html data-theme="…"> (the :root[data-theme]
  // blocks in <style>). The choice is kept per device in localStorage ('pairings-theme') and
  // applied by the small script in <head> before the first paint; "auto" follows the
  // device's light/dark setting. Swatches show each theme's background, accent and teal.
  const THEMES = [
    { id:'auto',     get label(){ return tr('themeAuto'); },     swatch:['#100e1a','#f3f1f9'] },
    { id:'rift',     get label(){ return tr('themeRift'); },     swatch:['#100e1a','#8b5cf6','#2dd9c1'] },
    { id:'ocean',    get label(){ return tr('themeOcean'); },    swatch:['#0a1120','#3b82f6','#2dd4bf'] },
    { id:'ember',    get label(){ return tr('themeEmber'); },    swatch:['#160d0b','#f97316','#fbbf24'] },
    { id:'forest',   get label(){ return tr('themeForest'); },   swatch:['#0b130e','#22c55e','#2dd9c1'] },
    { id:'midnight', get label(){ return tr('themeMidnight'); }, swatch:['#000000','#8b5cf6','#2dd9c1'] },
    { id:'daylight', get label(){ return tr('themeDaylight'); }, swatch:['#f3f1f9','#7c3aed','#0f766e'] },
  ];
  // Each theme's page background, for the browser/phone toolbar colour.
  const THEME_BG = { rift:'#100e1a', ocean:'#0a1120', ember:'#160d0b', forest:'#0b130e', midnight:'#000000', daylight:'#f3f1f9' };
  function savedTheme(){
    try{ const t = localStorage.getItem('pairings-theme'); return THEMES.some(x=>x.id===t) ? t : 'rift'; }catch(_){ return 'rift'; }
  }
  function resolveTheme(id){
    if(id === 'auto') return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'daylight' : 'rift';
    return THEME_BG[id] ? id : 'rift';
  }
  function applyTheme(id){
    const t = resolveTheme(id);
    if(t === 'rift') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
    const meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute('content', THEME_BG[t]);
  }
  function setTheme(id){
    if(id !== savedTheme()) trackFeature('theme_change');
    try{ localStorage.setItem('pairings-theme', id); }catch(_){}
    applyTheme(id);
  }
  applyTheme(savedTheme());
  try{ window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', ()=>{ if(savedTheme() === 'auto') applyTheme('auto'); }); }catch(_){}

  // Official events near the user's home city, read live from the game's own site.
  // A source says how to load one page: load(km, cursor) → { items, next }, where
  // each item is { event (ready to save, from riftboundToEvent / bandaiToEvent), bits
  // (the small grey details line) }, and next is the cursor for "Show more" or null.
  function riftboundFinderSource(){
    return {
      key: 'riftbound', icon: '🌀', title: tr('rbTitle'), intro: tr('rbIntro'), none: km => trf('rbNone', { km }),
      loadFailed: tr('rbLoadFailed'), siteLabel: 'playriftbound.com', siteUrl: riftboundEventsUrl(),
      async load(km, cursor){
        const p = await callRiftboundEvents({ near: { lat: profile.home_lat, lng: profile.home_lng, km, after: cursor || undefined } });
        if(!p || !Array.isArray(p.events)) throw new Error(p && p.error || 'no events');
        const today = todayStr();
        const items = p.events.filter(e => riftboundDateTime(e).date >= today).map(e => ({
          event: riftboundToEvent(e),
          bits: [
            e.distanceKm != null ? Math.round(e.distanceKm) + ' ' + tr('pokeAway') : '',
            riftboundTypeLabel(e.type), riftboundFee(e) === 'Free' ? tr('finderFree') : riftboundFee(e),
            e.capacity ? trf('rbRegistered', { n: e.registered || 0, cap: e.capacity }) : ''
          ]
        }));
        return { items, next: p.nextCursor || null };
      }
    };
  }
  function onePieceFinderSource(){
    const PAGE = 100;
    return {
      key: 'onepiece', icon: '🏴‍☠️', title: tr('opTitle'), intro: tr('opIntro'), none: km => trf('opNone', { km }),
      loadFailed: tr('opLoadFailed'), siteLabel: 'Bandai TCG+', siteUrl: BANDAI_WEB + '/event',
      async load(km, cursor){
        const offset = cursor || 0;
        const p = await bandaiGet('/api/user/event/list', {
          game_title_id: BANDAI_ONE_PIECE, limit: PAGE, offset, start_date: todayStr(), order: 1,
          current_lat: profile.home_lat, current_lng: profile.home_lng, distance: km
        });
        if(!p || !Array.isArray(p.event_list)) throw new Error('no events');
        const items = p.event_list.filter(e => !e.is_canceled).map(e => {
          const fee = bandaiFee(e);
          return {
            event: bandaiToEvent(e),
            bits: [
              typeof e.distance === 'number' ? Math.round(e.distance) + ' ' + tr('pokeAway') : '',
              fee === 'Free' ? tr('finderFree') : fee,
              e.max_join_count && !e.is_capacity_hidden ? trf('opSpots', { cap: e.max_join_count }) : ''
            ]
          };
        });
        const seen = offset + p.event_list.length;
        return { items, next: p.event_list.length && seen < Number(p.total || 0) ? seen : null };
      }
    };
  }

  function magicFinderSource(){
    const PAGE = 100;
    return {
      key: 'magic', icon: '🧙', title: tr('mtgTitle'), intro: tr('mtgIntro'), none: km => trf('mtgNone', { km }),
      loadFailed: tr('mtgLoadFailed'), siteLabel: 'Wizards Store & Event Locator', siteUrl: WIZARDS_WEB + '/',
      async load(km, cursor){
        const page = cursor || 0;
        const d = await wizardsQuery(`query ($lat: Float!, $lng: Float!, $maxMeters: Int!, $page: Int, $pageSize: Int) {
          advancedSearchEvents(query: { lat: $lat, lng: $lng, maxMeters: $maxMeters, sort: date, sortDirection: Asc, page: $page, pageSize: $pageSize }) {
            events { ${WIZARDS_EVENT_FIELDS} }
            pageInfo { page pageSize totalResults }
          } }`, { lat: profile.home_lat, lng: profile.home_lng, maxMeters: Math.round(km * 1000), page, pageSize: PAGE });
        const r = d && d.advancedSearchEvents;
        if(!r || !Array.isArray(r.events)) throw new Error('no events');
        const today = todayStr();
        const items = r.events
          .filter(e => isMagicEvent(e) && !/CANCEL/i.test(e.status || '') && wizardsDateTime(e).date >= today)
          .map(e => {
            const fee = wizardsFee(e);
            const fmt = e.eventFormat && e.eventFormat.name;
            return {
              event: wizardsToEvent(e),
              bits: [
                typeof e.distance === 'number' ? Math.round(e.distance / 1000) + ' ' + tr('pokeAway') : '',
                fmt && fmt !== 'Other' ? fmt : '',
                fee === 'Free' ? tr('finderFree') : fee,
                e.capacity ? trf('opSpots', { cap: e.capacity }) : ''
              ]
            };
          });
        const total = Number((r.pageInfo || {}).totalResults || 0);
        return { items, next: r.events.length && (page + 1) * PAGE < total ? page + 1 : null };
      }
    };
  }

  function openEventFinderModal(src){
    trackFeature('finder_' + src.key);
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `<div class="modal"><h2>${src.icon} ${escapeHtml(src.title)}</h2><div id="efBody"><div class="modal-sub">${tr('loadingDots')}</div></div></div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
    const body = overlay.querySelector('#efBody');

    if(profile.home_lat == null || profile.home_lng == null){
      body.innerHTML = `
        <div class="empty-state">
          <div class="big">${tr('pokeSetCity')}</div>
          <div>${tr('pokeSetCityBody')}</div>
        </div>
        <div class="modal-actions"><button class="btn-primary" id="efGoAccount" style="flex:1;">${tr('pokeOpenAccount')}</button></div>`;
      body.querySelector('#efGoAccount').onclick = ()=>{ overlay.remove(); openAccountModal(); };
      return;
    }

    let radiusKm = 80;
    let items = [], next = null, failed = false, loading = false;
    let loadToken = 0; // a radius change while a page is loading drops that page

    async function load(more){
      const token = ++loadToken;
      loading = true;
      if(!more){ items = []; next = null; failed = false; }
      draw();
      try{
        const page = await src.load(radiusKm, more ? next : null);
        if(token !== loadToken) return;
        items = items.concat(page.items);
        next = page.next;
      }catch(e){
        if(token !== loadToken) return;
        failed = true;
      }
      loading = false;
      draw();
    }

    function draw(){
      if(!overlay.isConnected) return;
      const radiusChips = [40,80,160].map(r=>
        `<button class="chip ${radiusKm===r?'active':''}" data-ef-radius="${r}">${r} km</button>`).join('');
      const rows = items.map(({ event: ev, bits }, i)=>`
          <div class="list-item">
            <div class="info">
              <div class="n">${escapeHtml(ev.name)}</div>
              <div class="m">${fmtFriendly(ev.date, ev.time)} · ${escapeHtml(ev.store||'')}${ev.city?' · '+escapeHtml(ev.city):''}</div>
              <div class="m" style="font-size:11px;">${bits.filter(Boolean).map(escapeHtml).join(' · ')}</div>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;">
              ${safeUrl(ev.link)?`<a class="mini-btn" href="${safeHref(ev.link)}" target="_blank" rel="noopener">${tr('pokeDetails')} ↗</a>`:''}
              <button class="mini-btn" data-ef-add="${i}">${tr('pokeAdd')}</button>
            </div>
          </div>`).join('');
      let status = '';
      if(failed) status = `<div class="modal-sub">${escapeHtml(src.loadFailed)}</div>`;
      else if(loading) status = `<div class="modal-sub">${tr('loadingDots')}</div>`;
      else if(!items.length) status = `<div class="modal-sub">${escapeHtml(src.none(radiusKm))}</div>`;
      body.innerHTML = `

      body.querySelector('#closeEf').onclick = ()=>overlay.remove();
      const more = body.querySelector('#efMore');

      body.querySelectorAll('[data-ef-radius]').forEach(btn=>{
        btn.onclick = ()=>{ radiusKm = parseInt(btn.dataset.efRadius,10); load(false); };

        const ev = items[parseInt(btn.dataset.efAdd,10)].event;
        if(isDuplicateEvent(ev)){ btn.textContent = tr('xAlreadyHaveIt'); btn.disabled = true; return; }

          showToast(tr('xAddedToYourCalendar'));

        };
      });

    load(false);
  }

        .filter(e => e.km <= radiusKm)

      const radiusChips = [50,100,200,400].map(r=>
        `<button class="chip ${radiusKm===r?'active':''}" data-poke-radius="${r}">${r} km</button>`).join('');

              <div class="n">${escapeHtml(e.name||tr('pokemonEventDefault'))}</div>
              <div class="m">${fmtFriendly(e.date, e.time)} · ${escapeHtml(e.shop||'')}${e.city?' · '+escapeHtml(e.city):''}</div>
              <div class="m" style="font-size:11px;">${Math.round(e.km)} ${tr('pokeAway')}${e.event_type?' · '+escapeHtml(e.event_type):''}${e.cost?' · '+escapeHtml(e.cost):''}</div>

        ${near.length > 60 ? `<div class="modal-sub" style="margin-top:8px;">${tr('pokeShowing')} 60 ${tr('pokeOf')} ${near.length}.</div>` : ''}
        <div style="text-align:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);">
          <span style="color:var(--text-dim);font-size:11.5px;">${tr('pokeCourtesy')}

        </div>

      overlay.querySelector('#closePoke').onclick = ()=>overlay.remove();
      body.querySelectorAll('[data-poke-radius]').forEach(btn=>{
        btn.onclick = ()=>{ radiusKm = parseInt(btn.dataset.pokeRadius,10); draw(); };
      });
      body.querySelectorAll('[data-poke-add]').forEach(btn=>{
        btn.onclick = async ()=>{
          const e = near[parseInt(btn.dataset.pokeAdd,10)];
          const candidate = { name: e.name||tr('pokemonEventDefault'), date: e.date, store: e.shop||'' };
          if(isDuplicateEvent(candidate)){
            showToast(tr('xYouAlreadyHaveThisEvent'));
            btn.textContent = tr('xAlreadyHaveIt'); btn.disabled = true; return;
          }

            id: uid(), name: candidate.name, game: 'Pokémon TCG', store: e.shop||'',
            date: e.date, time: e.time||'', repeat:'none', format: e.event_type||'',
            fee: e.cost||'', address: e.street_address||'', city: e.city||'',

            notes:'', rsvp:null, result:null, occurrences:{},
            lat: e.latitude, lng: e.longitude, googleEventId:null

          await saveTournaments();
          render();
          showToast(tr('xAddedToYourCalendar'));
          btn.textContent = tr('xAdded'); btn.disabled = true;
        };
      });

  }

  // Signed-in password change. Supabase can be set to demand a recent sign-in for this
  // ("secure password change"); if it refuses for that reason, say what to do about it.
  function openChangePasswordModal(){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `<div class="modal">
      <h2>🔑 ${tr('changePassword')}</h2>
      <div class="modal-sub">${tr('newPasswordSub')}</div>
      <div class="field"><label>${tr('newPassword')}</label><input id="cp_password" type="password" autocomplete="new-password" placeholder="••••••••"/></div>
      <div class="field"><label>${tr('confirmPassword')}</label><input id="cp_confirm" type="password" autocomplete="new-password" placeholder="••••••••"/></div>
      <div class="modal-actions">
        <button class="btn-secondary" id="cp_cancel" style="flex:1;">${tr('cancel')}</button>
        <button class="btn-primary" id="cp_save" style="flex:1;">${tr('savePassword')}</button>
      </div></div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
    overlay.querySelector('#cp_cancel').onclick = ()=>overlay.remove();
    const save = overlay.querySelector('#cp_save');
    save.onclick = async ()=>{
      const pw = overlay.querySelector('#cp_password').value;
      const pw2 = overlay.querySelector('#cp_confirm').value;
      if(pw !== pw2){ showToast(tr('passwordsDontMatch')); return; }
      save.disabled = true;
      const problem = await newPasswordProblem(pw);
      if(problem){ showToast(problem); save.disabled = false; return; }
      try{
        const { error } = await supabaseClient.auth.updateUser({ password: pw });
        if(error){
          showToast(/reauth|recent|nonce/i.test(error.message || '') ? tr('reauthNeeded') : error.message);
          save.disabled = false; return;
        }
      }catch(e){ showToast(tr('resetFailed')); save.disabled = false; return; }
      overlay.remove();
      showToast(tr('passwordChanged'));
    };
  }

  // Account deletion. Deliberately a few steps: shows exactly what will be
  // lost (including anything that affects OTHER people, like a store or
  // playgroup they own), nudges toward exporting first, and requires typing
  // DELETE rather than a single tap.
  async function openDeleteAccountModal(){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `<div class="modal"><h2>⚠️ ${tr('deleteAcctTitle')}</h2><div id="delBody"><div class="modal-sub">…</div></div></div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
    const body = overlay.querySelector('#delBody');

    // The server only deletes accounts that signed in recently (it can't be undone,
    // so a leftover session isn't enough). Explain and offer to sign out.
    function showSignInAgain(){
      body.innerHTML = `<div class="modal-sub">${tr('xForYourSecurityPleaseSign')}</div>
        <div class="modal-actions">
          <button class="btn-secondary" id="delClose" style="flex:1;">${tr('close')}</button>
          <button class="btn-danger" id="delSignOut" style="flex:1;">${tr('xSignOut')}</button>
        </div>`;
      body.querySelector('#delClose').onclick = ()=>overlay.remove();
      body.querySelector('#delSignOut').onclick = async ()=>{
        await supabaseClient.auth.signOut();
        window.location.href = baseAppUrl();
      };
    }

    let preview = null;
    try{
      const res = await fetch(FUNCTIONS_URL + '/delete-account', {
        method: 'POST',
        headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + session.access_token },
        body: JSON.stringify({ preview: true })
      });
      preview = await res.json();
      if(preview.code === 'recent_login_required'){ showSignInAgain(); return; }
      if(preview.error) throw new Error(preview.error);
    }catch(e){
      body.innerHTML = `<div class="modal-sub">${tr('xCouldnTReachTheDeletion')}</div>
        <div class="modal-actions"><button class="btn-secondary" id="delClose" style="flex:1;">${tr('close')}</button></div>`;
      body.querySelector('#delClose').onclick = ()=>overlay.remove();
      return;
    }

    const owns = [...(preview.owned_stores||[]).map(n=>'🏪 '+n), ...(preview.owned_playgroups||[]).map(n=>'👥 '+n)];

    body.innerHTML = `
      <div class="modal-sub">${tr('deleteAcctWarn')}</div>
      <div class="list-item"><div class="info"><div class="n">${trf('eventsDecksCount', { events: preview.events||0, decks: preview.decks||0 })}</div>
        <div class="m">${tr('xPlusYourResultsStatsFriendships')}</div></div></div>
      ${owns.length ? `
        <div class="section-label" style="color:var(--rose);">${tr('deleteAcctOwns')}</div>
        ${owns.map(o=>`<div class="list-item"><div class="info"><div class="n">${escapeHtml(o)}</div>
          <div class="m">${tr('xFollowersAndMembersWillLose')}</div></div></div>`).join('')}
      ` : ''}
      <div class="hint" style="margin:14px 0;">💾 ${tr('deleteAcctExportFirst')}</div>
      <div class="field">
        <label>${tr('deleteAcctTypeIt')}</label>
        <input id="delConfirmInput" placeholder="DELETE" autocomplete="off" style="text-transform:uppercase;"/>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" id="delCancel" style="flex:1;">${tr('cancel')}</button>
        <button class="btn-danger" id="delGo" style="flex:1;" disabled>${tr('deleteAcctConfirm')}</button>
      </div>`;

    const input = body.querySelector('#delConfirmInput');
    const goBtn = body.querySelector('#delGo');
    input.oninput = ()=>{ goBtn.disabled = input.value.trim().toUpperCase() !== 'DELETE'; };
    body.querySelector('#delCancel').onclick = ()=>overlay.remove();

    goBtn.onclick = async ()=>{
      goBtn.disabled = true; goBtn.textContent = tr('xDeleting');
      try{
        const res = await fetch(FUNCTIONS_URL + '/delete-account', {
          method: 'POST',
          headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + session.access_token },
          body: JSON.stringify({ confirm: true })
        });
        const out = await res.json();
        if(out.code === 'recent_login_required'){ showSignInAgain(); return; }
        if(out.error) throw new Error(out.error);
        overlay.remove();
        alert(tr('deleteAcctDone'));
        await supabaseClient.auth.signOut();
        window.location.href = baseAppUrl();
      }catch(e){
        showToast(tr('xCouldNotDeleteTheAccount'));
        goBtn.disabled = false; goBtn.textContent = tr('deleteAcctConfirm');
      }
    };
  }

    overlay.querySelector('#useLocationBtn').onclick = ()=>{
      if(!navigator.geolocation){ showToast(tr('xGeolocationIsNotAvailableOn')); return; }
      navigator.geolocation.getCurrentPosition(
        (pos)=>{ profile._pendingLat = pos.coords.latitude; profile._pendingLng = pos.coords.longitude; showToast(tr('xLocationCapturedTapSaveProfile')); },
        ()=>showToast(tr('xCouldNotGetYourLocation'))
      );
    };
    let citySuggestDebounce = null;
    const cityInput = overlay.querySelector('#acc_city');
    const suggestBox = overlay.querySelector('#citySuggestions');
    let cityDirty = false;
    cityInput.oninput = ()=>{
      const q = cityInput.value.trim();
      profile._pendingLat = null; profile._pendingLng = null; // typing invalidates any earlier pick/GPS capture until they choose again
      cityDirty = true;
      clearTimeout(citySuggestDebounce);
      if(q.length < 3){ suggestBox.innerHTML = ''; return; }
      citySuggestDebounce = setTimeout(async ()=>{
        try{
          const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&q=' + encodeURIComponent(q));
          const results = await res.json();
          if(!results || results.length===0){ suggestBox.innerHTML = ''; return; }
          suggestBox.innerHTML = results.map((r,i)=>`<button type="button" class="mini-btn" data-suggest-idx="${i}" style="display:block;width:100%;text-align:left;margin-top:4px;">${escapeHtml(r.display_name)}</button>`).join('');
          suggestBox.querySelectorAll('[data-suggest-idx]').forEach(btn=>{
            btn.onclick = ()=>{
              const r = results[parseInt(btn.dataset.suggestIdx,10)];
              cityInput.value = r.display_name;
              profile._pendingLat = parseFloat(r.lat);
              profile._pendingLng = parseFloat(r.lon);
              cityDirty = false; // a real pick was made — coordinates are now trustworthy again
              suggestBox.innerHTML = '';
            };
          });
        }catch(e){ /* non-fatal — falls back to single-guess geocoding on save */ }
      }, 350);
    };
    overlay.querySelector('#changePwBtn').onclick = ()=>openChangePasswordModal();
    overlay.querySelector('#saveProfileBtn').onclick = async ()=>{
      if(!profileLoaded){ showToast(tr('profileNotLoadedSave')); return; }
      let username = overlay.querySelector('#acc_username').value.trim().replace(/^@/,'');
      if(username && !/^[a-zA-Z0-9_]{3,24}$/.test(username)){
        showToast(tr('xUsernamesAre324Characters'));
        return;
      }
      const display_name = overlay.querySelector('#acc_name').value.trim();
      const home_city = overlay.querySelector('#acc_city').value.trim();
      let home_lat, home_lng;
      if(profile._pendingLat != null && profile._pendingLng != null){
        home_lat = profile._pendingLat; home_lng = profile._pendingLng;
      } else if(!cityDirty){
        home_lat = profile.home_lat; home_lng = profile.home_lng;
      } else {
        home_lat = null; home_lng = null; // city text changed with no pick made — force a fresh geocode below rather than keep stale coordinates
      }
      if((home_lat == null || home_lng == null) && home_city){
        const geo = await geocode(home_city);
        if(geo){ home_lat = geo.lat; home_lng = geo.lng; }
      }
      try{
        const { error } = await supabaseClient.from('profiles').update({ username: username || null, display_name, home_city, home_lat, home_lng }).eq('id', session.user.id);
        if(error){
          showToast(error.code === '23505' ? tr('xThatUsernameIsTakenTry') : tr('xCouldNotSaveProfile'));
          return;
        }
        profile = Object.assign({}, profile, { username, display_name, home_city, home_lat, home_lng });
        showToast(tr('xProfileSaved'));
        overlay.remove();
      }catch(e){ showToast(tr('xCouldNotSaveProfile')); }
    };
    overlay.querySelectorAll('[data-interested-game]').forEach(chip=>{
      chip.onclick = ()=>chip.classList.toggle('active');
    });
    overlay.querySelector('#saveNotifPrefsBtn').onclick = async ()=>{
      if(!profileLoaded){ showToast(tr('profileNotLoadedSave')); return; }
      const prefs = {};
      NOTIF_PREF_KEYS.forEach(k=>{
        prefs[k.key] = overlay.querySelector(`[data-pref="${k.key}"]`).checked;
      });
      const shareStats = overlay.querySelector('#acc_sharestats').checked;
      const interestedGames = Array.from(overlay.querySelectorAll('[data-interested-game].active')).map(el=>el.dataset.interestedGame);
      try{
        await supabaseClient.from('profiles').update({ notification_prefs: prefs, share_stats_with_friends: shareStats, interested_games: interestedGames }).eq('id', session.user.id);
        profile.notification_prefs = prefs;
        profile.share_stats_with_friends = shareStats;
        profile.interested_games = interestedGames;
        showToast(tr('settingsSaved'));
        await syncFollowedStoreEvents();
        render();
      }catch(e){ showToast(tr('couldNotSave')); }
    };
  }

  async function respondToInvitation(invitationId, accept, notifId){
    try{
      const { data: updated, error } = await supabaseClient
        .from('event_invitations')
        .update({ status: accept ? 'accepted' : 'declined' })
        .eq('id', invitationId)
        .eq('status', 'pending')
        .select()
        .maybeSingle();

      if(error){ showToast(tr('couldNotUpdateInvite')); return; }
      if(!updated){
        showToast(tr('inviteAlreadyResponded'));
        invitationStatusById[invitationId] = invitationStatusById[invitationId] || 'accepted';
        render();
        return;
      }

      async function finish(){
        invitationStatusById[invitationId] = accept ? 'accepted' : 'declined';
        if(notifId){
          await supabaseClient.from('notifications').update({ read:true }).eq('id', notifId);
          const n = notifications.find(x=>x.id===notifId);
          if(n) n.read = true;
        }
        render();
      }

      async function addAsTournament(e, repeatValue){
        if(isDuplicateEvent(e)){
          showToast(tr('inviteAcceptedHadIt'));
          await finish();
          return;
        }
        tournaments.push({
          id: uid(), name: e.name, game: e.game||'', store: e.store||'', date: e.date, time: e.time||'',
          repeat: repeatValue, format: e.format||'', fee: e.fee||'', address: e.address||'', city:'', link: e.link||'', storeLink: e.storeLink||'',
          notes:'', rsvp:'going', result:null, occurrences:{}, lat:null, lng:null, googleEventId:null,
          readOnly: true
        });
        await saveTournaments();
        showToast(repeatValue !== 'none' ? tr('xAddedAsARepeatingSeries') : tr('xAddedToYourCalendar'));
        await finish();
      }

      if(accept){
        const e = updated.event;
        if(e.repeat && e.repeat !== 'none'){
          const repLabel = (REPEATS.find(r=>r.v===e.repeat)||{}).l || tr('repeatingWord');
          openChoiceDialog({
            title: tr('eventRepeatsTitle'),
            message: trf('addSeriesMsg', { name: e.name, label: repLabel.toLowerCase() }),
            choices: [
              { label: tr('justThisOneDate'), action: ()=>addAsTournament(e, 'none') },
              { label: tr('asRepeatingSeries'), action: ()=>addAsTournament(e, e.repeat) }
            ]
          });
          return; // finish() runs inside whichever choice they pick
        } else {
          await addAsTournament(e, 'none');
          return;
        }
      } else {
        showToast(tr('inviteDeclined'));
      }
      await finish();
    }catch(e){ showToast(tr('couldNotRespondInvite')); }
  }
