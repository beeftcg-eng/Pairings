              <div class="info"><div class="n">${e.cancelled?'<span style="color:var(--rose);">[' + tr('cancelledWord') + '] </span>':''}${isFull?'<span style="color:var(--extra,#f5b942);">[' + tr('fullWord') + '] </span>':''}${escapeHtml(e.name)}</div>
                <div class="m">${fmtFriendly(e.date, e.time)}${isRepeating({repeat:e.repeat})?' · '+tr('repeatsWord'):''} · ${trf('goingCountN', { n: going + (e.capacity ? '/' + e.capacity : '') })}</div></div>
              <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;">
                ${going ? `<button class="mini-btn" data-view-attendees="${e.id}" data-event-name="${escapeAttr(e.name)}">${tr('xAttendees')}</button>` : ''}
                <button class="mini-btn" data-qr-se="${e.id}">${tr('xCheckInQr')}</button>
                <button class="mini-btn" data-edit-se="${e.id}">${tr('xEdit2')}</button>
                <button class="mini-btn" data-dup-se="${e.id}">${tr('xDuplicate')}</button>
                <button class="mini-btn" data-cancel-se="${e.id}">${e.cancelled?tr('uncancel'):tr('cancel')}</button>
                <button class="mini-btn decline" data-del-se="${e.id}">${tr('delete')}</button>
              </div>
            </div>`;
        }

        function render(){
          body.innerHTML = `
            <button class="mini-btn" id="backToStoreList" style="margin-bottom:10px;">${tr('xAllYourStores')}</button>
            <div class="modal-sub">✅ ${trf('storeApprovedLine', { name: escapeHtml(myStore.name) })} <strong>${myStore.follow_code}</strong></div>
            <div class="share-link" style="margin-bottom:14px;">${baseAppUrl()}?storepage=${myStore.follow_code}</div>
            <div id="storeQrHolder" style="display:flex;justify-content:center;margin-bottom:14px;background:#fff;padding:10px;border-radius:12px;width:fit-content;"></div>
            <button class="mini-btn" id="copyPublicLinkBtn" style="margin-bottom:14px;">${tr('xCopyPublicPageLink')}</button>
            <a class="mini-btn" href="${TURNZERO_URL}" target="_blank" rel="noopener" style="display:inline-block;margin-bottom:14px;margin-left:6px;text-decoration:none;">${tr('xOpenTurnzeroToStartA')}</a>

            <div class="section-label">${tr('xGamesYouRegularlyRun')}</div>
            <div class="modal-sub" style="margin-bottom:8px;">${tr('xHelpsPeopleFindYouIn')}</div>
            <div class="chip-row" style="margin-bottom:16px;">
              ${GAMES.map(g=>`<button type="button" class="chip ${(myStore.games||[]).includes(g)?'active':''}" data-store-game="${escapeAttr(g)}">${escapeHtml(g)}</button>`).join('')}
            </div>
            <button class="mini-btn" id="saveStoreGamesBtn" style="margin-bottom:20px;">${tr('xSaveGames')}</button>

            ${eventFormHtml()}

            <div class="section-label">${tr('xYourPublishedEvents')}</div>
            ${myEvents.length ? myEvents.map(eventRowHtml).join('') : `<div class="modal-sub">${tr('xNoEventsPublishedYet')}</div>`}

            <div class="section-label">${tr('xMessageYourFollowers')}</div>
            <div class="modal-sub" style="margin-bottom:8px;">${tr('xSeparateFromEventsForClosures')}</div>
            <div style="display:flex;gap:8px;margin-bottom:12px;">
              <input id="annMessage" placeholder="${escapeAttr(tr('xEGClosedThisFriday'))}" style="flex:1;"/>
              <button class="mini-btn" id="postAnnouncementBtn">${tr('xPost')}</button>
            </div>
            ${announcements.length ? announcements.map(a=>`
              <div class="list-item">
                <div class="info"><div class="n" style="font-size:13px;">${escapeHtml(a.message)}</div><div class="m">${new Date(a.created_at).toLocaleString()}</div></div>
                <button class="mini-btn decline" data-del-ann="${a.id}">${tr('delete')}</button>
              </div>`).join('') : ''}

            <div class="modal-actions"><button class="btn-secondary" id="closeStores" style="flex:1;">${tr('close')}</button></div>
          `;
          loadQrLib().then(()=>{
            const holder = document.getElementById('storeQrHolder');
            if(holder) new QRCode(holder, { text: `${baseAppUrl()}?storepage=${myStore.follow_code}`, width:150, height:150 });
          }).catch(()=>{ /* non-fatal — the follow code is still shown as text */ });

          overlay.querySelector('#closeStores').onclick = ()=>overlay.remove();
          body.querySelector('#backToStoreList').onclick = ()=>drawStoreList();
          body.querySelector('#copyPublicLinkBtn').onclick = ()=>{
            const ok = copyText(`${baseAppUrl()}?storepage=${myStore.follow_code}`);
            showToast(ok?tr('xLinkCopied'):tr('xCouldNotCopy'));
          };

          body.querySelectorAll('[data-store-game]').forEach(chip=>{
            chip.onclick = ()=>chip.classList.toggle('active');
          });
          body.querySelector('#saveStoreGamesBtn').onclick = async ()=>{
            const games = Array.from(body.querySelectorAll('[data-store-game].active')).map(el=>el.dataset.storeGame);
            try{
              await supabaseClient.from('stores').update({ games }).eq('id', myStore.id);
              myStore.games = games;
              showToast(tr('xSaved'));
            }catch(e){ showToast(tr('xCouldNotSave')); }
          };

          body.querySelector('#addStoreEventBtn').onclick = async ()=>{
            const name = body.querySelector('#se_name').value.trim();
            const date = body.querySelector('#se_date').value;
            if(!name || !date){ showToast(tr('xNameAndDateAreRequired')); return; }
            const isDupe = myEvents.some(e => (!editingEvent || e.id !== editingEvent.id) && e.date === date && (e.name||'').trim().toLowerCase() === name.toLowerCase());
            if(isDupe){ showToast(tr('xYouAlreadyHaveAnEvent')); return; }
            const capVal = body.querySelector('#se_capacity').value;
            const fields = {
              name, date,
              time: body.querySelector('#se_time').value.trim(),
              game: body.querySelector('#se_game').value.trim(),
              format: body.querySelector('#se_format').value.trim(),
              repeat: body.querySelector('#se_repeat').value,
              capacity: capVal ? parseInt(capVal,10) : null,
              fee: body.querySelector('#se_fee').value.trim(),
              prizing: body.querySelector('#se_prizing').value.trim()
            };
            try{
              // supabase-js returns { error } instead of throwing, so it has to be checked or a
              // refused save would still say "published".
              const { error } = editingEvent
                ? await supabaseClient.from('store_events').update(fields).eq('id', editingEvent.id).eq('store_id', myStore.id)
                : await supabaseClient.from('store_events').insert({ store_id: myStore.id, ...fields });
              if(error) throw error;
              showToast(editingEvent ? tr('xEventUpdatedFollowersSeeThe') : tr('xEventPublishedYourFollowersWill'));
              prefillEvent = null; editingEvent = null;
              drawManageStore(myStore);
            }catch(e){ showToast(editingEvent ? tr('xCouldNotSaveChanges') : tr('xCouldNotPublishEvent')); }
          };
          const cancelDupBtn = body.querySelector('#cancelDuplicateBtn');
          if(cancelDupBtn) cancelDupBtn.onclick = ()=>{ prefillEvent = null; editingEvent = null; render(); };

          body.querySelectorAll('[data-qr-se]').forEach(btn=>{
            btn.onclick = ()=>{ const ev = myEvents.find(x=>x.id===btn.dataset.qrSe); if(ev) openCheckinQrModal(ev); };
          });
          body.querySelectorAll('[data-edit-se]').forEach(btn=>{
            btn.onclick = ()=>{
              const ev = myEvents.find(x=>x.id===btn.dataset.editSe);
              if(!ev) return;
              editingEvent = ev; prefillEvent = null;
              render();
              const nameField = body.querySelector('#se_name');
              if(nameField) nameField.scrollIntoView({behavior:'smooth', block:'center'});
            };
          });

          body.querySelectorAll('[data-dup-se]').forEach(btn=>{
            btn.onclick = ()=>{
              const ev = myEvents.find(x=>x.id===btn.dataset.dupSe);
              if(!ev) return;
              prefillEvent = ev; editingEvent = null;
              render();
              const nameField = body.querySelector('#se_name');
              if(nameField) nameField.scrollIntoView({behavior:'smooth', block:'center'});
            };
          });
          body.querySelectorAll('[data-view-attendees]').forEach(btn=>{
            btn.onclick = ()=>openAttendeesModal(btn.dataset.viewAttendees, btn.dataset.eventName);
          });
          body.querySelectorAll('[data-cancel-se]').forEach(btn=>{
            btn.onclick = async ()=>{
              const ev = myEvents.find(x=>x.id===btn.dataset.cancelSe);
              try{ const { error } = await supabaseClient.from('store_events').update({ cancelled: !ev.cancelled }).eq('id', ev.id); if(error) throw error; drawManageStore(myStore); }
              catch(e){ showToast(tr('xCouldNotUpdate')); }
            };
          });
          body.querySelectorAll('[data-del-se]').forEach(btn=>{
            btn.onclick = async ()=>{
              if(!confirm(tr('xDeleteThisEventFollowersWill'))) return;
              try{ const { error } = await supabaseClient.from('store_events').delete().eq('id', btn.dataset.delSe); if(error) throw error; drawManageStore(myStore); }
              catch(e){ showToast(tr('xCouldNotDelete')); }
            };
          });
          body.querySelector('#postAnnouncementBtn').onclick = async ()=>{
            const message = body.querySelector('#annMessage').value.trim();
            if(!message){ showToast(tr('xWriteAMessageFirst')); return; }
            try{
              await supabaseClient.from('store_announcements').insert({ store_id: myStore.id, message });
              showToast(tr('xSentToYourFollowers'));
              drawManageStore(myStore);
            }catch(e){ showToast(tr('xCouldNotPost')); }
          };
          body.querySelectorAll('[data-del-ann]').forEach(btn=>{
            btn.onclick = async ()=>{
              try{ await supabaseClient.from('store_announcements').delete().eq('id', btn.dataset.delAnn); drawManageStore(myStore); }
              catch(e){ showToast(tr('xCouldNotDelete')); }
            };
          });
        }
        render();
      }

      // If exactly one approved store and nothing pending, skip straight to managing it.
      const approvedStores = myStores.filter(s=>s.approved);
      if(approvedStores.length === 1 && myStores.length === 1){
        drawManageStore(approvedStores[0]);
      } else {
        drawStoreList();
      }
    }

    async function renderFollowingTab(){
      body.innerHTML = `<div class="modal-sub">${tr('loadingDots')}</div>`;
      try{
        const { data: follows } = await supabaseClient.from('store_follows').select('store_id, stores(*)').eq('user_id', session.user.id);
        const stores = (follows||[]).map(f=>f.stores).filter(Boolean);
        if(stores.length === 0){
          body.innerHTML = `<div class="modal-sub">${tr('xYouReNotFollowingAny')}</div>
            <div class="modal-actions"><button class="btn-secondary" id="closeStores" style="flex:1;">${tr('close')}</button></div>`;
          overlay.querySelector('#closeStores').onclick = ()=>overlay.remove();
          return;
        }
        const today = todayStr();
        const sections = await Promise.all(stores.map(async s=>{
          const { data: events } = await supabaseClient.from('store_events').select('*').eq('store_id', s.id).gte('date', today).order('date').limit(5);
          const rows = (events||[]).map(e=>`
            <div class="list-item">
              <div class="info"><div class="n">${e.cancelled?'<span style="color:var(--rose);">[' + tr('cancelledWord') + '] </span>':''}${escapeHtml(e.name)}</div>
                <div class="m">${fmtFriendly(e.date, e.time)}</div></div>
            </div>`).join('');
          return `
            <div class="card" style="margin-bottom:12px;">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <div class="n" style="font-weight:700;">${escapeHtml(s.name)}</div>
                <button class="mini-btn decline" data-unfollow="${s.id}">${tr('xUnfollow')}</button>
              </div>
              ${rows || '<div class="modal-sub">' + tr('noUpcomingPosted') + '</div>'}
            </div>`;
        }));
        body.innerHTML = sections.join('') + `<div class="modal-actions"><button class="btn-secondary" id="closeStores" style="flex:1;">${tr('close')}</button></div>`;
        overlay.querySelector('#closeStores').onclick = ()=>overlay.remove();
        body.querySelectorAll('[data-unfollow]').forEach(btn=>{
          btn.onclick = async ()=>{
            try{ await supabaseClient.from('store_follows').delete().eq('user_id', session.user.id).eq('store_id', btn.dataset.unfollow); await syncFollowedStoreEvents(); render(); renderFollowingTab(); }
            catch(e){ showToast(tr('xCouldNotUnfollow')); }
          };
        });
      }catch(e){ body.innerHTML = `<div class="modal-sub">${tr('xCouldNotLoadYourFollowed')}</div>`; }
    }

    renderBrowseTab();
  }

  // ---------- Admin dashboard (only visible/functional if profile.is_admin) ----------
  function openAdminModal(){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `<div class="modal"><h2>🛠 Admin</h2><div id="adminBody"><div class="modal-sub">Loading…</div></div></div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
    const body = overlay.querySelector('#adminBody');

    async function draw(){
      let pending = [];
      try{
        const { data } = await supabaseClient.from('stores').select('*').eq('approved', false).order('created_at');
        pending = data || [];
      }catch(e){}

      body.innerHTML = `
        <div class="section-label">Pending store requests (${pending.length})</div>
        ${pending.length ? pending.map(s=>`
          <div class="list-item">
            <div class="info"><div class="n">${escapeHtml(s.name)}</div><div class="m">${escapeHtml(s.city||'')}${s.description?' · '+escapeHtml(s.description):''}</div></div>
            <div style="display:flex;gap:6px;">
              <button class="mini-btn" data-approve-store="${s.id}">Approve</button>
              <button class="mini-btn decline" data-reject-store="${s.id}">Reject</button>
            </div>
          </div>`).join('') : `<div class="modal-sub">Nothing pending.</div>`}

        <div class="section-label">📈 Analytics</div>
        <button class="mini-btn" id="loadMetricsBtn" style="margin-bottom:10px;">Load metrics</button>
        <div id="adminMetrics"></div>

        <div class="section-label">🚩 Reported images</div>
        <div id="adminReports"><div class="modal-sub">Loading…</div></div>

        <div class="section-label">🖼 Image moderation</div>
        <div class="modal-sub" style="margin-bottom:8px;">Every image currently in use across profiles, stores and playgroups.</div>
        <button class="mini-btn" id="loadImagesBtn" style="margin-bottom:10px;">Load all images</button>
        <div id="adminImages"></div>

        <div class="section-label">Post an announcement</div>
        <div class="field"><label>Title</label><input id="ann_title" placeholder="e.g. New features!"/></div>
        <div class="field"><label>Message</label><textarea id="ann_message" placeholder="What's new…"></textarea></div>
        <div class="modal-actions"><button class="btn-primary" id="postAnnBtn" style="flex:1;">Post to everyone</button></div>

        <div class="modal-actions"><button class="btn-secondary" id="closeAdmin" style="flex:1;">${tr('close')}</button></div>
      `;
      overlay.querySelector('#closeAdmin').onclick = ()=>overlay.remove();
      body.querySelectorAll('[data-approve-store]').forEach(btn=>{
        btn.onclick = async ()=>{
          try{
            const { data, error } = await supabaseClient.from('stores').update({ approved: true }).eq('id', btn.dataset.approveStore).select().maybeSingle();
            if(error) throw error;
            if(!data || data.approved !== true){
              showToast('Approval did not take effect — check that add-admin-role-migration.sql has been run');
              return;
            }
            showToast('Store approved');
            draw();
          }catch(e){ showToast('Could not approve'); }
        };
      });
      body.querySelectorAll('[data-reject-store]').forEach(btn=>{
        btn.onclick = async ()=>{
          if(!confirm('Reject and delete this store request?')) return;
          try{ await supabaseClient.from('stores').delete().eq('id', btn.dataset.rejectStore); showToast('Rejected'); draw(); }
          catch(e){ showToast('Could not reject'); }
        };
      });
      // Reported images queue
      (async ()=>{
        const rEl = body.querySelector('#adminReports');
        if(!rEl) return;
        try{
          const { data, error } = await supabaseClient.from('image_reports')
            .select('*').eq('status','open').order('created_at', {ascending:false}).limit(50);
          if(error) throw error;
          if(!data || data.length === 0){ rEl.innerHTML = `<div class="modal-sub">No open reports. 🎉</div>`; return; }
          rEl.innerHTML = data.map((rep,i)=>`
            <div class="list-item">
              <div style="display:flex;align-items:center;gap:10px;min-width:0;">
                <img src="${safeHref(rep.image_url)}" alt="" data-rep-zoom="${i}" style="width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--panel-2);cursor:zoom-in;"/>
                <div class="info">
                  <div class="n">${escapeHtml(rep.context||'unknown')}</div>
                  <div class="m">${escapeHtml(rep.reason || 'No reason given')}</div>
                  <div class="m" style="font-size:11px;">${new Date(rep.created_at).toLocaleString()}</div>
                </div>
              </div>
              <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;">
                <button class="mini-btn decline" data-rep-remove="${i}">Remove image</button>
                <button class="mini-btn" data-rep-dismiss="${i}">Dismiss</button>
              </div>
            </div>`).join('');

          rEl.querySelectorAll('[data-rep-zoom]').forEach(im=>{
            im.onclick = ()=>openImageLightbox(data[parseInt(im.dataset.repZoom,10)].image_url, 'Reported image');
          });
          rEl.querySelectorAll('[data-rep-remove]').forEach(btn=>{
            btn.onclick = async ()=>{
              const rep = data[parseInt(btn.dataset.repRemove,10)];
              if(!confirm('Remove this image and resolve the report?')) return;
              try{
                if(rep.context && rep.subject_id){
                  await supabaseClient.rpc('admin_clear_image', { p_context: rep.context, p_subject_id: rep.subject_id });
                }
                await supabaseClient.from('image_reports').update({ status:'resolved' }).eq('id', rep.id);
                showToast('Image removed and report resolved');
                draw();
              }catch(e){ showToast('Could not resolve'); }
            };
          });
          rEl.querySelectorAll('[data-rep-dismiss]').forEach(btn=>{
            btn.onclick = async ()=>{
              const rep = data[parseInt(btn.dataset.repDismiss,10)];
              try{
                await supabaseClient.from('image_reports').update({ status:'dismissed' }).eq('id', rep.id);
                showToast('Report dismissed');
                draw();
              }catch(e){ showToast('Could not dismiss'); }
            };
          });
        }catch(e){ rEl.innerHTML = `<div class="modal-sub">Could not load reports — check the avatars migration has been run.</div>`; }
      })();

      body.querySelector('#loadMetricsBtn').onclick = async ()=>{
        const el = body.querySelector('#adminMetrics');
        el.innerHTML = `<div class="modal-sub">Loading…</div>`;
        try{
          const { data, error } = await supabaseClient.rpc('admin_metrics');
          if(error) throw error;
          const m = data;
          const card = (val, lbl) => `<div class="stat-card"><div class="val">${val}</div><div class="lbl">${escapeHtml(lbl)}</div></div>`;
          const row = (lbl, val, hint) => `<div class="result-row"><div><div class="n">${escapeHtml(lbl)}</div>${hint?`<div class="m">${escapeHtml(hint)}</div>`:''}</div><div class="p">${val}</div></div>`;

          const u = m.users, e = m.engagement, f = m.features, s = m.settings;
          const activeRate = u.total ? Math.round((u.active_week / u.total) * 100) : 0;
          const engagedRate = (e.zero_events + e.light + e.engaged) > 0
            ? Math.round((e.engaged / (e.zero_events + e.light + e.engaged)) * 100) : 0;

          // Simple sparkline-style bars for signups per week.
          const weeks = m.signups_by_week || [];
          const maxN = Math.max(1, ...weeks.map(w=>w.n));
          const weekBars = weeks.map(w=>`
            <div class="bar-row">
              <div class="bar-top"><span class="bn">${new Date(w.week).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span><span class="bc">${w.n}</span></div>
              <div class="bar-track"><div class="bar-fill" style="width:${Math.round((w.n/maxN)*100)}%;"></div></div>
            </div>`).join('');

          el.innerHTML = `
            <div class="stat-grid" style="margin-bottom:12px;">
              ${card(u.total, 'Total users')}
              ${card(u.active_week, 'Active this week')}
              ${card(activeRate+'%', 'Weekly active rate')}
              ${card(u.new_week, 'New this week')}
            </div>

            <div class="section-label">Engagement</div>
            ${row('Engaged (5+ events)', e.engaged, engagedRate+'% of users with data')}
            ${row('Light (1–4 events)', e.light)}
            ${row('Signed up, no events yet', e.zero_events, 'the number worth watching')}
            ${row('Total events tracked', e.total_events)}
            ${row('Results logged', e.results_logged)}
            ${row('Users tracking decks', e.with_decks)}

            <div class="section-label">Activity window</div>
            ${row('Active today', u.active_today)}
            ${row('Active this month', u.active_month)}
            ${row('New this month', u.new_month)}

            <div class="section-label">Features</div>
            ${row('Playgroups', f.playgroups, f.pg_members+' memberships')}
            ${row('Stores approved', f.stores_approved, f.stores_pending+' pending · '+f.store_events+' events posted')}
            ${row('Store follows', f.store_follows)}
            ${row('Friendships', f.friendships)}
            ${row('Player cards', f.player_cards)}
            ${row('Profile photos', f.avatars)}
            ${row('Push enabled', f.push_enabled)}
            ${row('Pokémon events cached', f.pokedata_events)}

            <div class="section-label">Settings</div>
            ${row('Spanish', s.lang_es)}
            ${row('English', s.lang_en)}
            ${row('Home city set', s.has_home_city, 'needed for "near you" + Pokémon finder')}
            ${row('Stats set to private', s.stats_private)}

            ${weeks.length ? `<div class="section-label">Signups per week</div>${weekBars}` : ''}

            <div class="modal-sub" style="margin-top:10px;font-size:11px;">Generated ${new Date(m.generated_at).toLocaleString()}</div>
          `;
        }catch(err){
          el.innerHTML = `<div class="modal-sub">Couldn't load metrics — check that the analytics migration has been run.</div>`;
        }
      };
      body.querySelector('#loadImagesBtn').onclick = async ()=>{
        const el = body.querySelector('#adminImages');
        el.innerHTML = `<div class="modal-sub">Loading…</div>`;
        try{
          const { data, error } = await supabaseClient.rpc('admin_list_images');
          if(error) throw error;
          if(!data || data.length === 0){ el.innerHTML = `<div class="modal-sub">No images uploaded yet.</div>`; return; }
          el.innerHTML = data.map((img,i)=>`
            <div class="list-item">
              <div style="display:flex;align-items:center;gap:10px;">
                <img src="${safeHref(img.image_url)}" alt="" data-zoom-img="${escapeAttr(img.image_url)}" data-zoom-label="${escapeAttr(img.label||'')}" style="width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--panel-2);cursor:zoom-in;" title="Click to enlarge"/>
                <div class="info"><div class="n">${escapeHtml(img.label||'—')}</div><div class="m">${escapeHtml(img.context)}</div></div>
              </div>
              <button class="mini-btn decline" data-clear-img="${i}">Remove</button>
            </div>`).join('');
          el.querySelectorAll('[data-zoom-img]').forEach(im=>{
            im.onclick = ()=>openImageLightbox(im.dataset.zoomImg, im.dataset.zoomLabel);
          });
          el.querySelectorAll('[data-clear-img]').forEach(btn=>{
            btn.onclick = async ()=>{
              const img = data[parseInt(btn.dataset.clearImg,10)];
              if(!confirm(`Remove this image from "${img.label}"? This clears it from their profile immediately.`)) return;
              try{
                const { error } = await supabaseClient.rpc('admin_clear_image', { p_context: img.context, p_subject_id: img.subject_id });
                if(error) throw error;
                showToast('Image removed');
                body.querySelector('#loadImagesBtn').click();
              }catch(e){ showToast('Could not remove image'); }
            };
          });
        }catch(e){ el.innerHTML = `<div class="modal-sub">Could not load images — check that the avatars migration has been run.</div>`; }
      };

    function deckRow(d){
      const metaBits = [d.game || tr('noGameSet')];
      if(d.legend) metaBits.push(tr('legendLabel')+': '+d.legend);
      if(d.cardCount) metaBits.push(trf('deckCards', { n: d.cardCount }));
      return `
        <div class="list-item" id="deckrow-${d.id}">
          <div class="info">
            <div class="n" data-view="${d.id}">${escapeHtml(d.name)}</div>
            <div class="m">${escapeHtml(metaBits.join(' · '))}</div>
            ${(d.viewLink || d.editLink) ? `<div style="margin-top:4px;display:flex;gap:10px;">
              ${safeUrl(d.viewLink) ? `<a href="${safeHref(d.viewLink)}" target="_blank" rel="noopener" style="color:var(--teal);font-size:11.5px;">${tr('viewOnPiltover')}</a>` : ''}
              ${safeUrl(d.editLink) ? `<a href="${safeHref(d.editLink)}" target="_blank" rel="noopener" style="color:var(--teal);font-size:11.5px;">${tr('editArrow')}</a>` : ''}
            </div>` : ''}

          <div style="display:flex;gap:6px;">
            ${d.viewLink ? `<button class="mini-btn" data-resync="${d.id}">🔄 ${tr('resync')}</button>` : ''}
            <button class="mini-btn" data-rename="${d.id}">${tr('rename')}</button>
            <button class="mini-btn" data-toggle="${d.id}">${d.active ? tr('retire') : tr('reactivate')}</button>
            <button class="mini-btn decline" data-delete="${d.id}">${tr('delete')}</button>
          </div>
        </div>`;
    }

    function groupByGame(list){
      const groups = {};
      list.forEach(d=>{
        const key = d.game || 'No game set';
        groups[key] = groups[key] || [];
        groups[key].push(d);
      });
      return Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0]));
    }
    function renderGroupedDecks(list){
      if(!list.length) return '';
      const groups = groupByGame(list);
      if(groups.length === 1) return list.map(deckRow).join('');
      return groups.map(([gameName, ds])=>`
        <div style="font-size:12px;color:var(--text-dim);font-weight:600;margin:10px 0 6px;">${gameIcon(gameName)} ${escapeHtml(gameName)}</div>
        ${ds.map(deckRow).join('')}
      `).join('');
    }

    function draw(){
      const body = overlay.querySelector('#decksBody');
      const current = decks.filter(d=>d.active);
      const past = decks.filter(d=>!d.active);
      body.innerHTML = `
        <div class="paste-box">
          <div class="lbl">🔗 ${tr('importFromPiltover')}</div>
          <div style="display:flex;gap:8px;">
            <input id="pltDeckLink" placeholder="https://piltoverarchive.com/decks/view/…" style="flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 11px;font-size:13px;"/>
            <button class="parse-btn" id="pltImportBtn" type="button" style="margin-top:0;white-space:nowrap;">${tr('importBtn')}</button>
          </div>
          <div class="hint">${tr('importPltHint')}</div>
        </div>
        <div class="field">
          <label>${tr('orAddManually')}</label>
          <div class="row2">
            <input id="newDeckName" placeholder="${tr('deckName')}" list="legendOptionsGlobal"/>
            <input id="newDeckGame" list="gameOptions" placeholder="${escapeAttr(tr('gameOptional'))}"/>
          </div>
          <datalist id="gameOptions">${GAMES.map(g=>`<option value="${escapeAttr(g)}">`).join('')}</datalist>
          <datalist id="legendOptionsGlobal">${RIFTBOUND_LEGENDS.map(l=>`<option value="${escapeAttr(l)}">`).join('')}</datalist>
          <button class="mini-btn" id="addDeckBtn" style="margin-top:8px;">+ ${tr('addDeck')}</button>
        </div>
        <div class="section-label">${tr('currentDecks')} (${current.length})</div>
        ${current.length ? renderGroupedDecks(current) : `<div class="modal-sub">${tr('noCurrentDecks')}</div>`}
        <div class="section-label">${tr('pastDecks')} (${past.length})</div>
        ${past.length ? renderGroupedDecks(past) : `<div class="modal-sub">${tr('nothingRetired')}</div>`}
        <div class="modal-actions"><button class="btn-secondary" id="closeDecks" style="flex:1;">${tr('close')}</button></div>
      `;

      body.querySelector('#pltImportBtn').onclick = async ()=>{
        const url = body.querySelector('#pltDeckLink').value.trim();
        if(!url){ showToast(tr('pasteDeckLink')); return; }
        const btn = body.querySelector('#pltImportBtn');
        btn.disabled = true;
        btn.textContent = tr('importing');
        try{
          const res = await fetch(FUNCTIONS_URL + '/fetch-piltover-deck', {
            method: 'POST',
            headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + session.access_token },
            body: JSON.stringify({ url })
          });
          const p = await res.json();
          if(p.error){ showToast(p.error); return; }
          if(!p.foundAnything){ showToast(tr('cantReadDeck')); return; }
          decks.push({
            id: deckUid(), name: p.name || tr('importedDeckDefault'), game: 'Riftbound',
            legend: p.legend || '', colors: p.colors || [], cardCount: p.cardCount || null,
            viewLink: p.viewLink || url, editLink: p.editLink || '',
            notes: '', active: true, createdAt: Date.now()
          });
          await saveDecks();
          draw();
          showToast(tr('deckImported'));
        }catch(e){ showToast(tr('couldNotImportDeck')); }
        finally{ btn.disabled = false; btn.textContent = tr('importBtn'); }
      };

      body.querySelector('#addDeckBtn').onclick = async ()=>{
        const name = body.querySelector('#newDeckName').value.trim();
        const game = body.querySelector('#newDeckGame').value.trim();
        if(!name){ showToast(tr('giveDeckName')); return; }
        decks.push({ id: deckUid(), name, game, notes:'', active:true, createdAt: Date.now() });
        await saveDecks();
        draw();
        showToast(tr('deckAdded'));
      };
      body.querySelectorAll('[data-resync]').forEach(btn=>{
        btn.onclick = async ()=>{
          const d = decks.find(x=>x.id===btn.dataset.resync);
          if(!d || !d.viewLink) return;
          btn.disabled = true;
          btn.textContent = '🔄 …';
          try{
            const res = await fetch(FUNCTIONS_URL + '/fetch-piltover-deck', {
              method: 'POST',
              headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + session.access_token },
              body: JSON.stringify({ url: d.viewLink })
            });
            const p = await res.json();
            if(p.error){ showToast(p.error); btn.disabled=false; btn.textContent='🔄 ' + tr('resync'); return; }
            if(!p.foundAnything){ showToast(tr('cantReadDeckNow')); btn.disabled=false; btn.textContent='🔄 ' + tr('resync'); return; }
            if(p.name) d.name = p.name;
            d.legend = p.legend || d.legend || '';
            d.colors = p.colors || d.colors || [];
            d.cardCount = p.cardCount || d.cardCount || null;
            if(p.editLink) d.editLink = p.editLink;
            await saveDecks();
            draw();
            showToast(tr('deckSynced'));
          }catch(e){ showToast(tr('couldNotSync')); btn.disabled=false; btn.textContent='🔄 ' + tr('resync'); }
        };
      });
      body.querySelectorAll('[data-rename]').forEach(btn=>{
        btn.onclick = async ()=>{
          const d = decks.find(x=>x.id===btn.dataset.rename);
          if(!d) return;
          const newName = prompt(tr('renameDeck'), d.name);
          if(newName === null) return;
          const trimmed = newName.trim();
          if(!trimmed){ showToast(tr('nameEmpty')); return; }
          d.name = trimmed;
          await saveDecks();
          draw();
          showToast(tr('deckRenamed'));
        };
      });
      body.querySelectorAll('[data-toggle]').forEach(btn=>{
        btn.onclick = async ()=>{
          const d = decks.find(x=>x.id===btn.dataset.toggle);
          if(!d) return;
          d.active = !d.active;
          draw();
          showToast(d.active ? tr('deckCurrent') : tr('deckRetired'));
          await saveDecks();
        };
      });
      body.querySelectorAll('[data-delete]').forEach(btn=>{
        btn.onclick = async ()=>{
          if(!confirm(tr('confirmDeleteDeck'))) return;
          markDeleted('decks', btn.dataset.delete);
          decks = decks.filter(x=>x.id!==btn.dataset.delete);
          await saveDecks();
          draw();
          showToast(tr('deckDeleted'));
        };
      });
      body.querySelector('#closeDecks').onclick = ()=>overlay.remove();
    }
    draw();
  }

  // ---------- Account modal ----------
  // Player Card — your IDs in one place, big enough to read out or show a
  // clerk at registration, with one-tap copy for each.
  // ---------- Pokémon events near you (data from pokedata.ovh) ----------
  // Reads ONLY from our own cached table — never calls pokedata directly
  // from the browser. See the sync-pokedata Edge Function for the fetch.
  function haversineKm(lat1, lng1, lat2, lng2){
    const R = 6371, toRad = d => d*Math.PI/180;
    const dLat = toRad(lat2-lat1), dLng = toRad(lng2-lng1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.sqrt(a));
  }

  async function openPokedataModal(){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `<div class="modal"><h2>⚡ ${tr('pokeTitle')}</h2><div id="pokeBody"><div class="modal-sub">${tr('loadingDots')}</div></div></div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
    const body = overlay.querySelector('#pokeBody');

    if(profile.home_lat == null || profile.home_lng == null){
      body.innerHTML = `
        <div class="empty-state">
          <div class="big">${tr('pokeSetCity')}</div>
          <div>${tr('pokeSetCityBody')}</div>
        </div>
        <div class="modal-actions"><button class="btn-primary" id="pokeGoAccount" style="flex:1;">${tr('pokeOpenAccount')}</button></div>`;
      body.querySelector('#pokeGoAccount').onclick = ()=>{ overlay.remove(); openAccountModal(); };
      return;
    }

    let radiusKm = 100;

    async function draw(){
      body.innerHTML = `<div class="modal-sub">${tr('loadingDots')}</div>`;
      let events = [];
      try{
        const { data, error } = await supabaseClient.from('pokedata_events')
          .select('*').gte('date', todayStr()).order('date').limit(500);
        if(error) throw error;
        events = data || [];
      }catch(e){
        body.innerHTML = `<div class="modal-sub">${tr('pokeNotSetUp')}</div>`;
        return;
      }

      const near = events
        .filter(e => e.latitude != null && e.longitude != null)
        .map(e => ({ ...e, km: haversineKm(profile.home_lat, profile.home_lng, e.latitude, e.longitude) }))
        .filter(e => e.km <= radiusKm)
        .sort((a,b) => a.date.localeCompare(b.date) || a.km - b.km);

      const radiusChips = [50,100,200,400].map(r=>
        `<button class="chip ${radiusKm===r?'active':''}" data-poke-radius="${r}">${r} km</button>`).join('');

      body.innerHTML = `
        <div class="modal-sub">${tr('pokeIntro')} ${escapeHtml(profile.home_city||'')}.</div>
        <div class="chip-row" style="margin-bottom:12px;">${radiusChips}</div>
        ${near.length ? near.slice(0,60).map((e,i)=>`
          <div class="list-item">
            <div class="info">
              <div class="n">${escapeHtml(e.name||tr('pokemonEventDefault'))}</div>
              <div class="m">${fmtFriendly(e.date, e.time)} · ${escapeHtml(e.shop||'')}${e.city?' · '+escapeHtml(e.city):''}</div>
              <div class="m" style="font-size:11px;">${Math.round(e.km)} ${tr('pokeAway')}${e.event_type?' · '+escapeHtml(e.event_type):''}${e.cost?' · '+escapeHtml(e.cost):''}</div>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;">
              ${safeUrl(e.pokemon_url)?`<a class="mini-btn" href="${safeHref(e.pokemon_url)}" target="_blank" rel="noopener">${tr('pokeDetails')} ↗</a>`:''}
              <button class="mini-btn" data-poke-add="${i}">${tr('pokeAdd')}</button>
            </div>
          </div>`).join('') : `<div class="modal-sub">${tr('pokeNone')} ${radiusKm} km. ${tr('pokeTryWider')}</div>`}
        ${near.length > 60 ? `<div class="modal-sub" style="margin-top:8px;">${tr('pokeShowing')} 60 ${tr('pokeOf')} ${near.length}.</div>` : ''}
        <div style="text-align:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);">
          <span style="color:var(--text-dim);font-size:11.5px;">${tr('pokeCourtesy')}
            <a href="https://www.pokedata.ovh/events/" target="_blank" rel="noopener" style="color:var(--teal);">pokedata.ovh</a>
          </span>
        </div>
        <div class="modal-actions"><button class="btn-secondary" id="closePoke" style="flex:1;">${tr('close')}</button></div>`;

      overlay.querySelector('#closePoke').onclick = ()=>overlay.remove();
      body.querySelectorAll('[data-poke-radius]').forEach(btn=>{
        btn.onclick = ()=>{ radiusKm = parseInt(btn.dataset.pokeRadius,10); draw(); };
      });
      body.querySelectorAll('[data-poke-add]').forEach(btn=>{
        btn.onclick = async ()=>{
          const e = near[parseInt(btn.dataset.pokeAdd,10)];
          const candidate = { name: e.name||tr('pokemonEventDefault'), date: e.date, store: e.shop||'' };
          if(isDuplicateEvent(candidate)){
            showToast(tr('xYouAlreadyHaveThisEvent'));
            btn.textContent = tr('xAlreadyHaveIt'); btn.disabled = true; return;
          }
          tournaments.push({
            id: uid(), name: candidate.name, game: 'Pokémon TCG', store: e.shop||'',
            date: e.date, time: e.time||'', repeat:'none', format: e.event_type||'',
            fee: e.cost||'', address: e.street_address||'', city: e.city||'',
            link: e.pokemon_url||'', storeLink: e.event_website||'',
            notes:'', rsvp:null, result:null, occurrences:{},
            lat: e.latitude, lng: e.longitude, googleEventId:null
          });
          await saveTournaments();
          render();
          showToast(tr('xAddedToYourCalendar'));
          btn.textContent = tr('xAdded'); btn.disabled = true;
        };
      });
    }
    draw();
  }

    // The server only deletes accounts that signed in recently (it can't be undone,
    // so a leftover session isn't enough). Explain and offer to sign out.
    function showSignInAgain(){
      body.innerHTML = `<div class="modal-sub">${tr('xForYourSecurityPleaseSign')}</div>
        <div class="modal-actions">
          <button class="btn-secondary" id="delClose" style="flex:1;">${tr('close')}</button>

        await supabaseClient.auth.signOut();
        window.location.href = baseAppUrl();
      };
    }

    let preview = null;
    try{
      const res = await fetch(FUNCTIONS_URL + '/delete-account', {
        method: 'POST',
        headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + session.access_token },
        body: JSON.stringify({ preview: true })
      });
      preview = await res.json();
      if(preview.code === 'recent_login_required'){ showSignInAgain(); return; }
      if(preview.error) throw new Error(preview.error);
    }catch(e){
      body.innerHTML = `<div class="modal-sub">${tr('xCouldnTReachTheDeletion')}</div>
        <div class="modal-actions"><button class="btn-secondary" id="delClose" style="flex:1;">${tr('close')}</button></div>`;

    const owns = [...(preview.owned_stores||[]).map(n=>'🏪 '+n), ...(preview.owned_playgroups||[]).map(n=>'👥 '+n)];

    body.innerHTML = `

          <div class="m">${tr('xFollowersAndMembersWillLose')}</div></div></div>`).join('')}

      <div class="hint" style="margin:14px 0;">💾 ${tr('deleteAcctExportFirst')}</div>
      <div class="field">
        <label>${tr('deleteAcctTypeIt')}</label>
        <input id="delConfirmInput" placeholder="DELETE" autocomplete="off" style="text-transform:uppercase;"/>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" id="delCancel" style="flex:1;">${tr('cancel')}</button>
        <button class="btn-danger" id="delGo" style="flex:1;" disabled>${tr('deleteAcctConfirm')}</button>
      </div>`;

    const input = body.querySelector('#delConfirmInput');
    const goBtn = body.querySelector('#delGo');
    input.oninput = ()=>{ goBtn.disabled = input.value.trim().toUpperCase() !== 'DELETE'; };
    body.querySelector('#delCancel').onclick = ()=>overlay.remove();

    goBtn.onclick = async ()=>{
      goBtn.disabled = true; goBtn.textContent = tr('xDeleting');
      try{
        const res = await fetch(FUNCTIONS_URL + '/delete-account', {
          method: 'POST',
          headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + session.access_token },
          body: JSON.stringify({ confirm: true })
        });
        const out = await res.json();
        if(out.code === 'recent_login_required'){ showSignInAgain(); return; }

      const q = cityInput.value.trim();
      profile._pendingLat = null; profile._pendingLng = null; // typing invalidates any earlier pick/GPS capture until they choose again
      cityDirty = true;
      clearTimeout(citySuggestDebounce);
      if(q.length < 3){ suggestBox.innerHTML = ''; return; }
      citySuggestDebounce = setTimeout(async ()=>{
        try{
          const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&q=' + encodeURIComponent(q));
          const results = await res.json();
          if(!results || results.length===0){ suggestBox.innerHTML = ''; return; }
          suggestBox.innerHTML = results.map((r,i)=>`<button type="button" class="mini-btn" data-suggest-idx="${i}" style="display:block;width:100%;text-align:left;margin-top:4px;">${escapeHtml(r.display_name)}</button>`).join('');

              cityInput.value = r.display_name;
              profile._pendingLat = parseFloat(r.lat);
              profile._pendingLng = parseFloat(r.lon);
              cityDirty = false; // a real pick was made — coordinates are now trustworthy again
              suggestBox.innerHTML = '';
            };
          });
        }catch(e){ /* non-fatal — falls back to single-guess geocoding on save */ }
      }, 350);
    };

    overlay.querySelector('#saveProfileBtn').onclick = async ()=>{

        showToast(tr('xUsernamesAre324Characters'));
        return;
      }
      const display_name = overlay.querySelector('#acc_name').value.trim();
      const home_city = overlay.querySelector('#acc_city').value.trim();
      let home_lat, home_lng;
      if(profile._pendingLat != null && profile._pendingLng != null){
        home_lat = profile._pendingLat; home_lng = profile._pendingLng;
      } else if(!cityDirty){
        home_lat = profile.home_lat; home_lng = profile.home_lng;
      } else {
        home_lat = null; home_lng = null; // city text changed with no pick made — force a fresh geocode below rather than keep stale coordinates
      }
      if((home_lat == null || home_lng == null) && home_city){
        const geo = await geocode(home_city);
        if(geo){ home_lat = geo.lat; home_lng = geo.lng; }
      }
      try{
        const { error } = await supabaseClient.from('profiles').update({ username: username || null, display_name, home_city, home_lat, home_lng }).eq('id', session.user.id);
        if(error){
          showToast(error.code === '23505' ? tr('xThatUsernameIsTakenTry') : tr('xCouldNotSaveProfile'));
          return;
        }
        profile = Object.assign({}, profile, { username, display_name, home_city, home_lat, home_lng });
        showToast(tr('xProfileSaved'));
        overlay.remove();
      }catch(e){ showToast(tr('xCouldNotSaveProfile')); }
    };
    overlay.querySelectorAll('[data-interested-game]').forEach(chip=>{
      chip.onclick = ()=>chip.classList.toggle('active');
    });
    overlay.querySelector('#saveNotifPrefsBtn').onclick = async ()=>{
      const prefs = {};
      NOTIF_PREF_KEYS.forEach(k=>{
        prefs[k.key] = overlay.querySelector(`[data-pref="${k.key}"]`).checked;
      });
      const shareStats = overlay.querySelector('#acc_sharestats').checked;
      const interestedGames = Array.from(overlay.querySelectorAll('[data-interested-game].active')).map(el=>el.dataset.interestedGame);
      try{
        await supabaseClient.from('profiles').update({ notification_prefs: prefs, share_stats_with_friends: shareStats, interested_games: interestedGames }).eq('id', session.user.id);
        profile.notification_prefs = prefs;
        profile.share_stats_with_friends = shareStats;
        profile.interested_games = interestedGames;
        showToast(tr('settingsSaved'));
        await syncFollowedStoreEvents();
        render();
      }catch(e){ showToast(tr('couldNotSave')); }
    };
  }

        .from('event_invitations')
        .update({ status: accept ? 'accepted' : 'declined' })
        .eq('id', invitationId)
        .eq('status', 'pending')
        .select()
        .maybeSingle();

      if(error){ showToast(tr('couldNotUpdateInvite')); return; }
      if(!updated){
        showToast(tr('inviteAlreadyResponded'));
        invitationStatusById[invitationId] = invitationStatusById[invitationId] || 'accepted';
        render();
        return;
      }

      async function finish(){
        invitationStatusById[invitationId] = accept ? 'accepted' : 'declined';
        if(notifId){
          await supabaseClient.from('notifications').update({ read:true }).eq('id', notifId);
          const n = notifications.find(x=>x.id===notifId);
          if(n) n.read = true;
        }
        render();
      }

      async function addAsTournament(e, repeatValue){
        if(isDuplicateEvent(e)){
          showToast(tr('inviteAcceptedHadIt'));
          await finish();
          return;
        }
        tournaments.push({
          id: uid(), name: e.name, game: e.game||'', store: e.store||'', date: e.date, time: e.time||'',
          repeat: repeatValue, format: e.format||'', fee: e.fee||'', address: e.address||'', city:'', link: e.link||'', storeLink: e.storeLink||'',
          notes:'', rsvp:'going', result:null, occurrences:{}, lat:null, lng:null, googleEventId:null,
          readOnly: true
        });
        await saveTournaments();
        showToast(repeatValue !== 'none' ? tr('xAddedAsARepeatingSeries') : tr('xAddedToYourCalendar'));
        await finish();
      }

      if(accept){
        const e = updated.event;
        if(e.repeat && e.repeat !== 'none'){
          const repLabel = (REPEATS.find(r=>r.v===e.repeat)||{}).l || tr('repeatingWord');
          openChoiceDialog({
            title: tr('eventRepeatsTitle'),
            message: trf('addSeriesMsg', { name: e.name, label: repLabel.toLowerCase() }),
            choices: [
              { label: tr('justThisOneDate'), action: ()=>addAsTournament(e, 'none') },
              { label: tr('asRepeatingSeries'), action: ()=>addAsTournament(e, e.repeat) }
            ]
          });
          return; // finish() runs inside whichever choice they pick
        } else {
          await addAsTournament(e, 'none');
          return;
        }
      } else {
        showToast(tr('inviteDeclined'));
      }
      await finish();
    }catch(e){ showToast(tr('couldNotRespondInvite')); }
  }

  // ============================================================
  // Boot
  // ============================================================
  let bootstrapping = false;
  // Merges every event from every store you follow into your own tournaments
  // list, as read-only entries that stay live-linked — if a store edits,
  // cancels, or deletes an event, your copy updates or disappears to match.
  // Once merged in, they're ordinary tournament entries: shareable,
  // invitable, calendar-syncable, everything the rest of the app already
  // does for a normal event.
  // Anything left "in progress" gets automatically marked finished 6 hours
  // after the event's start time — so a result you started logging mid-event
  // and forgot about doesn't sit half-open forever (and correctly counts
  // toward your stats, which ignore nothing but do read cleaner when
  // entries aren't perpetually pending).
  async function autoFinishStaleInProgress(){
    if(!userDataLoaded) return; // never operate on data we failed to load
    let changed = false;
    const nowMs = Date.now();
    function maybeFinish(t, date, occ){
      if(!occ.result || !occ.result.inProgress) return;
      // Parse the event's start time as best we can; fall back to 6 PM,
      // matching the same assumption the server-side reminder jobs make.
      let hh = 18, mm = 0;
      const m = (t.time||'').match(/(\d{1,2}):(\d{2})\s*(am|pm)?/i);
      if(m){
        hh = parseInt(m[1],10); mm = parseInt(m[2],10);
        const ampm = (m[3]||'').toLowerCase();
        if(ampm === 'pm' && hh < 12) hh += 12;
        if(ampm === 'am' && hh === 12) hh = 0;
      }
      const startMs = new Date(`${date}T${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:00`).getTime();
      if(isNaN(startMs)) return;
      if(nowMs - startMs >= 6*60*60*1000){
        delete occ.result.inProgress;
        setOcc(t, date, { result: occ.result });
        syncResultLogged(t, date, true);
        changed = true;
      }
    }
    tournaments.forEach(t=>{
      if(!isRepeating(t)){
        if(t.result) maybeFinish(t, t.date, { result: t.result });
      } else {
        Object.keys(t.occurrences||{}).forEach(date=>{
          const o = t.occurrences[date];
          if(o && o.result) maybeFinish(t, date, o);
        });
      }
    });
    if(changed) await saveTournaments();
  }

  async function syncFollowedStoreEvents(){
    if(!userDataLoaded) return; // never operate on data we failed to load
    try{
      const { data: follows, error: followsError } = await supabaseClient.from('store_follows').select('store_id, stores(name)').eq('user_id', session.user.id);
      // If this fetch fails we must bail out entirely rather than continue —
      // an empty follows list would otherwise cause the filter below to strip
      // every store event out of the user's calendar, which looks exactly
      // like "my followed stores reset themselves".
      if(followsError) throw followsError;
      const followedStoreIds = (follows||[]).map(f=>f.store_id);
      const storeNameById = {};
      (follows||[]).forEach(f=>{ if(f.stores) storeNameById[f.store_id] = f.stores.name; });

      let liveEvents = [];
      if(followedStoreIds.length){
        const { data } = await supabaseClient.from('store_events').select('*').in('store_id', followedStoreIds);
        liveEvents = data || [];
      }
      // If the user has narrowed down which games they care about, filter
      // out events for other games entirely — this is what actually
      // declutters the main feed. Events with no game set are left in,
      // since we can't confidently say they're irrelevant.
      // Matched via gameIcon()'s normalizer rather than exact string
      // comparison: stores type the game as free text, so "Pokemon" from a
      // store wouldn't match "Pokémon TCG" selected here without it.
      const interests = profile.interested_games || [];
      if(interests.length){
        const interestIcons = new Set(interests.map(g=>gameIcon(g)).filter(i=>i && i!=='🎴'));
        const interestNorms = new Set(interests.map(g=>normalizeGameKey(g)));
        liveEvents = liveEvents.filter(e=>{
          if(!e.game) return true;
          const icon = gameIcon(e.game);
          if(icon && icon !== '🎴' && interestIcons.has(icon)) return true;
          return interestNorms.has(normalizeGameKey(e.game));
        });
      }
      const liveIds = new Set(liveEvents.map(e=>e.id));
      let goingCountById = {};
      if(liveEvents.length){
        try{
          const { data: counts } = await supabaseClient.rpc('get_store_event_rsvp_counts', { event_ids: [...liveIds] });
          (counts||[]).forEach(c=>{ goingCountById[c.store_event_id] = c.going_count; });
        }catch(e){}
      }
      let changed = false;

      // Drop local copies for events that were deleted, whose store you no
      // longer follow, or that no longer match your interested-games filter
      // (this last one is what makes DESELECTING a game actually remove
      // those events from your feed, rather than leaving stale copies behind).
      const before = tournaments.length;
      tournaments = tournaments.filter(t=>{
        if(!t.storeEventId) return true;
        return liveIds.has(t.storeEventId) && followedStoreIds.includes(t.storeId);
      });
      if(tournaments.length !== before) changed = true;

      // Add new ones, and refresh fields on ones you already have.
      liveEvents.forEach(e=>{
        let t = tournaments.find(x=>x.storeEventId===e.id);
        if(!t){
          t = {
            id: uid(), storeEventId: e.id, storeId: e.store_id,
            rsvp:null, result:null, occurrences:{}, lat:null, lng:null, googleEventId:null, readOnly:true
          };
          tournaments.push(t);
          changed = true;
        }
        const storeName = storeNameById[e.store_id] || 'Store';
        const fresh = { name: e.name, game: e.game||'', format: e.format||'', date: e.date, time: e.time||'',
          fee: e.fee||'', address: e.address||'', link: e.link||'', storeLink: e.store_link||'',
          notes: e.notes||'', repeat: e.repeat||'none', cancelled: !!e.cancelled, store: storeName,
          prizing: e.prizing||'',
          capacity: e.capacity||null, isFull: !!(e.capacity && (goingCountById[e.id]||0) >= e.capacity) };
        Object.keys(fresh).forEach(k=>{ if(t[k] !== fresh[k]){ t[k] = fresh[k]; changed = true; } });
      });

      if(changed) await saveTournaments();
    }catch(e){ /* non-fatal — worst case, followed events just don't refresh this load */ }
  }

  async function bootstrapApp(){
    if(bootstrapping) return; // Supabase's auth listener can fire twice for one login — ignore the repeat
    bootstrapping = true;
    try{
      await Promise.all([loadProfile(), loadTournaments(), loadFriendsData(), loadNotifications(), loadPlayerIds()]);
      await syncFollowedStoreEvents();
      await autoFinishStaleInProgress();
      if(preLoginLangChoice && preLoginLangChoice !== currentLang){
        currentLang = preLoginLangChoice;
        try{ await supabaseClient.from('profiles').update({ language: currentLang }).eq('id', session.user.id); profile.language = currentLang; }catch(e){}
      }
      preLoginLangChoice = null;
      await checkPushEnabled();
      subscribeRealtime();
      render();
      ensureTimezoneSaved();
      if(pendingPlaygroupCode){
        const pgCode = pendingPlaygroupCode;
        pendingPlaygroupCode = null;
        joinPlaygroupByCode(pgCode);
      } else if(pendingShareCode){
        const code = pendingShareCode;
        pendingShareCode = null;
        openSharedEventModal(code);
      } else if(pendingCheckin){
        const id = pendingCheckin;
        pendingCheckin = null;
        await performCheckin(id);
        if(profile && profile.onboarded === false) openWelcomeModal();
      } else if(profile && profile.onboarded === false){
        openWelcomeModal();
      } else if(pendingOpen){
        const name = pendingOpen;
        pendingOpen = null;
        OPEN_TARGETS[name]();
      } else {
        checkForAnnouncement();
      }
    } finally {
      bootstrapping = false;
    }
  }

  // Shows the latest announcement once per person, if they haven't seen it yet.
  // Post one anytime by inserting a row into the `announcements` table directly
  // in the Supabase dashboard — no in-app admin UI needed.
  async function checkForAnnouncement(){
    try{
      const { data } = await supabaseClient.from('announcements').select('*').order('created_at', { ascending:false }).limit(1).maybeSingle();
      if(!data) return;
      if(profile.last_seen_announcement_id === data.id) return;
      const overlay = document.createElement('div');
      overlay.className = 'overlay';
      overlay.innerHTML = `
        <div class="modal" style="max-width:420px;">
          <h2>📣 ${escapeHtml(data.title)}</h2>
          <div class="modal-sub" style="font-size:14px;line-height:1.6;white-space:pre-wrap;">${escapeHtml(data.message)}</div>
          <div class="modal-actions"><button class="btn-primary" id="dismissAnnouncement" style="flex:1;">${tr('xGotIt')}</button></div>
        </div>`;
      document.body.appendChild(overlay);
      const dismiss = async ()=>{
        overlay.remove();
        try{
          await supabaseClient.from('profiles').update({ last_seen_announcement_id: data.id }).eq('id', session.user.id);
          profile.last_seen_announcement_id = data.id;
        }catch(e){ /* non-fatal — worst case it shows again next login */ }
      };
      overlay.querySelector('#dismissAnnouncement').onclick = dismiss;
      overlay.onclick = (e)=>{ if(e.target===overlay) dismiss(); };
    }catch(e){ /* non-fatal, and expected until this migration is run */ }
  }

  // Silently records the browser's timezone on the profile, used server-side
  // by the "remind me to log results" scheduled job to know when 2 hours have
  // actually passed for you specifically, not just in UTC.
  async function ensureTimezoneSaved(){
    try{
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      if(tz && profile.timezone !== tz){
        await supabaseClient.from('profiles').update({ timezone: tz }).eq('id', session.user.id);
        profile.timezone = tz;
      }
    }catch(e){ /* non-fatal */ }
  }

  function baseAppUrl(){ return window.location.origin + window.location.pathname; }

  (async ()=>{
    registerServiceWorker();
    // Decide the language first: the public store page is shown to people who are not signed in,
    // and it used to be routed to before this line, so it was always English.
    try{ if((navigator.language||'').toLowerCase().startsWith('es')) currentLang = 'es'; }catch(e){}
    const publicParams = new URLSearchParams(window.location.search);
    if(publicParams.has('storepage')){
      await renderPublicStorePage(publicParams.get('storepage'));
      return;
    }
    const { data: { session: s } } = await supabaseClient.auth.getSession();
    session = s;
    // The auth tokens in the address bar are spent now; don't leave them in the URL/history.
    if(window.location.hash && (recoveryPending || emailLinkError)){
      try{ history.replaceState(null, '', window.location.pathname + window.location.search); }catch(e){}
    }
    if(session && recoveryPending) renderSetNewPassword();
    else if(session) await bootstrapApp();
    else { renderAuth('signin'); if(emailLinkError) showToast(tr('emailLinkExpired')); }
    // Try to send queued changes as soon as the connection or the tab comes back.
    window.addEventListener('online', ()=>{ syncPending(); });
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) syncPending(); });
    supabaseClient.auth.onAuthStateChange((event, sess)=>{
      const hadSession = !!session;
      session = sess;
      // PASSWORD_RECOVERY can arrive here instead of (or as well as) the hash check above.
      if(event === 'PASSWORD_RECOVERY' && sess){
        recoveryPending = true;
        if(!document.getElementById('np_submit')) renderSetNewPassword();
        return;
      }
      if(session && !hadSession && !recoveryPending) bootstrapApp();
      if(!session){ recoveryPending = false; clearOfflineCache(); offlineMode = false; pendingSync.tournaments = pendingSync.decks = false; clearTimeout(syncTimer); updateSyncPill(); renderAuth('signin'); }
    });
  })();
})();
</script>
</body>
</html>
