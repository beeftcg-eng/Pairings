  // ============================================================
  // Boot
  // ============================================================
  let bootstrapping = false;
  // Merges every event from every store you follow into your own tournaments
  // list, as read-only entries that stay live-linked — if a store edits,
  // cancels, or deletes an event, your copy updates or disappears to match.
  // Once merged in, they're ordinary tournament entries: shareable,
  // invitable, calendar-syncable, everything the rest of the app already
  // does for a normal event.
  // Anything left "in progress" gets automatically marked finished 6 hours
  // after the event's start time — so a result you started logging mid-event
  // and forgot about doesn't sit half-open forever (and correctly counts
  // toward your stats, which ignore nothing but do read cleaner when
  // entries aren't perpetually pending).
  async function autoFinishStaleInProgress(){
    if(!userDataLoaded) return; // never operate on data we failed to load
    let changed = false;
    const nowMs = Date.now();
    function maybeFinish(t, date, occ){
      if(!occ.result || !occ.result.inProgress) return;
      // Parse the event's start time as best we can; fall back to 6 PM,
      // matching the same assumption the server-side reminder jobs make.
      let hh = 18, mm = 0;
      const m = (t.time||'').match(/(\d{1,2}):(\d{2})\s*(am|pm)?/i);
      if(m){
        hh = parseInt(m[1],10); mm = parseInt(m[2],10);
        const ampm = (m[3]||'').toLowerCase();
        if(ampm === 'pm' && hh < 12) hh += 12;
        if(ampm === 'am' && hh === 12) hh = 0;
      }
      const startMs = new Date(`${date}T${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:00`).getTime();
      if(isNaN(startMs)) return;
      if(nowMs - startMs >= 6*60*60*1000){
        delete occ.result.inProgress;
        setOcc(t, date, { result: occ.result });
        syncResultLogged(t, date, true);
        changed = true;
      }
    }
    tournaments.forEach(t=>{
      if(!isRepeating(t)){
        if(t.result) maybeFinish(t, t.date, { result: t.result });
      } else {
        Object.keys(t.occurrences||{}).forEach(date=>{
          const o = t.occurrences[date];
          if(o && o.result) maybeFinish(t, date, o);
        });
      }
    });
    if(changed) await saveTournaments();
  }

  async function syncFollowedStoreEvents(){
    if(!userDataLoaded) return; // never operate on data we failed to load
    try{
      const { data: follows, error: followsError } = await supabaseClient.from('store_follows').select('store_id, stores(name)').eq('user_id', session.user.id);
      // If this fetch fails we must bail out entirely rather than continue —
      // an empty follows list would otherwise cause the filter below to strip
      // every store event out of the user's calendar, which looks exactly
      // like "my followed stores reset themselves".
      if(followsError) throw followsError;
      const followedStoreIds = (follows||[]).map(f=>f.store_id);
      const storeNameById = {};
      (follows||[]).forEach(f=>{ if(f.stores) storeNameById[f.store_id] = f.stores.name; });

      let liveEvents = [];
      if(followedStoreIds.length){
        const { data } = await supabaseClient.from('store_events').select('*').in('store_id', followedStoreIds);
        liveEvents = data || [];
      }
      // If the user has narrowed down which games they care about, filter
      // out events for other games entirely — this is what actually
      // declutters the main feed. Events with no game set are left in,
      // since we can't confidently say they're irrelevant.
      // Matched via gameIcon()'s normalizer rather than exact string
      // comparison: stores type the game as free text, so "Pokemon" from a
      // store wouldn't match "Pokémon TCG" selected here without it.
      const interests = profile.interested_games || [];
      if(interests.length){
        const interestIcons = new Set(interests.map(g=>gameIcon(g)).filter(i=>i && i!=='🎴'));
        const interestNorms = new Set(interests.map(g=>normalizeGameKey(g)));
        liveEvents = liveEvents.filter(e=>{
          if(!e.game) return true;
          const icon = gameIcon(e.game);
          if(icon && icon !== '🎴' && interestIcons.has(icon)) return true;
          return interestNorms.has(normalizeGameKey(e.game));
        });
      }
      const liveIds = new Set(liveEvents.map(e=>e.id));
      let goingCountById = {};
      if(liveEvents.length){
        try{
          const { data: counts } = await supabaseClient.rpc('get_store_event_rsvp_counts', { event_ids: [...liveIds] });
          (counts||[]).forEach(c=>{ goingCountById[c.store_event_id] = c.going_count; });
        }catch(e){}
      }
      let changed = false;

      // Drop local copies for events that were deleted, whose store you no
      // longer follow, or that no longer match your interested-games filter
      // (this last one is what makes DESELECTING a game actually remove
      // those events from your feed, rather than leaving stale copies behind).
      const before = tournaments.length;
      tournaments = tournaments.filter(t=>{
        if(!t.storeEventId) return true;
        return liveIds.has(t.storeEventId) && followedStoreIds.includes(t.storeId);
      });
      if(tournaments.length !== before) changed = true;

      // Add new ones, and refresh fields on ones you already have.
      liveEvents.forEach(e=>{
        let t = tournaments.find(x=>x.storeEventId===e.id);
        if(!t){
          t = {
            id: uid(), storeEventId: e.id, storeId: e.store_id,
            rsvp:null, result:null, occurrences:{}, lat:null, lng:null, googleEventId:null, readOnly:true
          };
          tournaments.push(t);
          changed = true;
        }
        const storeName = storeNameById[e.store_id] || 'Store';
        const fresh = { name: e.name, game: e.game||'', format: e.format||'', date: e.date, time: e.time||'',
          fee: e.fee||'', address: e.address||'', link: e.link||'', storeLink: e.store_link||'',
          notes: e.notes||'', repeat: e.repeat||'none', cancelled: !!e.cancelled, store: storeName,
          prizing: e.prizing||'',
          capacity: e.capacity||null, isFull: !!(e.capacity && (goingCountById[e.id]||0) >= e.capacity) };
        Object.keys(fresh).forEach(k=>{ if(t[k] !== fresh[k]){ t[k] = fresh[k]; changed = true; } });
      });

      if(changed) await saveTournaments();
    }catch(e){ /* non-fatal — worst case, followed events just don't refresh this load */ }
  }

  async function bootstrapApp(){
    if(bootstrapping) return; // Supabase's auth listener can fire twice for one login — ignore the repeat
    bootstrapping = true;
    try{
      await Promise.all([loadProfile(), loadTournaments(), loadFriendsData(), loadNotifications(), loadPlayerIds()]);
      await syncFollowedStoreEvents();
      await autoFinishStaleInProgress();
      if(preLoginLangChoice && preLoginLangChoice !== currentLang){
        currentLang = preLoginLangChoice;
        try{ await supabaseClient.from('profiles').update({ language: currentLang }).eq('id', session.user.id); profile.language = currentLang; }catch(e){}
      }
      preLoginLangChoice = null;
      await checkPushEnabled();
      subscribeRealtime();
      render();
      ensureTimezoneSaved();
      refreshBrewhouseDecksQuietly();
      // Offline (running from the local copy) the follow can't reach the server: keep the code for the next start.
      const followCode = offlineMode ? null : takePendingFollow();
      if(followCode) await followStoreByCode(followCode);
      if(pendingPlaygroupCode){
        const pgCode = pendingPlaygroupCode;
        pendingPlaygroupCode = null;
        joinPlaygroupByCode(pgCode);
      } else if(pendingShareCode){
        const code = pendingShareCode;
        pendingShareCode = null;
        openSharedEventModal(code);
      } else if(pendingCheckin){
        const id = pendingCheckin;
        pendingCheckin = null;
        await performCheckin(id);
        if(profileLoaded && profile && profile.onboarded === false) openWelcomeModal();
      } else if(pendingBracket){
        openPendingBracket(true);
      } else if(profileLoaded && profile && profile.onboarded === false){
        openWelcomeModal();
      } else if(pendingOpen){
        const name = pendingOpen;
        pendingOpen = null;
        OPEN_TARGETS[name]();
      } else {
        checkForAnnouncement();
      }
    } finally {
      bootstrapping = false;
    }
  }

  // Shows the latest announcement once per person, if they haven't seen it yet.
  // Post one anytime by inserting a row into the `announcements` table directly
  // in the Supabase dashboard — no in-app admin UI needed.
  async function checkForAnnouncement(){
    try{
      const { data } = await supabaseClient.from('announcements').select('*').order('created_at', { ascending:false }).limit(1).maybeSingle();
      if(!data) return;
      if(profile.last_seen_announcement_id === data.id) return;
      const overlay = document.createElement('div');
      overlay.className = 'overlay';
      overlay.innerHTML = `
        <div class="modal" style="max-width:420px;">
          <h2>📣 ${escapeHtml(data.title)}</h2>
          <div class="modal-sub" style="font-size:14px;line-height:1.6;white-space:pre-wrap;">${escapeHtml(data.message)}</div>
          <div class="modal-actions"><button class="btn-primary" id="dismissAnnouncement" style="flex:1;">${tr('xGotIt')}</button></div>
        </div>`;
      document.body.appendChild(overlay);
      const dismiss = async ()=>{
        overlay.remove();
        try{
          await supabaseClient.from('profiles').update({ last_seen_announcement_id: data.id }).eq('id', session.user.id);
          profile.last_seen_announcement_id = data.id;
        }catch(e){ /* non-fatal — worst case it shows again next login */ }
      };
      overlay.querySelector('#dismissAnnouncement').onclick = dismiss;
      overlay.onclick = (e)=>{ if(e.target===overlay) dismiss(); };
    }catch(e){ /* non-fatal, and expected until this migration is run */ }
  }

  // Silently records the browser's timezone on the profile, used server-side
  // by the "remind me to log results" scheduled job to know when 2 hours have
  // actually passed for you specifically, not just in UTC.
  async function ensureTimezoneSaved(){
    try{
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      if(tz && profile.timezone !== tz){
        await supabaseClient.from('profiles').update({ timezone: tz }).eq('id', session.user.id);
        profile.timezone = tz;
      }
    }catch(e){ /* non-fatal */ }
  }

  async function renderPublicStorePage(idOrCode){
    app.innerHTML = `<div class="wrap"><div class="modal-sub" style="text-align:center;margin-top:60px;">${tr('loadingDots')}</div></div>`;
    try{
      // Old links carry the store's id, new ones its follow code; only an id-shaped value is looked
      // up by id (a code there is a 400 "invalid input syntax for type uuid").
      let store = null;
      if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(idOrCode || '')){
        ({ data: store } = await supabaseClient.from('stores').select('*').eq('id', idOrCode).eq('approved', true).maybeSingle());
      }
      if(!store){
        const res = await supabaseClient.from('stores').select('*').eq('follow_code', idOrCode.toUpperCase()).eq('approved', true).maybeSingle();
        store = res.data;
      }
      if(!store){
        app.innerHTML = `<div class="wrap"><div class="empty-state" style="margin-top:60px;"><div class="big">${tr('xStoreNotFound')}</div><div>${tr('xThisLinkMayBeWrong')}</div></div></div>`;
        return;
      }
      const today = todayStr();
      const { data: events } = await supabaseClient.from('store_events').select('*').eq('store_id', store.id).gte('date', today).order('date').limit(30);

      const rows = (events||[]).map(e=>`
        <div class="card">
          <div class="date-block"><div class="dow">${fmtDateParts(e.date).dow}</div><div class="dom">${fmtDateParts(e.date).dom}</div></div>
          <div class="card-body">
            <div class="card-top"><div class="card-name">${e.cancelled?'<span style="color:var(--rose);">[' + tr('cancelledWord') + '] </span>':''}${escapeHtml(e.name)}</div></div>
            <div class="card-meta">
              ${e.time ? `<span>${escapeHtml(e.time)}</span>` : ''}
              ${e.game ? `<span class="badge game">${gameIcon(e.game)} ${escapeHtml(e.game)}</span>` : ''}
              ${e.format ? `<span class="badge format">${escapeHtml(e.format)}</span>` : ''}
              ${e.fee ? `<span class="badge fee">${escapeHtml(e.fee)}</span>` : ''}
              ${e.prizing ? `<span class="badge result">🏆 ${escapeHtml(e.prizing)}</span>` : ''}
            </div>
            <div class="card-links">
              ${safeUrl(e.link) ? `<a class="card-link" href="${safeHref(e.link)}" target="_blank" rel="noopener">${tr('eventPage')}</a>` : ''}
              <a class="card-link gold" href="${gcalQuickLink({name:e.name, time:e.time, fee:e.fee, notes:e.notes, link:e.link}, e.date)}" target="_blank" rel="noopener">${tr('addToGCal')}</a>
            </div>
          </div>
        </div>`).join('');

      app.innerHTML = `
        <div class="wrap">
          <div class="home-hero" style="text-align:center;padding:30px 0 10px;">
            <div class="brand">Pairings</div>
          </div>
          <div class="empty-state" style="margin-bottom:0;">
            <div class="big">🏪 ${escapeHtml(store.name)}</div>
            <div>${escapeHtml(store.city||'')}${store.description ? ' · '+escapeHtml(store.description) : ''}</div>
            ${safeUrl(store.contact_link) ? `<div style="margin-top:8px;"><a href="${safeHref(store.contact_link)}" target="_blank" rel="noopener" style="color:var(--teal);">${escapeHtml(store.contact_link)} ↗</a></div>` : ''}
          </div>
          <div class="section-label" style="text-align:center;">${tr('xUpcomingEvents')}</div>
          ${rows || `<div class="modal-sub" style="text-align:center;">${tr('xNoUpcomingEventsPostedRight')}</div>`}
          <div class="empty-state" style="margin-top:24px;">
            <div>${tr('xWantTheseEventsToShow')}</div>
            <div style="margin-top:12px;"><a href="${baseAppUrl()}?follow=${encodeURIComponent(store.follow_code)}" class="btn-primary" style="display:inline-block;text-decoration:none;padding:12px 22px;border-radius:10px;">${trf('getPairingsCta', { code: escapeHtml(store.follow_code) })}</a></div>
          </div>
        </div>`;
    }catch(e){
      app.innerHTML = `<div class="wrap"><div class="empty-state" style="margin-top:60px;"><div class="big">${tr('xSomethingWentWrong')}</div></div></div>`;
    }
  }
  function baseAppUrl(){ return window.location.origin + window.location.pathname; }
  // Opens the bracket from the link the app was started with. Signed out, the link is kept, so
  // signing in (e.g. a guest making an account to claim their spot) opens it again.
  function openPendingBracket(signedIn){
    const id = pendingBracket;
    if(pendingBracketToken){ rememberBracketToken(id, pendingBracketToken); pendingBracketToken = null; }
    if(signedIn) pendingBracket = null;
    openBracketViewModal(id);
  }

  (async ()=>{
    registerServiceWorker();
    // Decide the language first: the public store page is shown to people who are not signed in,
    // and it used to be routed to before this line, so it was always English.
    try{ if((navigator.language||'').toLowerCase().startsWith('es')) currentLang = 'es'; }catch(e){}
    const publicParams = new URLSearchParams(window.location.search);
    if(publicParams.has('storepage')){
      await renderPublicStorePage(publicParams.get('storepage'));
      return;
    }
    const { data: { session: s } } = await supabaseClient.auth.getSession();
    session = s;
    // The auth tokens in the address bar are spent now; don't leave them in the URL/history.
    if(window.location.hash && (recoveryPending || emailLinkError)){
      try{ history.replaceState(null, '', window.location.pathname + window.location.search); }catch(e){}
    }
    if(session && recoveryPending) renderSetNewPassword();
    else if(session) await bootstrapApp();
    else { renderAuth('signin'); if(emailLinkError) showToast(tr('emailLinkExpired')); if(pendingBracket) openPendingBracket(false); }
    // Try to send queued changes as soon as the connection or the tab comes back.
    window.addEventListener('online', ()=>{ syncPending(); });
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) syncPending(); });
    supabaseClient.auth.onAuthStateChange((event, sess)=>{
      const hadSession = !!session;
      session = sess;
      // PASSWORD_RECOVERY can arrive here instead of (or as well as) the hash check above.
      if(event === 'PASSWORD_RECOVERY' && sess){
        recoveryPending = true;
        if(!document.getElementById('np_submit')) renderSetNewPassword();
        return;
      }
      if(session && !hadSession && !recoveryPending) bootstrapApp();
      if(!session){ recoveryPending = false; clearOfflineCache(); forgetBrewhouse(); offlineMode = false; pendingSync.tournaments = pendingSync.decks = false; clearTimeout(syncTimer); updateSyncPill(); renderAuth('signin'); }
    });
  })();
})();
</script>
