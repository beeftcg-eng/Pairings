            showToast(tr('xLeftPlaygroup')); drawList();
          }catch(e){ showToast(tr('xCouldNotLeave')); }
        }
      };

      // Leaderboard — computed from each member's own data, respecting their
      // stats-sharing setting (a member who opted out simply won't appear).
      // Defaults to THIS WEEK so the rankings actually rotate and newer
      // members get a real shot, rather than one person owning an all-time
      // board forever. All-time is still available as a toggle.
      (async ()=>{
        const lbEl = body.querySelector('#pgLeaderboard');
        if(!lbEl) return;

        // Fetch each member's data once, then recompute locally when the
        // period toggle changes — avoids re-hitting the network per switch.
        const memberData = [];
        for(const m of members){
          try{
            const { data } = await supabaseClient.from('user_data').select('tournaments, decks').eq('user_id', m.id).maybeSingle();
            if(!data) continue;
            memberData.push({ m, tournaments: data.tournaments||[], decks: data.decks||[] });
          }catch(e){ /* member opted out of sharing, or load failed — skip them */ }
        }

        // Monday-start week, matching how most locals think about "this week".
        function startOfWeekStr(){
          const d = new Date();
          const day = (d.getDay() + 6) % 7; // 0 = Monday
          d.setDate(d.getDate() - day);
          return dateToStr(d);
        }
        function weekRangeLabel(){
          const start = new Date(startOfWeekStr()+'T00:00:00');
          const end = new Date(start); end.setDate(end.getDate()+6);
          const f = (x)=>x.toLocaleDateString(undefined,{month:'short', day:'numeric'});
          return `${f(start)} – ${f(end)}`;
        }

        let period = 'week'; // 'week' | 'all'

        function drawBoard(){
          const since = period === 'week' ? startOfWeekStr() : null;
          const rows = memberData.map(({m, tournaments:tt, decks:dd})=>{
            const s = computeStats(tt, dd, null, since);
            return {
              name: (m.display_name || m.username || tr('playerWord')) + (m.id===session.user.id?' '+tr('youSuffix'):''),
              winRate: s.winRate, wins: s.totalWins, losses: s.totalLosses,
              attended: s.attended, results: s.resultsLogged
            };
          });

          const periodToggle = `
            <div class="chip-row" style="margin-bottom:10px;">
              <button class="chip ${period==='week'?'active':''}" data-lb-period="week">${tr('xThisWeek')}</button>
              <button class="chip ${period==='all'?'active':''}" data-lb-period="all">${tr('rangeAll')}</button>
            </div>`;

          if(rows.length === 0){
            lbEl.innerHTML = periodToggle + `<div class="modal-sub">${tr('xNoSharedStatsYetMembers')}</div>`;
            wireToggle();
            return;
          }

          // Only rank people who actually did something this period — an
          // empty week shouldn't put someone on the podium with 0 games.
          const active = rows.filter(r=>r.wins+r.losses > 0 || r.attended > 0);
          const byWinRate = active.filter(r=>r.winRate!=null && (r.wins+r.losses)>0).sort((a,b)=>b.winRate-a.winRate || b.wins-a.wins);
          const byWins = active.slice().sort((a,b)=>b.wins-a.wins);
          const byEvents = active.slice().sort((a,b)=>b.attended-a.attended);
          const groupWins = rows.reduce((n,r)=>n+r.wins,0);
          const groupLosses = rows.reduce((n,r)=>n+r.losses,0);
          const groupEvents = rows.reduce((n,r)=>n+r.attended,0);
          const groupRate = (groupWins+groupLosses)>0 ? Math.round((groupWins/(groupWins+groupLosses))*100) : null;

          lbEl.innerHTML = `
            ${periodToggle}
            <div class="modal-sub" style="margin-bottom:10px;">${period==='week' ? `📅 ${weekRangeLabel()} · ${tr('resetsMonday')}` : tr('allTimeTotals')}</div>
            ${active.length === 0 ? `<div class="modal-sub">${tr('xNobodyHasLoggedAnythingYet')}</div>` : `
              <div class="stat-grid" style="margin-bottom:12px;">
                <div class="stat-card"><div class="val">${groupEvents}</div><div class="lbl">${tr('xEventsGroup')}</div></div>
                <div class="stat-card"><div class="val">${groupRate!=null?groupRate+'%':'—'}</div><div class="lbl">${tr('xGroupWinRate')}</div></div>
                <div class="stat-card"><div class="val">${groupWins}-${groupLosses}</div><div class="lbl">${tr('xGroupRecord')}</div></div>
                <div class="stat-card"><div class="val">${active.length}</div><div class="lbl">${period==='week'?tr('activeThisWeek'):tr('activeMembers')}</div></div>
              </div>
              ${byWinRate.length?`<div class="result-row"><div><div class="n">${tr('xBestWinRate')}</div><div class="m">${escapeHtml(byWinRate[0].name)}</div></div><div class="p">${byWinRate[0].winRate}%</div></div>`:''}
              ${byWins.length && byWins[0].wins>0?`<div class="result-row"><div><div class="n">${tr('xMostWins')}</div><div class="m">${escapeHtml(byWins[0].name)}</div></div><div class="p">${byWins[0].wins}</div></div>`:''}
              ${byEvents.length && byEvents[0].attended>0?`<div class="result-row"><div><div class="n">${tr('xMostEvents')}</div><div class="m">${escapeHtml(byEvents[0].name)}</div></div><div class="p">${byEvents[0].attended}</div></div>`:''}
              <div class="section-label">${period==='week'?tr('thisWeekLabel'):tr('allMembers')}</div>
              ${active.sort((a,b)=>(b.winRate||0)-(a.winRate||0) || b.wins-a.wins).map(r=>`
                <div class="result-row"><div><div class="n">${escapeHtml(r.name)}</div>
                  <div class="m">${r.wins}-${r.losses} · ${trf(r.attended===1?'event1':'eventsN', { n: r.attended })}</div></div>
                  <div class="p">${r.winRate!=null?r.winRate+'%':'—'}</div></div>`).join('')}
              ${rows.length > active.length ? `<div class="modal-sub" style="margin-top:8px;">${trf(rows.length-active.length===1?'membersNone1':'membersNoneN', { n: rows.length-active.length, when: period==='week' ? tr('thisWeekLower') : tr('yetWord') })}</div>` : ''}
            `}
          `;
          wireToggle();
        }

        function wireToggle(){
          lbEl.querySelectorAll('[data-lb-period]').forEach(btn=>{
            btn.onclick = ()=>{ period = btn.dataset.lbPeriod; drawBoard(); };
          });
        }

        drawBoard();
      })();
    }

    drawList();
  }

  // Picks one of your own upcoming events to share into a playgroup.

    const upcoming = buildInstances().filter(i=>i.date >= today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,40);

      <div class="modal">
        <h2>${tr('xShareAnEvent')}</h2>
        <div class="modal-sub">${trf('shareToGroup', { name: escapeHtml(group.name) })}</div>
        ${upcoming.length ? upcoming.map((i,idx)=>`
          <div class="list-item">
            <div class="info"><div class="n">${escapeHtml(i.t.name)}</div>
              <div class="m">${fmtFriendly(i.date, i.t.time)}${i.t.store?' · '+escapeHtml(i.t.store):''}</div></div>
            <button class="mini-btn" data-share-pg="${idx}">${tr('share')}</button>
          </div>`).join('') : `<div class="modal-sub">${tr('xYouHaveNoUpcomingEvents')}</div>`}
        <div class="modal-actions"><button class="btn-secondary" id="closeSharePg" style="flex:1;">${tr('close')}</button></div>
      </div>`;

    overlay.querySelectorAll('[data-share-pg]').forEach(btn=>{
      btn.onclick = async ()=>{
        const i = upcoming[parseInt(btn.dataset.sharePg,10)];
        const t = i.t;
        try{
          await supabaseClient.from('playgroup_shared_events').insert({
            playgroup_id: group.id, shared_by: session.user.id,
            event: { name: t.name, game: t.game, store: t.store, date: i.date, time: t.time,
                     format: t.format, fee: t.fee, address: t.address, link: t.link,
                     storeLink: t.storeLink, repeat: isRepeating(t) ? t.repeat : 'none',
                     isCasual: !!t.isCasual, onlineMode: t.onlineMode||'', simulatorLink: t.simulatorLink||'', contactInfo: t.contactInfo||'' }

        }catch(e){ showToast(tr('xCouldNotShare')); }
      };
    });

  async function openStoresModal(){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <div class="modal">

    document.body.appendChild(overlay);

    function setTab(name){
      overlay.querySelector('#tabBrowse').classList.toggle('active', name==='browse');
      overlay.querySelector('#tabMyStore').classList.toggle('active', name==='mystore');

    async function getMyFollowedIds(){
      try{
        const { data } = await supabaseClient.from('store_follows').select('store_id').eq('user_id', session.user.id);
        return (data||[]).map(r=>r.store_id);
      }catch(e){ return []; }

    async function renderBrowseTab(){
      body.innerHTML = `<div class="modal-sub">${tr('loadingDots')}</div>`;
      const followedIds = await getMyFollowedIds();
      body.innerHTML = `
        <div class="field"><input id="storeSearch" placeholder="${escapeAttr(tr('xSearchByStoreNameOr'))}"/></div>
        <div class="field">
          <select id="gameFilter">
            <option value="">${tr('xAllGames')}</option>
            ${GAMES.map(g=>`<option value="${escapeAttr(g)}">${escapeHtml(g)}</option>`).join('')}
          </select>
        </div>
        <div id="storeResults"><div class="modal-sub">${tr('xLoadingStores')}</div></div>
        <div class="section-label">${tr('xFollowByCode')}</div>
        <div class="field" style="align-items:center;display:flex;gap:8px;">
          <input id="followCodeInput" placeholder="${escapeAttr(tr('codeExample'))}" style="flex:1;min-width:0;text-transform:uppercase;"/>
          <button class="mini-btn" id="followCodeBtn">${tr('xFollow')}</button>
        </div>
        <div class="modal-actions"><button class="btn-secondary" id="closeStores" style="flex:1;">${tr('close')}</button></div>
      `;
      overlay.querySelector('#closeStores').onclick = ()=>overlay.remove();

      async function runSearch(term, game){
        const resultsEl = body.querySelector('#storeResults');
        resultsEl.innerHTML = `<div class="modal-sub">${tr('xSearching')}</div>`;
        try{
          let allowedIds = null;
          if(game){
            const [eventMatches, tagMatches] = await Promise.all([
              supabaseClient.from('store_events').select('store_id').ilike('game', game),
              supabaseClient.from('stores').select('id').contains('games', [game]).eq('approved', true)
            ]);
            const fromEvents = ((eventMatches.data)||[]).map(m=>m.store_id);
            const fromTags = ((tagMatches.data)||[]).map(m=>m.id);
            allowedIds = [...new Set([...fromEvents, ...fromTags])];
            if(allowedIds.length === 0){ resultsEl.innerHTML = `<div class="modal-sub">${trf('noStoresForGame', { game: escapeHtml(game) })}</div>`; return; }
          }
          let q = supabaseClient.from('stores').select('*').eq('approved', true);
          if(term && term.trim()) q = q.or(`name.ilike.%${term.trim()}%,city.ilike.%${term.trim()}%`);
          if(allowedIds) q = q.in('id', allowedIds);
          const { data, error } = await q.limit(50);
          if(error) throw error;
          if(!data || data.length===0){ resultsEl.innerHTML = `<div class="modal-sub">${tr('xNoStoresFound')}</div>`; return; }

          let countByStore = {};
          try{
            const { data: counts } = await supabaseClient.rpc('get_store_follower_counts', { store_ids: data.map(s=>s.id) });
            (counts||[]).forEach(c=>{ countByStore[c.store_id] = c.follower_count; });
          }catch(e){}

          const sorted = data.slice().sort((a,b)=>{
            if(term && term.trim()) return a.name.localeCompare(b.name); // relevance-ish: alphabetical among matches
            return (countByStore[b.id]||0) - (countByStore[a.id]||0); // default: most-followed first
          });

          resultsEl.innerHTML = sorted.map(s=>`
            <div class="list-item">
              <div class="info"><div class="n">${escapeHtml(s.name)}</div><div class="m">${escapeHtml(s.city||'')}${countByStore[s.id] ? ' · '+trf(countByStore[s.id]===1?'follower1':'followersN', { n: countByStore[s.id] }) : ''}${(s.games&&s.games.length) ? ' · '+s.games.map(g=>gameIcon(g)).join(' ') : ''}</div></div>
              <button class="mini-btn" data-follow="${s.id}" ${followedIds.includes(s.id)?'disabled':''}>${followedIds.includes(s.id)?tr('xFollowing2'):tr('followWord')}</button>
            </div>`).join('');
          resultsEl.querySelectorAll('[data-follow]').forEach(btn=>{
            btn.onclick = async ()=>{
              btn.disabled = true; btn.textContent = tr('xFollowing2');
              try{ await supabaseClient.from('store_follows').insert({ user_id: session.user.id, store_id: btn.dataset.follow }); showToast(tr('xFollowing3')); await syncFollowedStoreEvents(); render(); }
              catch(e){ showToast(tr('xCouldNotFollow')); btn.disabled=false; btn.textContent=tr('xFollow'); }
            };
          });
        }catch(e){ resultsEl.innerHTML = `<div class="modal-sub">${tr('xSearchFailedTryAgain')}</div>`; }
      }
      let searchDebounce = null;
      function currentGame(){ return body.querySelector('#gameFilter').value; }
      body.querySelector('#storeSearch').oninput = (e)=>{
        clearTimeout(searchDebounce);
        searchDebounce = setTimeout(()=>runSearch(e.target.value, currentGame()), 250);
      };
      body.querySelector('#gameFilter').onchange = ()=>{
        runSearch(body.querySelector('#storeSearch').value, currentGame());
      };
      runSearch('', '');

      body.querySelector('#followCodeBtn').onclick = async ()=>{
        const code = body.querySelector('#followCodeInput').value.trim().toUpperCase();
        if(!code){ showToast(tr('xEnterACode')); return; }
        if(await followStoreByCode(code)) runSearch(body.querySelector('#storeSearch').value, currentGame());
      };
    }

        try{

  // ---------- Brackets (Swiss / single elimination, run by a store owner or an allowed user) ----------
  // The engine is bracket.js (window.PairingsBracket): the organizer's device works out each round
  // and saves it with save_bracket_round; the server checks it (master-schema.sql, Brackets). The
  // screen is rebuilt from get_bracket, and while it is open it asks bracket_version every 15 s so
  // results players report show up (only a number crosses the network until something changed).
  const BRACKET_POLL_MS = 15000;
  const BRACKET_TOP_CUTS = [2, 4, 8, 16];
  const bracketEngine = () => window.PairingsBracket || null;
  const bracketOpts = b => ({ bestOf: (b.settings || {}).bestOf === 1 ? 1 : 3, seed: b.seed });
  const bracketPlayers = b => b.players.map(p => ({ id: p.id, name: p.name, dropped: p.dropped }));
  const bracketStageMatches = (b, stage) => b.matches.filter(m => m.stage === stage);
  const bracketSeeds = b => b.players.filter(p => p.seed != null).sort((x, y) => x.seed - y.seed).map(p => p.id);
  const bracketHasResult = m => m.p2 == null || !!m.result;
  function bracketStatusLabel(b){
    if(b.status === 'swiss') return trf('brStatusSwiss', { n: b.current_round });
    return tr({ registration: 'brStatusRegistration', top_cut: 'brStatusTopCut', finished: 'brStatusFinished', cancelled: 'brStatusCancelled' }[b.status] || 'brStatusRegistration');
  }
  const bracketPlayerCount = n => n === 1 ? tr('brPlayerCount1') : trf('brPlayerCount', { n });
  function bracketFormatLabel(f){ return tr({ swiss: 'brFormatSwiss', swiss_top_cut: 'brFormatSwissTopCut', single_elim: 'brFormatSingleElim' }[f] || 'brFormatSwiss'); }
  // "Final", "Semifinals", "Quarterfinals", or "Round of 16" for an elimination round.
  function bracketElimRoundName(size, round){
    const left = size / Math.pow(2, round - 1);
    return left === 2 ? tr('brFinal') : left === 4 ? tr('brSemis') : left === 8 ? tr('brQuarters') : trf('brRoundOfN', { n: left });
  }

  // ---- shared by the organizer's screen and the player view ----
  const bracketNameOf = (b, pid) => { const p = b.players.find(x => x.id === pid); return p ? p.name : '?'; };
  // Every result a match can have, as picker options ({ v: 'p1:2:1', l: 'Bea 2-1' }). Elimination has no draws.
  function bracketResultOptions(b, m){
    const need = bracketEngine().winsNeeded(bracketOpts(b).bestOf), elim = m.stage === 'elim';
    const o = [{ v: '', l: tr('brResultPick') }];
    const wins = [];
    for(let loser = 0; loser < need; loser++) wins.push([need, loser]);
    if(need > 1) wins.push([1, 0]);   // a win on time
    wins.forEach(([w, l]) => o.push({ v: `p1:${w}:${l}`, l: `${bracketNameOf(b, m.p1)} ${w}-${l}` }));
    wins.forEach(([w, l]) => o.push({ v: `p2:${l}:${w}`, l: `${bracketNameOf(b, m.p2)} ${w}-${l}` }));
    if(!elim){
      if(need > 1) o.push({ v: 'draw:1:1', l: tr('brDraw') + ' 1-1' });
      o.push({ v: 'draw:0:0', l: tr('brDraw') + (need > 1 ? ' 0-0' : '') });
      o.push({ v: 'double_loss::', l: tr('brDoubleLoss') });
    }
    return o;
  }
  // The picker value for a result ({ result, p1Games, p2Games }: a match or one player's report).
  function bracketResultValue(b, m){
    if(!m || !m.result) return '';
    if(m.result === 'double_loss') return 'double_loss::';
    if(m.p1Games == null){
      const need = bracketEngine().winsNeeded(bracketOpts(b).bestOf);
      return m.result === 'p1' ? `p1:${need}:0` : m.result === 'p2' ? `p2:0:${need}` : (need > 1 ? 'draw:1:1' : 'draw:0:0');
    }
    return `${m.result}:${m.p1Games}:${m.p2Games}`;
  }
  const bracketResultLabel = (b, m, r) => { const v = bracketResultValue(b, r); const o = v && bracketResultOptions(b, m).find(x => x.v === v); return o ? o.l : ''; };
  function bracketStatusBadge(m){
    if(m.status === 'disputed') return `<span style="color:var(--rose);">⚠ ${tr('brDisputed')}</span>`;
    if(m.status === 'reported') return `<span style="color:var(--text-dim);">${tr('brReported')}</span>`;
    if(m.status === 'confirmed') return `<span style="color:var(--teal);">✓ ${tr('brConfirmed')}</span>`;
    return '';
  }
  // One match as a list row; `editable` adds the organizer's result picker.
  function bracketMatchRow(b, m, label, editable){
    const nameOf = pid => bracketNameOf(b, pid);
    if(m.p2 == null) return `<div class="list-item"><div class="info"><div class="n">${escapeHtml(nameOf(m.p1))}</div><div class="m">${tr('brBye')}</div></div></div>`;
    const current = bracketResultValue(b, m);
    const picker = editable ? `<div class="field" style="margin:0;flex:0 0 auto;max-width:150px;"><select data-result="${escapeAttr(m.id)}" aria-label="${escapeAttr(trf('brResultFor', { a: nameOf(m.p1), b: nameOf(m.p2) }))}" style="padding:7px 8px;">
        ${bracketResultOptions(b, m).map(o=>`<option value="${escapeAttr(o.v)}" ${o.v === current ? 'selected' : ''}>${escapeHtml(o.l)}</option>`).join('')}
      </select></div>` : '';
    // Players who disagree: show what each of them reported, so the organizer can settle it.
    const said = (pid, r) => { const l = r && bracketResultLabel(b, m, r); return l ? trf('brSays', { name: nameOf(pid), result: l }) : ''; };
    const reports = m.status === 'disputed' ? [said(m.p1, m.p1_report), said(m.p2, m.p2_report)].filter(Boolean).join(' · ') : '';
    const result = !editable && m.result ? bracketResultLabel(b, m, m) : '';
    return `<div class="list-item">
      <div class="info"><div class="n">${escapeHtml(nameOf(m.p1))} <span style="color:var(--text-dim);">${tr('brVs')}</span> ${escapeHtml(nameOf(m.p2))}</div>
        <div class="m">${escapeHtml([label, result].filter(Boolean).join(' · '))}${bracketStatusBadge(m) ? ' · ' + bracketStatusBadge(m) : ''}</div>
        ${reports ? `<div class="m">${escapeHtml(reports)}</div>` : ''}</div>
      ${picker}
    </div>`;
  }
  // The elimination bracket round by round: { e (bracket.js's view), cur (latest saved round), html }.
  // rowFn(savedMatch, label, round, cur) draws a match that has been saved.
  function bracketElimView(b, rowFn){
    const nameOf = pid => bracketNameOf(b, pid);
    const elim = bracketStageMatches(b, 'elim'), seeds = bracketSeeds(b);
    const e = seeds.length ? bracketEngine().elimination(seeds, elim) : null;
    const cur = Math.max(0, ...elim.map(m => m.round));
    let html = '';
    if(e){
      const saved = (r, p1, p2) => elim.find(m => m.round === r && ((m.p1 === p1 && m.p2 === p2) || (m.p1 === p2 && m.p2 === p1)));
      e.rounds.forEach((list, i) => {
        const r = i + 1;
        const rows = list.map(m => {
          if(m.bye) return `<div class="list-item"><div class="info"><div class="n">${escapeHtml(nameOf(m.p1 || m.p2))}</div><div class="m">${tr('brBye')}</div></div></div>`;
          const row = m.p1 && m.p2 ? saved(r, m.p1, m.p2) : null;
          if(row) return rowFn(row, trf('brSeedVs', { a: seeds.indexOf(row.p1) + 1, b: seeds.indexOf(row.p2) + 1 }), r, cur);
          return `<div class="list-item"><div class="info"><div class="n" style="color:var(--text-dim);">${escapeHtml(m.p1 ? nameOf(m.p1) : tr('brTbd'))} ${tr('brVs')} ${escapeHtml(m.p2 ? nameOf(m.p2) : tr('brTbd'))}</div></div></div>`;
        }).join('');
        html += `<div class="section-label">${escapeHtml(bracketElimRoundName(e.size, r))}</div>${rows}`;
      });
    }
    return { e, cur, html };
  }
  // Swiss standings as list rows (meId's row is highlighted).
  function bracketStandingsHtml(b, meId){
    const rows = bracketEngine().standings(bracketPlayers(b), bracketStageMatches(b, 'swiss'), bracketOpts(b));
    return `<div class="hint" style="margin-bottom:8px;">${tr('brTiebreakHint')}</div>
      ${rows.map(r=>`
        <div class="list-item"${r.id === meId ? ' style="border-color:var(--rift);"' : ''}>
          <div class="info"><div class="n">${r.rank}. ${escapeHtml(r.name)}${r.dropped ? ` <span style="color:var(--text-dim);">(${tr('brDroppedShort')})</span>` : ''}</div>
            <div class="m">${escapeHtml(trf('brRecord', { w: r.wins, l: r.losses, d: r.draws }))} · <span title="${escapeAttr(tr('brTiebreakTitle'))}">${escapeHtml(r.tiebreak)}</span></div></div>
        </div>`).join('')}`;
  }

  // My brackets, and a form for a new one (prefill: from a store event's 🏆 button).
  async function openBracketsModal(prefill){
    prefill = prefill || {};
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `<div class="modal"><h2>🏆 ${tr('brTitle')}</h2><div id="bracketsBody"><div class="modal-sub">${tr('loadingDots')}</div></div></div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
    const body = overlay.querySelector('#bracketsBody');
    const closeRow = `<div class="modal-actions"><button class="btn-secondary" id="closeBrackets" style="flex:1;">${tr('close')}</button></div>`;
    const wireClose = () => { overlay.querySelector('#closeBrackets').onclick = ()=>overlay.remove(); };
    if(!bracketEngine()){ body.innerHTML = `<div class="modal-sub">${tr('brEngineMissing')}</div>${closeRow}`; wireClose(); return; }

    let allowed = false, mine = [], played = [];
    try{
      const [access, list, playedIn] = await Promise.all([
        supabaseClient.rpc('can_run_brackets'),
        supabaseClient.from('brackets').select('id, name, game, format, status, current_round, created_at').order('created_at', { ascending: false }).limit(30),
        supabaseClient.rpc('my_brackets'),
      ]);
      if(list.error) throw list.error;
      allowed = !access.error && access.data === true;
      mine = list.data || [];
      played = (!playedIn.error && Array.isArray(playedIn.data)) ? playedIn.data : [];
    }catch(e){
      body.innerHTML = `<div class="modal-sub">${tr('brCouldNotLoad')}</div>${closeRow}`; wireClose(); return;
    }

    const games = GAMES.includes(prefill.game) || !prefill.game ? GAMES : [prefill.game].concat(GAMES);
    const form = allowed ? `
      <div class="field">
        <label for="br_name">${tr('brNewTitle')}</label>
        <input id="br_name" maxlength="120" placeholder="${escapeAttr(tr('brNamePlaceholder'))}" value="${escapeAttr(prefill.name || '')}"/>
      </div>
      <div class="row2">
        <div class="field"><label for="br_game">${tr('brGame')}</label>
          <select id="br_game">${games.map(g=>`<option value="${escapeAttr(g)}" ${g === prefill.game ? 'selected' : ''}>${escapeHtml(g)}</option>`).join('')}</select></div>
        <div class="field"><label for="br_format">${tr('brFormatLabel')}</label>
          <select id="br_format">${['swiss', 'swiss_top_cut', 'single_elim'].map(f=>`<option value="${f}">${escapeHtml(bracketFormatLabel(f))}</option>`).join('')}</select></div>
      </div>
      <div class="row2">
        <div class="field"><label for="br_bestof">${tr('brBestOfLabel')}</label>
          <select id="br_bestof"><option value="3">${tr('brBestOf3')}</option><option value="1">${tr('brBestOf1')}</option></select></div>
        <div class="field"><label for="br_rounds">${tr('brRoundsLabel')}</label>
          <input id="br_rounds" type="number" min="1" max="20" placeholder="${escapeAttr(tr('brRoundsAuto'))}"/></div>
      </div>
      <div class="field" id="br_topcut_field" style="display:none;"><label for="br_topcut">${tr('brTopCutLabel')}</label>
        <select id="br_topcut">${BRACKET_TOP_CUTS.map(n=>`<option value="${n}" ${n === 8 ? 'selected' : ''}>${escapeHtml(trf('brTopN', { n }))}</option>`).join('')}</select></div>
      <div class="hint" style="margin-bottom:10px;">${tr('brTiebreakHint')}</div>
      <button class="btn-primary" id="br_create" style="width:100%;">${tr('brCreate')}</button>`
      : `<div class="modal-sub">${tr('brNotAllowed')}</div>`;

    body.innerHTML = `${form}
      ${allowed || mine.length ? `<div class="section-label">${tr('brYours')}</div>` : ''}
      ${mine.length ? mine.map(x=>`
        <div class="list-item">
          <div class="info"><div class="n">${escapeHtml(x.name)}</div>
            <div class="m">${escapeHtml([x.game, bracketFormatLabel(x.format), bracketStatusLabel(x)].filter(Boolean).join(' · '))}</div></div>
          <button class="mini-btn" data-open-bracket="${escapeAttr(x.id)}">${tr('brOpen')}</button>
        </div>`).join('') : allowed ? `<div class="modal-sub">${tr('brNoneYet')}</div>` : ''}
      ${played.length ? `<div class="section-label">${tr('brPlayedIn')}</div>
        ${played.map(x=>`
        <div class="list-item">
          <div class="info"><div class="n">${escapeHtml(x.name)}</div>
            <div class="m">${escapeHtml([x.game, bracketStatusLabel(x), x.status === 'finished' && bracketResultLogged(x.id) ? tr('brInYourResults') : ''].filter(Boolean).join(' · '))}</div></div>
          <button class="mini-btn" data-view-bracket="${escapeAttr(x.id)}">${tr('brOpen')}</button>
        </div>`).join('')}` : ''}
      ${closeRow}`;
    wireClose();
    body.querySelectorAll('[data-open-bracket]').forEach(btn=>{
      btn.onclick = ()=>{ overlay.remove(); openBracketModal(btn.dataset.openBracket); };
    });
    body.querySelectorAll('[data-view-bracket]').forEach(btn=>{
      btn.onclick = ()=>{ overlay.remove(); openBracketViewModal(btn.dataset.viewBracket); };
    });
    if(!allowed) return;

    const fmt = body.querySelector('#br_format');
    const rounds = body.querySelector('#br_rounds');
    fmt.onchange = ()=>{
      body.querySelector('#br_topcut_field').style.display = fmt.value === 'swiss_top_cut' ? '' : 'none';
      rounds.disabled = fmt.value === 'single_elim';
    };
    body.querySelector('#br_create').onclick = async (e)=>{
      const name = body.querySelector('#br_name').value.trim();
      if(!name){ showToast(tr('brNameFirst')); return; }
      const n = parseInt(rounds.value, 10);
      const settings = { bestOf: body.querySelector('#br_bestof').value === '1' ? 1 : 3 };
      if(fmt.value !== 'single_elim' && n >= 1 && n <= 20) settings.rounds = n;
      if(fmt.value === 'swiss_top_cut') settings.topCut = parseInt(body.querySelector('#br_topcut').value, 10) || 8;
      e.target.disabled = true;
      const { data, error } = await supabaseClient.from('brackets').insert({
        owner_id: session.user.id, name, game: body.querySelector('#br_game').value, format: fmt.value, settings,
        store_id: prefill.store_id || null, store_event_id: prefill.store_event_id || null, occurrence_date: prefill.occurrence_date || null,
      }).select('id').single();
      if(error || !data){ e.target.disabled = false; showToast(tr('brCouldNotSave')); return; }
      overlay.remove();
      openBracketModal(data.id);
    };
  }

  // One bracket, for its organizer: players, the current round, standings.
  async function openBracketModal(id){
    const B = bracketEngine();
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `<div class="modal"><h2 id="brHeading">🏆 ${tr('brTitle')}</h2><div id="bracketBody"><div class="modal-sub">${tr('loadingDots')}</div></div></div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
    const body = overlay.querySelector('#bracketBody');
    let b = null, tab = 'round', busy = false;

    async function load(){
      const { data, error } = await supabaseClient.rpc('get_bracket', { p_bracket: id });
      if(error || !data) throw error || new Error('bracket not found');
      b = data;
      b.players = b.players || []; b.matches = b.matches || [];
    }
    // Runs one change, then reloads and redraws. Errors from the server become a toast.
    async function act(fn){
      if(busy) return;
      busy = true;
      try{ await fn(); }
      catch(e){ console.error('bracket action failed:', e); showToast(tr('brCouldNotSave')); }
      try{ await load(); }catch(e){ /* keep showing what we had */ }
      busy = false;
      draw();
    }
    const must = r => { if(r && r.error) throw r.error; return r; };

    try{ await load(); }
    catch(e){
      body.innerHTML = `<div class="modal-sub">${tr('brCouldNotLoad')}</div><div class="modal-actions"><button class="btn-secondary" id="closeBracket" style="flex:1;">${tr('close')}</button></div>`;
      body.querySelector('#closeBracket').onclick = ()=>overlay.remove();
      return;
    }
    if(!B){ overlay.remove(); showToast(tr('brEngineMissing')); return; }

    // Results players report arrive while the screen is open; skip a tick while the organizer is typing.
    const timer = setInterval(async ()=>{
      if(!document.body.contains(overlay)){ clearInterval(timer); return; }
      const typing = overlay.contains(document.activeElement) && /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
      if(busy || typing || document.hidden) return;
      try{
        const { data } = await supabaseClient.rpc('bracket_version', { p_bracket: id });
        if(data != null && data !== b.version){ await load(); draw(); }
      }catch(e){ /* try again next tick */ }
    }, BRACKET_POLL_MS);

    const opts = () => bracketOpts(b);
    const nameOf = pid => { const p = b.players.find(x => x.id === pid); return p ? p.name : '?'; };
    const totalRounds = () => (b.settings || {}).rounds || B.recommendedRounds(b.players.filter(p => !p.dropped).length);
    const running = () => b.status === 'swiss' || b.status === 'top_cut';

    const matchRow = (m, label, editable) => bracketMatchRow(b, m, label, running() && editable !== false);

    // ---- actions ----
    function saveRound(stage, round, pairs){
      return supabaseClient.rpc('save_bracket_round', { p_bracket: id, p_stage: stage, p_round: round, p_pairings: pairs.map(p => ({ p1: p.p1, p2: p.p2 == null ? null : p.p2, table: p.table == null ? null : p.table })) }).then(must);
    }
    async function pairSwissRound(round){
      const pairs = B.pairSwiss(bracketPlayers(b), bracketStageMatches(b, 'swiss'), round, opts());
      if(pairs.rematch && !confirm(tr('brRematchWarn'))) return;
      if(round === 1 && !(b.settings || {}).rounds){
        const settings = Object.assign({}, b.settings, { rounds: B.recommendedRounds(b.players.filter(p => !p.dropped).length) });
        must(await supabaseClient.from('brackets').update({ settings }).eq('id', id));
      }
      await saveRound('swiss', round, pairs);
    }
    async function setSeeds(seeds){
      const results = await Promise.all(b.players.map(p => {
        const seed = seeds.indexOf(p.id) + 1 || null;
        return seed === p.seed ? null : supabaseClient.from('bracket_players').update({ seed }).eq('id', p.id);
      }));
      results.forEach(r => r && must(r));
    }
    async function saveElimRound(round, seeds){
      const e = B.elimination(seeds, bracketStageMatches(b, 'elim'));
      const pairs = e.rounds[round - 1].filter(m => !m.bye && m.p1 != null && m.p2 != null).map((m, i) => ({ p1: m.p1, p2: m.p2, table: i + 1 }));
      if(!pairs.length) throw new Error('nothing to pair');
      await saveRound('elim', round, pairs);
    }
    async function startElimination(){
      const active = b.players.filter(p => !p.dropped).length;
      const rows = B.standings(bracketPlayers(b), bracketStageMatches(b, 'swiss'), opts());
      const size = b.format === 'single_elim' ? active : Math.min((b.settings || {}).topCut || 8, active);
      const seeds = B.topCut(rows, size);   // straight elimination: no Swiss matches, so this is the seeded draw
      await setSeeds(seeds);
      await saveElimRound(1, seeds);
    }

    // ---- tabs ----
    function playersTab(){
      const canAdd = b.status === 'registration' || (b.status === 'swiss' && b.format !== 'single_elim');
      const list = b.players.slice().sort((x, y) => (x.dropped - y.dropped) || x.name.localeCompare(y.name));
      return `
        ${canAdd ? `<div class="field" style="display:flex;gap:8px;align-items:center;">
          <input id="brAddName" maxlength="40" placeholder="${escapeAttr(tr('brAddPlaceholder'))}" style="flex:1;min-width:0;"/>
          <button class="mini-btn" id="brAddBtn">${tr('brAdd')}</button>
        </div>${b.status === 'swiss' ? `<div class="hint" style="margin-bottom:10px;">${tr('brLateEntryHint')}</div>` : ''}` : ''}
        <div class="modal-sub">${bracketPlayerCount(b.players.filter(p => !p.dropped).length)}</div>
        ${list.map(p=>`
          <div class="list-item">
            <div class="info"><div class="n">${escapeHtml(p.name)}</div>
              <div class="m">${[p.guest ? tr('brGuest') : tr('brHasAccount'), p.dropped ? trf('brDroppedRound', { n: p.dropped_round || 0 }) : ''].filter(Boolean).map(escapeHtml).join(' · ')}</div></div>
            <div style="display:flex;gap:6px;">
              ${p.guest ? `<button class="mini-btn" data-guest-link="${escapeAttr(p.id)}" aria-label="${escapeAttr(trf('brGuestLinkTitle', { name: p.name }))}">🔗</button>` : ''}
              ${running() ? `<button class="mini-btn" data-drop="${escapeAttr(p.id)}">${p.dropped ? tr('brUndrop') : tr('brDrop')}</button>` : ''}
              ${b.status === 'registration' ? `<button class="mini-btn decline" data-remove="${escapeAttr(p.id)}" aria-label="${escapeAttr(trf('brRemoveName', { name: p.name }))}">✕</button>` : ''}
            </div>
          </div>`).join('')}`;
    }

    function roundTab(){
      const swiss = bracketStageMatches(b, 'swiss'), elim = bracketStageMatches(b, 'elim');
      const active = b.players.filter(p => !p.dropped).length;
      if(b.status === 'registration'){
        return `<div class="modal-sub">${bracketPlayerCount(active)}${b.format !== 'single_elim' ? ' · ' + trf('brRoundsPlanned', { n: totalRounds() }) : ''}</div>
          <button class="btn-primary" id="brStart" style="width:100%;" ${active < 2 ? 'disabled' : ''}>${b.format === 'single_elim' ? tr('brStartBracket') : tr('brStartRound1')}</button>
          ${active < 2 ? `<div class="hint" style="margin-top:8px;">${tr('brNeedTwo')}</div>` : ''}`;
      }
      if(b.status === 'swiss'){
        const round = b.current_round, current = swiss.filter(m => m.round === round);
        const done = current.every(bracketHasResult);
        const untouched = current.every(m => !m.result && !m.p1_report && !m.p2_report);
        const last = round >= totalRounds();
        const left = current.filter(m => !bracketHasResult(m)).length;
        return `<div class="section-label">${trf('brRoundOf', { n: round, total: totalRounds() })}</div>
          ${current.map(m => matchRow(m, m.table ? trf('brTable', { n: m.table }) : '')).join('')}
          <div class="modal-sub" style="margin-top:8px;">${done ? tr('brAllIn') : (left === 1 ? tr('brWaitingOn1') : trf('brWaitingOn', { n: left }))}</div>
          <div class="modal-actions" style="flex-wrap:wrap;">
            ${untouched ? `<button class="btn-secondary" id="brRepair" style="flex:1;">${tr('brRepair')}</button>` : ''}
            ${done && !last ? `<button class="btn-primary" id="brNext" style="flex:1;">${trf('brStartRoundN', { n: round + 1 })}</button>` : ''}
            ${done && last && b.format === 'swiss_top_cut' ? `<button class="btn-primary" id="brTopCut" style="flex:1;">${trf('brStartTopCut', { n: Math.min((b.settings || {}).topCut || 8, active) })}</button>` : ''}
            ${done && last ? `<button class="${b.format === 'swiss_top_cut' ? 'btn-secondary' : 'btn-primary'}" id="brExtra" style="flex:1;">${tr('brExtraRound')}</button>` : ''}
            ${done && last && b.format !== 'swiss_top_cut' ? `<button class="btn-primary" id="brFinish" style="flex:1;">${tr('brFinish')}</button>` : ''}
          </div>`;
      }
      // Elimination (a top cut, or the whole event), and the finished view.
      const { e, cur: curElim, html: elimHtml } = bracketElimView(b, (row, label, r, cur) => matchRow(row, label, r === cur));
      let html = elimHtml;
      if(b.status === 'top_cut' && e){
        const cur = curElim;
        const done = elim.filter(m => m.round === cur).every(bracketHasResult);
        html = (e.champion ? `<div class="modal-sub" style="font-size:16px;">🏆 ${escapeHtml(trf('brChampion', { name: nameOf(e.champion) }))}</div>` : '') + html + `
          <div class="modal-actions">
            ${done && !e.champion ? `<button class="btn-primary" id="brNextElim" style="flex:1;">${escapeHtml(trf('brStartElimRound', { name: bracketElimRoundName(e.size, cur + 1) }))}</button>` : ''}
            ${e.champion ? `<button class="btn-primary" id="brFinish" style="flex:1;">${tr('brFinish')}</button>` : ''}
          </div>`;
      }
      if(b.status === 'finished' || b.status === 'cancelled'){
        const winner = e && e.champion ? e.champion : (B.standings(bracketPlayers(b), bracketStageMatches(b, 'swiss'), opts())[0] || {}).id;
        html = `<div class="modal-sub" style="font-size:16px;">${b.status === 'finished' && winner ? '🏆 ' + escapeHtml(trf('brChampion', { name: nameOf(winner) })) : escapeHtml(bracketStatusLabel(b))}</div>` + html;
      }
      return html || `<div class="modal-sub">${tr('nothingToShow')}</div>`;
    }

    function standingsTab(){
      if(!bracketStageMatches(b, 'swiss').length) return `<div class="modal-sub">${tr('brNoStandings')}</div>`;
      return `${bracketStandingsHtml(b)}
        <button class="mini-btn" id="brCsv" style="margin-top:10px;">${tr('xDownloadCsv')}</button>`;
    }

    function draw(){
      if(!document.body.contains(overlay)) return;
      overlay.querySelector('#brHeading').textContent = '🏆 ' + b.name;
      const tabs = [['round', b.status === 'top_cut' || b.format === 'single_elim' ? tr('brTabBracket') : tr('brTabRound')], ['players', tr('brTabPlayers')], ['standings', tr('brTabStandings')]];
      body.innerHTML = `
        <div class="modal-sub">${escapeHtml([b.game, bracketFormatLabel(b.format), (b.settings || {}).bestOf === 1 ? tr('brBestOf1') : tr('brBestOf3'), bracketStatusLabel(b)].filter(Boolean).join(' · '))}</div>
        <div class="chip-row" style="margin-bottom:12px;">
          ${tabs.map(([k, l])=>`<button type="button" class="chip ${tab === k ? 'active' : ''}" data-tab="${k}" aria-pressed="${tab === k}">${escapeHtml(l)}</button>`).join('')}
        </div>
        <div id="brTab">${tab === 'players' ? playersTab() : tab === 'standings' ? standingsTab() : roundTab()}</div>
        <div class="modal-actions" style="margin-top:16px;flex-wrap:wrap;">
          <button class="btn-secondary" id="brShare" style="flex:1 1 100%;">📱 ${tr('brPlayerLink')}</button>
          <button class="btn-secondary" id="brDelete" style="flex:1;">${tr('brDelete')}</button>
          <button class="btn-secondary" id="closeBracket" style="flex:1;">${tr('close')}</button>
        </div>`;
      wire();
    }

    function wire(){
      const $ = sel => body.querySelector(sel);
      const on = (sel, fn) => { const el = $(sel); if(el) el.onclick = fn; };
      body.querySelectorAll('[data-tab]').forEach(btn => { btn.onclick = ()=>{ tab = btn.dataset.tab; draw(); }; });
      on('#closeBracket', ()=>overlay.remove());
      on('#brShare', ()=>openBracketQrModal(tr('brPlayerLink'), b.name, bracketLink(id), tr('brPlayerLinkHint')));
      body.querySelectorAll('[data-guest-link]').forEach(btn => {
        btn.onclick = async ()=>{
          const p = b.players.find(x => x.id === btn.dataset.guestLink);
          const { data, error } = await supabaseClient.from('bracket_players').select('guest_token').eq('id', btn.dataset.guestLink).maybeSingle();
          if(error || !data || !data.guest_token){ showToast(tr('brCouldNotLoad')); return; }
          openBracketQrModal(trf('brGuestLinkTitle', { name: p ? p.name : '' }), b.name, bracketLink(id, data.guest_token), tr('brGuestLinkHint'));
        };
      });
      on('#brDelete', ()=>{
        if(!confirm(tr('brDeleteConfirm'))) return;
        act(async ()=>{ must(await supabaseClient.from('brackets').delete().eq('id', id)); overlay.remove(); showToast(tr('brDeleted')); });
      });

      const addName = $('#brAddName');
      const add = ()=>{
        const name = addName.value.trim();
        if(!name){ showToast(tr('brNameFirst')); return; }
        act(async ()=>{ must(await supabaseClient.from('bracket_players').insert({ bracket_id: id, name: name.slice(0, 40) })); tab = 'players'; });
      };
      on('#brAddBtn', add);
      if(addName) addName.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); add(); } };
      body.querySelectorAll('[data-remove]').forEach(btn => {
        btn.onclick = ()=>act(async ()=>{ must(await supabaseClient.from('bracket_players').delete().eq('id', btn.dataset.remove)); });
      });
      body.querySelectorAll('[data-drop]').forEach(btn => {
        btn.onclick = ()=>{
          const p = b.players.find(x => x.id === btn.dataset.drop);
          if(!p) return;
          act(async ()=>{ must(await supabaseClient.from('bracket_players').update(p.dropped ? { dropped: false, dropped_round: null } : { dropped: true, dropped_round: b.current_round }).eq('id', p.id)); });
        };
      });

      body.querySelectorAll('[data-result]').forEach(sel => {
        sel.onchange = ()=>{
          if(!sel.value) return;
          const [result, g1, g2] = sel.value.split(':');
          act(async ()=>{
            must(await supabaseClient.rpc('report_bracket_result', { p_match: sel.dataset.result, p_result: result,
              p_p1_games: g1 === '' ? null : Number(g1), p_p2_games: g2 === '' ? null : Number(g2) }));
          });
        };
      });

      on('#brStart', ()=>act(async ()=>{ if(b.format === 'single_elim') await startElimination(); else await pairSwissRound(1); tab = 'round'; }));
      on('#brRepair', ()=>act(()=>pairSwissRound(b.current_round)));
      on('#brNext', ()=>act(()=>pairSwissRound(b.current_round + 1)));
      on('#brExtra', ()=>act(async ()=>{
        const settings = Object.assign({}, b.settings, { rounds: totalRounds() + 1 });
        must(await supabaseClient.from('brackets').update({ settings }).eq('id', id));
        b.settings = settings;
        await pairSwissRound(b.current_round + 1);
      }));
      on('#brTopCut', ()=>act(startElimination));
      on('#brNextElim', ()=>act(()=>saveElimRound(Math.max(...bracketStageMatches(b, 'elim').map(m => m.round)) + 1, bracketSeeds(b))));
      on('#brFinish', ()=>{
        if(!confirm(tr('brFinishConfirm'))) return;
        act(async ()=>{ must(await supabaseClient.from('brackets').update({ status: 'finished' }).eq('id', id)); tab = 'round'; });
      });
      on('#brCsv', ()=>{
        const rows = B.standings(bracketPlayers(b), bracketStageMatches(b, 'swiss'), opts());
        const table = [[tr('csvRank'), tr('csvName'), tr('csvWins'), tr('csvLosses'), tr('csvDraws'), tr('csvPoints'), tr('csvTiebreakers'), tr('csvDropped')]];
        rows.forEach(r => table.push([r.rank, r.name, r.wins, r.losses, r.draws, r.points, r.tiebreak, r.dropped ? tr('yesWord') : tr('noWord')]));
        const slug = String(b.name || 'bracket').replace(/[^a-z0-9]+/gi, '_').replace(/^_+|_+$/g, '').slice(0, 50) || 'bracket';
        downloadText('standings_' + slug + '.csv', toCsv(table));
      });
    }

    draw();
  }

  // ---- a finished bracket → the player's own results ----
  // "1st", "2nd", "3rd", "4th"... (Spanish "1º"): a placement is free text the player could have
  // typed, so it's written in the app's language at the moment it's filled in.
  function bracketOrdinal(n){
    if(currentLang === 'es') return n + 'º';
    const s = (n % 100 >= 11 && n % 100 <= 13) ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th');
    return n + s;
  }
  // The result form's fields for player `meId`: placement, record (byes count as wins, as on the
  // standings) and one round per match actually played, in order, plus the bracket's id so the
  // app knows this bracket's result is in. Unreported matches and byes are not rounds.
  function bracketResultFor(b, meId){
    const B = bracketEngine(), opts = bracketOpts(b);
    let w = 0, l = 0, d = 0;
    const matches = [];
    b.matches.filter(m => m.p1 === meId || m.p2 === meId)
      .sort((x, y) => (x.stage === y.stage ? 0 : x.stage === 'swiss' ? -1 : 1) || x.round - y.round)
      .forEach(m => {
        if(m.p2 == null){ w++; return; }
        if(!m.result) return;
        const mine = m.p1 === meId ? 'p1' : 'p2';
        const outcome = m.result === 'draw' ? 'D' : m.result === mine ? 'W' : 'L';
        if(outcome === 'W') w++; else if(outcome === 'L') l++; else d++;
        matches.push({ opponent: bracketNameOf(b, mine === 'p1' ? m.p2 : m.p1), outcome, wentFirst: '', notes: '' });
      });
    // Placement: how far they got in the elimination bracket, otherwise their Swiss rank.
    let placement = '';
    const seeds = bracketSeeds(b);
    if(seeds.includes(meId)){
      const e = B.elimination(seeds, bracketStageMatches(b, 'elim'));
      if(e.champion === meId) placement = bracketOrdinal(1);
      else {
        const lost = e.rounds.findIndex(list => list.some(m => !m.bye && (m.p1 === meId || m.p2 === meId) && m.winner && m.winner !== meId));
        if(lost >= 0){ const left = e.size / Math.pow(2, lost); placement = left === 2 ? bracketOrdinal(2) : trf('brTopN', { n: left }); }
      }
    }
    if(!placement && bracketStageMatches(b, 'swiss').length){
      const row = B.standings(bracketPlayers(b), bracketStageMatches(b, 'swiss'), opts).find(r => r.id === meId);
      if(row) placement = bracketOrdinal(row.rank);
    }
    return { placement, record: d ? `${w}-${l}-${d}` : `${w}-${l}`, notes: '', matches, bracketId: b.id };
  }
  // Where a bracket's result already is in the player's list, if anywhere: { t, date }.
  function bracketResultLogged(bracketId){
    for(const t of tournaments){
      if(t.result && t.result.bracketId === bracketId) return { t, date: t.date };
      for(const [date, o] of Object.entries(t.occurrences || {})) if(o && o.result && o.result.bracketId === bracketId) return { t, date };
    }
    return null;
  }
  // Opens the normal result form filled in from the bracket; the player adds their deck and saves.
  // It goes on the store event the bracket was for when that's in their list (a followed store's
  // event), otherwise on a new event named after the bracket.
  function addBracketResult(b, meId, onSaved){
    if(!userDataLoaded && !offlineMode){ showToast(tr('brEventsNotLoaded')); return; }
    const done = bracketResultLogged(b.id);
    if(done){ openResultModal(done.t.id, done.date, { onSaved }); return; }
    const date = b.occurrence_date || (b.finished_at || new Date().toISOString()).slice(0, 10);
    const prefill = bracketResultFor(b, meId);
    const copy = b.store_event_id && tournaments.find(t => t.storeEventId === b.store_event_id);
    if(copy && !getOcc(copy, date).result){ openResultModal(copy.id, date, { prefill, onSaved }); return; }
    const draft = {
      id: uid(), name: b.name, game: b.game || '', store: (b.store && b.store.name) || '', date, time: '',
      format: '', fee: '', address: '', city: '', link: '', storeLink: '', deckLink: '', notes: '',
      isCasual: false, onlineMode: '', simulatorLink: '', contactInfo: '',
      repeat: 'none', rsvp: 'going', result: null, occurrences: {}, lat: null, lng: null, googleEventId: null,
    };
    openResultModal(draft.id, date, { draft, prefill, onSaved });
  }

  // ---- links: ?bracket=<id> (anyone: follow, join) and ?bracket=<id>&p=<token> (one guest) ----
  // A guest's token is kept on this device (pairings-bracket-tokens, id → token) and taken out of
  // the address bar, so a refresh or a second visit still knows who they are without the secret
  // sitting in the URL bar or history.
  const BRACKET_TOKENS_KEY = 'pairings-bracket-tokens';
  function bracketTokens(){ try{ return JSON.parse(localStorage.getItem(BRACKET_TOKENS_KEY) || '{}') || {}; }catch(e){ return {}; } }
  function bracketTokenFor(id){ const t = bracketTokens()[id]; return typeof t === 'string' && /^[0-9a-f]{32}$/.test(t) ? t : null; }
  function rememberBracketToken(id, token){
    try{
      const all = bracketTokens(); all[id] = token;
      const keys = Object.keys(all); while(keys.length > 30) delete all[keys.shift()];   // only the newest 30
      localStorage.setItem(BRACKET_TOKENS_KEY, JSON.stringify(all));
    }catch(e){ /* private mode: the link still works while it is open */ }
  }
  const bracketLink = (id, token) => baseAppUrl() + '?bracket=' + id + (token ? '&p=' + token : '');

  // A link plus its QR code (a bracket's player link, or one guest's own link).
  function openBracketQrModal(title, sub, url, hint){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `<div class="modal" style="text-align:center;">
      <h2>${escapeHtml(title)}</h2>
      <div class="modal-sub">${escapeHtml(sub)}</div>
      <div id="brQrHolder" style="display:flex;justify-content:center;margin:12px auto;background:#fff;padding:12px;border-radius:12px;width:fit-content;"></div>
      <div class="hint">${escapeHtml(hint)}</div>
      <div class="share-link" style="margin:10px 0;word-break:break-all;">${escapeHtml(url)}</div>
      <div class="modal-actions">
        <button class="btn-secondary" id="brCopyLink" style="flex:1;">${tr('xCopyLink')}</button>
        <button class="btn-secondary" id="brCloseQr" style="flex:1;">${tr('close')}</button>
      </div></div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
    overlay.querySelector('#brCloseQr').onclick = ()=>overlay.remove();
    overlay.querySelector('#brCopyLink').onclick = ()=>showToast(copyText(url) ? tr('xLinkCopied') : tr('xCouldNotCopy'));
    loadQrLib().then(()=>{
      const holder = overlay.querySelector('#brQrHolder');
      if(holder) new QRCode(holder, { text: url, width: 220, height: 220 });
    }).catch(()=>{ /* the link is shown as text */ });
  }

  // The bracket as a player or viewer sees it (signed in or not): their own match and a way to
  // report it, dropping, joining while registration is open, taking over a guest spot after
  // signing up, the current pairings and the standings. Refreshes itself while open.
  async function openBracketViewModal(id, token){
    token = token || bracketTokenFor(id);
    const B = bracketEngine();
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `<div class="modal"><h2 id="bvHeading">🏆 ${tr('brTitle')}</h2><div id="bvBody"><div class="modal-sub">${tr('loadingDots')}</div></div></div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
    const body = overlay.querySelector('#bvBody');
    let b = null, tab = 'mine', busy = false;
    const closeRow = `<div class="modal-actions"><button class="btn-secondary" id="bvClose" style="flex:1;">${tr('close')}</button></div>`;

    async function load(){
      const { data, error } = await supabaseClient.rpc('get_bracket', { p_bracket: id, p_token: token || null });
      if(error || !data) throw error || new Error('bracket not found');
      b = data; b.players = b.players || []; b.matches = b.matches || [];
    }
    async function act(fn){
      if(busy) return;
      busy = true;
      try{ await fn(); }
      catch(e){ console.error('bracket action failed:', e); showToast(tr('brCouldNotSave')); }
      try{ await load(); }catch(e){}
      busy = false;
      draw();
    }
    const must = r => { if(r && r.error) throw r.error; return r; };
    try{ await load(); }
    catch(e){ body.innerHTML = `<div class="modal-sub">${tr('brNotFound')}</div>${closeRow}`; body.querySelector('#bvClose').onclick = ()=>overlay.remove(); return; }
    if(!B){ body.innerHTML = `<div class="modal-sub">${tr('brEngineMissing')}</div>${closeRow}`; body.querySelector('#bvClose').onclick = ()=>overlay.remove(); return; }
    if(b.is_organizer){ overlay.remove(); openBracketModal(id); return; }

    const timer = setInterval(async ()=>{
      if(!document.body.contains(overlay)){ clearInterval(timer); return; }
      const typing = overlay.contains(document.activeElement) && /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
      if(busy || typing || document.hidden) return;
      try{
        const { data } = await supabaseClient.rpc('bracket_version', { p_bracket: id });
        if(data != null && data !== b.version){ await load(); draw(); }
      }catch(e){}
    }, BRACKET_POLL_MS);

    const nameOf = pid => bracketNameOf(b, pid);
    const me = () => b.players.find(p => p.id === b.me) || null;
    const running = () => b.status === 'swiss' || b.status === 'top_cut';
    // My match in the round being played now (the latest round of the current stage).
    function myMatch(){
      if(!b.me || !running()) return null;
      const stage = b.status === 'swiss' ? 'swiss' : 'elim';
      const list = bracketStageMatches(b, stage);
      const round = Math.max(0, ...list.map(m => m.round));
      return list.find(m => m.round === round && (m.p1 === b.me || m.p2 === b.me)) || null;
    }

    function mineTab(){
      const p = me();
      const parts = [];
      if(!p){
        if(b.status === 'registration' && session) parts.push(`<button class="btn-primary" id="bvJoin" style="width:100%;">${tr('brJoin')}</button>`);
        else if(b.status === 'registration') parts.push(`<div class="modal-sub">${tr('brSignInToJoin')}</div>`);
        else parts.push(`<div class="modal-sub">${tr('brWatching')}</div>`);
        return parts.join('');
      }
      parts.push(`<div class="modal-sub">${escapeHtml(trf('brYouAre', { name: p.name }))}${p.dropped ? ' · ' + tr('brDroppedShort') : ''}</div>`);
      if(token && p.guest && session) parts.push(`<div class="list-item"><div class="info"><div class="n">${tr('brClaimTitle')}</div><div class="m">${tr('brClaimHint')}</div></div><button class="mini-btn" id="bvClaim">${tr('brClaim')}</button></div>`);
      else if(token && p.guest && !session) parts.push(`<div class="hint" style="margin-bottom:10px;">${tr('brGuestSignUpHint')}</div>`);
      if(b.status === 'registration') parts.push(`<div class="modal-sub">${tr('brWaitingStart')}</div>`);
      if(b.status === 'finished' && session && !p.guest){
        const res = bracketResultFor(b, b.me), logged = bracketResultLogged(b.id);
        parts.push(`<div class="list-item">
          <div class="info"><div class="n">${escapeHtml(res.placement ? trf('brYouFinished', { place: res.placement, record: res.record }) : trf('brYourRecord', { record: res.record }))}</div>
            <div class="m">${logged ? tr('brInYourResults') : tr('brAddResultsHint')}</div></div>
          <button class="mini-btn" id="bvAddResults">${logged ? tr('brViewResult') : '📊 ' + tr('brAddResults')}</button>
        </div>`);
      }
      const m = myMatch();
      if(m && m.p2 == null){
        parts.push(`<div class="list-item"><div class="info"><div class="n">${tr('brYourBye')}</div><div class="m">${tr('brBye')}</div></div></div>`);
      } else if(m){
        const opp = m.p1 === b.me ? m.p2 : m.p1;
        const mine = m.p1 === b.me ? m.p1_report : m.p2_report, theirs = m.p1 === b.me ? m.p2_report : m.p1_report;
        const locked = m.confirmed_by === 'organizer';
        const where = m.stage === 'elim' ? bracketElimRoundName(bracketEngine().elimination(bracketSeeds(b), bracketStageMatches(b, 'elim')).size, m.round) : trf('brRoundTable', { n: m.round, table: m.table || '?' });
        const current = bracketResultValue(b, mine || (locked ? m : null));
        let state = '';
        if(locked) state = `${tr('brOrganizerSet')}: ${escapeHtml(bracketResultLabel(b, m, m))}`;
        else if(m.status === 'confirmed') state = `✓ ${tr('brBothAgree')}`;
        else if(m.status === 'disputed') state = `<span style="color:var(--rose);">⚠ ${tr('brDisagreeHint')}</span>${theirs ? '<br>' + escapeHtml(trf('brSays', { name: nameOf(opp), result: bracketResultLabel(b, m, theirs) })) : ''}`;
        else if(mine) state = tr('brWaitingOpponent');
        else if(theirs) state = escapeHtml(trf('brOpponentReported', { name: nameOf(opp), result: bracketResultLabel(b, m, theirs) }));
        parts.push(`<div class="section-label">${escapeHtml(where)}</div>
          <div class="list-item" style="display:block;">
            <div class="n" style="font-size:16px;margin-bottom:8px;">${escapeHtml(trf('brYouVs', { name: nameOf(opp) }))}</div>
            ${!locked && !p.dropped ? `<div class="field" style="display:flex;gap:8px;align-items:center;margin-bottom:6px;">
              <select id="bvResult" aria-label="${escapeAttr(tr('brYourResult'))}" style="flex:1;min-width:0;">
                ${bracketResultOptions(b, m).map(o=>`<option value="${escapeAttr(o.v)}" ${o.v === current ? 'selected' : ''}>${escapeHtml(o.l)}</option>`).join('')}
              </select>
              <button class="mini-btn" id="bvReport" data-match="${escapeAttr(m.id)}">${mine ? tr('brChange') : tr('brReport')}</button>
            </div>` : ''}
            ${state ? `<div class="m">${state}</div>` : ''}
          </div>`);
      } else if(running() && !p.dropped){
        parts.push(`<div class="modal-sub">${tr('brNoMatchYet')}</div>`);
      }
      if(running() && !p.dropped) parts.push(`<button class="btn-secondary" id="bvDrop" style="width:100%;margin-top:12px;">${tr('brDropMe')}</button>`);
      return parts.join('');
    }

    function pairingsTab(){
      if(b.status === 'registration') return `<div class="modal-sub">${bracketPlayerCount(b.players.filter(p => !p.dropped).length)}</div>
        ${b.players.map(p=>`<div class="list-item"><div class="info"><div class="n">${escapeHtml(p.name)}</div></div></div>`).join('')}`;
      if(b.status === 'swiss' || (b.format !== 'single_elim' && !bracketStageMatches(b, 'elim').length)){
        const swiss = bracketStageMatches(b, 'swiss');
        const round = Math.max(0, ...swiss.map(m => m.round));
        if(!round) return `<div class="modal-sub">${tr('nothingToShow')}</div>`;
        return `<div class="section-label">${trf('brRoundN', { n: round })}</div>
          ${swiss.filter(m => m.round === round).map(m => bracketMatchRow(b, m, m.table ? trf('brTable', { n: m.table }) : '', false)).join('')}`;
      }
      const { e, html } = bracketElimView(b, (row, label) => bracketMatchRow(b, row, label, false));
      return (e && e.champion ? `<div class="modal-sub" style="font-size:16px;">🏆 ${escapeHtml(trf('brChampion', { name: nameOf(e.champion) }))}</div>` : '') + html;
    }

    function draw(){
      if(!document.body.contains(overlay)) return;
      overlay.querySelector('#bvHeading').textContent = '🏆 ' + b.name;
      const hasElim = b.format === 'single_elim' || bracketStageMatches(b, 'elim').length > 0;
      const tabs = [['mine', tr('brTabMe')], ['pairings', b.status === 'registration' ? tr('brTabPlayers') : hasElim && b.status !== 'swiss' ? tr('brTabBracket') : tr('brTabPairings')]];
      if(bracketStageMatches(b, 'swiss').length) tabs.push(['standings', tr('brTabStandings')]);
      if(!tabs.some(([k]) => k === tab)) tab = 'mine';
      const where = [b.store && b.store.name, b.organizer && trf('brRunBy', { name: b.organizer })].filter(Boolean).join(' · ');
      body.innerHTML = `
        <div class="modal-sub">${escapeHtml([b.game, bracketFormatLabel(b.format), bracketStatusLabel(b)].filter(Boolean).join(' · '))}${where ? '<br>' + escapeHtml(where) : ''}</div>
        <div class="chip-row" style="margin-bottom:12px;">
          ${tabs.map(([k, l])=>`<button type="button" class="chip ${tab === k ? 'active' : ''}" data-tab="${k}" aria-pressed="${tab === k}">${escapeHtml(l)}</button>`).join('')}
        </div>
        <div>${tab === 'pairings' ? pairingsTab() : tab === 'standings' ? bracketStandingsHtml(b, b.me) : mineTab()}</div>
        <div class="hint" style="margin-top:12px;">${tr('brLiveHint')}</div>
        ${closeRow}`;
      wire();
    }

    function wire(){
      const on = (sel, fn) => { const el = body.querySelector(sel); if(el) el.onclick = fn; };
      body.querySelectorAll('[data-tab]').forEach(btn => { btn.onclick = ()=>{ tab = btn.dataset.tab; draw(); }; });
      on('#bvClose', ()=>overlay.remove());
      on('#bvAddResults', ()=>{ overlay.remove(); addBracketResult(b, b.me); });
      on('#bvJoin', ()=>act(async ()=>{ must(await supabaseClient.rpc('join_bracket', { p_bracket: id })); showToast(tr('brJoined')); }));
      on('#bvClaim', ()=>act(async ()=>{ must(await supabaseClient.rpc('claim_bracket_guest', { p_bracket: id, p_token: token })); showToast(tr('brClaimed')); }));
      on('#bvDrop', ()=>{
        if(!confirm(tr('brDropConfirm'))) return;
        act(async ()=>{ must(await supabaseClient.rpc('drop_from_bracket', { p_bracket: id, p_token: token || null })); });
      });
      on('#bvReport', ()=>{
        const v = body.querySelector('#bvResult').value;
        if(!v){ showToast(tr('brPickResult')); return; }
        const [result, g1, g2] = v.split(':');
        const matchId = body.querySelector('#bvReport').dataset.match;
        act(async ()=>{
          const r = must(await supabaseClient.rpc('report_bracket_result', { p_match: matchId, p_result: result,
            p_p1_games: g1 === '' ? null : Number(g1), p_p2_games: g2 === '' ? null : Number(g2), p_token: token || null }));
          showToast(r.data === 'disputed' ? tr('brReportDisputed') : r.data === 'confirmed' ? tr('brReportConfirmed') : tr('brReportSent'));
        });
      });
    }
    draw();
  }

  // ---------- Admin dashboard (only visible/functional if profile.is_admin) ----------
  function openAdminModal(){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `<div class="modal"><h2>🛠 Admin</h2><div id="adminBody"><div class="modal-sub">Loading…</div></div></div>`;
    // Bracket hosts: users allowed to run brackets without an approved store (admin_set_bracket_host).
    async function drawBracketHosts(){
      const el = overlay.querySelector('#adminBracketHosts');
      if(!el) return;
      const { data, error } = await supabaseClient.rpc('admin_bracket_hosts');
      if(error){ el.innerHTML = '<div class="modal-sub">Could not load (has the Brackets SQL been run?)</div>'; return; }
      const now = Date.now();
      el.innerHTML = (data || []).length ? data.map(h => {
        const expired = h.until && new Date(h.until).getTime() < now;
        return `<div class="list-item">
          <div class="info"><div class="n">${escapeHtml(h.name)}</div>
            <div class="m">${h.until ? (expired ? 'Expired ' : 'Until ') + escapeHtml(new Date(h.until).toLocaleDateString()) : 'No end date'}</div></div>
          <div style="display:flex;gap:6px;">
            <button class="mini-btn" data-bh-extend="${escapeAttr(h.user_id)}">+30 days</button>
            <button class="mini-btn decline" data-bh-remove="${escapeAttr(h.user_id)}">Remove</button>
          </div></div>`;
      }).join('') : '<div class="modal-sub">Nobody yet.</div>';
      const set = async (args, msg) => {
        const { error: e } = await supabaseClient.rpc('admin_set_bracket_host', args);
        showToast(e ? 'Could not save' : msg);
        drawBracketHosts();
      };
      el.querySelectorAll('[data-bh-extend]').forEach(btn => {
        btn.onclick = ()=>{
          const h = data.find(x => x.user_id === btn.dataset.bhExtend);
          const from = Math.max(now, h && h.until ? new Date(h.until).getTime() : now);
          set({ p_user: h.user_id, p_until: new Date(from + 30 * 864e5).toISOString() }, 'Extended by 30 days');
        };
      });
      el.querySelectorAll('[data-bh-remove]').forEach(btn => {
        btn.onclick = ()=>{ if(confirm('Stop this user running brackets?')) set({ p_user: btn.dataset.bhRemove, p_remove: true }, 'Removed'); };
      });
    }
    function wireBracketHosts(){
      const btn = overlay.querySelector('#bhAllow');
      if(!btn) return;
      btn.onclick = async ()=>{
        const who = overlay.querySelector('#bhWho').value.trim();
        if(!who) return;
        let found = null;
        if(who.startsWith('@') || !who.includes('@')){
          const { data } = await supabaseClient.from('profiles').select('id, username, display_name').ilike('username', who.replace(/^@/, '')).limit(1);
          found = data && data[0];
        } else {
          const { data } = await supabaseClient.rpc('find_profile_by_email', { p_email: who });
          found = Array.isArray(data) ? data[0] : data;
        }
        if(!found || !found.id){ showToast('No user found'); return; }
        const days = parseInt(overlay.querySelector('#bhFor').value, 10);
        const { error } = await supabaseClient.rpc('admin_set_bracket_host', { p_user: found.id, p_until: days ? new Date(Date.now() + days * 864e5).toISOString() : null });
        if(error){ showToast('Could not save'); return; }
        showToast('Allowed: ' + (found.display_name || found.username || who));
        overlay.querySelector('#bhWho').value = '';
        drawBracketHosts();
      };
      drawBracketHosts();
    }
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
    const body = overlay.querySelector('#adminBody');

    async function draw(){
      let pending = [];
      try{
        const { data } = await supabaseClient.from('stores').select('*').eq('approved', false).order('created_at');
        pending = data || [];
      }catch(e){}

      body.innerHTML = `
        <div class="section-label">Pending store requests (${pending.length})</div>
