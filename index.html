  function storeShareCode(){
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = ''; for(let i=0;i<6;i++) s += chars[Math.floor(Math.random()*chars.length)];
    return s;
  }

  // Lets a store owner see who's actually RSVP'd "going" to their own
  // event — usernames, not just a count. Only works for events belonging
  // to a store the viewer owns (enforced by the "attendances select store
  // owner" RLS policy — this isn't just a UI-level restriction).
  async function openAttendeesModal(storeEventId, eventName){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `<div class="modal"><h2>👥 Attendees</h2><div class="modal-sub">${escapeHtml(eventName)}</div><div id="attendeesBody"><div class="modal-sub">Loading…</div></div></div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
    const body = overlay.querySelector('#attendeesBody');
    try{
      const { data: rows, error } = await supabaseClient.from('attendances').select('user_id').like('occurrence_key', `store:${storeEventId}::%`);
      if(error) throw error;
      const userIds = [...new Set((rows||[]).map(r=>r.user_id))];
      if(userIds.length === 0){
        body.innerHTML = `<div class="modal-sub">No one has RSVP'd yet.</div><div class="modal-actions"><button class="btn-secondary" id="closeAttendees" style="flex:1;">${tr('close')}</button></div>`;
      } else {
        const { data: profiles } = await supabaseClient.from('profiles').select('id, username, display_name').in('id', userIds);
        const rowsHtml = (profiles||[]).map(p=>`
          <div class="list-item"><div class="info"><div class="n">${escapeHtml(p.display_name || p.username || 'Player')}</div>${p.username ? `<div class="m">@${escapeHtml(p.username)}</div>` : ''}</div></div>
        `).join('');
        body.innerHTML = `<div class="modal-sub" style="margin-bottom:8px;">${userIds.length} going</div>${rowsHtml}
          <div class="modal-actions"><button class="btn-secondary" id="closeAttendees" style="flex:1;">${tr('close')}</button></div>`;
      }
    }catch(e){
      body.innerHTML = `<div class="modal-sub">Could not load attendees.</div><div class="modal-actions"><button class="btn-secondary" id="closeAttendees" style="flex:1;">${tr('close')}</button></div>`;
    }
    overlay.querySelector('#closeAttendees').onclick = ()=>overlay.remove();
  }

  async function openStoresModal(){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <div class="modal">
        <h2>🏪 Stores</h2>
        <div class="tabs">
          <button class="active" id="tabBrowse">Browse</button>
          <button id="tabMyStore">My Store</button>
          <button id="tabFollowing">Following</button>
        </div>
        <div id="storesBody"></div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
    const body = overlay.querySelector('#storesBody');
    function setTab(name){
      overlay.querySelector('#tabBrowse').classList.toggle('active', name==='browse');
      overlay.querySelector('#tabMyStore').classList.toggle('active', name==='mystore');
      overlay.querySelector('#tabFollowing').classList.toggle('active', name==='following');
    }
    overlay.querySelector('#tabBrowse').onclick = ()=>{ setTab('browse'); renderBrowseTab(); };
    overlay.querySelector('#tabMyStore').onclick = ()=>{ setTab('mystore'); renderMyStoreTab(); };
    overlay.querySelector('#tabFollowing').onclick = ()=>{ setTab('following'); renderFollowingTab(); };

    async function getMyFollowedIds(){
      try{
        const { data } = await supabaseClient.from('store_follows').select('store_id').eq('user_id', session.user.id);
        return (data||[]).map(r=>r.store_id);
      }catch(e){ return []; }
    }

    async function renderBrowseTab(){
      body.innerHTML = `<div class="modal-sub">Loading…</div>`;
      const followedIds = await getMyFollowedIds();
      body.innerHTML = `
        <div class="field"><input id="storeSearch" placeholder="Search by store name or city…"/></div>
        <div class="field">
          <select id="gameFilter">
            <option value="">All games</option>
            ${GAMES.map(g=>`<option value="${escapeAttr(g)}">${escapeHtml(g)}</option>`).join('')}
          </select>
        </div>
        <div id="storeResults"><div class="modal-sub">Loading stores…</div></div>
        <div class="section-label">Follow by code</div>
        <div style="display:flex;gap:8px;">
          <input id="followCodeInput" placeholder="e.g. AB12CD" style="flex:1;text-transform:uppercase;"/>
          <button class="mini-btn" id="followCodeBtn">Follow</button>
        </div>
        <div class="modal-actions"><button class="btn-secondary" id="closeStores" style="flex:1;">${tr('close')}</button></div>
      `;
      overlay.querySelector('#closeStores').onclick = ()=>overlay.remove();

      async function runSearch(term, game){
        const resultsEl = body.querySelector('#storeResults');
        resultsEl.innerHTML = `<div class="modal-sub">Searching…</div>`;
        try{
          let allowedIds = null;
          if(game){
            const [eventMatches, tagMatches] = await Promise.all([
              supabaseClient.from('store_events').select('store_id').ilike('game', game),
              supabaseClient.from('stores').select('id').contains('games', [game]).eq('approved', true)
            ]);
            const fromEvents = ((eventMatches.data)||[]).map(m=>m.store_id);
            const fromTags = ((tagMatches.data)||[]).map(m=>m.id);
            allowedIds = [...new Set([...fromEvents, ...fromTags])];
            if(allowedIds.length === 0){ resultsEl.innerHTML = `<div class="modal-sub">No stores currently running or tagged for ${escapeHtml(game)}.</div>`; return; }
          }
          let q = supabaseClient.from('stores').select('*').eq('approved', true);
          if(term && term.trim()) q = q.or(`name.ilike.%${term.trim()}%,city.ilike.%${term.trim()}%`);
          if(allowedIds) q = q.in('id', allowedIds);
          const { data, error } = await q.limit(50);
          if(error) throw error;
          if(!data || data.length===0){ resultsEl.innerHTML = `<div class="modal-sub">No stores found.</div>`; return; }

          let countByStore = {};
          try{
            const { data: counts } = await supabaseClient.rpc('get_store_follower_counts', { store_ids: data.map(s=>s.id) });
            (counts||[]).forEach(c=>{ countByStore[c.store_id] = c.follower_count; });
          }catch(e){}

          const sorted = data.slice().sort((a,b)=>{
            if(term && term.trim()) return a.name.localeCompare(b.name); // relevance-ish: alphabetical among matches
            return (countByStore[b.id]||0) - (countByStore[a.id]||0); // default: most-followed first
          });

          resultsEl.innerHTML = sorted.map(s=>`
            <div class="list-item">
              <div class="info"><div class="n">${escapeHtml(s.name)}</div><div class="m">${escapeHtml(s.city||'')}${countByStore[s.id] ? ' · '+countByStore[s.id]+' follower'+(countByStore[s.id]===1?'':'s') : ''}${(s.games&&s.games.length) ? ' · '+s.games.map(g=>gameIcon(g)).join(' ') : ''}</div></div>
              <button class="mini-btn" data-follow="${s.id}" ${followedIds.includes(s.id)?'disabled':''}>${followedIds.includes(s.id)?'Following ✓':'Follow'}</button>
            </div>`).join('');
          resultsEl.querySelectorAll('[data-follow]').forEach(btn=>{
            btn.onclick = async ()=>{
              btn.disabled = true; btn.textContent = 'Following ✓';
              try{ await supabaseClient.from('store_follows').insert({ user_id: session.user.id, store_id: btn.dataset.follow }); showToast('Following!'); await syncFollowedStoreEvents(); render(); }
              catch(e){ showToast('Could not follow'); btn.disabled=false; btn.textContent='Follow'; }
            };
          });
        }catch(e){ resultsEl.innerHTML = `<div class="modal-sub">Search failed — try again.</div>`; }
      }
      let searchDebounce = null;
      function currentGame(){ return body.querySelector('#gameFilter').value; }
      body.querySelector('#storeSearch').oninput = (e)=>{
        clearTimeout(searchDebounce);
        searchDebounce = setTimeout(()=>runSearch(e.target.value, currentGame()), 250);
      };
      body.querySelector('#gameFilter').onchange = ()=>{
        runSearch(body.querySelector('#storeSearch').value, currentGame());
      };
      runSearch('', '');

      body.querySelector('#followCodeBtn').onclick = async ()=>{
        const code = body.querySelector('#followCodeInput').value.trim().toUpperCase();
        if(!code){ showToast('Enter a code'); return; }
        try{
          const { data: s, error } = await supabaseClient.from('stores').select('*').eq('follow_code', code).eq('approved', true).maybeSingle();
          if(error || !s){ showToast('No store found with that code'); return; }
          await supabaseClient.from('store_follows').insert({ user_id: session.user.id, store_id: s.id });
          showToast('Now following ' + s.name);
          await syncFollowedStoreEvents();
          render();
          runSearch(body.querySelector('#storeSearch').value, currentGame());
        }catch(e){ showToast('Could not follow — you may already follow this store'); }
      };
    }

      body.innerHTML = `<div class="modal-sub">Loading…</div>`;
      let myStores = [];
      try{
        const { data } = await supabaseClient.from('stores').select('*').eq('owner_id', session.user.id).order('created_at');

      function requestFormHtml(hasExisting){

            <button class="mini-btn" id="saveStoreGamesBtn" style="margin-bottom:20px;">Save games</button>

            ${eventFormHtml()}

            <div class="section-label">Your published events</div>
            ${myEvents.length ? myEvents.map(eventRowHtml).join('') : `<div class="modal-sub">No events published yet.</div>`}

            <div class="section-label">Message your followers</div>
            <div class="modal-sub" style="margin-bottom:8px;">Separate from events — for closures, restocks, anything else. Sends a notification to everyone following you.</div>
            <div style="display:flex;gap:8px;margin-bottom:12px;">
              <input id="annMessage" placeholder="e.g. Closed this Friday for a holiday" style="flex:1;"/>
              <button class="mini-btn" id="postAnnouncementBtn">Post</button>
            </div>
            ${announcements.length ? announcements.map(a=>`
              <div class="list-item">
                <div class="info"><div class="n" style="font-size:13px;">${escapeHtml(a.message)}</div><div class="m">${new Date(a.created_at).toLocaleString()}</div></div>
                <button class="mini-btn decline" data-del-ann="${a.id}">Delete</button>
              </div>`).join('') : ''}

            <div class="modal-actions"><button class="btn-secondary" id="closeStores" style="flex:1;">${tr('close')}</button></div>
          `;
          try{ new QRCode(document.getElementById('storeQrHolder'), { text: `${baseAppUrl()}?storepage=${myStore.follow_code}`, width:150, height:150 }); }catch(e){}

          overlay.querySelector('#closeStores').onclick = ()=>overlay.remove();
          body.querySelector('#backToStoreList').onclick = ()=>drawStoreList();
          body.querySelector('#copyPublicLinkBtn').onclick = ()=>{
            const ok = copyText(`${baseAppUrl()}?storepage=${myStore.follow_code}`);
            showToast(ok?'Link copied':'Could not copy');
          };

          body.querySelectorAll('[data-store-game]').forEach(chip=>{
            chip.onclick = ()=>chip.classList.toggle('active');
          });
          body.querySelector('#saveStoreGamesBtn').onclick = async ()=>{
            const games = Array.from(body.querySelectorAll('[data-store-game].active')).map(el=>el.dataset.storeGame);
            try{
              await supabaseClient.from('stores').update({ games }).eq('id', myStore.id);
              myStore.games = games;
              showToast('Saved');
            }catch(e){ showToast('Could not save'); }
          };

          body.querySelector('#addStoreEventBtn').onclick = async ()=>{
            const name = body.querySelector('#se_name').value.trim();
            const date = body.querySelector('#se_date').value;
            if(!name || !date){ showToast('Name and date are required'); return; }
            const isDupe = myEvents.some(e => e.date === date && (e.name||'').trim().toLowerCase() === name.toLowerCase());
            if(isDupe){ showToast('You already have an event with this name on this date'); return; }
            const capVal = body.querySelector('#se_capacity').value;
            try{
              await supabaseClient.from('store_events').insert({
                store_id: myStore.id, name, date,
                time: body.querySelector('#se_time').value.trim(),
                game: body.querySelector('#se_game').value.trim(),
                format: body.querySelector('#se_format').value.trim(),
                repeat: body.querySelector('#se_repeat').value,
                capacity: capVal ? parseInt(capVal,10) : null,
                fee: body.querySelector('#se_fee').value.trim(),
                prizing: body.querySelector('#se_prizing').value.trim()
              });
              showToast('Event published — your followers will see it');
              prefillEvent = null;
              drawManageStore(myStore);
            }catch(e){ showToast('Could not publish event'); }
          };
          const cancelDupBtn = body.querySelector('#cancelDuplicateBtn');
          if(cancelDupBtn) cancelDupBtn.onclick = ()=>{ prefillEvent = null; render(); };

          body.querySelectorAll('[data-dup-se]').forEach(btn=>{
            btn.onclick = ()=>{
              const ev = myEvents.find(x=>x.id===btn.dataset.dupSe);
              if(!ev) return;
              prefillEvent = ev;
              render();
              const nameField = body.querySelector('#se_name');
              if(nameField) nameField.scrollIntoView({behavior:'smooth', block:'center'});
            };
          });
          body.querySelectorAll('[data-view-attendees]').forEach(btn=>{
            btn.onclick = ()=>openAttendeesModal(btn.dataset.viewAttendees, btn.dataset.eventName);
          });
          body.querySelectorAll('[data-cancel-se]').forEach(btn=>{
            btn.onclick = async ()=>{
              const ev = myEvents.find(x=>x.id===btn.dataset.cancelSe);
              try{ await supabaseClient.from('store_events').update({ cancelled: !ev.cancelled }).eq('id', ev.id); drawManageStore(myStore); }
              catch(e){ showToast('Could not update'); }
            };
          });
          body.querySelectorAll('[data-del-se]').forEach(btn=>{
            btn.onclick = async ()=>{
              if(!confirm('Delete this event? Followers will no longer see it.')) return;
              try{ await supabaseClient.from('store_events').delete().eq('id', btn.dataset.delSe); drawManageStore(myStore); }
              catch(e){ showToast('Could not delete'); }
            };
          });
          body.querySelector('#postAnnouncementBtn').onclick = async ()=>{
            const message = body.querySelector('#annMessage').value.trim();
            if(!message){ showToast('Write a message first'); return; }
            try{
              await supabaseClient.from('store_announcements').insert({ store_id: myStore.id, message });
              showToast('Sent to your followers');
              drawManageStore(myStore);
            }catch(e){ showToast('Could not post'); }
          };
          body.querySelectorAll('[data-del-ann]').forEach(btn=>{
            btn.onclick = async ()=>{
              try{ await supabaseClient.from('store_announcements').delete().eq('id', btn.dataset.delAnn); drawManageStore(myStore); }
              catch(e){ showToast('Could not delete'); }
            };
          });
        }
        render();
      }

      // If exactly one approved store and nothing pending, skip straight to managing it.
      const approvedStores = myStores.filter(s=>s.approved);
      if(approvedStores.length === 1 && myStores.length === 1){
        drawManageStore(approvedStores[0]);
      } else {
        drawStoreList();
      }
    }

    async function renderFollowingTab(){
      body.innerHTML = `<div class="modal-sub">Loading…</div>`;
      try{
        const { data: follows } = await supabaseClient.from('store_follows').select('store_id, stores(*)').eq('user_id', session.user.id);
        const stores = (follows||[]).map(f=>f.stores).filter(Boolean);
        if(stores.length === 0){
          body.innerHTML = `<div class="modal-sub">You're not following any stores yet — check the Browse tab.</div>
            <div class="modal-actions"><button class="btn-secondary" id="closeStores" style="flex:1;">${tr('close')}</button></div>`;
          overlay.querySelector('#closeStores').onclick = ()=>overlay.remove();
          return;
        }
        const today = todayStr();
        const sections = await Promise.all(stores.map(async s=>{
          const { data: events } = await supabaseClient.from('store_events').select('*').eq('store_id', s.id).gte('date', today).order('date').limit(5);
          const rows = (events||[]).map(e=>`
            <div class="list-item">
              <div class="info"><div class="n">${e.cancelled?'<span style="color:var(--rose);">[CANCELLED] </span>':''}${escapeHtml(e.name)}</div>
                <div class="m">${fmtFriendly(e.date, e.time)}</div></div>
            </div>`).join('');
          return `
            <div class="card" style="margin-bottom:12px;">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <div class="n" style="font-weight:700;">${escapeHtml(s.name)}</div>
                <button class="mini-btn decline" data-unfollow="${s.id}">Unfollow</button>
              </div>
              ${rows || '<div class="modal-sub">No upcoming events posted.</div>'}
            </div>`;
        }));
        body.innerHTML = sections.join('') + `<div class="modal-actions"><button class="btn-secondary" id="closeStores" style="flex:1;">${tr('close')}</button></div>`;
        overlay.querySelector('#closeStores').onclick = ()=>overlay.remove();
        body.querySelectorAll('[data-unfollow]').forEach(btn=>{
          btn.onclick = async ()=>{
            try{ await supabaseClient.from('store_follows').delete().eq('user_id', session.user.id).eq('store_id', btn.dataset.unfollow); await syncFollowedStoreEvents(); render(); renderFollowingTab(); }
            catch(e){ showToast('Could not unfollow'); }
          };
        });
      }catch(e){ body.innerHTML = `<div class="modal-sub">Could not load your followed stores.</div>`; }
    }

    renderBrowseTab();
  }

  // ---------- Admin dashboard (only visible/functional if profile.is_admin) ----------
  function openAdminModal(){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `<div class="modal"><h2>🛠 Admin</h2><div id="adminBody"><div class="modal-sub">Loading…</div></div></div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
    const body = overlay.querySelector('#adminBody');

    async function draw(){
      let pending = [];
      try{
        const { data } = await supabaseClient.from('stores').select('*').eq('approved', false).order('created_at');
        pending = data || [];
      }catch(e){}

      body.innerHTML = `
        <div class="section-label">Pending store requests (${pending.length})</div>
        ${pending.length ? pending.map(s=>`
          <div class="list-item">
            <div class="info"><div class="n">${escapeHtml(s.name)}</div><div class="m">${escapeHtml(s.city||'')}${s.description?' · '+escapeHtml(s.description):''}</div></div>
            <div style="display:flex;gap:6px;">
              <button class="mini-btn" data-approve-store="${s.id}">Approve</button>
              <button class="mini-btn decline" data-reject-store="${s.id}">Reject</button>
            </div>
          </div>`).join('') : `<div class="modal-sub">Nothing pending.</div>`}

        <div class="section-label">Post an announcement</div>
        <div class="field"><label>Title</label><input id="ann_title" placeholder="e.g. New features!"/></div>
        <div class="field"><label>Message</label><textarea id="ann_message" placeholder="What's new…"></textarea></div>
        <div class="modal-actions"><button class="btn-primary" id="postAnnBtn" style="flex:1;">Post to everyone</button></div>

        <div class="modal-actions"><button class="btn-secondary" id="closeAdmin" style="flex:1;">${tr('close')}</button></div>
      `;
      overlay.querySelector('#closeAdmin').onclick = ()=>overlay.remove();
      body.querySelectorAll('[data-approve-store]').forEach(btn=>{
        btn.onclick = async ()=>{
          try{
            const { data, error } = await supabaseClient.from('stores').update({ approved: true }).eq('id', btn.dataset.approveStore).select().maybeSingle();
            if(error) throw error;
            if(!data || data.approved !== true){
              showToast('Approval did not take effect — check that add-admin-role-migration.sql has been run');
              return;
            }
            showToast('Store approved');
            draw();
          }catch(e){ showToast('Could not approve'); }
        };
      });
      body.querySelectorAll('[data-reject-store]').forEach(btn=>{
        btn.onclick = async ()=>{
          if(!confirm('Reject and delete this store request?')) return;
          try{ await supabaseClient.from('stores').delete().eq('id', btn.dataset.rejectStore); showToast('Rejected'); draw(); }
          catch(e){ showToast('Could not reject'); }
        };
      });
      body.querySelector('#postAnnBtn').onclick = async ()=>{
        const title = body.querySelector('#ann_title').value.trim();
        const message = body.querySelector('#ann_message').value.trim();
        if(!title || !message){ showToast('Fill in both fields'); return; }
        try{
          await supabaseClient.from('announcements').insert({ title, message });
          showToast('Announcement posted!');
          body.querySelector('#ann_title').value = '';
          body.querySelector('#ann_message').value = '';
        }catch(e){ showToast('Could not post — check that you have admin access'); }
      };
    }
    draw();
  }

  function openDecksModal(){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `<div class="modal"><h2>${tr('yourDecks')}</h2><div id="decksBody"></div></div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };

    function deckRow(d){
      const metaBits = [d.game || 'No game set'];
      if(d.legend) metaBits.push('Legend: '+d.legend);
      if(d.cardCount) metaBits.push(d.cardCount+' cards');
      return `
        <div class="list-item" id="deckrow-${d.id}">
          <div class="info">
            <div class="n" data-view="${d.id}">${escapeHtml(d.name)}</div>
            <div class="m">${escapeHtml(metaBits.join(' · '))}</div>
            ${(d.viewLink || d.editLink) ? `<div style="margin-top:4px;display:flex;gap:10px;">
              ${d.viewLink ? `<a href="${escapeAttr(d.viewLink)}" target="_blank" rel="noopener" style="color:var(--teal);font-size:11.5px;">View on Piltover Archive ↗</a>` : ''}
              ${d.editLink ? `<a href="${escapeAttr(d.editLink)}" target="_blank" rel="noopener" style="color:var(--teal);font-size:11.5px;">Edit ↗</a>` : ''}
            </div>` : ''}
          </div>
          <div style="display:flex;gap:6px;">
            ${d.viewLink ? `<button class="mini-btn" data-resync="${d.id}">🔄 Re-sync</button>` : ''}
            <button class="mini-btn" data-rename="${d.id}">${tr('rename')}</button>
            <button class="mini-btn" data-toggle="${d.id}">${d.active ? tr('retire') : tr('reactivate')}</button>
            <button class="mini-btn decline" data-delete="${d.id}">${tr('delete')}</button>
          </div>
        </div>`;
    }

    function groupByGame(list){
      const groups = {};
      list.forEach(d=>{
        const key = d.game || 'No game set';
        groups[key] = groups[key] || [];
        groups[key].push(d);
      });
      return Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0]));
    }
    function renderGroupedDecks(list){
      if(!list.length) return '';
      const groups = groupByGame(list);
      if(groups.length === 1) return list.map(deckRow).join('');
      return groups.map(([gameName, ds])=>`
        <div style="font-size:12px;color:var(--text-dim);font-weight:600;margin:10px 0 6px;">${gameIcon(gameName)} ${escapeHtml(gameName)}</div>
        ${ds.map(deckRow).join('')}
      `).join('');
    }

    function draw(){
      const body = overlay.querySelector('#decksBody');
      const current = decks.filter(d=>d.active);
      const past = decks.filter(d=>!d.active);
      body.innerHTML = `
        <div class="paste-box">
          <div class="lbl">🔗 Import from Piltover Archive</div>
          <div style="display:flex;gap:8px;">
            <input id="pltDeckLink" placeholder="https://piltoverarchive.com/decks/view/…" style="flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 11px;font-size:13px;"/>
            <button class="parse-btn" id="pltImportBtn" type="button" style="margin-top:0;white-space:nowrap;">Import</button>
          </div>
          <div class="hint">Pulls in the deck's name, legend, and a direct edit link automatically.</div>
        </div>
        <div class="field">
          <label>Or add one manually</label>
          <div class="row2">
            <input id="newDeckName" placeholder="${tr('deckName')}" list="legendOptionsGlobal"/>
            <input id="newDeckGame" list="gameOptions" placeholder="Game (optional)"/>
          </div>
          <datalist id="gameOptions">${GAMES.map(g=>`<option value="${escapeAttr(g)}">`).join('')}</datalist>
          <datalist id="legendOptionsGlobal">${RIFTBOUND_LEGENDS.map(l=>`<option value="${escapeAttr(l)}">`).join('')}</datalist>
          <button class="mini-btn" id="addDeckBtn" style="margin-top:8px;">+ ${tr('addDeck')}</button>
        </div>
        <div class="section-label">${tr('currentDecks')} (${current.length})</div>
        ${current.length ? renderGroupedDecks(current) : `<div class="modal-sub">${tr('noCurrentDecks')}</div>`}
        <div class="section-label">${tr('pastDecks')} (${past.length})</div>
        ${past.length ? renderGroupedDecks(past) : `<div class="modal-sub">${tr('nothingRetired')}</div>`}
        <div class="modal-actions"><button class="btn-secondary" id="closeDecks" style="flex:1;">${tr('close')}</button></div>
      `;

      body.querySelector('#pltImportBtn').onclick = async ()=>{
        const url = body.querySelector('#pltDeckLink').value.trim();
        if(!url){ showToast('Paste a Piltover Archive deck link first'); return; }
        const btn = body.querySelector('#pltImportBtn');
        btn.disabled = true;
        btn.textContent = 'Importing…';
        try{
          const res = await fetch(FUNCTIONS_URL + '/fetch-piltover-deck', {
            method: 'POST',
            headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + session.access_token },
            body: JSON.stringify({ url })
          });
          const p = await res.json();
          if(p.error){ showToast(p.error); return; }
          if(!p.foundAnything){ showToast("Couldn't read that deck page — try adding it manually instead"); return; }
          decks.push({
            id: deckUid(), name: p.name || 'Imported deck', game: 'Riftbound',
            legend: p.legend || '', colors: p.colors || [], cardCount: p.cardCount || null,
            viewLink: p.viewLink || url, editLink: p.editLink || '',
            notes: '', active: true, createdAt: Date.now()
          });
          await saveDecks();
          draw();
          showToast('Deck imported from Piltover Archive');
        }catch(e){ showToast('Could not import that deck'); }
        finally{ btn.disabled = false; btn.textContent = 'Import'; }
      };

      body.querySelector('#addDeckBtn').onclick = async ()=>{
        const name = body.querySelector('#newDeckName').value.trim();
        const game = body.querySelector('#newDeckGame').value.trim();
        if(!name){ showToast('Give the deck a name'); return; }
        decks.push({ id: deckUid(), name, game, notes:'', active:true, createdAt: Date.now() });
        await saveDecks();
        draw();
        showToast('Deck added');
      };
      body.querySelectorAll('[data-resync]').forEach(btn=>{
        btn.onclick = async ()=>{
          const d = decks.find(x=>x.id===btn.dataset.resync);
          if(!d || !d.viewLink) return;
          btn.disabled = true;
          btn.textContent = '🔄 …';
          try{
            const res = await fetch(FUNCTIONS_URL + '/fetch-piltover-deck', {
              method: 'POST',
              headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + session.access_token },
              body: JSON.stringify({ url: d.viewLink })
            });
            const p = await res.json();
            if(p.error){ showToast(p.error); btn.disabled=false; btn.textContent='🔄 Re-sync'; return; }
            if(!p.foundAnything){ showToast("Couldn't read that deck page right now"); btn.disabled=false; btn.textContent='🔄 Re-sync'; return; }
            if(p.name) d.name = p.name;
            d.legend = p.legend || d.legend || '';
            d.colors = p.colors || d.colors || [];
            d.cardCount = p.cardCount || d.cardCount || null;
            if(p.editLink) d.editLink = p.editLink;
            await saveDecks();
            draw();
            showToast('Deck synced from Piltover Archive');
          }catch(e){ showToast('Could not sync — try again'); btn.disabled=false; btn.textContent='🔄 Re-sync'; }
        };
      });
      body.querySelectorAll('[data-rename]').forEach(btn=>{
        btn.onclick = async ()=>{
          const d = decks.find(x=>x.id===btn.dataset.rename);
          if(!d) return;
          const newName = prompt('Rename deck', d.name);
          if(newName === null) return;
          const trimmed = newName.trim();
          if(!trimmed){ showToast('Name cannot be empty'); return; }
          d.name = trimmed;
          await saveDecks();
          draw();
          showToast('Deck renamed — updates everywhere it was used automatically');
        };
      });
      body.querySelectorAll('[data-toggle]').forEach(btn=>{
        btn.onclick = async ()=>{
          const d = decks.find(x=>x.id===btn.dataset.toggle);
          if(!d) return;
          d.active = !d.active;
          draw();
          showToast(d.active ? 'Deck marked current' : 'Deck retired');
          await saveDecks();
        };
      });
      body.querySelectorAll('[data-delete]').forEach(btn=>{
        btn.onclick = async ()=>{
          if(!confirm('Delete this deck? Past results logged with it will show as "Deleted deck" instead of losing their win/loss data.')) return;
          decks = decks.filter(x=>x.id!==btn.dataset.delete);
          await saveDecks();
          draw();
          showToast('Deck deleted');
        };
      });
      body.querySelector('#closeDecks').onclick = ()=>overlay.remove();
    }
    draw();
  }

    overlay.querySelector('#useLocationBtn').onclick = ()=>{
      if(!navigator.geolocation){ showToast('Geolocation is not available on this device'); return; }
      navigator.geolocation.getCurrentPosition(
        (pos)=>{ profile._pendingLat = pos.coords.latitude; profile._pendingLng = pos.coords.longitude; showToast('Location captured — tap Save profile'); },
        ()=>showToast('Could not get your location')
      );
    };
    let citySuggestDebounce = null;
    const cityInput = overlay.querySelector('#acc_city');
    const suggestBox = overlay.querySelector('#citySuggestions');
    let cityDirty = false;
    cityInput.oninput = ()=>{
      const q = cityInput.value.trim();
      profile._pendingLat = null; profile._pendingLng = null; // typing invalidates any earlier pick/GPS capture until they choose again
      cityDirty = true;
      clearTimeout(citySuggestDebounce);
      if(q.length < 3){ suggestBox.innerHTML = ''; return; }
      citySuggestDebounce = setTimeout(async ()=>{
        try{
          const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&q=' + encodeURIComponent(q));
          const results = await res.json();
          if(!results || results.length===0){ suggestBox.innerHTML = ''; return; }
          suggestBox.innerHTML = results.map((r,i)=>`<button type="button" class="mini-btn" data-suggest-idx="${i}" style="display:block;width:100%;text-align:left;margin-top:4px;">${escapeHtml(r.display_name)}</button>`).join('');
          suggestBox.querySelectorAll('[data-suggest-idx]').forEach(btn=>{
            btn.onclick = ()=>{
              const r = results[parseInt(btn.dataset.suggestIdx,10)];
              cityInput.value = r.display_name;
              profile._pendingLat = parseFloat(r.lat);
              profile._pendingLng = parseFloat(r.lon);
              cityDirty = false; // a real pick was made — coordinates are now trustworthy again
              suggestBox.innerHTML = '';
            };
          });
        }catch(e){ /* non-fatal — falls back to single-guess geocoding on save */ }
      }, 350);
    };
    overlay.querySelector('#saveProfileBtn').onclick = async ()=>{
      let username = overlay.querySelector('#acc_username').value.trim().replace(/^@/,'');
      if(username && !/^[a-zA-Z0-9_]{3,24}$/.test(username)){
        showToast('Usernames are 3-24 characters: letters, numbers, underscores only');
        return;
      }
      const display_name = overlay.querySelector('#acc_name').value.trim();
      const home_city = overlay.querySelector('#acc_city').value.trim();
      let home_lat, home_lng;
      if(profile._pendingLat != null && profile._pendingLng != null){
        home_lat = profile._pendingLat; home_lng = profile._pendingLng;
      } else if(!cityDirty){
        home_lat = profile.home_lat; home_lng = profile.home_lng;
      } else {
        home_lat = null; home_lng = null; // city text changed with no pick made — force a fresh geocode below rather than keep stale coordinates
      }
      if((home_lat == null || home_lng == null) && home_city){
        const geo = await geocode(home_city);
        if(geo){ home_lat = geo.lat; home_lng = geo.lng; }
      }
      try{
        const { error } = await supabaseClient.from('profiles').update({ username: username || null, display_name, home_city, home_lat, home_lng }).eq('id', session.user.id);
        if(error){
          showToast(error.code === '23505' ? 'That username is taken — try another' : 'Could not save profile');
          return;
        }
        profile = Object.assign({}, profile, { username, display_name, home_city, home_lat, home_lng });
        showToast('Profile saved');
        overlay.remove();
      }catch(e){ showToast('Could not save profile'); }
    };
    overlay.querySelectorAll('[data-interested-game]').forEach(chip=>{
      chip.onclick = ()=>chip.classList.toggle('active');
    });
    overlay.querySelector('#saveNotifPrefsBtn').onclick = async ()=>{
      const prefs = {};
      NOTIF_PREF_KEYS.forEach(k=>{
        prefs[k.key] = overlay.querySelector(`[data-pref="${k.key}"]`).checked;
      });
      const shareStats = overlay.querySelector('#acc_sharestats').checked;
      const interestedGames = Array.from(overlay.querySelectorAll('[data-interested-game].active')).map(el=>el.dataset.interestedGame);
      try{
        await supabaseClient.from('profiles').update({ notification_prefs: prefs, share_stats_with_friends: shareStats, interested_games: interestedGames }).eq('id', session.user.id);
        profile.notification_prefs = prefs;
        profile.share_stats_with_friends = shareStats;
        profile.interested_games = interestedGames;
        showToast(tr('settingsSaved'));
        await syncFollowedStoreEvents();
        render();
      }catch(e){ showToast(tr('couldNotSave')); }
    };
  }

  async function respondToInvitation(invitationId, accept, notifId){
    try{
      const { data: updated, error } = await supabaseClient
        .from('event_invitations')
        .update({ status: accept ? 'accepted' : 'declined' })
        .eq('id', invitationId)
        .eq('status', 'pending')
        .select()
        .maybeSingle();

      if(error){ showToast('Could not update invitation'); return; }
      if(!updated){
        showToast('This invitation was already responded to');
        invitationStatusById[invitationId] = invitationStatusById[invitationId] || 'accepted';
        render();
        return;
      }

      async function finish(){
        invitationStatusById[invitationId] = accept ? 'accepted' : 'declined';
        if(notifId){
          await supabaseClient.from('notifications').update({ read:true }).eq('id', notifId);
          const n = notifications.find(x=>x.id===notifId);
          if(n) n.read = true;
        }
        render();
      }

      async function addAsTournament(e, repeatValue){
        if(isDuplicateEvent(e)){
          showToast('Accepted — but you already had this event on your calendar');
          await finish();
          return;
        }
        tournaments.push({
          id: uid(), name: e.name, game: e.game||'', store: e.store||'', date: e.date, time: e.time||'',
          repeat: repeatValue, format: e.format||'', fee: e.fee||'', address: e.address||'', city:'', link: e.link||'', storeLink: e.storeLink||'',
          notes:'', rsvp:'going', result:null, occurrences:{}, lat:null, lng:null, googleEventId:null,
          readOnly: true
        });
        await saveTournaments();
        showToast(repeatValue !== 'none' ? 'Added as a repeating series' : 'Added to your calendar');
        await finish();
      }

      if(accept){
        const e = updated.event;
        if(e.repeat && e.repeat !== 'none'){
          const repLabel = (REPEATS.find(r=>r.v===e.repeat)||{}).l || 'Repeating';
          openChoiceDialog({
            title: 'This event repeats',
            message: `"${e.name}" repeats ${repLabel.toLowerCase()}. How would you like to add it?`,
            choices: [
              { label: `Just this one date`, action: ()=>addAsTournament(e, 'none') },
              { label: `As a repeating series`, action: ()=>addAsTournament(e, e.repeat) }
            ]
          });
          return; // finish() runs inside whichever choice they pick
        } else {
          await addAsTournament(e, 'none');
          return;
        }
      } else {
        showToast('Invitation declined');
      }
      await finish();
    }catch(e){ showToast('Could not respond to invitation'); }
  }

  // ============================================================
  // Boot
  // ============================================================
  let bootstrapping = false;
  // Merges every event from every store you follow into your own tournaments
  // list, as read-only entries that stay live-linked — if a store edits,
  // cancels, or deletes an event, your copy updates or disappears to match.
  // Once merged in, they're ordinary tournament entries: shareable,
  // invitable, calendar-syncable, everything the rest of the app already
  // does for a normal event.
  // Anything left "in progress" gets automatically marked finished 6 hours
  // after the event's start time — so a result you started logging mid-event
  // and forgot about doesn't sit half-open forever (and correctly counts
  // toward your stats, which ignore nothing but do read cleaner when
  // entries aren't perpetually pending).
  async function autoFinishStaleInProgress(){
    let changed = false;
    const nowMs = Date.now();
    function maybeFinish(t, date, occ){
      if(!occ.result || !occ.result.inProgress) return;
      // Parse the event's start time as best we can; fall back to 6 PM,
      // matching the same assumption the server-side reminder jobs make.
      let hh = 18, mm = 0;
      const m = (t.time||'').match(/(\d{1,2}):(\d{2})\s*(am|pm)?/i);
      if(m){
        hh = parseInt(m[1],10); mm = parseInt(m[2],10);
        const ampm = (m[3]||'').toLowerCase();
        if(ampm === 'pm' && hh < 12) hh += 12;
        if(ampm === 'am' && hh === 12) hh = 0;
      }
      const startMs = new Date(`${date}T${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:00`).getTime();
      if(isNaN(startMs)) return;
      if(nowMs - startMs >= 6*60*60*1000){
        delete occ.result.inProgress;
        setOcc(t, date, { result: occ.result });
        syncResultLogged(t, date, true);
        changed = true;
      }
    }
    tournaments.forEach(t=>{
      if(!isRepeating(t)){
        if(t.result) maybeFinish(t, t.date, { result: t.result });
      } else {
        Object.keys(t.occurrences||{}).forEach(date=>{
          const o = t.occurrences[date];
          if(o && o.result) maybeFinish(t, date, o);
        });
      }
    });
    if(changed) await saveTournaments();
  }

  async function syncFollowedStoreEvents(){
    try{
      const { data: follows } = await supabaseClient.from('store_follows').select('store_id, stores(name)').eq('user_id', session.user.id);
      const followedStoreIds = (follows||[]).map(f=>f.store_id);
      const storeNameById = {};
      (follows||[]).forEach(f=>{ if(f.stores) storeNameById[f.store_id] = f.stores.name; });

      let liveEvents = [];
      if(followedStoreIds.length){
        const { data } = await supabaseClient.from('store_events').select('*').in('store_id', followedStoreIds);
        liveEvents = data || [];
      }
      // If the user has narrowed down which games they care about, filter
      // out events for other games entirely — this is what actually
      // declutters the main feed. Events with no game set are left in,
      // since we can't confidently say they're irrelevant.
      // Matched via gameIcon()'s normalizer rather than exact string
      // comparison: stores type the game as free text, so "Pokemon" from a
      // store wouldn't match "Pokémon TCG" selected here without it.
      const interests = profile.interested_games || [];
      if(interests.length){
        const interestIcons = new Set(interests.map(g=>gameIcon(g)).filter(i=>i && i!=='🎴'));
        const interestNorms = new Set(interests.map(g=>normalizeGameKey(g)));
        liveEvents = liveEvents.filter(e=>{
          if(!e.game) return true;
          const icon = gameIcon(e.game);
          if(icon && icon !== '🎴' && interestIcons.has(icon)) return true;
          return interestNorms.has(normalizeGameKey(e.game));
        });
      }
      const liveIds = new Set(liveEvents.map(e=>e.id));
      let goingCountById = {};
      if(liveEvents.length){
        try{
          const { data: counts } = await supabaseClient.rpc('get_store_event_rsvp_counts', { event_ids: [...liveIds] });
          (counts||[]).forEach(c=>{ goingCountById[c.store_event_id] = c.going_count; });
        }catch(e){}
      }
      let changed = false;

      // Drop local copies for events that were deleted, whose store you no
      // longer follow, or that no longer match your interested-games filter
      // (this last one is what makes DESELECTING a game actually remove
      // those events from your feed, rather than leaving stale copies behind).
      const before = tournaments.length;
      tournaments = tournaments.filter(t=>{
        if(!t.storeEventId) return true;
        return liveIds.has(t.storeEventId) && followedStoreIds.includes(t.storeId);
      });
      if(tournaments.length !== before) changed = true;

      // Add new ones, and refresh fields on ones you already have.
      liveEvents.forEach(e=>{
        let t = tournaments.find(x=>x.storeEventId===e.id);
        if(!t){
          t = {
            id: uid(), storeEventId: e.id, storeId: e.store_id,
            rsvp:null, result:null, occurrences:{}, lat:null, lng:null, googleEventId:null, readOnly:true
          };
          tournaments.push(t);
          changed = true;
        }
        const storeName = storeNameById[e.store_id] || 'Store';
        const fresh = { name: e.name, game: e.game||'', format: e.format||'', date: e.date, time: e.time||'',
          fee: e.fee||'', address: e.address||'', link: e.link||'', storeLink: e.store_link||'',
          notes: e.notes||'', repeat: e.repeat||'none', cancelled: !!e.cancelled, store: storeName,
          prizing: e.prizing||'',
          capacity: e.capacity||null, isFull: !!(e.capacity && (goingCountById[e.id]||0) >= e.capacity) };
        Object.keys(fresh).forEach(k=>{ if(t[k] !== fresh[k]){ t[k] = fresh[k]; changed = true; } });
      });

      if(changed) await saveTournaments();
    }catch(e){ /* non-fatal — worst case, followed events just don't refresh this load */ }
  }

  async function bootstrapApp(){
    if(bootstrapping) return; // Supabase's auth listener can fire twice for one login — ignore the repeat
    bootstrapping = true;
    try{
      await Promise.all([loadProfile(), loadTournaments(), loadFriendsData(), loadNotifications()]);
      await syncFollowedStoreEvents();
      await autoFinishStaleInProgress();
      if(preLoginLangChoice && preLoginLangChoice !== currentLang){
        currentLang = preLoginLangChoice;
        try{ await supabaseClient.from('profiles').update({ language: currentLang }).eq('id', session.user.id); profile.language = currentLang; }catch(e){}
      }
      preLoginLangChoice = null;
      await checkPushEnabled();
      subscribeRealtime();
      render();
      ensureTimezoneSaved();
      if(pendingShareCode){
        const code = pendingShareCode;
        pendingShareCode = null;
        openSharedEventModal(code);
      } else if(profile && profile.onboarded === false){
        openWelcomeModal();
      } else {
        checkForAnnouncement();
      }
    } finally {
      bootstrapping = false;
    }
  }

  // Shows the latest announcement once per person, if they haven't seen it yet.
  // Post one anytime by inserting a row into the `announcements` table directly
  // in the Supabase dashboard — no in-app admin UI needed.
  async function checkForAnnouncement(){
    try{
      const { data } = await supabaseClient.from('announcements').select('*').order('created_at', { ascending:false }).limit(1).maybeSingle();
      if(!data) return;
      if(profile.last_seen_announcement_id === data.id) return;
      const overlay = document.createElement('div');
      overlay.className = 'overlay';
      overlay.innerHTML = `
        <div class="modal" style="max-width:420px;">
          <h2>📣 ${escapeHtml(data.title)}</h2>
          <div class="modal-sub" style="font-size:14px;line-height:1.6;white-space:pre-wrap;">${escapeHtml(data.message)}</div>
          <div class="modal-actions"><button class="btn-primary" id="dismissAnnouncement" style="flex:1;">Got it</button></div>
        </div>`;
      document.body.appendChild(overlay);
      const dismiss = async ()=>{
        overlay.remove();
        try{
          await supabaseClient.from('profiles').update({ last_seen_announcement_id: data.id }).eq('id', session.user.id);
          profile.last_seen_announcement_id = data.id;
        }catch(e){ /* non-fatal — worst case it shows again next login */ }
      };
      overlay.querySelector('#dismissAnnouncement').onclick = dismiss;
      overlay.onclick = (e)=>{ if(e.target===overlay) dismiss(); };
    }catch(e){ /* non-fatal, and expected until this migration is run */ }
  }

  // Silently records the browser's timezone on the profile, used server-side
  // by the "remind me to log results" scheduled job to know when 2 hours have
  // actually passed for you specifically, not just in UTC.
  async function ensureTimezoneSaved(){
    try{
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      if(tz && profile.timezone !== tz){
        await supabaseClient.from('profiles').update({ timezone: tz }).eq('id', session.user.id);
        profile.timezone = tz;
      }
    }catch(e){ /* non-fatal */ }
  }

  async function renderPublicStorePage(idOrCode){
    app.innerHTML = `<div class="wrap"><div class="modal-sub" style="text-align:center;margin-top:60px;">Loading…</div></div>`;
    try{
      let { data: store } = await supabaseClient.from('stores').select('*').eq('id', idOrCode).eq('approved', true).maybeSingle();
      if(!store){
        const res = await supabaseClient.from('stores').select('*').eq('follow_code', idOrCode.toUpperCase()).eq('approved', true).maybeSingle();
        store = res.data;
      }
      if(!store){
        app.innerHTML = `<div class="wrap"><div class="empty-state" style="margin-top:60px;"><div class="big">Store not found</div><div>This link may be wrong, or the store isn't approved yet.</div></div></div>`;
        return;
      }
      const today = todayStr();
      const { data: events } = await supabaseClient.from('store_events').select('*').eq('store_id', store.id).gte('date', today).order('date').limit(30);

      const rows = (events||[]).map(e=>`
        <div class="card">
          <div class="date-block"><div class="dow">${fmtDateParts(e.date).dow}</div><div class="dom">${fmtDateParts(e.date).dom}</div></div>
          <div class="card-body">
            <div class="card-top"><div class="card-name">${e.cancelled?'<span style="color:var(--rose);">[CANCELLED] </span>':''}${escapeHtml(e.name)}</div></div>
            <div class="card-meta">
              ${e.time ? `<span>${escapeHtml(e.time)}</span>` : ''}
              ${e.game ? `<span class="badge game">${gameIcon(e.game)} ${escapeHtml(e.game)}</span>` : ''}
              ${e.format ? `<span class="badge format">${escapeHtml(e.format)}</span>` : ''}
              ${e.fee ? `<span class="badge fee">${escapeHtml(e.fee)}</span>` : ''}
              ${e.prizing ? `<span class="badge result">🏆 ${escapeHtml(e.prizing)}</span>` : ''}
            </div>
            <div class="card-links">
              ${e.link ? `<a class="card-link" href="${escapeAttr(e.link)}" target="_blank" rel="noopener">Event page ↗</a>` : ''}
              <a class="card-link gold" href="${gcalQuickLink({name:e.name, time:e.time, fee:e.fee, notes:e.notes, link:e.link}, e.date)}" target="_blank" rel="noopener">📅 Add to Google Calendar</a>
            </div>
          </div>
        </div>`).join('');

      app.innerHTML = `
        <div class="wrap">
          <div class="home-hero" style="text-align:center;padding:30px 0 10px;">
            <div class="brand">Pairings</div>
          </div>
          <div class="empty-state" style="margin-bottom:0;">
            <div class="big">🏪 ${escapeHtml(store.name)}</div>
            <div>${escapeHtml(store.city||'')}${store.description ? ' · '+escapeHtml(store.description) : ''}</div>
            ${store.contact_link ? `<div style="margin-top:8px;"><a href="${escapeAttr(store.contact_link)}" target="_blank" rel="noopener" style="color:var(--teal);">${escapeHtml(store.contact_link)} ↗</a></div>` : ''}
          </div>
          <div class="section-label" style="text-align:center;">Upcoming events</div>
          ${rows || `<div class="modal-sub" style="text-align:center;">No upcoming events posted right now.</div>`}
          <div class="empty-state" style="margin-top:24px;">
            <div>Want these events to show up in your own calendar automatically, and get notified when new ones are posted?</div>
            <div style="margin-top:12px;"><a href="${baseAppUrl()}" class="btn-primary" style="display:inline-block;text-decoration:none;padding:12px 22px;border-radius:10px;">Get Pairings — follow code: ${escapeHtml(store.follow_code)}</a></div>
          </div>
        </div>`;
    }catch(e){
      app.innerHTML = `<div class="wrap"><div class="empty-state" style="margin-top:60px;"><div class="big">Something went wrong</div></div></div>`;
    }
  }
  function baseAppUrl(){ return window.location.origin + window.location.pathname; }

  (async ()=>{
    registerServiceWorker();
    const publicParams = new URLSearchParams(window.location.search);
    if(publicParams.has('storepage')){
      await renderPublicStorePage(publicParams.get('storepage'));
      return;
    }
    try{ if((navigator.language||'').toLowerCase().startsWith('es')) currentLang = 'es'; }catch(e){}
    const { data: { session: s } } = await supabaseClient.auth.getSession();
    session = s;
    if(session) await bootstrapApp(); else renderAuth('signin');
    supabaseClient.auth.onAuthStateChange((event, sess)=>{
      const hadSession = !!session;
      session = sess;
      if(session && !hadSession) bootstrapApp();
      if(!session) renderAuth('signin');
    });
  })();
})();
</script>
