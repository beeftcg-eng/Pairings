<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Pairings — TCG Tournament Tracker</title>

<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#100e1a"/>
<link rel="icon" href="/favicon-32.png" sizes="32x32"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Pairings"/>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap');

  :root{
    --void:#100e1a;
    --panel:#181528;
    --panel-2:#1f1b33;
    --line:#2c2745;
    --text:#eeeaf7;
    --text-dim:#a49bc4;
    --rift:#8b5cf6;
    --rift-2:#c084fc;
    --teal:#2dd9c1;
    --amber:#f5b656;
    --rose:#f0678a;
    --gold:#ffd166;
    --radius:14px;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(139,92,246,0.16), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(45,217,193,0.10), transparent 55%),
      var(--void);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 90px;}

  /* ---------- Header ---------- */
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand .mark{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;letter-spacing:-0.02em;
    background:linear-gradient(90deg,var(--rift-2),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand .sub{color:var(--text-dim);font-size:12.5px;}
  .head-actions{display:flex;gap:6px;flex-wrap:wrap;}

  .btn{border:none;border-radius:10px;cursor:pointer;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13.5px;min-height:40px;}
  .add-btn{background:linear-gradient(135deg,var(--rift),#6d28d9);color:#fff;padding:9px 14px;box-shadow:0 6px 18px rgba(139,92,246,0.35);white-space:nowrap;}
  .add-btn:hover{filter:brightness(1.08);}
  .icon-pill{background:var(--panel);border:1px solid var(--line) !important;color:var(--text);padding:9px 12px;position:relative;white-space:nowrap;}
  .icon-pill:hover{border-color:var(--teal) !important;}
  .btn:active{transform:translateY(1px);}
  .bell-badge{position:absolute;top:-5px;right:-5px;background:var(--rose);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 5px;min-width:16px;text-align:center;line-height:1.4;}

  /* ---------- Hero / next-up ring ---------- */
  .hero{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,var(--panel),var(--panel-2));
    border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:20px;position:relative;overflow:hidden;}
  .hero::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;
    background:radial-gradient(circle,rgba(139,92,246,0.25),transparent 70%);}
  .ring{flex:none;position:relative;width:70px;height:70px;}
  .ring svg{transform:rotate(-90deg);}
  .ring .bg{stroke:rgba(255,255,255,0.08);}
  .ring .fg{stroke:url(#ringGrad);stroke-linecap:round;transition:stroke-dashoffset .5s ease;}
  .ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;}
  .hero-info{flex:1;min-width:0;}
  .hero-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--teal);font-weight:600;margin-bottom:3px;}
  .hero-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hero-meta{color:var(--text-dim);font-size:12.5px;margin-top:2px;}
  .hero-empty{color:var(--text-dim);font-size:13.5px;}

  /* ---------- Quick links ---------- */
  .quick-links{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
  .qlink{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
    color:var(--text-dim);text-decoration:none;font-size:12px;padding:7px 11px;border-radius:9px;}
  .qlink:hover{border-color:var(--rift);color:var(--text);}

  /* ---------- Toolbar ---------- */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center;}
  .search{flex:1;min-width:140px;background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:9px 12px;color:var(--text);font-size:14px;}
  .search::placeholder{color:var(--text-dim);}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--text-dim);
    padding:7px 11px;border-radius:20px;font-size:12px;cursor:pointer;white-space:nowrap;}
  .chip.active{background:rgba(139,92,246,0.18);border-color:var(--rift);color:var(--rift-2);}
  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-left:auto;}
  .seg button{background:none;border:none;color:var(--text-dim);padding:8px 12px;font-size:12px;cursor:pointer;}
  .seg button.active{background:var(--panel-2);color:var(--text);}

  /* ---------- List ---------- */
  .month-label{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12.5px;color:var(--text-dim);
    text-transform:uppercase;letter-spacing:.08em;margin:20px 0 10px;}
  .card{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px;margin-bottom:10px;position:relative;}
  .card.past{opacity:0.6;}
  .date-block{flex:none;width:50px;height:50px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;position:relative;}
  .date-block .dow{font-size:9.5px;color:var(--teal);text-transform:uppercase;}
  .date-block .dom{font-size:18px;font-weight:600;line-height:1.1;}
  .date-block .game-icon{position:absolute;top:-7px;left:-7px;font-size:13px;background:var(--panel);border:1px solid var(--line);
    border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;}
  .card-body{flex:1;min-width:0;}
  .card-top{display:flex;justify-content:space-between;gap:8px;}
  .card-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14.5px;}
  .card-actions{display:flex;gap:2px;flex:none;}
  .icon-btn{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:14px;padding:5px 6px;border-radius:6px;min-height:32px;min-width:32px;}
  .icon-btn:hover{color:var(--text);background:var(--panel-2);}
  .card-meta{color:var(--text-dim);font-size:12px;margin-top:3px;display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center;}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:3px 8px;border-radius:20px;font-weight:600;}
  .badge.format{background:rgba(139,92,246,0.16);color:var(--rift-2);}
  .badge.game{background:rgba(45,217,193,0.16);color:var(--teal);}
  .badge.fee{background:rgba(245,182,86,0.16);color:var(--amber);}
  .badge.repeat{background:rgba(45,217,193,0.14);color:var(--teal);}
  .badge.result{background:rgba(255,209,102,0.16);color:var(--gold);}
  .rsvp-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .rsvp-btn{font-size:11px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--text-dim);cursor:pointer;min-height:32px;}
  .rsvp-btn.going.active{background:rgba(45,217,193,0.18);border-color:var(--teal);color:var(--teal);}
  .rsvp-btn.maybe.active{background:rgba(245,182,86,0.18);border-color:var(--amber);color:var(--amber);}
  .rsvp-btn.skip.active{background:rgba(240,103,138,0.18);border-color:var(--rose);color:var(--rose);}
  .result-btn{font-size:11px;padding:6px 10px;border-radius:8px;border:1px dashed var(--line);background:none;color:var(--text-dim);cursor:pointer;min-height:32px;}
  .result-btn:hover{border-color:var(--gold);color:var(--gold);}
  .card-notes{font-size:12px;color:var(--text-dim);margin-top:8px;white-space:pre-wrap;}
  .card-links{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px;}
  .card-link{font-size:11.5px;color:var(--teal);text-decoration:none;}
  .card-link.gold{color:var(--gold);}

  .empty-state{text-align:center;padding:44px 18px;color:var(--text-dim);border:1px dashed var(--line);border-radius:16px;}
  .empty-state .big{font-family:'Space Grotesk',sans-serif;font-size:16px;color:var(--text);margin-bottom:6px;font-weight:700;}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(8,7,14,0.72);backdrop-filter:blur(3px);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;padding-top:env(safe-area-inset-top);}
  @media(min-width:640px){.overlay{align-items:center;}}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;
    width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom));}
  @media(min-width:640px){.modal{border-radius:18px;}}
  .modal h2{font-family:'Space Grotesk',sans-serif;margin:0 0 4px;font-size:17px;}
  .modal .modal-sub{color:var(--text-dim);font-size:12px;margin-bottom:14px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:5px;font-weight:600;}
  .field input,.field select,.field textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    padding:10px 11px;color:var(--text);font-size:16px;font-family:inherit;}
  .field textarea{resize:vertical;min-height:60px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:420px){.row2{grid-template-columns:1fr;}}
  .paste-box{background:var(--panel-2);border:1px dashed var(--rift);border-radius:10px;padding:12px;margin-bottom:16px;}
  .paste-box .lbl{font-size:12px;font-weight:700;color:var(--rift-2);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
  .paste-box textarea{width:100%;min-height:64px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
    color:var(--text);padding:9px;font-size:13px;font-family:inherit;}
  .parse-btn{margin-top:8px;background:var(--rift);color:#fff;border:none;border-radius:7px;padding:8px 13px;font-size:12.5px;font-weight:700;cursor:pointer;min-height:36px;}
  .modal-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .btn-primary{flex:1;min-width:120px;background:linear-gradient(135deg,var(--rift),#6d28d9);color:#fff;border:none;border-radius:9px;padding:12px;font-weight:700;font-family:'Space Grotesk',sans-serif;cursor:pointer;min-height:44px;}
  .btn-secondary{background:var(--panel-2);color:var(--text-dim);border:1px solid var(--line);border-radius:9px;padding:12px 16px;cursor:pointer;min-height:44px;}
  .btn-danger{background:none;color:var(--rose);border:1px solid rgba(240,103,138,0.4);border-radius:9px;padding:12px 16px;cursor:pointer;min-height:44px;}
  .hint{font-size:11px;color:var(--text-dim);margin-top:4px;line-height:1.5;}

  .tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--panel-2);padding:4px;border-radius:10px;}
  .tabs button{flex:1;background:none;border:none;color:var(--text-dim);padding:9px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;min-height:38px;}
  .tabs button.active{background:var(--panel);color:var(--text);}

  .share-code-display{background:var(--panel-2);border:1px solid var(--rift);border-radius:10px;padding:16px;text-align:center;margin-top:14px;}
  .share-code-display .code{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;letter-spacing:.1em;color:var(--rift-2);}
  .list-item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel-2);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px;}
  .list-item .info{min-width:0;}
  .list-item .n{font-weight:700;font-family:'Space Grotesk',sans-serif;font-size:13px;}
  .list-item .m{color:var(--text-dim);font-size:11.5px;}
  .mini-btn{font-size:11px;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:7px;cursor:pointer;white-space:nowrap;min-height:34px;}
  .mini-btn:hover{border-color:var(--teal);}
  .mini-btn.accept{border-color:var(--teal);color:var(--teal);}
  .mini-btn.decline{border-color:var(--rose);color:var(--rose);}
  .section-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);font-weight:700;margin:16px 0 8px;}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
  .stat-card{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:14px;}
  .stat-card .val{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;background:linear-gradient(90deg,var(--rift-2),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .stat-card .lbl{font-size:11px;color:var(--text-dim);margin-top:2px;}
  .bar-row{margin-bottom:10px;}
  .bar-row .bar-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;}
  .bar-row .bar-top .bn{font-weight:600;}
  .bar-row .bar-top .bc{color:var(--text-dim);}
  .bar-track{background:var(--panel-2);border-radius:6px;height:8px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--rift),var(--teal));border-radius:6px;}
  .result-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .result-row:last-child{border-bottom:none;}
  .result-row .n{font-weight:600;font-family:'Space Grotesk',sans-serif;}
  .result-row .m{color:var(--text-dim);font-size:11px;}
  .result-row .p{color:var(--gold);font-weight:600;white-space:nowrap;}

  .notif-item{padding:11px 4px;border-bottom:1px solid var(--line);font-size:13px;}
  .notif-item.unread{background:rgba(139,92,246,0.08);border-radius:8px;padding:11px 8px;}
  .notif-item .t{color:var(--text-dim);font-size:11px;margin-top:3px;}

  /* ---------- Auth screen ---------- */
  .auth-wrap{max-width:380px;margin:12vh auto 0;padding:0 16px;}
  .auth-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 20px;}
  .auth-card h1{font-family:'Space Grotesk',sans-serif;font-size:26px;margin:0 0 4px;
    background:linear-gradient(90deg,var(--rift-2),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .auth-sub{color:var(--text-dim);font-size:13px;margin-bottom:20px;}
  .auth-toggle{text-align:center;margin-top:14px;font-size:13px;color:var(--text-dim);}
  .auth-toggle a{color:var(--teal);cursor:pointer;text-decoration:underline;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel-2);
    border:1px solid var(--line);color:var(--text);padding:10px 18px;border-radius:20px;font-size:13px;z-index:70;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);max-width:90vw;text-align:center;}

  @media(max-width:420px){
    .brand .mark{font-size:20px;}
    .icon-pill, .add-btn{padding:8px 10px;font-size:12.5px;}
    .hero-title{font-size:14.5px;}
    .card{padding:11px;gap:10px;}
    .date-block{width:44px;height:44px;}
  }
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<!--
  ============================================================
  SETUP REQUIRED — see SETUP.md for the full walkthrough.
  Your actual Supabase/Google credentials live in config.js, a separate
  file next to this one — NOT in this file. That way, whenever you get an
  updated pairings.html, you just drop it in and config.js stays untouched.
  ============================================================
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script>
(function(){
  const CFG = window.PAIRINGS_CONFIG || {};
  const SUPABASE_URL = CFG.SUPABASE_URL || 'YOUR_SUPABASE_URL';
  const SUPABASE_ANON_KEY = CFG.SUPABASE_ANON_KEY || 'YOUR_SUPABASE_ANON_KEY';
  const VAPID_PUBLIC_KEY = CFG.VAPID_PUBLIC_KEY || 'BOZU4eZ0JCuAnFXlLzsjUJ1gUYaXLD_LLnJ032FRE7SZVA1VtHg1Qz6tKoKdldRsiiVrbzH4UUxAcqO9F_EU3_o';
  const GOOGLE_CLIENT_ID = CFG.GOOGLE_CLIENT_ID || 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com';

  const configured = SUPABASE_URL.startsWith('http') && SUPABASE_ANON_KEY.length > 20;
  const app = document.getElementById('app');

  if(!configured){
    app.innerHTML = `
      <div class="auth-wrap" style="max-width:520px;">
        <div class="auth-card">
          <h1>⚙️ One setup step</h1>
          <p style="color:var(--text-dim);line-height:1.6;">This app needs a free Supabase project. Follow <code>SETUP.md</code>, then edit <code>config.js</code> (a separate file next to this one) with your Project URL and anon key, and reload.</p>
        </div>
      </div>`;
    return;
  }

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const FUNCTIONS_URL = SUPABASE_URL + '/functions/v1';

  const GAMES = ['Riftbound','One Piece Card Game','Magic: The Gathering','Pokémon TCG','Yu-Gi-Oh!','Digimon Card Game','Flesh and Blood','Disney Lorcana','Star Wars: Unlimited','Other'];
  // Generic symbols, not official logos/artwork — avoids any IP issues while still giving a quick visual cue per game.
  const GAME_ICONS = {
    'Riftbound': '🌀',
    'One Piece Card Game': '🏴‍☠️',
    'Magic: The Gathering': '🔮',
    'Pokémon TCG': '⚡',
    'Yu-Gi-Oh!': '🌟',
    'Digimon Card Game': '🦖',
    'Flesh and Blood': '⚔️',
    'Disney Lorcana': '✨',
    'Star Wars: Unlimited': '🚀'
  };
  function gameIcon(game){ return GAME_ICONS[game] || (game ? '🎴' : ''); }

  // Curated list of Riftbound Champion Legends, used only as autocomplete suggestions
  // (for logging match-ups) — not an exhaustive/official list, just a helpful starting point.
  const RIFTBOUND_LEGENDS = [
    "Kai'Sa","Volibear","Jinx","Darius","Ahri","Lee Sin","Yasuo","Leona","Teemo","Viktor","Miss Fortune","Sett",
    "Rumble","Lucian","Draven","Rek'Sai","Ornn","Jax","Irelia","Azir","Ezreal","Renata Glasc","Sivir","Fiora",
    "Zed","Shen","Akali","Nasus","Renekton","Mel","Ambessa","Jayce","Kennen","Ekko","Dr. Mundo",
    "Master Yi","Lux","Annie","Garen"
  ];
  const FORMATS = ['Constructed','Sealed','Draft','Standard','Limited','Modified Champion Deck','Team Trios','2v2','Learn to Play','Other'];
  const REPEATS = [
    {v:'none', l:'Does not repeat'},
    {v:'weekly', l:'Weekly'},
    {v:'biweekly', l:'Every 2 weeks'},
    {v:'monthly', l:'Monthly'}
  ];

  let session = null;
  let profile = null;
  let tournaments = [];
  let decks = [];
  let friendsAccepted = [];
  let pendingIncoming = [];
  let pendingOutgoing = [];
  let profilesById = {};
  let notifications = [];
  let invitationStatusById = {};
  let filterFormat = 'All';
  let filterGame = 'All';
  let searchTerm = '';
  let viewMode = 'upcoming';
  let pushEnabled = false;

  let pendingShareCode = null;
  (function captureShareParam(){
    const params = new URLSearchParams(window.location.search);
    const code = params.get('share');
    if(code){
      pendingShareCode = code.toUpperCase();
      const url = new URL(window.location.href);
      url.searchParams.delete('share');
      window.history.replaceState({}, '', url.toString());
    }
  })();

  function riftboundEventsUrl(){
    const base = 'https://locator.riftbound.uvsgames.com/events';
    if(profile && profile.home_city){
      // Best-effort: their site may or may not read this from the URL — worst case it's just the plain page.
      return base + '?location=' + encodeURIComponent(profile.home_city) + '&distance=50';
    }
    return base;
  }

  function uid(){ return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function deckUid(){ return 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  // Resolves a result's deck reference to whatever that deck is CURRENTLY named —
  // so renaming a deck later automatically updates it everywhere in your stats history.
  function resolveDeckName(result){
    if(!result) return null;
    if(result.deckId){
      const d = decks.find(x=>x.id===result.deckId);
      return d ? d.name : 'Deleted deck';
    }

    const cName = (candidate.name||'').trim().toLowerCase();
    const cDate = candidate.date;
    const cStore = (candidate.store||'').trim().toLowerCase();
    if(!cName || !cDate) return false;
    return tournaments.some(t=>{

      if((t.name||'').trim().toLowerCase() !== cName) return false;
      if(cStore && (t.store||'').trim().toLowerCase() !== cStore) return false;
      return true;
    });

  function todayStr(){ return dateToStr(new Date()); }
  function fmtDateParts(dateStr){

  function daysUntil(dateStr){
    const today = new Date(); today.setHours(0,0,0,0);
    const d = new Date(dateStr + 'T00:00:00');

  }
  function combineDateTime(dateStr, timeStr){
    const d = new Date(dateStr + 'T00:00:00');
    if(timeStr){
      const m = timeStr.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
      if(m){
        let h = parseInt(m[1],10);
        const min = parseInt(m[2],10);
        const ap = m[3].toUpperCase();
        if(ap==='PM' && h!==12) h += 12;
        if(ap==='AM' && h===12) h = 0;
        d.setHours(h, min, 0, 0);
      }
    }
    return d;
  }
  function hoursUntil(dateStr, timeStr){
    const target = combineDateTime(dateStr, timeStr);

  // ---------- recurrence ----------
  function isRepeating(t){ return t.repeat && t.repeat !== 'none'; }
  function getOccurrenceDates(t, windowStartStr, windowEndStr){
    if(!t.date) return [];
    if(!isRepeating(t)) return [t.date];
    const dates = [];
    let d = new Date(t.date + 'T00:00:00');
    const end = new Date(windowEndStr + 'T00:00:00');
    const start = new Date(windowStartStr + 'T00:00:00');
    let count = 0;
    while(d <= end && count < 500){
      if(d >= start) dates.push(dateToStr(d));
      if(t.repeat === 'weekly') d.setDate(d.getDate()+7);
      else if(t.repeat === 'biweekly') d.setDate(d.getDate()+14);
      else if(t.repeat === 'monthly') d.setMonth(d.getMonth()+1);
      else break;
      count++;
    }
    return dates;
  }
  function getOcc(t, date){
    if(!isRepeating(t)) return { rsvp: t.rsvp||null, result: t.result||null, skip:false, googleEventId: t.googleEventId||null };
    const o = (t.occurrences && t.occurrences[date]) || {};
    return { rsvp: o.rsvp||null, result: o.result||null, skip: !!o.skip, googleEventId: o.googleEventId||null };
  }
  function setOcc(t, date, patch){
    if(!isRepeating(t)){ Object.assign(t, patch); return; }
    t.occurrences = t.occurrences || {};
    t.occurrences[date] = Object.assign({}, t.occurrences[date], patch);
  }

  // ---------- Push notifications ----------
  function urlBase64ToUint8Array(base64String){
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g,'+').replace(/_/g,'/');
    const rawData = atob(base64);
    const arr = new Uint8Array(rawData.length);
    for(let i=0;i<rawData.length;i++) arr[i] = rawData.charCodeAt(i);
    return arr;
  }

  async function checkPushEnabled(){
    if(!('serviceWorker' in navigator)) { pushEnabled = false; return; }
    try{

      const sub = reg ? await reg.pushManager.getSubscription() : null;
      if(!sub){ pushEnabled = false; return; }
      const { data } = await supabaseClient.from('push_subscriptions').select('id').eq('endpoint', sub.endpoint).maybeSingle();
      pushEnabled = !!data;
    }catch(e){ pushEnabled = false; }

  async function enablePush(){
    if(!('serviceWorker' in navigator) || !('PushManager' in window)){
      showToast('Push notifications are not supported in this browser'); return;
    }
    try{
      const reg = await navigator.serviceWorker.register('/sw.js');
      const perm = await Notification.requestPermission();
      if(perm !== 'granted'){ showToast('Notification permission was denied'); return; }
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
      const j = sub.toJSON();
      const { error } = await supabaseClient.from('push_subscriptions').upsert({
        user_id: session.user.id, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth
      }, { onConflict: 'endpoint' });
      if(error){
        console.error('push_subscriptions upsert failed', error);
        showToast('Saved on this device but the server rejected it: ' + error.message);
        pushEnabled = false;
        render();
        return;
      }
      pushEnabled = true;
      showToast('Push notifications enabled on this device');
      render();
    }catch(e){ console.error(e); showToast('Could not enable push notifications'); }

  function downloadIcs(t, date){

      'DESCRIPTION:' + icsEscape(description),

    const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });

  // ---------- Smart paste parser ----------
  function parsePastedText(text){
    const result = {};
    const monthNames = 'January|February|March|April|May|June|July|August|September|October|November|December|Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec';
    const monthMap = {jan:0,january:0,feb:1,february:1,mar:2,march:2,apr:3,april:3,may:4,jun:5,june:5,jul:6,july:6,aug:7,august:7,sep:8,sept:8,september:8,oct:9,october:9,nov:10,november:10,dec:11,december:11};
    let m = text.match(new RegExp('(' + monthNames + ')\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?,?\\s*(\\d{4})?','i'));
    if(m){
      const mon = monthMap[m[1].toLowerCase()];
      const day = parseInt(m[2],10);
      let year = m[3] ? parseInt(m[3],10) : new Date().getFullYear();
      let d = new Date(year, mon, day);
      const now = new Date(); now.setHours(0,0,0,0);
      if(!m[3] && d < now){ d = new Date(year+1, mon, day); }
      result.date = dateToStr(d);
    } else {
      m = text.match(/\b(\d{1,2})\/(\d{1,2})\/(\d{2,4})\b/);
      if(m){
        let yr = m[3].length===2 ? '20'+m[3] : m[3];
        result.date = yr+'-'+String(m[1]).padStart(2,'0')+'-'+String(m[2]).padStart(2,'0');
      }
    }
    let tm = text.match(/\b(\d{1,2}):(\d{2})\s?(am|pm|AM|PM)\b/) || text.match(/\b(\d{1,2})\s?(am|pm|AM|PM)\b/);
    if(tm){
      if(tm.length===4){ result.time = tm[1]+':'+tm[2]+' '+tm[3].toUpperCase(); }
      else { result.time = tm[1]+':00 '+tm[2].toUpperCase(); }
    }
    let pr = text.match(/\$\s?(\d+(?:\.\d{2})?)/);
    if(pr){ result.fee = '$' + pr[1]; }
    else if(/\bfree\b/i.test(text)){ result.fee = 'Free'; }
    for(const f of FORMATS){
      if(new RegExp(f.replace(/\s+/g,'\\s+'),'i').test(text)){ result.format = f; break; }
    }
    const gamePatterns = [
      [/one\s*piece/i, 'One Piece Card Game'],
      [/riftbound/i, 'Riftbound'],
      [/magic:?\s*the\s*gathering|\bmtg\b/i, 'Magic: The Gathering'],
      [/pok[eé]mon/i, 'Pokémon TCG'],
      [/yu-?gi-?oh/i, 'Yu-Gi-Oh!'],
      [/digimon/i, 'Digimon Card Game'],
      [/flesh\s*and\s*blood/i, 'Flesh and Blood'],
      [/lorcana/i, 'Disney Lorcana'],
      [/star\s*wars.*unlimited/i, 'Star Wars: Unlimited']
    ];
    for(const [re, name] of gamePatterns){
      if(re.test(text)){ result.game = name; break; }
    }
    if(/\b(every week|weekly|each week)\b/i.test(text)) result.repeat = 'weekly';
    else if(/\b(every other week|biweekly|every 2 weeks)\b/i.test(text)) result.repeat = 'biweekly';
    else if(/\b(monthly|every month)\b/i.test(text)) result.repeat = 'monthly';
    const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
    const storeGuess = lines.find(l => /(games?|cards?|comics?|hobby|hobbies|collect|lgs|shop)\b/i.test(l) && l.length < 60);
    if(storeGuess) result.store = storeGuess;
    const nameGuess = lines.find(l => l !== storeGuess && l.length > 4 && l.length < 80);
    if(nameGuess) result.name = nameGuess;
    result.notes = text.trim();
    return result;
  }

  function splitIntoEventBlocks(text){
    // First try: blocks separated by one or more blank lines (common when copying a page's event list)
    let blocks = text.split(/\n\s*\n+/).map(b=>b.trim()).filter(Boolean);
    if(blocks.length > 1) return blocks;

    // Fallback: split right before each date-like mention
    const monthNames = 'January|February|March|April|May|June|July|August|September|October|November|December|Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec';
    const dateRe = new RegExp('(' + monthNames + ')\\.?\\s+\\d{1,2}(?:st|nd|rd|th)?,?\\s*\\d{0,4}', 'gi');
    const indices = [];
    let m;
    while((m = dateRe.exec(text))){ indices.push(m.index); }
    if(indices.length <= 1) return [text.trim()];
    const chunks = [];
    for(let i=0;i<indices.length;i++){
      const start = indices[i];
      const end = i+1<indices.length ? indices[i+1] : text.length;
      chunks.push(text.slice(start, end).trim());
    }
    return chunks.filter(Boolean);
  }

  // ---------- Build display instances ----------
  function buildInstances(){
    const today = new Date();
    const windowStart = dateToStr(new Date(today.getFullYear(), today.getMonth(), today.getDate()-120));
    const windowEnd = dateToStr(new Date(today.getFullYear(), today.getMonth(), today.getDate()+180));
    const instances = [];
    tournaments.forEach(t=>{
      getOccurrenceDates(t, windowStart, windowEnd).forEach(date=>{
        const occ = getOcc(t, date);
        if(occ.skip) return;
        instances.push({ t, date, rsvp: occ.rsvp, result: occ.result, googleEventId: occ.googleEventId });
      });
    });
    return instances;
  }

  function parseRecord(record){
    if(!record) return null;
    const m = String(record).match(/(\d+)\s*-\s*(\d+)(?:\s*-\s*(\d+))?/);
    if(!m) return null;
    return { w: parseInt(m[1],10), l: parseInt(m[2],10), d: m[3] ? parseInt(m[3],10) : 0 };
  }

  function computeStats(){
    const attendedSet = new Set();
    const formatCounts = {};
    const storeCounts = {};
    const gameCounts = {};
    const placementCounts = {};
    const matchupStats = {};
    const deckStats = {};
    const allResults = [];
    let totalWins = 0, totalLosses = 0, totalDraws = 0;

    function accumulate(t, date, occ){
      if(occ.skip) return;
      if(occ.rsvp === 'going' || occ.result){
        attendedSet.add(t.id + '::' + date);
        if(t.format) formatCounts[t.format] = (formatCounts[t.format]||0) + 1;
        if(t.store) storeCounts[t.store] = (storeCounts[t.store]||0) + 1;
        if(t.game) gameCounts[t.game] = (gameCounts[t.game]||0) + 1;
      }
      if(occ.result){
        allResults.push({ name: t.name, store: t.store, date, result: occ.result });
        if(occ.result.placement){
          placementCounts[occ.result.placement] = (placementCounts[occ.result.placement]||0) + 1;
        }
        const rec = parseRecord(occ.result.record);
        if(rec){ totalWins += rec.w; totalLosses += rec.l; totalDraws += rec.d; }
        const deckKey = occ.result.deckId ? ('id:'+occ.result.deckId) : (occ.result.deck ? ('legacy:'+occ.result.deck.trim()) : null);
        if(deckKey && rec){
          deckStats[deckKey] = deckStats[deckKey] || {w:0,l:0,d:0};
          deckStats[deckKey].w += rec.w; deckStats[deckKey].l += rec.l; deckStats[deckKey].d += rec.d;
        }
        (occ.result.matches||[]).forEach(m=>{
          const key = (m.opponent||'').trim();
          if(!key || !m.outcome) return;
          matchupStats[key] = matchupStats[key] || {w:0,l:0,d:0};
          if(m.outcome==='W') matchupStats[key].w++;
          else if(m.outcome==='L') matchupStats[key].l++;
          else if(m.outcome==='D') matchupStats[key].d++;
        });
      }
    }

    tournaments.forEach(t=>{
      if(!isRepeating(t)){
        accumulate(t, t.date, { rsvp: t.rsvp||null, result: t.result||null, skip:false });
      } else {
        Object.keys(t.occurrences||{}).forEach(date=>{
          const o = t.occurrences[date] || {};
          accumulate(t, date, { rsvp: o.rsvp||null, result: o.result||null, skip: !!o.skip });
        });
      }
    });

    const decidedGames = totalWins + totalLosses;
    const winRate = decidedGames > 0 ? Math.round((totalWins/decidedGames) * 100) : null;
    const topN = (obj, n) => Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,n);

    const matchups = Object.entries(matchupStats)
      .map(([name, rec]) => ({
        name, ...rec, total: rec.w+rec.l+rec.d,
        winRate: (rec.w+rec.l) > 0 ? Math.round((rec.w/(rec.w+rec.l))*100) : null
      }))
      .sort((a,b)=>b.total-a.total)
      .slice(0, 8);

    function resolveDeckKeyName(key){
      if(key.startsWith('id:')){
        const d = decks.find(x=>x.id===key.slice(3));
        return d ? d.name : 'Deleted deck';
      }
      return key.slice('legacy:'.length);
    }
    function deckStatusForKey(key){
      if(key.startsWith('id:')){
        const d = decks.find(x=>x.id===key.slice(3));
        if(!d) return 'other';
        return d.active ? 'current' : 'past';
      }
      return 'other'; // legacy free-text entries aren't tracked as current/past decks
    }
    const deckEntries = Object.entries(deckStats).map(([key, rec]) => ({
      name: resolveDeckKeyName(key), status: deckStatusForKey(key), ...rec,
      total: rec.w+rec.l+rec.d,
      winRate: (rec.w+rec.l) > 0 ? Math.round((rec.w/(rec.w+rec.l))*100) : null
    })).sort((a,b)=>b.total-a.total);
    const deckWinRates = {
      current: deckEntries.filter(d=>d.status==='current').slice(0,8),
      past: deckEntries.filter(d=>d.status==='past').slice(0,8),
      other: deckEntries.filter(d=>d.status==='other').slice(0,8)
    };

    return {
      attended: attendedSet.size,
      resultsLogged: allResults.length,
      totalWins, totalLosses, totalDraws, winRate,
      topFormats: topN(formatCounts, 5),
      topStores: topN(storeCounts, 5),
      topGames: topN(gameCounts, 5),
      topPlacements: topN(placementCounts, 5),
      matchups,
      deckWinRates,
      recentResults: allResults.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10),
      maxFormatCount: Math.max(1, ...Object.values(formatCounts)),
      maxStoreCount: Math.max(1, ...Object.values(storeCounts)),
      maxGameCount: Math.max(1, ...Object.values(gameCounts))
    };
  }

  async function toggleRsvp(id, date, val){
    const t = tournaments.find(x=>x.id===id);
    if(!t) return;
    const cur = getOcc(t, date).rsvp;
    setOcc(t, date, { rsvp: cur === val ? null : val });
    await saveTournaments();
    await syncAttendance(t, date);
    render();
  }

  function handleDelete(id, date){
    const t = tournaments.find(x=>x.id===id);
    if(!t) return;
    if(!isRepeating(t)){
      if(!confirm('Delete this tournament?')) return;
      tournaments = tournaments.filter(x=>x.id!==id);
      saveTournaments(); render();
      showToast('Deleted');
      return;
    }
    openChoiceDialog({
      title: 'Remove tournament',
      message: `"${t.name}" repeats ${(REPEATS.find(r=>r.v===t.repeat)||{}).l||''}. What would you like to remove?`,
      choices: [
        { label: `Just ${fmtFriendly(date)}`, action: ()=>{ setOcc(t, date, {skip:true}); saveTournaments(); render(); showToast('That date removed'); } },
        { label: 'Entire series', danger:true, action: ()=>{ tournaments = tournaments.filter(x=>x.id!==id); saveTournaments(); render(); showToast('Series deleted'); } }
      ]
    });
  }

  function openChoiceDialog({title, message, choices}){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <div class="modal" style="max-width:400px;">
        <h2>${escapeHtml(title)}</h2>
        <div class="modal-sub">${escapeHtml(message)}</div>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;">
          ${choices.map((c,i)=>`<button class="btn-secondary" data-i="${i}" style="text-align:left;${c.danger?'color:var(--rose);border-color:rgba(240,103,138,0.4);':''}">${escapeHtml(c.label)}</button>`).join('')}
          <button class="btn-secondary" id="cancelChoice" style="text-align:center;">Cancel</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
    overlay.querySelector('#cancelChoice').onclick = ()=>overlay.remove();
    overlay.querySelectorAll('[data-i]').forEach(b=>{
      b.onclick = ()=>{ overlay.remove(); choices[parseInt(b.dataset.i,10)].action(); };
    });
  }

          <button class="parse-btn" id="parseBtn" type="button">Parse &amp; fill fields</button>
        </div>
        <div class="field"><label>Event name</label><input id="f_name" value="${escapeAttr(t.name)}" placeholder="e.g. Friday Night Sealed"/></div>
        <div class="row2">
          <div class="field"><label>Game</label>
            <input id="f_game" list="gameOptions" value="${escapeAttr(t.game||'')}" placeholder="e.g. One Piece Card Game"/>
            <datalist id="gameOptions">${GAMES.map(g=>`<option value="${escapeAttr(g)}">`).join('')}</datalist>
          </div>
          <div class="field"><label>Format</label>
            <input id="f_format" list="formatOptions" value="${escapeAttr(t.format||'')}" placeholder="e.g. Standard, Sealed…"/>

          <div class="field"><label>Store / venue</label><input id="f_store" value="${escapeAttr(t.store)}" placeholder="e.g. Meeple Mountain Games"/></div>

        </div>
        <div class="row2">
          <div class="field"><label>${isRepeating(t) || !id ? 'First date' : 'Date'}</label><input type="date" id="f_date" value="${escapeAttr(t.date)}"/></div>
          <div class="field"><label>Time</label><input id="f_time" value="${escapeAttr(t.time)}" placeholder="e.g. 6:30 PM"/></div>
        </div>
        <div class="field">
          <label>Repeats</label>
          <select id="f_repeat">${REPEATS.map(r=>`<option value="${r.v}" ${t.repeat===r.v?'selected':''}>${escapeHtml(r.l)}</option>`).join('')}</select>
          <div class="hint">A repeating local shows up every week/month automatically — RSVP and results are tracked per date.</div>
        </div>
        <div class="field"><label>Entry fee</label><input id="f_fee" value="${escapeAttr(t.fee)}" placeholder="e.g. $10, or Free"/></div>
        <div class="field"><label>Address</label><input id="f_address" value="${escapeAttr(t.address)}" placeholder="Street, city"/></div>
        <div class="field"><label>Event link</label><input id="f_link" value="${escapeAttr(t.link)}" placeholder="https://…"/></div>
        <div class="field">
          <label>Decklist link (optional)</label>
          <input id="f_decklink" value="${escapeAttr(t.deckLink||'')}" placeholder="https://piltoverarchive.com/decks/…"/>
          <div class="hint">Playing Riftbound? <a href="https://piltoverarchive.com/deckbuilder" target="_blank" rel="noopener" style="color:var(--teal);">Build a deck on Piltover Archive ↗</a> then paste the link here.</div>
        </div>
        <div class="field"><label>Notes (pricing details, prize support, byes, anything else)</label>
          <textarea id="f_notes" placeholder="e.g. $10 entry, +$5 for a bye, cash payouts top 4">${escapeHtml(t.notes)}</textarea>
        </div>
        <div class="modal-actions">
          ${id ? '<button class="btn-danger" id="deleteBtn" type="button">Delete</button>' : ''}
          <button class="btn-secondary" id="cancelBtn" type="button">Cancel</button>
          <button class="btn-primary" id="saveBtn" type="button">${id?'Save changes':'Add tournament'}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);

    overlay.querySelector('#linkFetchBtn').onclick = async ()=>{
      const url = overlay.querySelector('#linkFetchInput').value.trim();
      if(!url){ showToast('Paste a Riftbound event link first'); return; }
      const btn = overlay.querySelector('#linkFetchBtn');
      btn.disabled = true;
      btn.textContent = 'Fetching…';
      try{
        const res = await fetch(FUNCTIONS_URL + '/fetch-event-link', {
          method:'POST',
          headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + session.access_token },
          body: JSON.stringify({ url })
        });
        const p = await res.json();
        if(p.error){ showToast(p.error); return; }
        if(!p.foundAnything){ showToast("Couldn't find event details on that page — try pasting text instead"); return; }
        if(p.date) overlay.querySelector('#f_date').value = p.date;
        if(p.time && !overlay.querySelector('#f_time').value) overlay.querySelector('#f_time').value = p.time;
        if(p.store && !overlay.querySelector('#f_store').value) overlay.querySelector('#f_store').value = p.store;
        if(p.address && !overlay.querySelector('#f_address').value) overlay.querySelector('#f_address').value = p.address;
        if(p.format) overlay.querySelector('#f_format').value = p.format;
        if(p.fee && !overlay.querySelector('#f_fee').value) overlay.querySelector('#f_fee').value = p.fee;
        if(!overlay.querySelector('#f_game').value) overlay.querySelector('#f_game').value = 'Riftbound';
        if(!overlay.querySelector('#f_link').value) overlay.querySelector('#f_link').value = url;
        showToast('Filled what we could find — the event name still needs typing in');
      }catch(e){ showToast('Could not fetch that page'); }
      finally{ btn.disabled = false; btn.textContent = 'Fetch details'; }
    };

    overlay.querySelector('#parseBtn').onclick = ()=>{
      const raw = overlay.querySelector('#pasteArea').value;
      if(!raw.trim()){ showToast('Paste some event text first'); return; }
      const p = parsePastedText(raw);
      if(p.name && !overlay.querySelector('#f_name').value) overlay.querySelector('#f_name').value = p.name;
      if(p.store && !overlay.querySelector('#f_store').value) overlay.querySelector('#f_store').value = p.store;
      if(p.date) overlay.querySelector('#f_date').value = p.date;
      if(p.time && !overlay.querySelector('#f_time').value) overlay.querySelector('#f_time').value = p.time;
      if(p.game && !overlay.querySelector('#f_game').value) overlay.querySelector('#f_game').value = p.game;
      if(p.format) overlay.querySelector('#f_format').value = p.format;
      if(p.fee && !overlay.querySelector('#f_fee').value) overlay.querySelector('#f_fee').value = p.fee;
      if(p.repeat) overlay.querySelector('#f_repeat').value = p.repeat;
      if(p.notes && !overlay.querySelector('#f_notes').value) overlay.querySelector('#f_notes').value = p.notes;
      showToast('Filled what we could find — double check before saving');
    };
    overlay.querySelector('#cancelBtn').onclick = ()=>overlay.remove();
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
    if(id){ overlay.querySelector('#deleteBtn').onclick = ()=>{ overlay.remove(); handleDelete(id, t.date); }; }

    overlay.querySelector('#saveBtn').onclick = async ()=>{
      const name = overlay.querySelector('#f_name').value.trim();
      if(!name){ showToast('Give the event a name'); return; }
      const newCity = overlay.querySelector('#f_city').value.trim();
      const newAddress = overlay.querySelector('#f_address').value.trim();
      const updated = {
        id: t.id, name,
        game: overlay.querySelector('#f_game').value.trim(),
        store: overlay.querySelector('#f_store').value.trim(),
        city: newCity,
        date: overlay.querySelector('#f_date').value,
        time: overlay.querySelector('#f_time').value.trim(),
        repeat: overlay.querySelector('#f_repeat').value,
        format: overlay.querySelector('#f_format').value.trim(),
        fee: overlay.querySelector('#f_fee').value.trim(),
        address: newAddress,
        link: overlay.querySelector('#f_link').value.trim(),
        deckLink: overlay.querySelector('#f_decklink').value.trim(),
        notes: overlay.querySelector('#f_notes').value.trim(),
        rsvp: t.rsvp || null,
        result: t.result || null,
        occurrences: t.occurrences || {},
        lat: (newAddress !== t.address || newCity !== t.city) ? null : (t.lat || null),
        lng: (newAddress !== t.address || newCity !== t.city) ? null : (t.lng || null),
        googleEventId: t.googleEventId || null
      };
      if(!updated.date){ showToast('Pick a date'); return; }
      if(id){
        const idx = tournaments.findIndex(x=>x.id===id);
        tournaments[idx] = updated;
      } else {
        tournaments.push(updated);
      }
      await saveTournaments();
      overlay.remove();
      render();
      showToast(id ? 'Saved' : 'Added to your calendar');
    };
  }

  // ---------- Bulk import modal ----------
  function openBulkImportModal(){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <div class="modal">
        <h2>Bulk import events</h2>
        <div class="modal-sub">Paste the whole list of events from a store's page, Riftbound events, or Facebook — we'll try to split it into separate events automatically.</div>
        <div class="field"><textarea id="bulkPasteArea" style="min-height:160px;" placeholder="Paste multiple events here, one after another…"></textarea></div>
        <div class="modal-actions">
          <button class="btn-secondary" id="cancelBulk" style="flex:1;">Cancel</button>
          <button class="btn-primary" id="parseBulkBtn" style="flex:1;">Find events</button>
        </div>
        <div id="bulkReviewArea"></div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
    overlay.querySelector('#cancelBulk').onclick = ()=>overlay.remove();

    overlay.querySelector('#parseBulkBtn').onclick = ()=>{
      const raw = overlay.querySelector('#bulkPasteArea').value;
      if(!raw.trim()){ showToast('Paste some event text first'); return; }
      const blocks = splitIntoEventBlocks(raw);
      const parsed = blocks.map(b=>({ block: b, ...parsePastedText(b) })).filter(p=>p.name || p.date);

      const reviewArea = overlay.querySelector('#bulkReviewArea');
      if(parsed.length === 0){
        reviewArea.innerHTML = `<div class="modal-sub">Couldn't find any distinct events in that text — try pasting a smaller chunk, or add this one manually instead.</div>`;
        return;
      }
      reviewArea.innerHTML = `
        <div class="section-label">Found ${parsed.length} possible event${parsed.length>1?'s':''} — uncheck any that look wrong</div>
        ${parsed.map((p,idx)=>`
          <div class="list-item">
            <div class="info">
              <div class="n">${escapeHtml(p.name || 'Untitled event')}</div>
              <div class="m">${p.date ? fmtFriendly(p.date, p.time) : 'No date found'}${p.store ? ' · '+escapeHtml(p.store) : ''}</div>
            </div>
            <input type="checkbox" data-bulk-idx="${idx}" ${p.date ? 'checked' : ''} style="width:20px;height:20px;flex:none;"/>
          </div>`).join('')}
        <div class="modal-actions">
          <button class="btn-primary" id="addBulkBtn" style="flex:1;">Add selected events</button>
        </div>
      `;
      reviewArea.querySelector('#addBulkBtn').onclick = async ()=>{
        const checked = Array.from(reviewArea.querySelectorAll('[data-bulk-idx]:checked')).map(el=>parseInt(el.dataset.bulkIdx,10));
        if(checked.length === 0){ showToast('Select at least one event'); return; }
        let added = 0, skippedDupes = 0;
        checked.forEach(idx=>{
          const p = parsed[idx];
          if(!p.date) return; // need at least a date to be useful
          const candidate = { name: p.name || 'Untitled event', date: p.date, store: p.store || '' };
          if(isDuplicateEvent(candidate)){ skippedDupes++; return; }
          tournaments.push({
            id: uid(), name: candidate.name, game: p.game || '', store: candidate.store, date: p.date, time: p.time || '',
            repeat: p.repeat || 'none', format: p.format || '', fee: p.fee || '', address: '', city: '', link: '',
            notes: p.notes || '', rsvp: null, result: null, occurrences: {}, lat: null, lng: null, googleEventId: null
          });
          added++;
        });
        await saveTournaments();
        overlay.remove();
        render();
        const dupeNote = skippedDupes ? ` (skipped ${skippedDupes} already on your calendar)` : '';
        showToast(`Added ${added} event${added===1?'':'s'}${dupeNote} — double-check details, since this was an automatic guess`);
      };
    };
  }

  // ---------- Result modal ----------
  function openResultModal(id, date){
    const t = tournaments.find(x=>x.id===id);
    if(!t) return;
    const occ = getOcc(t, date);
    const r = occ.result || { placement:'', record:'', notes:'', deckId:'', deck:'', matches:[] };
    let matches = (r.matches || []).map(m=>({...m}));
    const isRiftbound = t.game === 'Riftbound';
    const legendDatalist = isRiftbound
      ? `<datalist id="legendOptions">${RIFTBOUND_LEGENDS.map(l=>`<option value="${escapeAttr(l)}">`).join('')}</datalist>`
      : '';
    const matchingDecks = decks.filter(d => !t.game || !d.game || d.game === t.game).sort((a,b)=>(b.active?1:0)-(a.active?1:0));
    const currentDeckId = r.deckId || '';

    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <div class="modal" style="max-width:480px;">
        <h2>Log your result</h2>
        <div class="modal-sub">${escapeHtml(t.name)} · ${fmtFriendly(date, t.time)}</div>
        <div class="row2">
          <div class="field"><label>Placement</label><input id="r_placement" value="${escapeAttr(r.placement)}" placeholder="e.g. 1st, Top 8"/></div>
          <div class="field"><label>Overall record</label><input id="r_record" value="${escapeAttr(r.record)}" placeholder="e.g. 3-1"/></div>
        </div>
        <div class="field">
          <label>Your deck</label>
          <select id="r_deckSelect">
            <option value="">— No deck selected —</option>
            ${matchingDecks.map(d=>`<option value="${d.id}" ${currentDeckId===d.id?'selected':''}>${escapeHtml(d.name)}${d.active?'':' (retired)'}</option>`).join('')}
            <option value="__new__">+ Add a new deck…</option>
          </select>
          <div id="newDeckInline" style="display:none;margin-top:8px;">
            <input id="newDeckNameInline" placeholder="Deck name" ${isRiftbound?'list="legendOptions"':''}/>
            <button class="mini-btn" id="createDeckInlineBtn" type="button" style="margin-top:6px;">Create &amp; select</button>
          </div>
          ${!r.deckId && r.deck ? `<div class="hint">Previously logged as free text: "${escapeHtml(r.deck)}" — pick a deck above to switch this to a trackable one.</div>` : ''}
        </div>
        ${legendDatalist}
        <div class="hint" style="margin:-6px 0 12px;">Record fills in automatically from the match log below — you can still edit it by hand.</div>

        <div class="section-label">Match log</div>
        <div id="matchRows"></div>
        <button class="mini-btn" id="addMatchBtn" type="button" style="margin-bottom:14px;">+ Add a round</button>

        <div class="field"><label>Notes</label><textarea id="r_notes" placeholder="Key matchups, what to improve…">${escapeHtml(r.notes)}</textarea></div>
        <div class="modal-actions">
          ${occ.result ? '<button class="btn-danger" id="clearResult" type="button">Clear result</button>' : ''}
          <button class="btn-secondary" id="cancelResult" type="button">Cancel</button>
          <button class="btn-primary" id="saveResult" type="button">Save result</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
    overlay.querySelector('#cancelResult').onclick = ()=>overlay.remove();

    function recomputeRecordFromMatches(){
      if(matches.length === 0) return;
      let w=0,l=0,d=0;
      matches.forEach(m=>{ if(m.outcome==='W') w++; else if(m.outcome==='L') l++; else if(m.outcome==='D') d++; });
      overlay.querySelector('#r_record').value = d>0 ? `${w}-${l}-${d}` : `${w}-${l}`;
    }

    const inputStyle = 'background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 10px;font-size:13px;';

    function drawMatches(){
      const rowsEl = overlay.querySelector('#matchRows');
      if(matches.length === 0){
        rowsEl.innerHTML = `<div class="modal-sub" style="margin-bottom:10px;">No rounds logged yet — add one below, or just fill in the overall record above.</div>`;
        return;
      }
      rowsEl.innerHTML = matches.map((m,idx)=>`
        <div class="list-item" style="align-items:flex-start;flex-wrap:wrap;">
          <div class="info" style="flex:1;min-width:220px;">
            <div class="n" style="margin-bottom:6px;">Round ${idx+1}</div>
            <div class="row2" style="margin-bottom:6px;">
              <input data-m="${idx}" data-f="opponent" value="${escapeAttr(m.opponent||'')}" placeholder="Opponent's deck/leader" style="${inputStyle}" ${isRiftbound?'list="legendOptions"':''}/>
              <select data-m="${idx}" data-f="outcome" style="${inputStyle}">
                <option value="">Result…</option>
                <option value="W" ${m.outcome==='W'?'selected':''}>Win</option>
                <option value="L" ${m.outcome==='L'?'selected':''}>Loss</option>
                <option value="D" ${m.outcome==='D'?'selected':''}>Draw</option>
              </select>
            </div>
            <div class="row2">
              <select data-m="${idx}" data-f="wentFirst" style="${inputStyle}">
                <option value="">Went first?</option>
                <option value="yes" ${m.wentFirst==='yes'?'selected':''}>I went first</option>
                <option value="no" ${m.wentFirst==='no'?'selected':''}>I went second</option>
              </select>
              <input data-m="${idx}" data-f="notes" value="${escapeAttr(m.notes||'')}" placeholder="Notes (optional)" style="${inputStyle}"/>
            </div>
          </div>
          <button class="icon-btn" data-remove-match="${idx}" title="Remove round">✕</button>
        </div>`).join('');

      rowsEl.querySelectorAll('[data-m]').forEach(el=>{
        el.oninput = el.onchange = ()=>{
          const idx = parseInt(el.dataset.m,10);
          matches[idx][el.dataset.f] = el.value;
          recomputeRecordFromMatches();
        };
      });
      rowsEl.querySelectorAll('[data-remove-match]').forEach(btn=>{
        btn.onclick = ()=>{
          matches.splice(parseInt(btn.dataset.removeMatch,10), 1);
          drawMatches();
          recomputeRecordFromMatches();
        };
      });
    }
    drawMatches();

    overlay.querySelector('#addMatchBtn').onclick = ()=>{
      matches.push({ opponent:'', outcome:'', wentFirst:'', notes:'' });
      drawMatches();
    };

    const deckSelect = overlay.querySelector('#r_deckSelect');
    const newDeckInline = overlay.querySelector('#newDeckInline');
    deckSelect.onchange = ()=>{
      newDeckInline.style.display = deckSelect.value === '__new__' ? 'block' : 'none';
    };
    overlay.querySelector('#createDeckInlineBtn').onclick = async ()=>{
      const name = overlay.querySelector('#newDeckNameInline').value.trim();
      if(!name){ showToast('Give the deck a name'); return; }
      const newDeck = { id: deckUid(), name, game: t.game||'', notes:'', active:true, createdAt: Date.now() };
      decks.push(newDeck);
      await saveDecks();
      const opt = document.createElement('option');
      opt.value = newDeck.id; opt.textContent = newDeck.name; opt.selected = true;
      deckSelect.insertBefore(opt, deckSelect.lastElementChild);
      newDeckInline.style.display = 'none';
      showToast('Deck created');
    };

    if(occ.result){
      overlay.querySelector('#clearResult').onclick = async ()=>{
        setOcc(t, date, { result: null });
        await saveTournaments();
        syncResultLogged(t, date, false);
        overlay.remove(); render();
        showToast('Result cleared');
      };
    }
    overlay.querySelector('#saveResult').onclick = async ()=>{
      const placement = overlay.querySelector('#r_placement').value.trim();
      const record = overlay.querySelector('#r_record').value.trim();
      const deckId = deckSelect.value && deckSelect.value !== '__new__' ? deckSelect.value : '';
      const notes = overlay.querySelector('#r_notes').value.trim();
      const cleanMatches = matches.filter(m=>m.opponent || m.outcome || m.notes);
      if(!placement && !record && !deckId && !r.deck && !notes && cleanMatches.length===0){ showToast('Add at least one detail'); return; }
      const resultObj = { placement, record, notes, matches: cleanMatches };
      if(deckId) resultObj.deckId = deckId;
      else if(r.deck) resultObj.deck = r.deck; // keep old free-text entry if you didn't switch it to a tracked deck
      setOcc(t, date, { result: resultObj });
      await saveTournaments();
      syncResultLogged(t, date, true);
      overlay.remove(); render();
      showToast('Result saved');
    };
  }

    function draw(){

      body.innerHTML = `
        <div class="field">
          <label>Add a friend by username or email</label>
          <div style="display:flex;gap:8px;">
            <input id="friendEmail" placeholder="@username or friend@example.com" style="flex:1;"/>
            <button class="mini-btn" id="sendReqBtn">Send</button>

          <div class="list-item">

          <div class="list-item">

            <button class="mini-btn decline" data-decline="${p.friendshipId}">Cancel</button>
          </div>`).join('') : ''}
        <div class="section-label">Your friends (${friendsAccepted.length})</div>
        ${friendsAccepted.length ? friendsAccepted.map(p=>`
          <div class="list-item">
            <div class="info"><div class="n">${escapeHtml(friendLabel(p.userId))}</div>${friendSubLabel(p.userId) ? `<div class="m">${escapeHtml(friendSubLabel(p.userId))}</div>` : ''}</div>

        <div class="modal-actions"><button class="btn-secondary" id="closeFriends" style="flex:1;">Close</button></div>
      `;
      body.querySelector('#sendReqBtn').onclick = async ()=>{

      body.querySelectorAll('[data-decline]').forEach(b=>b.onclick = async ()=>{ await removeFriendship(b.dataset.decline); draw(); });
      body.querySelector('#closeFriends').onclick = ()=>overlay.remove();
    }
    draw();
  }

  // ---------- Notifications modal ----------
  function openNotificationsModal(){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    const rows = notifications.length ? notifications.map(n=>{
      const isInvite = n.type === 'event_invite' && n.related_invitation_id;
      const inviteStatus = isInvite ? (invitationStatusById[n.related_invitation_id] || 'pending') : null;
      return `
      <div class="notif-item ${n.read?'':'unread'}">
        <div>${escapeHtml(n.message)}</div>
        <div class="t">${new Date(n.created_at).toLocaleString()}</div>
        ${isInvite && inviteStatus === 'pending' ? `
          <div class="rsvp-row" style="margin-top:8px;">
            <button class="rsvp-btn going" data-invite-accept="${n.related_invitation_id}" data-notif="${n.id}">Accept</button>
            <button class="rsvp-btn skip" data-invite-decline="${n.related_invitation_id}" data-notif="${n.id}">Decline</button>
          </div>` : ''}
        ${isInvite && inviteStatus === 'accepted' ? `<div class="t" style="color:var(--teal);margin-top:4px;">✓ Accepted</div>` : ''}
        ${isInvite && inviteStatus === 'declined' ? `<div class="t" style="color:var(--rose);margin-top:4px;">Declined</div>` : ''}
      </div>`;
    }).join('') : `<div class="modal-sub">No notifications yet.</div>`;
    overlay.innerHTML = `
      <div class="modal">
        <h2>Notifications</h2>
        <div class="modal-actions" style="margin-top:0;margin-bottom:14px;">
          <button class="btn-secondary" id="markAllBtn" style="flex:1;">Mark all read</button>
          <button class="btn-primary" id="pushBtn" style="flex:1;">${pushEnabled ? '🔔 Push enabled on this device' : 'Enable push on this device'}</button>
        </div>
        <div style="max-height:50vh;overflow-y:auto;">${rows}</div>
        <div class="modal-actions"><button class="btn-secondary" id="closeNotif" style="flex:1;">Close</button></div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
    overlay.querySelector('#closeNotif').onclick = ()=>overlay.remove();
    overlay.querySelector('#markAllBtn').onclick = async ()=>{ await markAllRead(); render(); overlay.remove(); };
    overlay.querySelector('#pushBtn').onclick = async ()=>{ await enablePush(); overlay.remove(); openNotificationsModal(); };
    overlay.querySelectorAll('[data-invite-accept]').forEach(b=>b.onclick = async ()=>{
      overlay.remove();
      await respondToInvitation(b.dataset.inviteAccept, true, b.dataset.notif);
      openNotificationsModal();
    });
    overlay.querySelectorAll('[data-invite-decline]').forEach(b=>b.onclick = async ()=>{
      overlay.remove();
      await respondToInvitation(b.dataset.inviteDecline, false, b.dataset.notif);
      openNotificationsModal();
    });
  }

      <div class="result-row">

  // ---------- Decks modal ----------
  function openDecksModal(){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `<div class="modal"><h2>Your decks</h2><div id="decksBody"></div></div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };

    function deckRow(d){
      const metaBits = [d.game || 'No game set'];
      if(d.legend) metaBits.push('Legend: '+d.legend);
      if(d.cardCount) metaBits.push(d.cardCount+' cards');
      return `
        <div class="list-item" id="deckrow-${d.id}">
          <div class="info">
            <div class="n" data-view="${d.id}">${escapeHtml(d.name)}</div>
            <div class="m">${escapeHtml(metaBits.join(' · '))}</div>
            ${(d.viewLink || d.editLink) ? `<div style="margin-top:4px;display:flex;gap:10px;">
              ${d.viewLink ? `<a href="${escapeAttr(d.viewLink)}" target="_blank" rel="noopener" style="color:var(--teal);font-size:11.5px;">View on Piltover Archive ↗</a>` : ''}
              ${d.editLink ? `<a href="${escapeAttr(d.editLink)}" target="_blank" rel="noopener" style="color:var(--teal);font-size:11.5px;">Edit ↗</a>` : ''}
            </div>` : ''}
          </div>
          <div style="display:flex;gap:6px;">
            <button class="mini-btn" data-rename="${d.id}">Rename</button>
            <button class="mini-btn" data-toggle="${d.id}">${d.active ? 'Retire' : 'Reactivate'}</button>
            <button class="mini-btn decline" data-delete="${d.id}">Delete</button>
          </div>
        </div>`;
    }

    function draw(){
      const body = overlay.querySelector('#decksBody');
      const current = decks.filter(d=>d.active);
      const past = decks.filter(d=>!d.active);
      body.innerHTML = `
        <div class="paste-box">
          <div class="lbl">🔗 Import from Piltover Archive</div>
          <div style="display:flex;gap:8px;">
            <input id="pltDeckLink" placeholder="https://piltoverarchive.com/decks/view/…" style="flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 11px;font-size:13px;"/>
            <button class="parse-btn" id="pltImportBtn" type="button" style="margin-top:0;white-space:nowrap;">Import</button>
          </div>
          <div class="hint">Pulls in the deck's name, legend, and a direct edit link automatically.</div>
        </div>
        <div class="field">
          <label>Or add one manually</label>
          <div class="row2">
            <input id="newDeckName" placeholder="Deck name" list="legendOptionsGlobal"/>
            <input id="newDeckGame" list="gameOptions" placeholder="Game (optional)"/>
          </div>
          <datalist id="gameOptions">${GAMES.map(g=>`<option value="${escapeAttr(g)}">`).join('')}</datalist>
          <datalist id="legendOptionsGlobal">${RIFTBOUND_LEGENDS.map(l=>`<option value="${escapeAttr(l)}">`).join('')}</datalist>
          <button class="mini-btn" id="addDeckBtn" style="margin-top:8px;">+ Add deck</button>
        </div>
        <div class="section-label">Current decks (${current.length})</div>
        ${current.length ? current.map(deckRow).join('') : `<div class="modal-sub">No current decks yet.</div>`}
        <div class="section-label">Past decks (${past.length})</div>
        ${past.length ? past.map(deckRow).join('') : `<div class="modal-sub">Nothing retired yet.</div>`}
        <div class="modal-actions"><button class="btn-secondary" id="closeDecks" style="flex:1;">Close</button></div>
      `;

      body.querySelector('#pltImportBtn').onclick = async ()=>{
        const url = body.querySelector('#pltDeckLink').value.trim();
        if(!url){ showToast('Paste a Piltover Archive deck link first'); return; }
        const btn = body.querySelector('#pltImportBtn');
        btn.disabled = true;
        btn.textContent = 'Importing…';
        try{
          const res = await fetch(FUNCTIONS_URL + '/fetch-piltover-deck', {
            method: 'POST',
            headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + session.access_token },
            body: JSON.stringify({ url })
          });
          const p = await res.json();
          if(p.error){ showToast(p.error); return; }
          if(!p.foundAnything){ showToast("Couldn't read that deck page — try adding it manually instead"); return; }
          decks.push({
            id: deckUid(), name: p.name || 'Imported deck', game: 'Riftbound',
            legend: p.legend || '', colors: p.colors || [], cardCount: p.cardCount || null,
            viewLink: p.viewLink || url, editLink: p.editLink || '',
            notes: '', active: true, createdAt: Date.now()
          });
          await saveDecks();
          draw();
          showToast('Deck imported from Piltover Archive');
        }catch(e){ showToast('Could not import that deck'); }
        finally{ btn.disabled = false; btn.textContent = 'Import'; }
      };

      body.querySelector('#addDeckBtn').onclick = async ()=>{
        const name = body.querySelector('#newDeckName').value.trim();
        const game = body.querySelector('#newDeckGame').value.trim();
        if(!name){ showToast('Give the deck a name'); return; }
        decks.push({ id: deckUid(), name, game, notes:'', active:true, createdAt: Date.now() });
        await saveDecks();
        draw();
        showToast('Deck added');
      };
      body.querySelectorAll('[data-rename]').forEach(btn=>{
        btn.onclick = async ()=>{
          const d = decks.find(x=>x.id===btn.dataset.rename);
          if(!d) return;
          const newName = prompt('Rename deck', d.name);
          if(newName === null) return;
          const trimmed = newName.trim();
          if(!trimmed){ showToast('Name cannot be empty'); return; }
          d.name = trimmed;
          await saveDecks();
          draw();
          showToast('Deck renamed — updates everywhere it was used automatically');
        };
      });
      body.querySelectorAll('[data-toggle]').forEach(btn=>{
        btn.onclick = async ()=>{
          const d = decks.find(x=>x.id===btn.dataset.toggle);
          if(!d) return;
          d.active = !d.active;
          await saveDecks();
          draw();
          showToast(d.active ? 'Deck marked current' : 'Deck retired');
        };
      });
      body.querySelectorAll('[data-delete]').forEach(btn=>{
        btn.onclick = async ()=>{
          if(!confirm('Delete this deck? Past results logged with it will show as "Deleted deck" instead of losing their win/loss data.')) return;
          decks = decks.filter(x=>x.id!==btn.dataset.delete);
          await saveDecks();
          draw();
          showToast('Deck deleted');
        };
      });
      body.querySelector('#closeDecks').onclick = ()=>overlay.remove();
    }
    draw();
  }

    overlay.querySelector('#connectGoogleBtn').onclick = ()=>connectGoogleCalendar(()=>{ overlay.remove(); openAccountModal(); });
    overlay.querySelector('#logoutBtn').onclick = async ()=>{ await supabaseClient.auth.signOut(); overlay.remove(); };
    overlay.querySelector('#useLocationBtn').onclick = ()=>{
      if(!navigator.geolocation){ showToast('Geolocation is not available on this device'); return; }
      navigator.geolocation.getCurrentPosition(
        (pos)=>{ profile._pendingLat = pos.coords.latitude; profile._pendingLng = pos.coords.longitude; showToast('Location captured — tap Save profile'); },
        ()=>showToast('Could not get your location')
      );
    };
    overlay.querySelector('#saveProfileBtn').onclick = async ()=>{
      let username = overlay.querySelector('#acc_username').value.trim().replace(/^@/,'');
      if(username && !/^[a-zA-Z0-9_]{3,24}$/.test(username)){
        showToast('Usernames are 3-24 characters: letters, numbers, underscores only');
        return;
      }
      const display_name = overlay.querySelector('#acc_name').value.trim();
      const home_city = overlay.querySelector('#acc_city').value.trim();
      let home_lat = profile._pendingLat != null ? profile._pendingLat : profile.home_lat;
      let home_lng = profile._pendingLng != null ? profile._pendingLng : profile.home_lng;
      if((home_lat == null || home_lng == null) && home_city){
        const geo = await geocode(home_city);
        if(geo){ home_lat = geo.lat; home_lng = geo.lng; }
      }
      try{
        const { error } = await supabaseClient.from('profiles').update({ username: username || null, display_name, home_city, home_lat, home_lng }).eq('id', session.user.id);
        if(error){
          showToast(error.code === '23505' ? 'That username is taken — try another' : 'Could not save profile');
          return;
        }
        profile = Object.assign({}, profile, { username, display_name, home_city, home_lat, home_lng });
        showToast('Profile saved');
        overlay.remove();
      }catch(e){ showToast('Could not save profile'); }
    };
  }

  // ---------- Single-event share link ----------
  async function shareEventLink(t, date){
    const code = shareCode();
    const payload = {
      createdAt: Date.now(),
      events: [{
        name: t.name, game: t.game, store: t.store, date, time: t.time, format: t.format,
        fee: t.fee, address: t.address, link: t.link
      }]
    };
    try{
      await supabaseClient.from('kv_store').upsert({ key: 'share:'+code, value: payload, updated_at: new Date().toISOString() });
      const url = window.location.origin + window.location.pathname + '?share=' + code;
      const ok = copyText(url);
      showToast(ok ? 'Link copied — send it to a friend' : ('Could not copy — here\'s the link: ' + url));
    }catch(e){ showToast('Could not create a share link'); }
  }

  async function openSharedEventModal(code){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `<div class="modal"><h2>Shared with you</h2><div id="sharedBody"><div class="modal-sub">Loading…</div></div></div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
    const body = overlay.querySelector('#sharedBody');
    try{
      const { data } = await supabaseClient.from('kv_store').select('value').eq('key', 'share:'+code).maybeSingle();
      const payload = data ? data.value : null;
      if(!payload || !payload.events || payload.events.length===0){
        body.innerHTML = `<div class="modal-sub">This link has expired or doesn't exist.</div>
          <div class="modal-actions"><button class="btn-secondary" id="closeShared" style="flex:1;">Close</button></div>`;
        body.querySelector('#closeShared').onclick = ()=>overlay.remove();
        return;
      }
      body.innerHTML = payload.events.map((e,idx)=>`
        <div class="list-item">
          <div class="info"><div class="n">${escapeHtml(e.name)}</div>
          <div class="m">${fmtFriendly(e.date, e.time)}${e.store ? ' · '+escapeHtml(e.store) : ''}</div></div>
          <button class="mini-btn" data-idx="${idx}">Add to mine</button>
        </div>`).join('') +
        `<div class="modal-actions"><button class="btn-secondary" id="closeShared" style="flex:1;">Close</button></div>`;
      body.querySelectorAll('[data-idx]').forEach(btn=>{
        btn.onclick = async ()=>{
          const e = payload.events[parseInt(btn.dataset.idx,10)];
          if(isDuplicateEvent(e)){
            showToast('You already have this event');
            btn.textContent = 'Already have it';
            btn.disabled = true;
            return;
          }
          tournaments.push({
            id: uid(), name: e.name, game: e.game||'', store: e.store||'', date: e.date, time: e.time||'',
            repeat:'none', format: e.format||'', fee: e.fee||'', address: e.address||'', city:'', link: e.link||'',
            notes:'', rsvp:null, result:null, occurrences:{}, lat:null, lng:null, googleEventId:null,
            readOnly: true
          });
          await saveTournaments();
          render();
          showToast('Added to your calendar');
          btn.textContent = 'Added ✓';
          btn.disabled = true;
        };
      });
      body.querySelector('#closeShared').onclick = ()=>overlay.remove();
    }catch(e){
      body.innerHTML = `<div class="modal-sub">Could not load this shared link.</div>
        <div class="modal-actions"><button class="btn-secondary" id="closeShared" style="flex:1;">Close</button></div>`;
      body.querySelector('#closeShared').onclick = ()=>overlay.remove();
    }
  }

  function openInviteModal(t, date){

    overlay.className = 'overlay';
    const friendRows = friendsAccepted.map(f=>`
      <div class="list-item">
        <div class="info"><div class="n">${escapeHtml(friendLabel(f.userId))}</div>${friendSubLabel(f.userId) ? `<div class="m">${escapeHtml(friendSubLabel(f.userId))}</div>` : ''}</div>
        <button class="mini-btn" data-friend="${f.userId}">Invite</button>
      </div>`).join('');
    overlay.innerHTML = `
      <div class="modal">
        <h2>Invite a friend</h2>
        <div class="modal-sub">${escapeHtml(t.name)} · ${fmtFriendly(date, t.time)}</div>
        ${friendsAccepted.length ? friendRows : `<div class="modal-sub">You don't have any friends added yet — add one first from the Friends button.</div>`}
        <div class="modal-actions"><button class="btn-secondary" id="closeInvite" style="flex:1;">Close</button></div>
