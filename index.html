<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Pairings — TCG Tournament Tracker</title>

<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#100e1a"/>
<link rel="icon" href="/favicon-32.png" sizes="32x32"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Pairings"/>

<!-- A <link> (with preconnect) instead of a CSS @import: the browser starts
     fetching the fonts immediately rather than only after the stylesheet has
     been downloaded and parsed. -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap"/>

<style>
  :root{
    --void:#100e1a;
    --panel:#181528;
    --panel-2:#1f1b33;
    --line:#2c2745;
    --field-border:#726a96;   /* form-field outline: 3.3:1 on the panels (WCAG non-text contrast needs 3:1; --line is 1.3:1) */
    --text:#eeeaf7;
    --text-dim:#a49bc4;
    --rift:#8b5cf6;
    --rift-2:#c084fc;
    --teal:#2dd9c1;
    --amber:#f5b656;
    --rose:#f0678a;
    --gold:#ffd166;
    --radius:14px;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(139,92,246,0.16), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(45,217,193,0.10), transparent 55%),
      var(--void);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 90px;}

  /* ---------- Header ---------- */
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand .mark{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;letter-spacing:-0.02em;
    background:linear-gradient(90deg,var(--rift-2),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand .sub{color:var(--text-dim);font-size:12.5px;}
  .head-actions{display:flex;gap:6px;flex-wrap:wrap;}

  .btn{border:none;border-radius:10px;cursor:pointer;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13.5px;min-height:40px;}
  .add-btn{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;padding:9px 14px;box-shadow:0 6px 18px rgba(139,92,246,0.35);white-space:nowrap;}
  .add-btn:hover{filter:brightness(1.08);}
  .icon-pill{background:var(--panel);border:1px solid var(--line) !important;color:var(--text);padding:9px 12px;position:relative;white-space:nowrap;}
  .icon-pill:hover{border-color:var(--teal) !important;}
  .btn:active{transform:translateY(1px);}
  .bell-badge{position:absolute;top:-5px;right:-5px;background:var(--rose);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 5px;min-width:16px;text-align:center;line-height:1.4;}

  /* ---------- Hero / next-up ring ---------- */
  .hero{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,var(--panel),var(--panel-2));
    border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:20px;position:relative;overflow:hidden;}
  .hero::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;
    background:radial-gradient(circle,rgba(139,92,246,0.25),transparent 70%);}
  .ring{flex:none;position:relative;width:70px;height:70px;}
  .ring svg{transform:rotate(-90deg);}
  .ring .bg{stroke:rgba(255,255,255,0.08);}
  .ring .fg{stroke:url(#ringGrad);stroke-linecap:round;transition:stroke-dashoffset .5s ease;}
  .ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;}
  .hero-info{flex:1;min-width:0;}
  .hero-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--teal);font-weight:600;margin-bottom:3px;}
  .hero-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hero-meta{color:var(--text-dim);font-size:12.5px;margin-top:2px;}
  .hero-empty{color:var(--text-dim);font-size:13.5px;}

  /* ---------- Quick links ---------- */
  .quick-links{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
  .pg-menu-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;
    border:none;border-bottom:1px solid var(--line);color:var(--text);font-family:inherit;font-size:14px;
    padding:12px 2px;cursor:pointer;}
  .pg-menu-row:last-of-type{border-bottom:none;}
  .pg-menu-row:hover{color:var(--teal);}
  .qlink{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
    color:var(--text-dim);text-decoration:none;font-size:12px;padding:7px 11px;border-radius:9px;}
  .qlink:hover{border-color:var(--rift);color:var(--text);}

  /* ---------- Toolbar ---------- */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center;}
  .search{flex:1;min-width:140px;background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:9px 12px;color:var(--text);font-size:14px;}
  .search::placeholder{color:var(--text-dim);}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--text-dim);
    padding:7px 11px;border-radius:20px;font-size:12px;cursor:pointer;white-space:nowrap;}
  .chip.active{background:rgba(139,92,246,0.18);border-color:var(--rift);color:var(--rift-2);}
  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-left:auto;}
  .seg button{background:none;border:none;color:var(--text-dim);padding:8px 12px;font-size:12px;cursor:pointer;}
  .seg button.active{background:var(--panel-2);color:var(--text);}

  /* ---------- List ---------- */
  .month-label{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12.5px;color:var(--text-dim);
    text-transform:uppercase;letter-spacing:.08em;margin:20px 0 10px;}
  .card{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px;margin-bottom:10px;position:relative;}
  .card.past{opacity:0.6;}
  .date-block{flex:none;width:50px;height:50px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;position:relative;}
  .date-block .dow{font-size:9.5px;color:var(--teal);text-transform:uppercase;}
  .date-block .dom{font-size:18px;font-weight:600;line-height:1.1;}
  .date-block .game-icon{position:absolute;top:-7px;left:-7px;font-size:13px;background:var(--panel);border:1px solid var(--line);
    border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;}
  .card-body{flex:1;min-width:0;}
  .card-top{display:flex;justify-content:space-between;gap:8px;}
  .card-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14.5px;}
  .card-actions{display:flex;gap:2px;flex:none;}
  .icon-btn{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:14px;padding:5px 6px;border-radius:6px;min-height:32px;min-width:32px;}
  .icon-btn:hover{color:var(--text);background:var(--panel-2);}
  .card-meta{color:var(--text-dim);font-size:12px;margin-top:3px;display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center;}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:3px 8px;border-radius:20px;font-weight:600;}
  .badge.format{background:rgba(139,92,246,0.16);color:var(--rift-2);}
  .badge.game{background:rgba(45,217,193,0.16);color:var(--teal);}
  .badge.fee{background:rgba(245,182,86,0.16);color:var(--amber);}
  .badge.repeat{background:rgba(45,217,193,0.14);color:var(--teal);}
  .badge.result{background:rgba(255,209,102,0.16);color:var(--gold);}
  .rsvp-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .rsvp-btn{font-size:11px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--text-dim);cursor:pointer;min-height:32px;}
  .rsvp-btn.going.active{background:rgba(45,217,193,0.18);border-color:var(--teal);color:var(--teal);}
  .rsvp-btn.maybe.active{background:rgba(245,182,86,0.18);border-color:var(--amber);color:var(--amber);}
  .rsvp-btn.skip.active{background:rgba(240,103,138,0.18);border-color:var(--rose);color:var(--rose);}
  .result-btn{font-size:11px;padding:6px 10px;border-radius:8px;border:1px dashed var(--line);background:none;color:var(--text-dim);cursor:pointer;min-height:32px;}
  .result-btn:hover{border-color:var(--gold);color:var(--gold);}
  .card-notes{font-size:12px;color:var(--text-dim);margin-top:8px;white-space:pre-wrap;}
  .card-links{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px;}
  .card-link{font-size:11.5px;color:var(--teal);text-decoration:none;}
  .card-link.gold{color:var(--gold);}

  .empty-state{text-align:center;padding:44px 18px;color:var(--text-dim);border:1px dashed var(--line);border-radius:16px;}
  .empty-state .big{font-family:'Space Grotesk',sans-serif;font-size:16px;color:var(--text);margin-bottom:6px;font-weight:700;}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(8,7,14,0.72);backdrop-filter:blur(3px);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;padding-top:env(safe-area-inset-top);}
  @media(min-width:640px){.overlay{align-items:center;}}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;
    width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom));
    position:relative;}
  /* Always-reachable close button — stays pinned as the modal scrolls, so
     long modals don't require scrolling to the bottom to get out. */
  .modal-x{position:sticky;top:0;float:right;z-index:5;background:var(--panel-2);border:1px solid var(--line);
    color:var(--text-dim);font-size:18px;line-height:1;cursor:pointer;border-radius:50%;
    width:32px;height:32px;display:flex;align-items:center;justify-content:center;margin:-4px -4px 0 0;}
  .modal-x:hover{color:var(--text);border-color:var(--rose);}
  @media(min-width:640px){.modal{border-radius:18px;}}
  .modal h2{font-family:'Space Grotesk',sans-serif;margin:0 0 4px;font-size:17px;}
  .modal .modal-sub{color:var(--text-dim);font-size:12px;margin-bottom:14px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:5px;font-weight:600;}
  .field input,.field select,.field textarea{width:100%;background:var(--panel-2);border:1px solid var(--field-border);border-radius:8px;
    padding:10px 11px;color:var(--text);font-size:16px;font-family:inherit;}
  .field textarea{resize:vertical;min-height:60px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:420px){.row2{grid-template-columns:1fr;}}
  .paste-box{background:var(--panel-2);border:1px dashed var(--rift);border-radius:10px;padding:12px;margin-bottom:16px;}
  .paste-box .lbl{font-size:12px;font-weight:700;color:var(--rift-2);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
  .paste-box textarea{width:100%;min-height:64px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
    color:var(--text);padding:9px;font-size:13px;font-family:inherit;}
  .parse-btn{margin-top:8px;background:var(--rift);color:#fff;border:none;border-radius:7px;padding:8px 13px;font-size:12.5px;font-weight:700;cursor:pointer;min-height:36px;}
  .modal-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .btn-primary{flex:1;min-width:120px;background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;border:none;border-radius:9px;padding:12px;font-weight:700;font-family:'Space Grotesk',sans-serif;cursor:pointer;min-height:44px;}
  .btn-secondary{background:var(--panel-2);color:var(--text-dim);border:1px solid var(--line);border-radius:9px;padding:12px 16px;cursor:pointer;min-height:44px;}
  .btn-danger{background:none;color:var(--rose);border:1px solid rgba(240,103,138,0.4);border-radius:9px;padding:12px 16px;cursor:pointer;min-height:44px;}
  .hint{font-size:11px;color:var(--text-dim);margin-top:4px;line-height:1.5;}

  .tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--panel-2);padding:4px;border-radius:10px;}
  .tabs button{flex:1;background:none;border:none;color:var(--text-dim);padding:9px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;min-height:38px;}
  .tabs button.active{background:var(--panel);color:var(--text);}

  .share-code-display{background:var(--panel-2);border:1px solid var(--rift);border-radius:10px;padding:16px;text-align:center;margin-top:14px;}
  .share-code-display .code{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;letter-spacing:.1em;color:var(--rift-2);}
  .list-item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel-2);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px;}
  .list-item .info{min-width:0;}
  .list-item .n{font-weight:700;font-family:'Space Grotesk',sans-serif;font-size:13px;}
  .list-item .m{color:var(--text-dim);font-size:11.5px;}
  .mini-btn{font-size:11px;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:7px;cursor:pointer;white-space:nowrap;min-height:34px;}
  .mini-btn:hover{border-color:var(--teal);}
  .mini-btn.accept{border-color:var(--teal);color:var(--teal);}
  .mini-btn.decline{border-color:var(--rose);color:var(--rose);}
  .section-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);font-weight:700;margin:16px 0 8px;}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
  .stat-card{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:14px;}
  .stat-card .val{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;background:linear-gradient(90deg,var(--rift-2),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .stat-card .lbl{font-size:11px;color:var(--text-dim);margin-top:2px;}
  .bar-row{margin-bottom:10px;}
  .bar-row .bar-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;}
  .bar-row .bar-top .bn{font-weight:600;}
  .bar-row .bar-top .bc{color:var(--text-dim);}
  .bar-track{background:var(--panel-2);border-radius:6px;height:8px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--rift),var(--teal));border-radius:6px;}
  .result-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .result-row:last-child{border-bottom:none;}
  .result-row .n{font-weight:600;font-family:'Space Grotesk',sans-serif;}
  .result-row .m{color:var(--text-dim);font-size:11px;}
  .result-row .p{color:var(--gold);font-weight:600;white-space:nowrap;}

  .notif-item{padding:11px 4px;border-bottom:1px solid var(--line);font-size:13px;}
  .notif-item.unread{background:rgba(139,92,246,0.08);border-radius:8px;padding:11px 8px;}
  .notif-item .t{color:var(--text-dim);font-size:11px;margin-top:3px;}

  /* ---------- Auth screen ---------- */
  .auth-wrap{max-width:380px;margin:12vh auto 0;padding:0 16px;}
  .auth-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 20px;}
  .auth-card h1{font-family:'Space Grotesk',sans-serif;font-size:26px;margin:0 0 4px;
    background:linear-gradient(90deg,var(--rift-2),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .auth-sub{color:var(--text-dim);font-size:13px;margin-bottom:20px;}
  .auth-toggle{text-align:center;margin-top:14px;font-size:13px;color:var(--text-dim);}
  .auth-toggle a{color:var(--teal);cursor:pointer;text-decoration:underline;}

  .trend-chart{margin:4px 0 12px;}
  .matrix-wrap{overflow-x:auto;margin:4px 0 6px;border:1px solid var(--border, rgba(255,255,255,.14));border-radius:10px;}
  .matrix{border-collapse:collapse;font-size:12px;width:100%;}
  .matrix th,.matrix td{padding:6px 8px;border:1px solid var(--border, rgba(255,255,255,.10));text-align:center;white-space:nowrap;}
  .matrix thead th{max-width:96px;overflow:hidden;text-overflow:ellipsis;font-weight:600;}
  .matrix tbody th{text-align:left;max-width:120px;overflow:hidden;text-overflow:ellipsis;font-weight:600;position:sticky;left:0;background:var(--panel, #161a2b);}
  .matrix .mx-rec{font-weight:600;} .matrix .mx-pct{font-size:11px;opacity:.8;} .matrix .mx-empty{opacity:.4;}
  /* Keyboard focus must be visible. The teal ring is 9:1 on the panels. */
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
  .field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible{outline-offset:0;}
  .modal:focus{outline:none;}   /* the dialog itself takes focus only so it is announced */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important;}
  }
  .sync-pill{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:60;max-width:calc(100vw - 32px);
    background:var(--panel-2);color:var(--text);border:1px solid var(--border, rgba(255,255,255,.18));
    border-radius:999px;padding:6px 14px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.35);text-align:center;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel-2);
    border:1px solid var(--line);color:var(--text);padding:10px 18px;border-radius:20px;font-size:13px;z-index:70;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);max-width:90vw;text-align:center;}

  @media(max-width:420px){
    .brand .mark{font-size:20px;}
    .icon-pill, .add-btn{padding:8px 10px;font-size:12.5px;}
    .hero-title{font-size:14.5px;}
    .card{padding:11px;gap:10px;}
    .date-block{width:44px;height:44px;}
  }
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<!--
  ============================================================
  SETUP REQUIRED — see SETUP.md for the full walkthrough.
  Your actual Supabase/Google credentials live in config.js, a separate
  file next to this one — NOT in this file. That way, whenever you get an
  updated pairings.html, you just drop it in and config.js stays untouched.
  ============================================================
-->
<!-- Pinned to an exact version with a Subresource Integrity hash, so a CDN
     compromise or surprise upgrade can't change what runs in the app. To
     upgrade: change the version, then regenerate the hash with
     curl -s <url> | openssl dgst -sha384 -binary | openssl base64 -A -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
<script src="/config.js"></script>
<script>
(function(){
  const CFG = window.PAIRINGS_CONFIG || {};
  const SUPABASE_URL = CFG.SUPABASE_URL || 'YOUR_SUPABASE_URL';
  const SUPABASE_ANON_KEY = CFG.SUPABASE_ANON_KEY || 'YOUR_SUPABASE_ANON_KEY';
  const VAPID_PUBLIC_KEY = CFG.VAPID_PUBLIC_KEY || 'BOZU4eZ0JCuAnFXlLzsjUJ1gUYaXLD_LLnJ032FRE7SZVA1VtHg1Qz6tKoKdldRsiiVrbzH4UUxAcqO9F_EU3_o';
  const GOOGLE_CLIENT_ID = CFG.GOOGLE_CLIENT_ID || 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com';
  const DONATION_URL = CFG.DONATION_URL || '';
  const APP_VERSION = '1.12.0'; // bumped each time this file is updated — check this in Account to confirm a deploy actually landed
  const TURNZERO_URL = 'https://turn-zero-nine.vercel.app/';

  const configured = SUPABASE_URL.startsWith('http') && SUPABASE_ANON_KEY.length > 20;
  const app = document.getElementById('app');

  if(!configured){
    app.innerHTML = `
      <div class="auth-wrap" style="max-width:520px;">
        <div class="auth-card">
          <h1>⚙️ One setup step</h1>

  // Shared avatar upload. `folder` is the first path segment, which the
  // storage policies use to decide who's allowed to write.
  // Lets the user frame their photo before upload — drag to reposition,
  // slider to zoom. Outputs a square JPEG, which also keeps file sizes
  // predictable regardless of what they started with.
  function openImageCropper(file, onDone){
    const SIZE = 400; // output resolution
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const overlay = document.createElement('div');
        overlay.className = 'overlay';
        overlay.innerHTML = `
          <div class="modal" style="max-width:380px;text-align:center;">
            <h2>${tr('cropTitle')}</h2>
            <div class="modal-sub">${tr('cropHint')}</div>
            <div id="cropStage" style="position:relative;width:280px;height:280px;margin:0 auto 14px;
              border-radius:50%;overflow:hidden;background:var(--panel-2);border:2px solid var(--line);cursor:grab;touch-action:none;">
              <canvas id="cropCanvas" width="280" height="280" style="display:block;"></canvas>
            </div>
            <div class="field">
              <label>${tr('cropZoom')}</label>
              <input type="range" id="cropZoom" min="100" max="300" value="100" style="width:100%;"/>
            </div>
            <div class="modal-actions">
              <button class="btn-secondary" id="cropCancel" style="flex:1;">${tr('cancel')}</button>
              <button class="btn-primary" id="cropSave" style="flex:1;">${tr('cropUse')}</button>
            </div>
          </div>`;
        document.body.appendChild(overlay);

        const canvas = overlay.querySelector('#cropCanvas');
        const ctx = canvas.getContext('2d');
        const stage = overlay.querySelector('#cropStage');
        const zoomEl = overlay.querySelector('#cropZoom');

        // Start with the image scaled to just cover the circle.
        const baseScale = Math.max(280/img.width, 280/img.height);
        let zoom = 1, offX = 0, offY = 0;

        function clampOffsets(){
          const w = img.width * baseScale * zoom;
          const h = img.height * baseScale * zoom;
          const maxX = Math.max(0, (w - 280)/2);
          const maxY = Math.max(0, (h - 280)/2);
          offX = Math.max(-maxX, Math.min(maxX, offX));
          offY = Math.max(-maxY, Math.min(maxY, offY));
        }
        function draw(){
          clampOffsets();
          const w = img.width * baseScale * zoom;
          const h = img.height * baseScale * zoom;
          ctx.clearRect(0,0,280,280);
          ctx.drawImage(img, (280-w)/2 + offX, (280-h)/2 + offY, w, h);
        }
        draw();

        zoomEl.oninput = ()=>{ zoom = parseInt(zoomEl.value,10)/100; draw(); };

        // Drag to reposition (mouse + touch via pointer events).
        let dragging = false, lastX = 0, lastY = 0;
        stage.addEventListener('pointerdown', (e)=>{
          dragging = true; lastX = e.clientX; lastY = e.clientY;
          stage.style.cursor = 'grabbing';
          stage.setPointerCapture(e.pointerId);
        });
        stage.addEventListener('pointermove', (e)=>{
          if(!dragging) return;
          offX += e.clientX - lastX; offY += e.clientY - lastY;
          lastX = e.clientX; lastY = e.clientY;
          draw();
        });
        const endDrag = ()=>{ dragging = false; stage.style.cursor = 'grab'; };
        stage.addEventListener('pointerup', endDrag);
        stage.addEventListener('pointercancel', endDrag);

        overlay.querySelector('#cropCancel').onclick = ()=>overlay.remove();
        overlay.querySelector('#cropSave').onclick = ()=>{
          // Re-render at output resolution so the saved image isn't limited
          // to the 280px preview size.
          const out = document.createElement('canvas');
          out.width = SIZE; out.height = SIZE;
          const octx = out.getContext('2d');
          const ratio = SIZE/280;
          const w = img.width * baseScale * zoom * ratio;
          const h = img.height * baseScale * zoom * ratio;
          octx.drawImage(img, (SIZE-w)/2 + offX*ratio, (SIZE-h)/2 + offY*ratio, w, h);
          out.toBlob((blob)=>{
            overlay.remove();
            if(!blob){ showToast(tr('xCouldNotProcessThatImage')); return; }
            onDone(new File([blob], 'avatar.jpg', { type:'image/jpeg' }));
          }, 'image/jpeg', 0.9);
        };
      };
      img.onerror = ()=>showToast(tr('xCouldNotReadThatImage'));
      img.src = reader.result;
    };
    reader.onerror = ()=>showToast(tr('xCouldNotReadThatFile'));
    reader.readAsDataURL(file);
  }

  async function uploadAvatar(file, folder){
    if(!file) return null;

    try{
      const ext = (file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
      const path = `${folder}/${Date.now()}.${ext}`;
      const { error } = await supabaseClient.storage.from('avatars').upload(path, file, { upsert:true, contentType:file.type });
      if(error) throw error;
      const { data } = supabaseClient.storage.from('avatars').getPublicUrl(path);

  // Share codes are write-once rows in kv_store (see the "kv insert share

  async function createShareRow(payload){
    for(let i = 0; i < 5; i++){
      const code = shareCode();
      const { error } = await supabaseClient.from('kv_store').insert({ key: 'share:' + code, value: payload });
      if(!error) return code;

  // if the database doesn't have it yet, falls back to a direct select.
  // Links inside are re-validated here because the payload is written by
  // someone else and ends up in the viewer's own event list.
  async function fetchSharePayload(code){
    let payload = null;
    const { data, error } = await supabaseClient.rpc('get_share_payload', { p_code: code });
    if(!error){
      payload = data;
    } else if(error.code === 'PGRST202' || error.code === '42883'){
      const r = await supabaseClient.from('kv_store').select('value').eq('key', 'share:' + code).maybeSingle();
      payload = r.data ? r.data.value : null;
