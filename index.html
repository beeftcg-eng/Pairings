  }
  function gcalQuickLink(t, date){
    const timing = eventTiming(t);
    let start, end, zone = '';
    if(timing){
      ({ start, end } = timedRangeCompact(date, timing));
      const tz = userTimeZone(); if(tz) zone = '&ctz=' + encodeURIComponent(tz);
    } else {
      start = date.replace(/-/g,'');
      const nd = new Date(date+'T00:00:00'); nd.setDate(nd.getDate()+1);
      end = dateToStr(nd).replace(/-/g,'');
    }
    const text = encodeURIComponent(timing ? t.name : t.name + (t.time ? ' — ' + t.time : ''));
    const details = encodeURIComponent([t.fee?(tr('entryLabel')+' '+t.fee):'', t.notes, t.link].filter(Boolean).join('\n\n'));
    const location = encodeURIComponent(t.address || t.store || '');
    return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${text}&dates=${start}/${end}${zone}&details=${details}&location=${location}`;
  }

  // Works with Apple Calendar, Outlook, and any other app that accepts .ics files —
  // the universal fallback for anyone not using Google Calendar sync.
  function icsEscape(s){
    return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  }
  function downloadIcs(t, date){
    // Timed events use "floating" local times (no zone), so they show at the same clock
    // time wherever the file is opened; all-day events use dates, as before.
    const timing = eventTiming(t);
    let dtStart, dtEnd;
    if(timing){
      const r = timedRangeCompact(date, timing);
      dtStart = 'DTSTART:' + r.start; dtEnd = 'DTEND:' + r.end;
    } else {
      const nd = new Date(date+'T00:00:00'); nd.setDate(nd.getDate()+1);
      dtStart = 'DTSTART;VALUE=DATE:' + date.replace(/-/g,'');
      dtEnd = 'DTEND;VALUE=DATE:' + dateToStr(nd).replace(/-/g,'');
    }
    const stamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
    const uidStr = (t.id||uid()) + '-' + date + '@pairings';
    const summary = timing ? t.name : t.name + (t.time ? ' — ' + t.time : '');
    const description = [t.fee?(tr('entryLabel')+' '+t.fee):'', t.notes, t.link].filter(Boolean).join('\n\n');
    const location = t.address || t.store || '';
    const lines = [
      'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Pairings//EN','CALSCALE:GREGORIAN',
      'BEGIN:VEVENT',
      'UID:' + uidStr,
      'DTSTAMP:' + stamp,
      dtStart,
      dtEnd,
      'SUMMARY:' + icsEscape(summary),
      'DESCRIPTION:' + icsEscape(description),
      'LOCATION:' + icsEscape(location),
      'END:VEVENT','END:VCALENDAR'
    ];
    const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (t.name || 'event').replace(/[^a-z0-9]+/gi, '_').slice(0,60) + '.ics';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }

  // ---------- Smart paste parser ----------
  function parsePastedText(text){
    const result = {};
    const monthNames = 'January|February|March|April|May|June|July|August|September|October|November|December|Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec';
    const monthMap = {jan:0,january:0,feb:1,february:1,mar:2,march:2,apr:3,april:3,may:4,jun:5,june:5,jul:6,july:6,aug:7,august:7,sep:8,sept:8,september:8,oct:9,october:9,nov:10,november:10,dec:11,december:11};
    let m = text.match(new RegExp('(' + monthNames + ')\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?,?\\s*(\\d{4})?','i'));
    if(m){
      const mon = monthMap[m[1].toLowerCase()];
      const day = parseInt(m[2],10);
      let year = m[3] ? parseInt(m[3],10) : new Date().getFullYear();
      let d = new Date(year, mon, day);
      const now = new Date(); now.setHours(0,0,0,0);
      if(!m[3] && d < now){ d = new Date(year+1, mon, day); }
      result.date = dateToStr(d);
    } else {
      m = text.match(/\b(\d{1,2})\/(\d{1,2})\/(\d{2,4})\b/);
      if(m){
        let yr = m[3].length===2 ? '20'+m[3] : m[3];
        result.date = yr+'-'+String(m[1]).padStart(2,'0')+'-'+String(m[2]).padStart(2,'0');
      }
    }
    let tm = text.match(/\b(\d{1,2}):(\d{2})\s?(am|pm|AM|PM)\b/) || text.match(/\b(\d{1,2})\s?(am|pm|AM|PM)\b/);
    if(tm){
      if(tm.length===4){ result.time = tm[1]+':'+tm[2]+' '+tm[3].toUpperCase(); }
      else { result.time = tm[1]+':00 '+tm[2].toUpperCase(); }
    }
    let pr = text.match(/\$\s?(\d+(?:\.\d{2})?)/);
    if(pr){ result.fee = '$' + pr[1]; }
    else if(/\bfree\b/i.test(text)){ result.fee = 'Free'; }
    for(const f of FORMATS){
      if(new RegExp(f.replace(/\s+/g,'\\s+'),'i').test(text)){ result.format = f; break; }
    }
    const gamePatterns = [
      [/one\s*piece/i, 'One Piece Card Game'],
      [/riftbound/i, 'Riftbound'],
      [/magic:?\s*the\s*gathering|\bmtg\b/i, 'Magic: The Gathering'],
      [/pok[eé]mon/i, 'Pokémon TCG'],
      [/yu-?gi-?oh/i, 'Yu-Gi-Oh!'],
      [/digimon/i, 'Digimon Card Game'],
      [/flesh\s*and\s*blood/i, 'Flesh and Blood'],
      [/lorcana/i, 'Disney Lorcana'],
      [/star\s*wars.*unlimited/i, 'Star Wars: Unlimited']
    ];
    for(const [re, name] of gamePatterns){
      if(re.test(text)){ result.game = name; break; }
    }
    if(/\b(every week|weekly|each week)\b/i.test(text)) result.repeat = 'weekly';
    else if(/\b(every other week|biweekly|every 2 weeks)\b/i.test(text)) result.repeat = 'biweekly';
    else if(/\b(monthly|every month)\b/i.test(text)) result.repeat = 'monthly';
    const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
    const storeGuess = lines.find(l => /(games?|cards?|comics?|hobby|hobbies|collect|lgs|shop)\b/i.test(l) && l.length < 60);
    if(storeGuess) result.store = storeGuess;
    const nameGuess = lines.find(l => l !== storeGuess && l.length > 4 && l.length < 80);
    if(nameGuess) result.name = nameGuess;
    result.notes = text.trim();
    return result;
  }

  function splitIntoEventBlocks(text){
    // First try: blocks separated by one or more blank lines (common when copying a page's event list)
    let blocks = text.split(/\n\s*\n+/).map(b=>b.trim()).filter(Boolean);
    if(blocks.length > 1) return blocks;

    // Fallback: split right before each date-like mention
    const monthNames = 'January|February|March|April|May|June|July|August|September|October|November|December|Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec';
    const dateRe = new RegExp('(' + monthNames + ')\\.?\\s+\\d{1,2}(?:st|nd|rd|th)?,?\\s*\\d{0,4}', 'gi');
    const indices = [];
    let m;
    while((m = dateRe.exec(text))){ indices.push(m.index); }
    if(indices.length <= 1) return [text.trim()];
    const chunks = [];
    for(let i=0;i<indices.length;i++){
      const start = indices[i];
      const end = i+1<indices.length ? indices[i+1] : text.length;
      chunks.push(text.slice(start, end).trim());
    }
    return chunks.filter(Boolean);
  }

  // ---------- Build display instances ----------
  function buildInstances(){
    const today = new Date();
    const windowStart = dateToStr(new Date(today.getFullYear(), today.getMonth(), today.getDate()-120));
    const windowEnd = dateToStr(new Date(today.getFullYear(), today.getMonth(), today.getDate()+180));
    const instances = [];
    tournaments.forEach(t=>{
      getOccurrenceDates(t, windowStart, windowEnd).forEach(date=>{
        const occ = getOcc(t, date);
        if(occ.skip) return;
        instances.push({ t, date, rsvp: occ.rsvp, result: occ.result, googleEventId: occ.googleEventId });
      });
    });
    return instances;
  }

  function parseRecord(record){
    if(!record) return null;
    const m = String(record).match(/(\d+)\s*-\s*(\d+)(?:\s*-\s*(\d+))?/);
    if(!m) return null;
    return { w: parseInt(m[1],10), l: parseInt(m[2],10), d: m[3] ? parseInt(m[3],10) : 0 };
  }

  // opts.deckId limits everything to results logged with that deck, and opts.version (with deckId)
  // to one version of it; opts.minMatchupGames is how many games an opponent needs before it can
  // top "what you beat / lose to" (2 by default, so one fluke doesn't; a single deck has fewer games).
  function computeStats(tournamentsArr, decksArr, gameFilter, sinceDate, opts){
    tournamentsArr = tournamentsArr || tournaments;
    decksArr = decksArr || decks;
    opts = opts || {};
    const minMatchupGames = opts.minMatchupGames || 2;
    const attendedSet = new Set();
    const formatCounts = {};
    const storeCounts = {};
    const gameCounts = {};
    const placementCounts = {};
    const matchupStats = {};
    const deckStats = {};
    const leaderStats = {};  // your leader/legend (One Piece, Riftbound): the result's, else its deck's
    const allResults = [];
    const trendRows = [];    // finished events with a readable record: feeds the monthly trend and streaks
    const matchRows = [];    // individual matches with an opponent: feeds the deck-vs-opponent matrix
    let totalWins = 0, totalLosses = 0, totalDraws = 0;
    const opponentSpelling = {};
    const turnOrder = { first: {w:0,l:0,d:0}, second: {w:0,l:0,d:0} };  // match results by who went first

    function accumulate(t, date, occ){
      if(occ.skip) return;
      if(sinceDate && date < sinceDate) return;
      // A testing session played with several decks or games counts each round under its own
      // (resultPieces); the filters below keep only the pieces asked for.
      const pieces = (occ.result ? resultPieces(t, occ.result, decksArr) : [{ game: t.game || '', result: null }]).filter(p=>{
        if(gameFilter && p.game !== gameFilter) return false;
        if(opts.deckId){
          if(!p.result || p.result.deckId !== opts.deckId) return false;
          if(opts.version && resultDeckVersion(p.result, decksArr.find(x=>x.id===opts.deckId), date) !== opts.version) return false;
        }
        return true;
      });
      if(!pieces.length) return;
      if(occ.rsvp === 'going' || occ.result){
        attendedSet.add(t.id + '::' + date);
        if(t.format) formatCounts[t.format] = (formatCounts[t.format]||0) + 1;
        if(t.store) storeCounts[t.store] = (storeCounts[t.store]||0) + 1;
        [...new Set(pieces.map(p=>p.game).filter(Boolean))].forEach(g=>{ gameCounts[g] = (gameCounts[g]||0) + 1; });
      }
      if(!occ.result) return;
      allResults.push({ name: t.name, store: t.store, date, result: occ.result });
      if(occ.result.placement){
        placementCounts[occ.result.placement] = (placementCounts[occ.result.placement]||0) + 1;
      }
      const eventRec = { w:0, l:0, d:0 };
      let eventHasRec = false;
      pieces.forEach(({ game, result })=>{
        const rec = parseRecord(result.record);
        if(rec){
          totalWins += rec.w; totalLosses += rec.l; totalDraws += rec.d;
          eventRec.w += rec.w; eventRec.l += rec.l; eventRec.d += rec.d; eventHasRec = true;
        }
        const deckKey = result.deckId ? ('id:'+result.deckId) : (result.deck ? ('legacy:'+result.deck.trim()) : null);
        if(deckKey && rec){
          deckStats[deckKey] = deckStats[deckKey] || {w:0,l:0,d:0};
          deckStats[deckKey].w += rec.w; deckStats[deckKey].l += rec.l; deckStats[deckKey].d += rec.d;
        }
        const leaderName = leaderGameKey(game)
          ? (result.leader || (result.deckId ? deckLeaderName(decksArr.find(x=>x.id===result.deckId)) : '')) : '';
        if(leaderName && rec){
          const ls = leaderStats[leaderName] = leaderStats[leaderName] || {w:0,l:0,d:0};
          ls.w += rec.w; ls.l += rec.l; ls.d += rec.d;
        }
        (result.matches||[]).forEach(m=>{
          const side = m.wentFirst === 'yes' ? turnOrder.first : (m.wentFirst === 'no' ? turnOrder.second : null);
          if(side && m.outcome){
            if(m.outcome === 'W') side.w++; else if(m.outcome === 'L') side.l++; else if(m.outcome === 'D') side.d++;
          }
          const typed = (m.opponent||'').trim();
          if(!typed || !m.outcome) return;
          // Opponents are typed by hand: "mitsurugi" and "Mitsurugi " are one opponent, shown as first typed.
          const key = opponentSpelling[typed.toLowerCase()] = opponentSpelling[typed.toLowerCase()] || typed;
          if(deckKey) matchRows.push({ deckKey, opponent: key, outcome: m.outcome });
          matchupStats[key] = matchupStats[key] || {w:0,l:0,d:0};
          if(m.outcome==='W') matchupStats[key].w++;
          else if(m.outcome==='L') matchupStats[key].l++;
          else if(m.outcome==='D') matchupStats[key].d++;
        });
      });
      // An event still in progress has a partial record; it would distort a trend or a streak.
      if(eventHasRec && !occ.result.inProgress) trendRows.push({ date, name: t.name, ...eventRec });
    }

    tournamentsArr.forEach(t=>{
      if(!isRepeating(t)){
        accumulate(t, t.date, { rsvp: t.rsvp||null, result: t.result||null, skip:false });
      } else {
        Object.keys(t.occurrences||{}).forEach(date=>{
          const o = t.occurrences[date] || {};
          accumulate(t, date, { rsvp: o.rsvp||null, result: o.result||null, skip: !!o.skip });
        });
      }
    });

    const withRate = rec => ({ ...rec, total: rec.w+rec.l+rec.d, winRate: (rec.w+rec.l) > 0 ? Math.round((rec.w/(rec.w+rec.l))*100) : null });
    const decidedGames = totalWins + totalLosses;
    const winRate = decidedGames > 0 ? Math.round((totalWins/decidedGames) * 100) : null;
    const topN = (obj, n) => Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,n);

    const matchupEntries = Object.entries(matchupStats)
      .map(([name, rec]) => ({
        name, ...rec, total: rec.w+rec.l+rec.d,
        winRate: (rec.w+rec.l) > 0 ? Math.round((rec.w/(rec.w+rec.l))*100) : null
      }));
    const matchups = matchupEntries.slice().sort((a,b)=>b.total-a.total).slice(0, 8);
    // "What you lose to the most" — ranked by loss count first, then by worst win rate,
    // and only among matchups with at least 2 games so one fluke loss doesn't top the list.
    const toughestMatchups = matchupEntries.filter(m=>m.total>=minMatchupGames && m.l > 0)
      .sort((a,b)=> b.l - a.l || (a.winRate||0) - (b.winRate||0))
      .slice(0, 5);
    // "What you beat the most" — the mirror: ranked by win count first, then best win rate.
    const bestMatchups = matchupEntries.filter(m=>m.total>=minMatchupGames && m.w > 0)
      .sort((a,b)=> b.w - a.w || (b.winRate||0) - (a.winRate||0))
      .slice(0, 5);

    function resolveDeckKeyName(key){
      if(key.startsWith('id:')){
        const d = decksArr.find(x=>x.id===key.slice(3));
        return d ? d.name : tr('deletedDeck');
      }
      return key.slice('legacy:'.length);
    }
    function deckStatusForKey(key){
      if(key.startsWith('id:')){
        const d = decksArr.find(x=>x.id===key.slice(3));
        if(!d) return 'other';
        return d.active ? 'current' : 'past';
      }
      return 'other'; // legacy free-text entries aren't tracked as current/past decks
    }
    const deckEntries = Object.entries(deckStats).map(([key, rec]) => ({
      name: resolveDeckKeyName(key), status: deckStatusForKey(key), ...rec,
      deckId: key.startsWith('id:') && decksArr.some(x=>x.id===key.slice(3)) ? key.slice(3) : null,
      total: rec.w+rec.l+rec.d,
      winRate: (rec.w+rec.l) > 0 ? Math.round((rec.w/(rec.w+rec.l))*100) : null
    })).sort((a,b)=>b.total-a.total);
    const leaderWinRates = Object.entries(leaderStats).map(([name, rec]) => ({
      name, ...rec, total: rec.w+rec.l+rec.d,
      winRate: (rec.w+rec.l) > 0 ? Math.round((rec.w/(rec.w+rec.l))*100) : null
    })).sort((a,b)=>b.total-a.total).slice(0,8);
    const deckWinRates = {
      current: deckEntries.filter(d=>d.status==='current').slice(0,8),
      past: deckEntries.filter(d=>d.status==='past').slice(0,8),
      other: deckEntries.filter(d=>d.status==='other').slice(0,8)
    };

    // Win rate by calendar month (from event records), oldest first, at most the last 12 months.
    const monthly = {};
    trendRows.forEach(r=>{
      const k = r.date.slice(0, 7);
      const m = monthly[k] = monthly[k] || { w:0, l:0, d:0 };
      m.w += r.w; m.l += r.l; m.d += r.d;
    });
    const timeline = Object.keys(monthly).sort().slice(-12).map(k=>{
      const m = monthly[k], decided = m.w + m.l;
      return { month: k, ...m, total: decided + m.d, winRate: decided > 0 ? Math.round((m.w / decided) * 100) : null };
    }).filter(m=>m.winRate != null);

    // Streaks over events, oldest first. An event is a win if it has more wins than losses, a
    // loss if more losses than wins, otherwise even (which ends a winning streak).
    const eventKind = r => r.w > r.l ? 'W' : (r.l > r.w ? 'L' : 'D');
    const ordered = trendRows.slice().sort((a,b)=> a.date.localeCompare(b.date) || String(a.name).localeCompare(String(b.name)));
    let bestWin = 0, run = 0;
    ordered.forEach(r=>{ if(eventKind(r) === 'W'){ run++; bestWin = Math.max(bestWin, run); } else run = 0; });
    let currentType = null, currentLength = 0;
    if(ordered.length){
      currentType = eventKind(ordered[ordered.length - 1]);
      for(let i = ordered.length - 1; i >= 0 && eventKind(ordered[i]) === currentType; i--) currentLength++;
    }
    const streaks = { events: ordered.length, currentType, currentLength, bestWin };

    // Your decks (rows) against what you played (columns): the six decks and eight opponents
    // with the most games, each cell a win-loss-draw count.
    const cellMap = {}, deckGames = {}, oppGames = {};
    matchRows.forEach(m=>{
      const name = resolveDeckKeyName(m.deckKey);
      const c = (cellMap[name] = cellMap[name] || {})[m.opponent] = (cellMap[name][m.opponent] || {w:0,l:0,d:0});
      if(m.outcome === 'W') c.w++; else if(m.outcome === 'L') c.l++; else if(m.outcome === 'D') c.d++;
      deckGames[name] = (deckGames[name] || 0) + 1;
      oppGames[m.opponent] = (oppGames[m.opponent] || 0) + 1;
    });
    const rank = obj => Object.keys(obj).sort((a,b)=> obj[b] - obj[a] || a.localeCompare(b));
    const matrix = { decks: rank(deckGames).slice(0, 6), opponents: rank(oppGames).slice(0, 8), cells: cellMap };

    return {
      timeline, streaks, matrix,
      attended: attendedSet.size,
      resultsLogged: allResults.length,
      totalWins, totalLosses, totalDraws, winRate,
      topFormats: topN(formatCounts, 5),
      topStores: topN(storeCounts, 5),
      topGames: topN(gameCounts, 5),
      topPlacements: topN(placementCounts, 5),
      matchups,
      toughestMatchups,
      bestMatchups,
      deckWinRates,
      leaderWinRates,
      allMatchups: matchupEntries.slice().sort((a,b)=>b.total-a.total || a.name.localeCompare(b.name)),
      goingFirst: withRate(turnOrder.first),
      goingSecond: withRate(turnOrder.second),
      recentResults: allResults.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10),
      maxFormatCount: Math.max(1, ...Object.values(formatCounts), 1),
      maxStoreCount: Math.max(1, ...Object.values(storeCounts), 1),
      maxGameCount: Math.max(1, ...Object.values(gameCounts), 1)
    };
  }

  // Free stand-in for Supabase's paid "leaked password protection": checks a new password
  // against Have I Been Pwned's breached-password list with its k-anonymity API. Only the
  // first 5 characters of the password's SHA-1 are sent (padded responses, so even the size
  // of the answer says nothing); the match happens on the device. If the service can't be
  // reached, the password is allowed, so an outage never blocks sign-up.
  async function isBreachedPassword(pw){
    try{
      if(!window.crypto || !crypto.subtle) return false;
      const buf = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(pw));
      const hex = [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('').toUpperCase();
      const res = await fetch('https://api.pwnedpasswords.com/range/' + hex.slice(0,5), { headers: { 'Add-Padding': 'true' } });
      if(!res.ok) return false;
      const suffix = hex.slice(5);
      return (await res.text()).split('\n').some(line => {
        const [h, count] = line.trim().split(':');
        return h === suffix && Number(count) > 0;   // padding rows have a count of 0
      });
    }catch(_){ return false; }
  }
  // Shared rules for any new password: at least 8 characters, and not from a known breach.
  async function newPasswordProblem(pw){
    if(pw.length < 8) return tr('passwordTooShort');
    if(await isBreachedPassword(pw)) return tr('passwordBreached');
    return null;
  }

    };
    app.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ viewMode=b.dataset.view; render(); });
    app.querySelectorAll('.chip[data-format]').forEach(c=>c.onclick=()=>{ filterFormat=c.dataset.format; render(); });
    app.querySelectorAll('.chip[data-game]').forEach(c=>c.onclick=()=>{ filterGame=c.dataset.game; render(); });
    app.querySelectorAll('.edit-btn').forEach(b=>b.onclick=()=>openModal(b.dataset.id));
    app.querySelectorAll('.del-btn').forEach(b=>b.onclick=()=>handleDelete(b.dataset.id, b.dataset.date));

    app.querySelectorAll('[data-action="logresult"]').forEach(b=>b.onclick=()=>openResultModal(b.dataset.id,b.dataset.date));
    app.querySelectorAll('[data-action="gsync"]').forEach(b=>b.onclick=(e)=>{ e.preventDefault(); const t=tournaments.find(x=>x.id===b.dataset.id); if(t) syncEventToGoogle(t, b.dataset.date); });
    app.querySelectorAll('[data-action="resultcard"]').forEach(b=>b.onclick=(e)=>{
      e.preventDefault();
      const t = tournaments.find(x=>x.id===b.dataset.id);
      const occ = t && getOcc(t, b.dataset.date);
      if(occ && occ.result) openResultCardModal(t, b.dataset.date, occ.result);
    });
    app.querySelectorAll('[data-action="shareevent"]').forEach(b=>b.onclick=(e)=>{ e.preventDefault(); const t=tournaments.find(x=>x.id===b.dataset.id); if(t) shareEventLink(t, b.dataset.date); });
    app.querySelectorAll('[data-action="inviteevent"]').forEach(b=>b.onclick=(e)=>{ e.preventDefault(); const t=tournaments.find(x=>x.id===b.dataset.id); if(t) openInviteModal(t, b.dataset.date); });
    app.querySelectorAll('[data-action="downloadics"]').forEach(b=>b.onclick=(e)=>{ e.preventDefault(); const t=tournaments.find(x=>x.id===b.dataset.id); if(t) downloadIcs(t, b.dataset.date); });
  }

  async function toggleRsvp(id, date, val){
    const t = tournaments.find(x=>x.id===id);
    if(!t) return;
    const cur = getOcc(t, date).rsvp;
    setOcc(t, date, { rsvp: cur === val ? null : val });
    render(); // reflect the tap immediately — don't make the button wait on the network
    await saveTournaments();
    await syncAttendance(t, date);
  }

  function handleDelete(id, date){
    const t = tournaments.find(x=>x.id===id);
    if(!t) return;
    if(t.storeEventId){
      if(!confirm(trf('confirmUnfollowCopy', { store: t.store }))) return;
      (async ()=>{
        try{
          await supabaseClient.from('store_follows').delete().eq('user_id', session.user.id).eq('store_id', t.storeId);
          await syncFollowedStoreEvents();
          render();
          showToast(tr('xUnfollowed') + t.store);
        }catch(e){ showToast(tr('xCouldNotUnfollow')); }
      })();
      return;
    }
    if(!isRepeating(t)){
      if(!confirm(tr('xDeleteThisTournament'))) return;
      markDeleted('tournaments', id);
      tournaments = tournaments.filter(x=>x.id!==id);
      saveTournaments(); render();
      showToast(tr('xDeleted'));
      return;
    }
    openChoiceDialog({
      title: tr('removeTournamentTitle'),
      message: trf('removeSeriesMsg', { name: t.name, label: (REPEATS.find(r=>r.v===t.repeat)||{}).l || '' }),
      choices: [
        { label: trf('justThisDate', { date: fmtFriendly(date) }), action: ()=>{ setOcc(t, date, {skip:true}); saveTournaments(); render(); showToast(tr('xThatDateRemoved')); } },
        { label: tr('entireSeries'), danger:true, action: ()=>{ markDeleted('tournaments', id); tournaments = tournaments.filter(x=>x.id!==id); saveTournaments(); render(); showToast(tr('xSeriesDeleted')); } }
      ]
    });
  }

  // ---------- Result modal ----------
  // opts.draft: an event that isn't in `tournaments` yet (from "Log a result" on the Stats page).
  // It's only added when a result is saved, so backing out leaves nothing behind.
  // opts.onSaved runs after a save instead of nothing (the Stats page uses it to refresh).
  function openResultModal(id, date, opts){
    opts = opts || {};
    const t = opts.draft || tournaments.find(x=>x.id===id);
    if(!t) return;
    const occ = getOcc(t, date);
    // opts.prefill: a result to start from when there is none yet (a finished bracket's rounds).
    const r = occ.result || opts.prefill || { placement:'', record:'', notes:'', deckId:'', deck:'', matches:[] };
    let matches = (r.matches || []).map(m=>({...m}));
    const leaderKey = leaderGameKey(t.game);
    const leaderOptionsHtml = list => (leaderKey ? leaderSuggestions(leaderKey, list) : opponentSuggestions(t.game)).map(l=>`<option value="${escapeAttr(l)}">`).join('');
    const legendDatalist = `<datalist id="legendOptions">${leaderOptionsHtml()}</datalist>`;
    const leaderWord = leaderKey === 'riftbound' ? tr('yourLegend') : tr('yourLeader');
    // Testing sessions and casual play can switch decks and games between rounds: each round can
    // name its own deck (any game) and game (resultPieces counts them apart). The deck above is
    // the event game's, for the rounds that don't.
    const perRound = !!t.isCasual;
    const byActive = (a,b)=>(b.active?1:0)-(a.active?1:0);
    const matchingDecks = decks.filter(d => !t.game || !d.game || d.game === t.game).sort(byActive);
    const currentDeckId = r.deckId || '';
    const initialLeader = r.leader || deckLeaderName(decks.find(d=>d.id===currentDeckId));

    const isInProgress = occ.result && occ.result.inProgress;
    const hasAnyResult = !!occ.result;
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <div class="modal" style="max-width:480px;">
        <h2>${hasAnyResult ? (isInProgress ? tr('updateRoundsTitle') : tr('editYourResult')) : tr('logYourResult')}</h2>
        <div class="modal-sub">${escapeHtml(t.name)} · ${fmtFriendly(date, t.time)}</div>
        <div class="hint" style="margin-bottom:14px;">${tr('xYouCanLogRoundsAs')}</div>
        <div class="row2">
          <div class="field"><label>${tr('xPlacement')}</label><input id="r_placement" value="${escapeAttr(r.placement)}" placeholder="${escapeAttr(tr('xEG1stTop8'))}"/></div>
          <div class="field"><label>${tr('overallRecord')}</label><input id="r_record" value="${escapeAttr(r.record)}" placeholder="e.g. 3-1"/></div>
        </div>
        <div class="field">
          <label>${tr('xYourDeck')}</label>
          <select id="r_deckSelect">
            <option value="">${tr('xNoDeckSelected')}</option>
            ${matchingDecks.map(d=>`<option value="${d.id}" ${currentDeckId===d.id?'selected':''}>${escapeHtml(d.name)}${d.active?'':' ' + tr('retiredSuffix')}</option>`).join('')}
            <option value="__new__">${tr('xAddANewDeck')}</option>
          </select>
          <div id="newDeckInline" style="display:none;margin-top:8px;">
            <input id="newDeckNameInline" placeholder="${escapeAttr(tr('deckName'))}" ${leaderKey?'list="legendOptions"':''}/>
            <button class="mini-btn" id="createDeckInlineBtn" type="button" style="margin-top:6px;">${tr('xCreateSelect')}</button>
          </div>
          ${!r.deckId && r.deck ? `<div class="hint">${trf('freeTextDeckHint', { deck: escapeHtml(r.deck) })}</div>` : ''}
        </div>
        <div class="field" id="deckVersionField" style="display:none;"><label>${tr('deckVersionLabel')}</label><select id="r_deckVersion"></select></div>
        ${leaderKey ? `<div class="field"><label>${leaderWord}</label><input id="r_leader" list="legendOptions" value="${escapeAttr(initialLeader)}" placeholder="${escapeAttr(tr('leaderFromDeckPh'))}"/></div>` : ''}
        ${legendDatalist}
        <div class="hint" style="margin:-6px 0 12px;">${tr('xRecordFillsInAutomaticallyFrom')}</div>

        <div class="section-label">${tr('xMatchLog')}</div>
        ${perRound ? `<div class="hint" style="margin:-4px 0 10px;">${tr('perRoundDeckHint')}</div>` : ''}
        <div id="matchRows"></div>
        <button class="mini-btn" id="addMatchBtn" type="button" style="margin-bottom:14px;">${tr('xAddARound')}</button>

        <div class="field"><label>${tr('xNotes')}</label><textarea id="r_notes" placeholder="${escapeAttr(tr('xKeyMatchupsWhatToImprove'))}">${escapeHtml(r.notes)}</textarea></div>
        <div class="modal-actions">
          ${occ.result ? '<button class="btn-danger" id="clearResult" type="button">' + tr('clearResult') + '</button>' : ''}
          <button class="btn-secondary" id="cancelResult" type="button">${tr('cancel')}</button>
        </div>
        <div class="modal-actions" style="margin-top:8px;">
          <button class="btn-secondary" id="saveInProgress" type="button" style="flex:1;">${tr('xSaveProgress')}</button>
          <button class="btn-primary" id="saveResult" type="button" style="flex:1;">${tr('xMarkFinished')}</button>
        </div>
        <div class="hint" style="margin-top:8px;">${tr('xSaveProgressKeepsThisEvent')}</div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
    overlay.querySelector('#cancelResult').onclick = ()=>overlay.remove();

    function recomputeRecordFromMatches(){
      if(matches.length === 0) return;
      let w=0,l=0,d=0;
      matches.forEach(m=>{ if(m.outcome==='W') w++; else if(m.outcome==='L') l++; else if(m.outcome==='D') d++; });
      overlay.querySelector('#r_record').value = d>0 ? `${w}-${l}-${d}` : `${w}-${l}`;
    }

    const inputStyle = 'background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 10px;font-size:13px;';

    // Opponent suggestions for a round's game: the form's own list for the event's game, and one
    // more list per other game a round is played in.
    const extraLists = {};
    function datalistFor(game){
      const g = game || t.game || '';
      if(g === (t.game || '')) return 'legendOptions';
      if(extraLists[g]) return extraLists[g];
      const id = extraLists[g] = 'oppOptions' + Object.keys(extraLists).length;
      const key = leaderGameKey(g);
      const dl = document.createElement('datalist');
      dl.id = id;
      const fillList = list => { dl.innerHTML = (key ? leaderSuggestions(key, list) : opponentSuggestions(g)).map(l=>`<option value="${escapeAttr(l)}">`).join(''); };
      fillList();
      overlay.querySelector('.modal').appendChild(dl);
      if(key) ensureLeaderList(key).then(list=>{ if(overlay.isConnected) fillList(list); });
      return id;
    }
    function roundDeckHtml(m, idx){
      const roundDecks = decks.slice().sort(byActive);
      const games = GAMES.includes(m.game) || !m.game ? GAMES : [m.game, ...GAMES];
      return `
            <div class="row2" style="margin-top:6px;">
              <select data-round-deck="${idx}" aria-label="${escapeAttr(trf('roundDeckLabel', { n: idx+1 }))}" style="${inputStyle}">
                <option value="">${tr('roundDeckSame')}</option>
                ${roundDecks.map(d=>`<option value="${escapeAttr(d.id)}" ${m.deckId===d.id?'selected':''}>${escapeHtml(d.name)}${d.game && d.game !== t.game ? ' · ' + escapeHtml(d.game) : ''}${d.active?'':' ' + tr('retiredSuffix')}</option>`).join('')}
              </select>
              <select data-round-game="${idx}" aria-label="${escapeAttr(trf('roundGameLabel', { n: idx+1 }))}" style="${inputStyle}">
                <option value="">${t.game ? escapeHtml(trf('roundGameSame', { game: t.game })) : tr('roundGameNone')}</option>
                ${games.filter(g => g !== t.game).map(g=>`<option value="${escapeAttr(g)}" ${m.game===g?'selected':''}>${escapeHtml(g)}</option>`).join('')}
              </select>
            </div>`;
    }

    function drawMatches(){
      const rowsEl = overlay.querySelector('#matchRows');
      if(matches.length === 0){
        rowsEl.innerHTML = `<div class="modal-sub" style="margin-bottom:10px;">${tr('xNoRoundsLoggedYetAdd')}</div>`;
        return;
      }
      rowsEl.innerHTML = matches.map((m,idx)=>`
        <div class="list-item" style="align-items:flex-start;flex-wrap:wrap;">
          <div class="info" style="flex:1;min-width:220px;">
            <div class="n" style="margin-bottom:6px;">${trf('roundN', { n: idx+1 })}</div>
            <div class="row2" style="margin-bottom:6px;">
              <input data-m="${idx}" data-f="opponent" value="${escapeAttr(m.opponent||'')}" placeholder="${escapeAttr(tr('xOpponentSDeckLeader'))}" style="${inputStyle}" list="${datalistFor(roundGame(t, m))}"/>
              <select data-m="${idx}" data-f="outcome" style="${inputStyle}">
                <option value="">${tr('xResult')}</option>
                <option value="W" ${m.outcome==='W'?'selected':''}>${tr('xWin')}</option>
                <option value="L" ${m.outcome==='L'?'selected':''}>${tr('xLoss')}</option>
                <option value="D" ${m.outcome==='D'?'selected':''}>${tr('xDraw')}</option>
              </select>
            </div>
            <div class="row2">
              <select data-m="${idx}" data-f="wentFirst" style="${inputStyle}">
                <option value="">${tr('xWentFirst')}</option>
                <option value="yes" ${m.wentFirst==='yes'?'selected':''}>${tr('xIWentFirst')}</option>
                <option value="no" ${m.wentFirst==='no'?'selected':''}>${tr('xIWentSecond')}</option>
              </select>
              <input data-m="${idx}" data-f="notes" value="${escapeAttr(m.notes||'')}" placeholder="${escapeAttr(tr('xNotesOptional'))}" style="${inputStyle}"/>
            </div>
            ${perRound ? roundDeckHtml(m, idx) : ''}
          </div>
          <button class="icon-btn" data-remove-match="${idx}" title="${escapeAttr(tr('xRemoveRound'))}">✕</button>
        </div>`).join('');

      rowsEl.querySelectorAll('[data-m]').forEach(el=>{
        el.oninput = el.onchange = ()=>{
          const idx = parseInt(el.dataset.m,10);
          matches[idx][el.dataset.f] = el.value;
          recomputeRecordFromMatches();
        };
      });
      // A round's deck brings its game (and the version in use on that date) along with it.
      rowsEl.querySelectorAll('[data-round-deck]').forEach(el=>{
        el.onchange = ()=>{
          const m = matches[parseInt(el.dataset.roundDeck,10)];
          const d = decks.find(x=>x.id===el.value);
          m.deckId = d ? d.id : '';
          m.deckVersion = d ? versionForDate(d, date) : '';
          if(d && d.game) m.game = d.game === t.game ? '' : d.game;
          drawMatches();
        };
      });
      rowsEl.querySelectorAll('[data-round-game]').forEach(el=>{
        el.onchange = ()=>{
          matches[parseInt(el.dataset.roundGame,10)].game = el.value;
          drawMatches();
        };
      });
      rowsEl.querySelectorAll('[data-remove-match]').forEach(btn=>{
        btn.onclick = ()=>{
          matches.splice(parseInt(btn.dataset.removeMatch,10), 1);
          drawMatches();
          recomputeRecordFromMatches();
        };
      });
    }
    drawMatches();

    overlay.querySelector('#addMatchBtn').onclick = ()=>{
      matches.push({ opponent:'', outcome:'', wentFirst:'', notes:'' });
      drawMatches();
    };

    const deckSelect = overlay.querySelector('#r_deckSelect');
    const newDeckInline = overlay.querySelector('#newDeckInline');
    // Your leader follows the deck you pick until you type one yourself.
    const leaderInput = overlay.querySelector('#r_leader');
    let leaderTyped = false;
    if(leaderInput) leaderInput.oninput = ()=>{ leaderTyped = true; };
    function followDeckLeader(){
      if(!leaderInput || leaderTyped) return;
      const d = decks.find(x=>x.id===deckSelect.value);
      leaderInput.value = deckLeaderName(d) || (d ? '' : r.leader || '');
    }
    // Which version of the deck this was: shown once a deck has more than one. It starts at the
    // version this result already has, else the one in use on the event's date.
    const versionField = overlay.querySelector('#deckVersionField');
    const versionSelect = overlay.querySelector('#r_deckVersion');
    function drawVersions(){
      const d = decks.find(x=>x.id===deckSelect.value);
      const vs = deckVersions(d);
      if(!d || vs.length < 2){ versionField.style.display = 'none'; versionSelect.innerHTML = ''; return; }
      const pick = d.id === r.deckId ? resultDeckVersion(r, d, date) : versionForDate(d, date);
      versionSelect.innerHTML = vs.slice().reverse().map(v=>`<option value="${v.n}" ${v.n===pick?'selected':''}>${escapeHtml(versionLabel(d, v))}</option>`).join('');
      versionField.style.display = '';
    }
    drawVersions();
    deckSelect.onchange = ()=>{
      newDeckInline.style.display = deckSelect.value === '__new__' ? 'block' : 'none';
      followDeckLeader();
      drawVersions();
    };
    // The full list arrives in the background (cached for two weeks); fill it in when it does.
    if(leaderKey) ensureLeaderList(leaderKey).then(list=>{
      const dl = overlay.querySelector('#legendOptions');
      if(dl && overlay.isConnected) dl.innerHTML = leaderOptionsHtml(list);
    });
    overlay.querySelector('#createDeckInlineBtn').onclick = async ()=>{
      const name = overlay.querySelector('#newDeckNameInline').value.trim();
      if(!name){ showToast(tr('giveDeckName')); return; }
      const newDeck = { id: deckUid(), name, game: t.game||'', notes:'', active:true, createdAt: Date.now() };
      decks.push(newDeck);
      await saveDecks();
      const opt = document.createElement('option');
      opt.value = newDeck.id; opt.textContent = newDeck.name; opt.selected = true;
      deckSelect.insertBefore(opt, deckSelect.lastElementChild);
      newDeckInline.style.display = 'none';
      followDeckLeader();
      showToast(tr('xDeckCreated'));
    };

    if(occ.result){
      overlay.querySelector('#clearResult').onclick = async ()=>{
        setOcc(t, date, { result: null });
        await saveTournaments();
        syncResultLogged(t, date, false);
        overlay.remove(); render();
        showToast(tr('xResultCleared'));
      };
    }
    async function doSave(markInProgress){
      const placement = overlay.querySelector('#r_placement').value.trim();
      const record = overlay.querySelector('#r_record').value.trim();
      const deckId = deckSelect.value && deckSelect.value !== '__new__' ? deckSelect.value : '';
      const notes = overlay.querySelector('#r_notes').value.trim();
      const cleanMatches = matches.filter(m=>m.opponent || m.outcome || m.notes).map(m=>{
        const c = { ...m };
        // Only a casual event's rounds carry their own deck and game, and only when one was picked.
        if(!perRound || !c.deckId){ delete c.deckId; delete c.deckVersion; }
        if(!perRound || !c.game || c.game === t.game) delete c.game;
        return c;
      });
      if(!placement && !record && !deckId && !r.deck && !notes && cleanMatches.length===0){ showToast(tr('xAddAtLeastOneDetail')); return; }
      const leader = leaderInput ? leaderInput.value.trim() : (r.leader || '');
      const resultObj = { placement, record, notes, matches: cleanMatches };
      if(leader) resultObj.leader = leader;
      if(r.bracketId) resultObj.bracketId = r.bracketId;   // came from a bracket: Brackets shows it as logged
      if(deckId) resultObj.deckId = deckId;
      if(deckId){
        const d = decks.find(x=>x.id===deckId);
        const pickedVersion = parseInt(versionSelect.value, 10);
        resultObj.deckVersion = pickedVersion > 0 ? pickedVersion
          : (deckId === r.deckId ? resultDeckVersion(r, d, date) : versionForDate(d, date));
      }
      else if(r.deck) resultObj.deck = r.deck; // keep old free-text entry if you didn't switch it to a tracked deck
      if(markInProgress) resultObj.inProgress = true;
      setOcc(t, date, { result: resultObj });
      trackFeature(opts.draft ? 'quick_log' : 'result_logged');
      if(opts.draft && !tournaments.includes(t)) tournaments.push(t);
      await saveTournaments();
      // A deck you made here (not from Brewhouse, which keeps its own) remembers the leader you
      // gave it, so the next result fills it in.
      const pickedDeck = deckId && decks.find(d=>d.id===deckId);
      if(leader && pickedDeck && !pickedDeck.legend && !pickedDeck.brewhouseDeckId){
        pickedDeck.legend = leader;
        await saveDecks();
      }
      // Only tell the "remind me to log results" job to stop nagging once
      // this is actually finished — an in-progress entry should still get
      // the reminder if it's left unfinished.
      syncResultLogged(t, date, !markInProgress);
      overlay.remove(); render();
      showToast(markInProgress ? tr('xProgressSavedAddMoreRounds') : tr('xResultSaved'));
      if(opts.onSaved) opts.onSaved();
    }
    overlay.querySelector('#saveInProgress').onclick = ()=>doSave(true);
    overlay.querySelector('#saveResult').onclick = ()=>doSave(false);
  }

  // Log a result without an event on the calendar (Stats page): ask for a name (an event, or a
  // testing session, saved as a casual event), game and date, then hand a draft event to the
  // normal result form. The event is created only when that result is saved.
  function openQuickResultModal(onSaved){
    let testing = false;
    const recent = tournaments.filter(x=>x.game && (x.result || Object.values(x.occurrences||{}).some(o=>o && o.result)))
      .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))[0];
    const activeDeck = decks.find(d=>d.active && d.game);
    const defaultGame = recent ? recent.game : (activeDeck ? activeDeck.game : '');
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <div class="modal" style="max-width:440px;">
        <h2>${tr('quickLogTitle')}</h2>
        <div class="hint" style="margin-bottom:14px;">${tr('quickLogHint')}</div>
        <div class="section-label" style="margin-top:0;">${tr('quickLogKindLabel')}</div>
        <div class="chip-row" style="margin-bottom:14px;">
          <button class="chip active" type="button" data-qkind="event" aria-pressed="true">${tr('quickLogKindEvent')}</button>
          <button class="chip" type="button" data-qkind="testing" aria-pressed="false">${tr('quickLogKindTesting')}</button>
        </div>
        <div class="field"><label>${tr('quickLogNameLabel')}</label><input id="q_name" placeholder="${escapeAttr(tr('quickLogNamePh'))}"/></div>
        <div class="row2">
          <div class="field"><label>${tr('game')}</label>
            <input id="q_game" list="quickGameOptions" value="${escapeAttr(defaultGame)}" placeholder="${escapeAttr(tr('xEGOnePieceCard'))}"/>
            <datalist id="quickGameOptions">${GAMES.map(g=>`<option value="${escapeAttr(g)}">`).join('')}</datalist>
          </div>
          <div class="field"><label>${tr('date')}</label><input id="q_date" type="date" value="${todayStr()}"/></div>
        </div>
        <div class="modal-actions">
          <button class="btn-secondary" id="q_cancel" type="button" style="flex:1;">${tr('cancel')}</button>
          <button class="btn-primary" id="q_next" type="button" style="flex:1;">${tr('quickLogNext')}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
    overlay.querySelector('#q_cancel').onclick = ()=>overlay.remove();
    const nameEl = overlay.querySelector('#q_name');
    overlay.querySelectorAll('[data-qkind]').forEach(b=>b.onclick = ()=>{
      testing = b.dataset.qkind === 'testing';
      overlay.querySelectorAll('[data-qkind]').forEach(x=>{
        const on = x === b;
        x.classList.toggle('active', on);
        x.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      // Suggest a name for a testing session, but never overwrite one the user typed.
      const val = nameEl.value.trim();
      if(testing && !val) nameEl.value = tr('quickLogTestingName');
      else if(!testing && val === tr('quickLogTestingName')) nameEl.value = '';
    });
    overlay.querySelector('#q_next').onclick = ()=>{
      const name = nameEl.value.trim();
      const date = overlay.querySelector('#q_date').value;
      if(!name){ showToast(tr('giveEventName')); return; }
      if(!date){ showToast(tr('pickDate')); return; }
      const draft = {
        id: uid(), name, game: overlay.querySelector('#q_game').value.trim(), store:'', date, time:'',
        format:'', fee:'', address:'', city:'', link:'', storeLink:'', deckLink:'', notes:'',
        isCasual: testing, onlineMode:'', simulatorLink:'', contactInfo:'',
        repeat:'none', rsvp:null, result:null, occurrences:{}, lat:null, lng:null, googleEventId:null
      };
      overlay.remove();
      openResultModal(draft.id, date, { draft, onSaved });
    };
    nameEl.focus();
  }

  // ---------- Friends modal ----------
  function openFriendsModal(){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `<div class="modal"><h2>${tr('friends')}</h2><div id="friendsBody"></div></div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };

    function draw(){
      const body = overlay.querySelector('#friendsBody');
      body.innerHTML = `
        <div class="field">
          <label>${tr('addFriendLabel')}</label>
          <div class="hint" style="margin-bottom:6px;">${tr('addFriendHint')}</div>
          <div class="field" style="align-items:center;display:flex;gap:8px;">
            <input id="friendEmail" placeholder="${escapeAttr(tr('friendSearchPlaceholder'))}" style="flex:1;min-width:0;"/>
            <button class="mini-btn" id="sendReqBtn">${tr('send')}</button>
          </div>
        </div>
        ${pendingIncoming.length ? `<div class="section-label">${tr('requestsForYou')}</div>` + pendingIncoming.map(p=>`
          <div class="list-item">
            <div class="info"><div class="n">${escapeHtml(friendLabel(p.userId))}</div><div class="m">${friendSubLabel(p.userId) ? escapeHtml(friendSubLabel(p.userId)) + ' · ' : ''}${tr('wantsFriend')}</div></div>
            <div style="display:flex;gap:6px;">
              <button class="mini-btn accept" data-accept="${p.friendshipId}">${tr('accept')}</button>

          </div>`).join('') : ''}

          <div class="list-item">
            <div class="info"><div class="n">${escapeHtml(friendLabel(p.userId))}</div><div class="m">${friendSubLabel(p.userId) ? escapeHtml(friendSubLabel(p.userId)) + ' · ' : ''}${tr('requestPending')}</div></div>
            <button class="mini-btn decline" data-decline="${p.friendshipId}">${tr('cancelBtn')}</button>
          </div>`).join('') : ''}
        <div class="section-label">${tr('yourFriends')} (${friendsAccepted.length})</div>
        ${friendsAccepted.length ? friendsAccepted.map(p=>`
          <div class="list-item">
            <div class="info"><div class="n">${escapeHtml(friendLabel(p.userId))}</div>${friendSubLabel(p.userId) ? `<div class="m">${escapeHtml(friendSubLabel(p.userId))}</div>` : ''}</div>
            <div style="display:flex;gap:6px;">
              <button class="mini-btn" data-friend-stats="${p.userId}">${tr('stats')}</button>
              <button class="mini-btn decline" data-decline="${p.friendshipId}">${tr('remove')}</button>

          </div>`).join('') : `<div class="modal-sub">${tr('noFriendsYet')}</div>`}
        <div class="modal-actions"><button class="btn-secondary" id="closeFriends" style="flex:1;">${tr('close')}</button></div>
      `;
      body.querySelector('#sendReqBtn').onclick = async ()=>{
        const identifier = body.querySelector('#friendEmail').value;

        const ok = await sendFriendRequest(identifier);
        if(ok) draw();
      };
      body.querySelectorAll('[data-accept]').forEach(b=>b.onclick = async ()=>{ await acceptFriend(b.dataset.accept); draw(); });
      body.querySelectorAll('[data-decline]').forEach(b=>b.onclick = async ()=>{ await removeFriendship(b.dataset.decline); draw(); });
      body.querySelectorAll('[data-friend-stats]').forEach(b=>b.onclick = ()=>{
        openFriendStatsModal(b.dataset.friendStats, friendLabel(b.dataset.friendStats));
      });
      body.querySelector('#closeFriends').onclick = ()=>overlay.remove();
    }
    draw();
  }

  // ---------- Notifications modal ----------
  function openNotificationsModal(){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    // Which notifications can be acted on right here?
    const pendingReqIds = new Set(pendingIncoming.map(p=>p.userId));
    const rows = notifications.length ? notifications.map(n=>{
      const isInvite = n.type === 'event_invite' && n.related_invitation_id;
      const inviteStatus = isInvite ? (invitationStatusById[n.related_invitation_id] || 'pending') : null;
      // A friend request is still actionable only while it's actually pending.
      const isFriendReq = n.type === 'friend_request' && n.related_user_id && pendingReqIds.has(n.related_user_id);
      const friendship = isFriendReq ? pendingIncoming.find(p=>p.userId === n.related_user_id) : null;
      // Anything carrying an event we don't already have can be added directly.
      const canAddEvent = !!n.event_name && !!n.event_date
        && ['friend_going_same','friend_going_near','store_new_event','playgroup_going','playgroup_shared_event'].includes(n.type)
        && !isDuplicateEvent({ name: n.event_name, date: n.event_date, store: '' });
      return `
      <div class="notif-item ${n.read?'':'unread'}">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;">
          <div style="flex:1;">${escapeHtml(localizeNotification(n))}</div>
          <button class="icon-btn" data-del-notif="${n.id}" title="${escapeAttr(tr('delete'))}" aria-label="${escapeAttr(tr('delete'))}" style="flex:none;">✕</button>
        </div>
        <div class="t">${new Date(n.created_at).toLocaleString(dateLocale())}</div>
        ${n.bracket_id && /^bracket_/.test(n.type) ? `
          <div class="rsvp-row" style="margin-top:8px;"><button class="rsvp-btn going" data-notif-bracket="${escapeAttr(n.bracket_id)}">🏆 ${tr('brOpenBracket')}</button></div>` : ''}
        ${isInvite && inviteStatus === 'pending' ? `
          <div class="rsvp-row" style="margin-top:8px;">
            <button class="rsvp-btn going" data-invite-accept="${n.related_invitation_id}" data-notif="${n.id}">${tr('accept')}</button>
            <button class="rsvp-btn skip" data-invite-decline="${n.related_invitation_id}" data-notif="${n.id}">${tr('decline')}</button>
          </div>` : ''}
        ${isFriendReq ? `
          <div class="rsvp-row" style="margin-top:8px;">
            <button class="rsvp-btn going" data-notif-accept-friend="${friendship.friendshipId}">${tr('accept')}</button>
            <button class="rsvp-btn skip" data-notif-decline-friend="${friendship.friendshipId}">${tr('decline')}</button>

  // ---------- Trend, streak and matrix sections (shared by the stats screens) ----------
  function monthLabel(ym){
    try{ return new Date(ym + '-01T00:00:00').toLocaleDateString(dateLocale(), { month: 'short' }); }
    catch(e){ return ym; }
  }
  // Bars of win rate per month. The text alternative lists every value, because a bar chart is
  // no use to a screen reader, and each bar has a tooltip with the record behind it.
  function trendChartHtml(timeline){
    if(!timeline || !timeline.length) return '';
    const W = 320, H = 130, top = 16, bottom = 22, left = 4, right = 4;
    const plotH = H - top - bottom, slot = (W - left - right) / timeline.length, barW = Math.min(34, slot * 0.7);
    const y = pct => top + plotH * (1 - pct / 100);
    const bars = timeline.map((m, i)=>{
      const cx = left + slot * i + slot / 2, h = Math.max(2, plotH * m.winRate / 100);
      const rec = m.w + '-' + m.l + (m.d ? '-' + m.d : '');
      return `<g><title>${escapeHtml(monthLabel(m.month))} ${escapeHtml(m.month.slice(0,4))}: ${m.winRate}% (${rec})</title>
        <rect x="${(cx - barW/2).toFixed(1)}" y="${(top + plotH - h).toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${m.winRate >= 50 ? 'var(--teal)' : 'var(--rose)'}" opacity="0.9"/>
        <text x="${cx.toFixed(1)}" y="${(top + plotH - h - 4).toFixed(1)}" text-anchor="middle" font-size="10" fill="currentColor">${m.winRate}%</text>
        <text x="${cx.toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.7">${escapeHtml(monthLabel(m.month))}</text></g>`;
    }).join('');
    const summary = timeline.map(m=>`${monthLabel(m.month)} ${m.month.slice(0,4)} ${m.winRate}%`).join(', ');
    return `<div class="trend-chart"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${escapeAttr(tr('winRateByMonth') + ': ' + summary)}" style="color:var(--text-dim);display:block;">
        <line x1="${left}" x2="${W - right}" y1="${y(50).toFixed(1)}" y2="${y(50).toFixed(1)}" stroke="currentColor" stroke-dasharray="3 4" opacity="0.5"/>
        ${bars}</svg>
      ${timeline.length < 2 ? `<div class="hint">${tr('trendHint')}</div>` : ''}</div>`;
  }
  function streaksHtml(st){
    if(!st || !st.events) return '';
    const cur = st.currentType === 'W' ? { v: st.currentLength, l: tr('streakWinning') }
              : st.currentType === 'L' ? { v: st.currentLength, l: tr('streakLosing') }
              : { v: '—', l: tr('streakNone') };
    return `<div class="stat-grid">
        <div class="stat-card"><div class="val">${st.currentType === 'W' ? '🔥 ' : ''}${cur.v}</div><div class="lbl">${cur.l}</div></div>
        <div class="stat-card"><div class="val">${st.bestWin || '—'}</div><div class="lbl">${tr('streakBest')}</div></div>
      </div>`;
  }
  // Rows are your decks, columns are the opponents. Colour follows win rate, but every cell also
  // states its numbers, so colour is never the only signal.
  function matrixHtml(mx){
    if(!mx || !mx.decks.length || !mx.opponents.length) return '';
    const cell = (deck, opp)=>{
      const c = (mx.cells[deck] || {})[opp];
      if(!c) return '<td class="mx-empty">·</td>';
      const decided = c.w + c.l, rate = decided ? Math.round(c.w / decided * 100) : null;
      const bg = rate == null ? 'transparent'
        : rate >= 50 ? `color-mix(in srgb,var(--teal) ${Math.round(10 + (rate - 50) / 50 * 40)}%,transparent)`
        : `color-mix(in srgb,var(--rose) ${Math.round(10 + (50 - rate) / 50 * 40)}%,transparent)`;
      const rec = c.w + '-' + c.l + (c.d ? '-' + c.d : '');
      return `<td style="background:${bg};" title="${escapeAttr(deck + ' ' + tr('vs') + ' ' + opp + ': ' + rec + (rate != null ? ' (' + rate + '%)' : ''))}"><div class="mx-rec">${rec}</div>${rate != null ? `<div class="mx-pct">${rate}%</div>` : ''}</td>`;
    };
    return `<div class="matrix-wrap" tabindex="0" role="region" aria-label="${escapeAttr(tr('matchupMatrix'))}">
      <table class="matrix"><thead><tr><th scope="col"></th>${mx.opponents.map(o=>`<th scope="col" title="${escapeAttr(o)}">${escapeHtml(o)}</th>`).join('')}</tr></thead>
      <tbody>${mx.decks.map(d=>`<tr><th scope="row" title="${escapeAttr(d)}">${escapeHtml(d)}</th>${mx.opponents.map(o=>cell(d, o)).join('')}</tr>`).join('')}</tbody></table></div>
      <div class="hint">${tr('matrixHint')}</div>`;
  }

  // ---------- Pieces shared by the stats screens: turn order, matchup rows, opponent list ----------
  const recordText = m => `${m.w}-${m.l}${m.d ? '-' + m.d : ''}`;
  function statRowHtml(m, color, attrs){
    return `
      <div class="result-row" ${attrs || ''}>
        <div>
          <div class="n">${escapeHtml(m.name)}</div>
          <div class="m">${recordText(m)} ${trf(m.total===1?'gamesCount1':'gamesCountN',{n:m.total})}</div>
        </div>
        <div class="p" ${color ? `style="color:var(--${color});"` : ''}>${m.winRate != null ? m.winRate+'%' : '—'}</div>
      </div>`;
  }
  // Win rate going first / second, from rounds where "went first" was filled in.
  function turnOrderHtml(s){
    if(!s.goingFirst.total && !s.goingSecond.total) return '';
    const card = (m, key) => `
      <div class="stat-card">
        <div class="val">${m.winRate != null ? m.winRate + '%' : '—'}</div>
        <div class="lbl">${tr(key)}${m.total ? ' · ' + recordText(m) : ''}</div>
      </div>`;
    return `<div class="section-label">${tr('turnOrder')}</div>
      <div class="stat-grid">${card(s.goingFirst, 'winRateGoingFirst')}${card(s.goingSecond, 'winRateGoingSecond')}</div>
      <div class="hint" style="margin:0 0 6px;">${tr('turnOrderHint')}</div>`;
  }
  // Your record against every opponent deck, most-played first; past ten, the rest fold away.
  function opponentListHtml(list){
    if(!list.length) return '';
    const rowColor = m => m.winRate == null ? '' : (m.winRate >= 50 ? 'teal' : 'rose');
    const rows = list.map(m=>statRowHtml(m, rowColor(m)));
    const shown = rows.slice(0, 10).join('');
    const rest = rows.slice(10);
    return `<div class="section-label">${tr('againstEachDeck')}</div>${shown}${rest.length ? `
      <details class="more-rows"><summary>${trf('showAllN', { n: list.length })}</summary>${rest.join('')}</details>` : ''}`;
  }

  // ---------- Deck stats (one deck, optionally one version of it) ----------
  function openDeckStatsModal(deckId, version){
    const d = decks.find(x=>x.id===deckId);
    if(!d) return;
    const vs = deckVersions(d);
    const s = computeStats(tournaments, decks, null, null, { deckId, version, minMatchupGames: 1 });
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    const chips = vs.length > 1 ? `
      <div class="chip-row" style="margin-bottom:14px;">
        <button class="chip ${!version?'active':''}" type="button" data-dver="" aria-pressed="${!version}">${tr('allVersions')}</button>
        ${vs.map(v=>`<button class="chip ${version===v.n?'active':''}" type="button" data-dver="${v.n}" aria-pressed="${version===v.n}">${trf('versionN', { n: v.n })}</button>`).join('')}
      </div>` : '';
    const byVersion = !version && vs.length > 1 ? `<div class="section-label">${tr('byVersion')}</div>` + vs.slice().reverse().map(v=>{
      const vsStats = computeStats(tournaments, decks, null, null, { deckId, version: v.n });
      const m = { name: versionLabel(d, v), w: vsStats.totalWins, l: vsStats.totalLosses, d: vsStats.totalDraws,
        total: vsStats.totalWins + vsStats.totalLosses + vsStats.totalDraws, winRate: vsStats.winRate };
      return statRowHtml(m, '', `data-dver="${v.n}"`);
    }).join('') : '';
    const current = vs.find(v=>v.n === version);
    const meta = [d.game || tr('noGameSet'), deckLeaderName(d)].filter(Boolean).join(' · ');
    const best = s.bestMatchups.map(m=>statRowHtml(m, 'teal')).join('');
    const tough = s.toughestMatchups.map(m=>statRowHtml(m, 'rose')).join('');
    overlay.innerHTML = `
      <div class="modal">
        <h2>${escapeHtml(d.name)}</h2>
        <div class="modal-sub">${escapeHtml(meta)}${current ? ' · ' + escapeHtml(versionLabel(d, current)) : ''}</div>
        ${chips}
        ${s.resultsLogged ? `
          <div class="stat-grid">
            <div class="stat-card"><div class="val">${s.resultsLogged}</div><div class="lbl">${tr('resultsLogged')}</div></div>
            <div class="stat-card"><div class="val">${s.winRate != null ? s.winRate+'%' : '—'}</div><div class="lbl">${tr('winRate')}</div></div>
            <div class="stat-card"><div class="val">${recordText({ w: s.totalWins, l: s.totalLosses, d: s.totalDraws })}</div><div class="lbl">${tr('overallRecord')}</div></div>
            <div class="stat-card"><div class="val">${currentDeckVersion(d)}</div><div class="lbl">${tr('versionsCount')}</div></div>
          </div>
          ${turnOrderHtml(s)}
          ${byVersion}
          ${best ? `<div class="section-label">${tr('whatYouBeat')}</div>${best}` : ''}
          ${tough ? `<div class="section-label">${tr('whatYouLose')}</div>${tough}` : ''}
          ${opponentListHtml(s.allMatchups)}`
        : `<div class="empty-state"><div>${version ? tr('noResultsThisVersion') : tr('noResultsThisDeck')}</div></div>${byVersion}`}
        <div class="section-label">${tr('deckVersionsTitle')}</div>
        <div class="hint" style="margin-bottom:8px;">${d.brewhouseDeckId ? tr('versionsHintBrewhouse') : tr('versionsHintManual')}</div>
        <div id="newVersionForm" style="display:none;margin-bottom:8px;">
          <input id="newVersionNote" placeholder="${escapeAttr(tr('versionNotePh'))}"/>
          <button class="mini-btn" id="saveNewVersion" type="button" style="margin-top:6px;">${trf('startVersionN', { n: currentDeckVersion(d) + 1 })}</button>
        </div>
        <div class="modal-actions">
          <button class="btn-secondary" id="newVersionBtn" type="button" style="flex:1;">＋ ${tr('newVersionBtn')}</button>
          <button class="btn-secondary" id="closeDeckStats" type="button" style="flex:1;">${tr('close')}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
    overlay.querySelector('#closeDeckStats').onclick = ()=>overlay.remove();
    overlay.querySelectorAll('[data-dver]').forEach(b=>b.onclick = ()=>{
      overlay.remove();
      openDeckStatsModal(deckId, b.dataset.dver ? parseInt(b.dataset.dver, 10) : undefined);
    });
    overlay.querySelector('#newVersionBtn').onclick = ()=>{
      overlay.querySelector('#newVersionForm').style.display = 'block';
      overlay.querySelector('#newVersionNote').focus();
    };
    overlay.querySelector('#saveNewVersion').onclick = async ()=>{
      const note = overlay.querySelector('#newVersionNote').value.trim().slice(0, 120);
      startDeckVersion(d, Object.assign({}, note ? { note } : {}, d.cardCount ? { cardCount: d.cardCount } : {}), true);
      await saveDecks();
      showToast(trf('versionStarted', { n: currentDeckVersion(d) }));
      overlay.remove();
      openDeckStatsModal(deckId);
    };
  }

  // ---------- Per-game detailed stats (opened from the general stats page) ----------
  function openGameStatsModal(game, tournamentsArr, decksArr, ownerLabel){
    const s = computeStats(tournamentsArr, decksArr, game, getStatsRangeCutoff());
    const overlay = document.createElement('div');
    overlay.className = 'overlay';

    const formatBars = s.topFormats.map(([name,count])=>`
      <div class="bar-row">
        <div class="bar-top"><span class="bn">${escapeHtml(name)}</span><span class="bc">${count}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round((count/s.maxFormatCount)*100)}%;"></div></div>
      </div>`).join('');

    const rowOf = m => statRowHtml(m, '');

      <div class="modal">
        <h2>${gameIcon(game)} ${escapeHtml(game)}</h2>
        <div class="modal-sub">${ownerLabel === 'Your' ? tr('yourStatsForGame') : trf('theirStatsForGame', { name: ownerLabel })}</div>

  async function openFriendStatsModal(friendUserId, friendName){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `<div class="modal"><h2>${escapeHtml(trf('friendStatsTitle', { name: friendName }))}</h2><div class="modal-sub">${tr('loadingDots')}</div></div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };

    try{
      const { data: friendProfile } = await supabaseClient.from('profiles').select('share_stats_with_friends').eq('id', friendUserId).maybeSingle();
      if(friendProfile && friendProfile.share_stats_with_friends === false){
        overlay.innerHTML = `<div class="modal"><h2>${escapeHtml(trf('friendStatsTitle', { name: friendName }))}</h2>
          <div class="empty-state"><div class="big">${tr('statsPrivate')}</div><div>${escapeHtml(friendName)} ${tr('statsPrivateBody')}</div></div>
          <div class="modal-actions"><button class="btn-secondary" id="closeFriendStats" style="flex:1;">${tr('close')}</button></div></div>`;
        overlay.querySelector('#closeFriendStats').onclick = ()=>overlay.remove();
        return;
      }
    }catch(e){ /* if this check fails, fall through and let the data fetch below handle it */ }

    let friendTournaments = [], friendDecks = [];
    try{
      const { data, error } = await supabaseClient.from('user_data').select('tournaments, decks').eq('user_id', friendUserId).maybeSingle();
      if(error) throw error;
      friendTournaments = (data && data.tournaments) || [];
      friendDecks = (data && data.decks) || [];
    }catch(e){
      overlay.innerHTML = `<div class="modal"><h2>${escapeHtml(trf('friendStatsTitle', { name: friendName }))}</h2>
        <div class="modal-sub">${tr('friendStatsLoadFail')}</div>
        <div class="modal-actions"><button class="btn-secondary" id="closeFriendStats" style="flex:1;">${tr('close')}</button></div></div>`;
      overlay.querySelector('#closeFriendStats').onclick = ()=>overlay.remove();
      return;
    }

    const s = computeStats(friendTournaments, friendDecks, null, getStatsRangeCutoff());
    if(s.attended === 0 && s.resultsLogged === 0){
      overlay.innerHTML = `<div class="modal"><h2>${escapeHtml(trf('friendStatsTitle', { name: friendName }))}</h2>
        <div class="empty-state"><div class="big">${tr('nothingToShow')}</div><div>${escapeHtml(trf('friendNoResults', { name: friendName }))}</div></div>
        <div class="modal-actions"><button class="btn-secondary" id="closeFriendStats" style="flex:1;">${tr('close')}</button></div></div>`;
      overlay.querySelector('#closeFriendStats').onclick = ()=>overlay.remove();
      return;
    }

    const gameRows = s.topGames.map(([name,count])=>`
      <div class="list-item">
        <div class="info"><div class="n">${gameIcon(name)} ${escapeHtml(name)}</div><div class="m">${trf(count===1?'eventAttended1':'eventsAttendedN',{n:count})}</div></div>
        <button class="mini-btn" data-friend-game-details="${escapeAttr(name)}">${tr('details')}</button>
      </div>`).join('');

    const storeBars = s.topStores.map(([name,count])=>`
      <div class="bar-row">
        <div class="bar-top"><span class="bn">${escapeHtml(name)}</span><span class="bc">${count}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round((count/s.maxStoreCount)*100)}%;"></div></div>
      </div>`).join('');

    const toughRows = s.toughestMatchups.map(m=>`
      <div class="result-row">
        <div>
          <div class="n">${escapeHtml(m.name)}</div>
          <div class="m">${m.w}-${m.l}${m.d?('-'+m.d):''} ${trf(m.total===1?'gamesCount1':'gamesCountN',{n:m.total})}</div>
        </div>
        <div class="p" style="color:var(--rose);">${m.winRate != null ? m.winRate+'%' : '—'}</div>
      </div>`).join('');
    const bestRows = s.bestMatchups.map(m=>`
      <div class="result-row">
        <div>
          <div class="n">${escapeHtml(m.name)}</div>
          <div class="m">${m.w}-${m.l}${m.d?('-'+m.d):''} ${trf(m.total===1?'gamesCount1':'gamesCountN',{n:m.total})}</div>
        </div>
        <div class="p" style="color:var(--teal);">${m.winRate != null ? m.winRate+'%' : '—'}</div>
      </div>`).join('');

    overlay.innerHTML = `
      <div class="modal">
        <h2>${escapeHtml(trf('friendStatsTitle', { name: friendName }))}</h2>
        <div class="stat-grid">
          <div class="stat-card"><div class="val">${s.attended}</div><div class="lbl">${tr('eventsAttended')}</div></div>
          <div class="stat-card"><div class="val">${s.resultsLogged}</div><div class="lbl">${tr('resultsLogged')}</div></div>
          <div class="stat-card"><div class="val">${s.winRate != null ? s.winRate+'%' : '—'}</div><div class="lbl">${tr('winRate')}</div></div>
          <div class="stat-card"><div class="val">${s.totalWins}-${s.totalLosses}${s.totalDraws?('-'+s.totalDraws):''}</div><div class="lbl">${tr('overallRecord')}</div></div>
        </div>

        ${gameRows ? `<div class="section-label">${tr('theyPlayGames')}</div>${gameRows}` : ''}
        ${s.topStores.length ? `<div class="section-label">${tr('theyPlayMost')}</div>${storeBars}` : ''}
        ${bestRows ? `<div class="section-label">${tr('theyBeatMost')}</div>${bestRows}` : ''}
        ${toughRows ? `<div class="section-label">${tr('theyLoseMost')}</div>${toughRows}` : ''}

        <div class="modal-actions"><button class="btn-secondary" id="closeFriendStats" style="flex:1;">${tr('close')}</button></div>
      </div>`;

      b.onclick = ()=>{ overlay.remove(); openGameStatsModal(b.dataset.friendGameDetails, friendTournaments, friendDecks, friendName+"'s"); };

  }

        <div class="modal" style="max-width:420px;text-align:center;">
          <div style="display:flex;justify-content:center;gap:6px;margin-bottom:18px;">
            ${ONBOARDING_STEPS.map((_,i)=>`<div style="width:${i===step?18:6}px;height:6px;border-radius:3px;background:${i===step?'var(--rift)':'var(--line)'};transition:width .2s;"></div>`).join('')}
          </div>
          <h2 style="margin-bottom:10px;">${escapeHtml(s.title)}</h2>
          <div class="modal-sub" style="font-size:14px;line-height:1.6;margin-bottom:22px;">${escapeHtml(s.body)}</div>
          <div class="modal-actions">
            ${step>0 ? '<button class="btn-secondary" id="wBack" style="flex:1;">' + tr('tourBack') + '</button>' : '<button class="btn-secondary" id="wSkip" style="flex:1;">' + tr('tourSkip') + '</button>'}
            <button class="btn-primary" id="wNext" style="flex:1;">${isLast?tr('tourStart'):tr('tourNext')}</button>
          </div>
        </div>`;
      const backOrSkip = overlay.querySelector('#wBack') || overlay.querySelector('#wSkip');
      backOrSkip.onclick = ()=>{ if(step>0){ step--; draw(); } else { finish(); } };
      overlay.querySelector('#wNext').onclick = ()=>{ if(isLast){ finish(); } else { step++; draw(); } };
    }
    draw();
  }

  // Lets a store owner see who's actually RSVP'd "going" to their own
  // event — usernames, not just a count. Only works for events belonging
  // to a store the viewer owns (enforced by the "attendances select store
  // owner" RLS policy — this isn't just a UI-level restriction).
  // ---- Check-in ------------------------------------------------------------------
  // The QR a store shows opens /?checkin=<store event id>. It only works on a day the event
  // actually happens (so a link shared afterwards is useless) and only for the signed-in person
  // themself: it records their own attendance row with checked_in_at, which the store owner can
  // already see (owners may read attendance for their own events).
  async function performCheckin(eventId){
    try{
      const { data: ev, error } = await supabaseClient.from('store_events').select('id, name, date, time, repeat, cancelled, store_id').eq('id', eventId).maybeSingle();
      if(error) throw error;
      if(!ev){ showToast(tr('checkinInvalid')); return false; }
      if(ev.cancelled){ showToast(tr('checkinCancelled')); return false; }
      const today = todayStr();
      // getOccurrenceDates returns a one-off event's own date whatever window it is given, so the
      // date has to be compared, not just counted.
      if(!getOccurrenceDates(ev, today, today).includes(today)){ showToast(tr('checkinWrongDay')); return false; }
      const { data: store } = await supabaseClient.from('stores').select('name').eq('id', ev.store_id).maybeSingle();
      const row = { user_id: session.user.id, occurrence_key: 'store:' + ev.id + '::' + today, event_name: ev.name, event_date: today,
                    time: ev.time || null, store: (store && store.name) || null, checked_in_at: new Date().toISOString() };
      let up = await supabaseClient.from('attendances').upsert(row, { onConflict: 'user_id,occurrence_key' });
      let recorded = true;
      if(up.error && /checked_in_at/.test(up.error.message || '')){
        // Database without the newest SQL: still mark them as going, just without the check-in time.
        delete row.checked_in_at; recorded = false;
        up = await supabaseClient.from('attendances').upsert(row, { onConflict: 'user_id,occurrence_key' });
      }
      if(up.error) throw up.error;
      // Keep their own list in step: a followed copy of this event becomes "going".
      const copy = tournaments.find(x=>x.storeEventId === ev.id);
      if(copy && userDataLoaded){ setOcc(copy, today, { rsvp: 'going' }); saveTournaments(); render(); }
      showToast(tr(recorded ? 'checkedIn' : 'checkedInBasic').replace('{name}', ev.name));
      return true;
    }catch(e){
      console.error('check-in failed:', e);
      showToast(tr('checkinFailed'));
      return false;
    }
  }

  // ---- CSV ------------------------------------------------------------------------
  // A cell that starts with = + - @ (or a tab/CR) is run as a formula by spreadsheet apps, and
  // names come from other people, so those are prefixed with an apostrophe.
  function csvCell(v){
    let x = v == null ? '' : String(v);
    if(/^[=+\-@\t\r]/.test(x)) x = "'" + x;
    return /[",\n\r]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x;
  }
  function toCsv(rows){ return '\ufeff' + rows.map(r=>r.map(csvCell).join(',')).join('\r\n') + '\r\n'; }
  function downloadText(filename, text, type){
    const blob = new Blob([text], { type: type || 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }

  async function openAttendeesModal(storeEventId, eventName){
    const overlay = document.createElement('div');

    const body = overlay.querySelector('#attendeesBody');
    const closeBtn = `<button class="btn-secondary" id="closeAttendees" style="flex:1;">${tr('close')}</button>`;
    try{
      let res = await supabaseClient.from('attendances').select('user_id, occurrence_key, checked_in_at').like('occurrence_key', `store:${storeEventId}::%`);
      if(res.error && /checked_in_at/.test(res.error.message || '')){
        res = await supabaseClient.from('attendances').select('user_id, occurrence_key').like('occurrence_key', `store:${storeEventId}::%`);
      }
      if(res.error) throw res.error;
      const rows = res.data || [];
      const userIds = [...new Set(rows.map(r=>r.user_id))];
      if(userIds.length === 0){
        body.innerHTML = `<div class="modal-sub">${tr('xNoOneHasRsvpD')}</div><div class="modal-actions">${closeBtn}</div>`;
      } else {
        const { data: profiles } = await supabaseClient.from('profiles').select('id, username, display_name').in('id', userIds);
        const who = {}; (profiles || []).forEach(p=>{ who[p.id] = p; });
        const nameOf = id => (who[id] && (who[id].display_name || who[id].username)) || tr('playerWord');
        // occurrence_key is  store:<event id>::<date>
        const byDate = {};
        rows.forEach(r=>{ const d = (r.occurrence_key.split('::')[1] || '').slice(0, 10); (byDate[d] = byDate[d] || []).push(r); });
        const dates = Object.keys(byDate).sort();
        const sections = dates.map(d=>{
          const list = byDate[d].slice().sort((a,b)=> nameOf(a.user_id).localeCompare(nameOf(b.user_id)));
          const here = list.filter(r=>r.checked_in_at).length;
          return `<div class="section-label">${escapeHtml(d ? fmtFriendly(d) : tr('dateUnknown'))} · ${trf('goingCountN', { n: list.length })}${here ? ' · ' + trf('checkedInCountN', { n: here }) : ''}</div>
            ${list.map(r=>{ const p = who[r.user_id] || {}; return `
              <div class="list-item"><div class="info"><div class="n">${escapeHtml(nameOf(r.user_id))}${r.checked_in_at ? ' <span title="' + escapeAttr(tr('checkedInLabel')) + '" aria-label="' + escapeAttr(tr('checkedInLabel')) + '" style="color:var(--teal);">✅</span>' : ''}</div>${p.username ? `<div class="m">@${escapeHtml(p.username)}</div>` : ''}</div></div>`; }).join('')}`;
        }).join('');
        body.innerHTML = `${sections}
          <div class="modal-actions"><button class="btn-secondary" id="downloadAttendees" style="flex:1;">${tr('xDownloadCsv')}</button>${closeBtn}</div>`;
        body.querySelector('#downloadAttendees').onclick = ()=>{
          const table = [[tr('csvDate'), tr('csvName'), tr('csvUsername'), tr('csvCheckedIn'), tr('csvCheckedInAt')]];
          dates.forEach(d=>byDate[d].slice().sort((a,b)=> nameOf(a.user_id).localeCompare(nameOf(b.user_id))).forEach(r=>{
            const p = who[r.user_id] || {};
            table.push([d, nameOf(r.user_id), p.username || '', r.checked_in_at ? tr('yesWord') : tr('noWord'), r.checked_in_at || '']);
          }));
          const slug = String(eventName || 'event').replace(/[^a-z0-9]+/gi, '_').replace(/^_+|_+$/g, '').slice(0, 50) || 'event';
          downloadText('attendees_' + slug + '.csv', toCsv(table));
        };
      }
    }catch(e){
      body.innerHTML = `<div class="modal-sub">${tr('xCouldNotLoadAttendees')}</div><div class="modal-actions">${closeBtn}</div>`;
    }
    overlay.querySelector('#closeAttendees').onclick = ()=>overlay.remove();
  }

        } else {
