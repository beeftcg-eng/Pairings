  async function toggleRsvp(id, date, val){
    const t = tournaments.find(x=>x.id===id);
    if(!t) return;
    const cur = getOcc(t, date).rsvp;
    setOcc(t, date, { rsvp: cur === val ? null : val });
    render(); // reflect the tap immediately — don't make the button wait on the network
    await saveTournaments();
    await syncAttendance(t, date);
  }

  function handleDelete(id, date){
    const t = tournaments.find(x=>x.id===id);
    if(!t) return;
    if(t.storeEventId){
      if(!confirm(trf('confirmUnfollowCopy', { store: t.store }))) return;
      (async ()=>{
        try{
          await supabaseClient.from('store_follows').delete().eq('user_id', session.user.id).eq('store_id', t.storeId);
          await syncFollowedStoreEvents();
          render();
          showToast(tr('xUnfollowed') + t.store);
        }catch(e){ showToast(tr('xCouldNotUnfollow')); }
      })();
      return;
    }
    if(!isRepeating(t)){
      if(!confirm(tr('xDeleteThisTournament'))) return;
      markDeleted('tournaments', id);
      tournaments = tournaments.filter(x=>x.id!==id);
      saveTournaments(); render();
      showToast(tr('xDeleted'));
      return;
    }
    openChoiceDialog({
      title: tr('removeTournamentTitle'),
      message: trf('removeSeriesMsg', { name: t.name, label: (REPEATS.find(r=>r.v===t.repeat)||{}).l || '' }),
      choices: [
        { label: trf('justThisDate', { date: fmtFriendly(date) }), action: ()=>{ setOcc(t, date, {skip:true}); saveTournaments(); render(); showToast(tr('xThatDateRemoved')); } },
        { label: tr('entireSeries'), danger:true, action: ()=>{ markDeleted('tournaments', id); tournaments = tournaments.filter(x=>x.id!==id); saveTournaments(); render(); showToast(tr('xSeriesDeleted')); } }
      ]
    });
  }

  function openChoiceDialog({title, message, choices}){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <div class="modal" style="max-width:400px;">
        <h2>${escapeHtml(title)}</h2>
        <div class="modal-sub">${escapeHtml(message)}</div>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;">
          ${choices.map((c,i)=>`<button class="btn-secondary" data-i="${i}" style="text-align:left;${c.danger?'color:var(--rose);border-color:rgba(240,103,138,0.4);':''}">${escapeHtml(c.label)}</button>`).join('')}
          <button class="btn-secondary" id="cancelChoice" style="text-align:center;">${tr('cancel')}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
    overlay.querySelector('#cancelChoice').onclick = ()=>overlay.remove();
    overlay.querySelectorAll('[data-i]').forEach(b=>{
      b.onclick = ()=>{ overlay.remove(); choices[parseInt(b.dataset.i,10)].action(); };
    });
  }

  // ---------- Add/Edit modal ----------
  function openModal(id){
    const t = id ? tournaments.find(x=>x.id===id) : {
      id: uid(), name:'', game:'', store:'', date:'', time:'', format:'', fee:'', address:'', city:'', link:'', storeLink:'', deckLink:'', notes:'',
      isCasual:false, onlineMode:'', simulatorLink:'', contactInfo:'',
      repeat:'none', rsvp:null, result:null, occurrences:{}, lat:null, lng:null, googleEventId:null
    };
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <div class="modal">
        <h2>${id ? tr('editTournament') : tr('addTournament')}</h2>
        ${id && isRepeating(t) ? `<div class="modal-sub">${tr('changesApplyWhole')}</div>` : ''}
        <div class="paste-box">
          <div class="lbl">${tr('pasteRiftboundLink')}</div>
          <div style="display:flex;gap:8px;">
            <input id="linkFetchInput" placeholder="https://locator.riftbound.uvsgames.com/events/…" style="flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 11px;font-size:13px;"/>
            <button class="parse-btn" id="linkFetchBtn" type="button" style="margin-top:0;white-space:nowrap;">${tr('fetchDetails')}</button>
          </div>
          <div class="hint">${tr('xFillsInDateTimeStore')}</div>
        </div>
        <div class="paste-box">
          <div class="lbl">${tr('pasteFromStore')}</div>
          <textarea id="pasteArea" placeholder="${escapeAttr(tr('xPasteTheEventTextHere'))}"></textarea>
          <button class="parse-btn" id="parseBtn" type="button">${tr('parseAndFill')}</button>
        </div>
        <div class="field"><label>${tr('eventName')}</label><input id="f_name" value="${escapeAttr(t.name)}" placeholder="${escapeAttr(tr('xEGFridayNightSealed'))}"/></div>
        <div class="row2">
          <div class="field"><label>${tr('game')}</label>
            <input id="f_game" list="gameOptions" value="${escapeAttr(t.game||'')}" placeholder="${escapeAttr(tr('xEGOnePieceCard'))}"/>
            <datalist id="gameOptions">${GAMES.map(g=>`<option value="${escapeAttr(g)}">`).join('')}</datalist>
          </div>
          <div class="field"><label>${tr('format')}</label>
            <input id="f_format" list="formatOptions" value="${escapeAttr(t.format||'')}" placeholder="${escapeAttr(tr('xEGStandardSealed'))}"/>
            <datalist id="formatOptions">${FORMATS.map(f=>`<option value="${escapeAttr(f)}">`).join('')}</datalist>
          </div>
        </div>
        <div class="field" style="background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px;">
          <label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
            <input type="checkbox" id="f_iscasual" ${t.isCasual?'checked':''} style="width:18px;height:18px;"/>
            <span>${tr('xCasualTestingSessionNotA')}</span>
          </label>
          <div id="casualFields" style="display:${t.isCasual?'block':'none'};margin-top:10px;">
            <div class="row2">
              <select id="f_onlinemode" aria-label="${escapeAttr(tr('playMode'))}">
                <option value="physical" ${t.onlineMode!=='online'?'selected':''}>${tr('xInPerson')}</option>
                <option value="online" ${t.onlineMode==='online'?'selected':''}>${tr('xOnline')}</option>
              </select>
              <input id="f_contact" value="${escapeAttr(t.contactInfo||'')}" placeholder="${escapeAttr(tr('xContactDiscordWhatsapp'))}"/>
            </div>
            <input id="f_simlink" value="${escapeAttr(t.simulatorLink||'')}" placeholder="${escapeAttr(tr('xSimulatorRoomLinkForOnline'))}" style="margin-top:8px;"/>
            <div class="hint">${tr('xCasualSessionsSkipTheStore')}</div>
          </div>
        </div>
        <div class="row2">
          <div class="field"><label>${tr('storeVenue')}</label><input id="f_store" value="${escapeAttr(t.store)}" placeholder="${escapeAttr(tr('xEGMeepleMountainGames'))}"/></div>
          <div class="field"><label>${tr('cityForNear')}</label><input id="f_city" value="${escapeAttr(t.city||'')}" placeholder="${escapeAttr(tr('xEGAustinTx'))}"/></div>
        </div>
        <div class="field">
          <label>${tr('xStoreSPageOptional')}</label>
          <input id="f_storelink" value="${escapeAttr(t.storeLink||'')}" placeholder="${escapeAttr(tr('xHttpsTheStoreSOwn'))}"/>
          <div class="hint">${tr('xAQuickLinkToThe')}</div>
        </div>
        <div class="row2">
          <div class="field"><label>${isRepeating(t) || !id ? tr('firstDate') : tr('date')}</label><input type="date" id="f_date" value="${escapeAttr(t.date)}"/></div>
          <div class="field"><label>${tr('time')}</label><input id="f_time" value="${escapeAttr(t.time)}" placeholder="${escapeAttr(tr('timeExample'))}"/></div>
        </div>
        <div class="field">
          <label>${tr('repeats')}</label>
          <select id="f_repeat">${REPEATS.map(r=>`<option value="${r.v}" ${t.repeat===r.v?'selected':''}>${escapeHtml(r.l)}</option>`).join('')}</select>
          <div class="hint">${tr('xARepeatingLocalShowsUp')}</div>
        </div>
        <div class="field"><label>${tr('entryFee')}</label><input id="f_fee" value="${escapeAttr(t.fee)}" placeholder="${escapeAttr(tr('feeExample'))}"/></div>
        <div class="field"><label>${tr('address')}</label><input id="f_address" value="${escapeAttr(t.address)}" placeholder="${escapeAttr(tr('xStreetCity'))}"/></div>
        <div class="field"><label>${tr('eventLink')}</label><input id="f_link" value="${escapeAttr(t.link)}" placeholder="https://…"/></div>
        <div class="field">
          <label>${tr('decklistLink')}</label>
          <input id="f_decklink" value="${escapeAttr(t.deckLink||'')}" placeholder="https://piltoverarchive.com/decks/…"/>
          <div class="hint">${tr('xPlayingRiftbound')} <a href="https://piltoverarchive.com/deckbuilder" target="_blank" rel="noopener" style="color:var(--teal);">${tr('xBuildADeckOnPiltover')}</a> ${tr('xThenPasteTheLinkHere')}</div>
        </div>
        <div class="field"><label>${tr('notesLabel')}</label>
          <textarea id="f_notes" placeholder="${escapeAttr(tr('feeDetailExample'))}">${escapeHtml(t.notes)}</textarea>
        </div>
        <div class="modal-actions">
          ${id ? `<button class="btn-danger" id="deleteBtn" type="button">${tr('delete')}</button>` : ''}
          <button class="btn-secondary" id="cancelBtn" type="button">${tr('cancel')}</button>
          <button class="btn-primary" id="saveBtn" type="button">${id?tr('save'):tr('add')}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);

    overlay.querySelector('#linkFetchBtn').onclick = async ()=>{
      const url = overlay.querySelector('#linkFetchInput').value.trim();
      if(!url){ showToast(tr('xPasteARiftboundEventLink')); return; }
      const btn = overlay.querySelector('#linkFetchBtn');
      btn.disabled = true;
      btn.textContent = tr('xFetching');
      try{
        const res = await fetch(FUNCTIONS_URL + '/fetch-event-link', {
          method:'POST',
          headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + session.access_token },
          body: JSON.stringify({ url })
        });
        const p = await res.json();
        if(p.error){ showToast(p.error); return; }
        if(!p.foundAnything){ showToast(tr('xCouldnTFindEventDetails')); return; }
        if(p.date) overlay.querySelector('#f_date').value = p.date;
        if(p.time && !overlay.querySelector('#f_time').value) overlay.querySelector('#f_time').value = p.time;
        if(p.store && !overlay.querySelector('#f_store').value) overlay.querySelector('#f_store').value = p.store;
        if(p.address && !overlay.querySelector('#f_address').value) overlay.querySelector('#f_address').value = p.address;
        if(p.format) overlay.querySelector('#f_format').value = p.format;
        if(p.fee && !overlay.querySelector('#f_fee').value) overlay.querySelector('#f_fee').value = p.fee;
        if(!overlay.querySelector('#f_game').value) overlay.querySelector('#f_game').value = 'Riftbound';
        if(!overlay.querySelector('#f_link').value) overlay.querySelector('#f_link').value = url;
        showToast(tr('xFilledWhatWeCouldFind'));
      }catch(e){ showToast(tr('xCouldNotFetchThatPage')); }
      finally{ btn.disabled = false; btn.textContent = tr('fetchDetails'); }
    };

    overlay.querySelector('#parseBtn').onclick = ()=>{
      const raw = overlay.querySelector('#pasteArea').value;
      if(!raw.trim()){ showToast(tr('xPasteSomeEventTextFirst')); return; }
      const p = parsePastedText(raw);
      if(p.name && !overlay.querySelector('#f_name').value) overlay.querySelector('#f_name').value = p.name;
      if(p.store && !overlay.querySelector('#f_store').value) overlay.querySelector('#f_store').value = p.store;
      if(p.date) overlay.querySelector('#f_date').value = p.date;
      if(p.time && !overlay.querySelector('#f_time').value) overlay.querySelector('#f_time').value = p.time;
      if(p.game && !overlay.querySelector('#f_game').value) overlay.querySelector('#f_game').value = p.game;
      if(p.format) overlay.querySelector('#f_format').value = p.format;
      if(p.fee && !overlay.querySelector('#f_fee').value) overlay.querySelector('#f_fee').value = p.fee;
      if(p.repeat) overlay.querySelector('#f_repeat').value = p.repeat;
      if(p.notes && !overlay.querySelector('#f_notes').value) overlay.querySelector('#f_notes').value = p.notes;
      showToast(tr('xFilledWhatWeCouldFind2'));
    };
    overlay.querySelector('#cancelBtn').onclick = ()=>overlay.remove();
    overlay.querySelector('#f_iscasual').onchange = (e)=>{
      overlay.querySelector('#casualFields').style.display = e.target.checked ? 'block' : 'none';
    };
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
    if(id){ overlay.querySelector('#deleteBtn').onclick = ()=>{ overlay.remove(); handleDelete(id, t.date); }; }

    overlay.querySelector('#saveBtn').onclick = async ()=>{
      const name = overlay.querySelector('#f_name').value.trim();
      if(!name){ showToast(tr('giveEventName')); return; }
      const newCity = overlay.querySelector('#f_city').value.trim();
      const newAddress = overlay.querySelector('#f_address').value.trim();
      const updated = {
        id: t.id, name,
        game: overlay.querySelector('#f_game').value.trim(),
        store: overlay.querySelector('#f_store').value.trim(),
        city: newCity,
        date: overlay.querySelector('#f_date').value,
        time: overlay.querySelector('#f_time').value.trim(),
        repeat: overlay.querySelector('#f_repeat').value,
        format: overlay.querySelector('#f_format').value.trim(),
        fee: overlay.querySelector('#f_fee').value.trim(),
        address: newAddress,
        link: overlay.querySelector('#f_link').value.trim(),
        deckLink: overlay.querySelector('#f_decklink').value.trim(),
        isCasual: overlay.querySelector('#f_iscasual').checked,
        onlineMode: overlay.querySelector('#f_onlinemode').value,
        simulatorLink: overlay.querySelector('#f_simlink').value.trim(),
        contactInfo: overlay.querySelector('#f_contact').value.trim(),
        storeLink: overlay.querySelector('#f_storelink').value.trim(),
        notes: overlay.querySelector('#f_notes').value.trim(),
        rsvp: t.rsvp || null,
        result: t.result || null,
        occurrences: t.occurrences || {},
        lat: (newAddress !== t.address || newCity !== t.city) ? null : (t.lat || null),
        lng: (newAddress !== t.address || newCity !== t.city) ? null : (t.lng || null),
        googleEventId: t.googleEventId || null
      };
      if(!updated.date){ showToast(tr('pickDate')); return; }
      if(id){
        const idx = tournaments.findIndex(x=>x.id===id);
        tournaments[idx] = updated;
      } else {
        tournaments.push(updated);
      }
      await saveTournaments();
      overlay.remove();
      render();
      showToast(id ? tr('xSaved') : tr('xAddedToYourCalendar'));
    };
  }

  // ---------- Bulk import modal ----------
  function openBulkImportModal(){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <div class="modal">
        <h2>${tr('xBulkImportEvents')}</h2>
        <div class="modal-sub">${tr('xPasteTheWholeListOf')}</div>
        <div class="field"><textarea id="bulkPasteArea" style="min-height:160px;" placeholder="${escapeAttr(tr('xPasteMultipleEventsHereOne'))}"></textarea></div>
        <div class="modal-actions">
          <button class="btn-secondary" id="cancelBulk" style="flex:1;">${tr('cancel')}</button>
          <button class="btn-primary" id="parseBulkBtn" style="flex:1;">${tr('menuFindEvents')}</button>
        </div>
        <div id="bulkReviewArea"></div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
    overlay.querySelector('#cancelBulk').onclick = ()=>overlay.remove();

    overlay.querySelector('#parseBulkBtn').onclick = ()=>{
      const raw = overlay.querySelector('#bulkPasteArea').value;
      if(!raw.trim()){ showToast(tr('xPasteSomeEventTextFirst')); return; }
      const blocks = splitIntoEventBlocks(raw);
      const parsed = blocks.map(b=>({ block: b, ...parsePastedText(b) })).filter(p=>p.name || p.date);

      const reviewArea = overlay.querySelector('#bulkReviewArea');
      if(parsed.length === 0){
        reviewArea.innerHTML = `<div class="modal-sub">${tr('xCouldnTFindAnyDistinct')}</div>`;
        return;
      }
      reviewArea.innerHTML = `
        <div class="section-label">${trf(parsed.length>1?'foundPossibleN':'foundPossible1', { n: parsed.length })}</div>
        ${parsed.map((p,idx)=>`
          <div class="list-item">
            <div class="info">
              <div class="n">${escapeHtml(p.name || tr('untitledEvent'))}</div>
              <div class="m">${p.date ? fmtFriendly(p.date, p.time) : tr('noDateFound')}${p.store ? ' · '+escapeHtml(p.store) : ''}</div>
            </div>
            <input type="checkbox" data-bulk-idx="${idx}" ${p.date ? 'checked' : ''} style="width:20px;height:20px;flex:none;"/>
          </div>`).join('')}
        <div class="modal-actions">
          <button class="btn-primary" id="addBulkBtn" style="flex:1;">${tr('xAddSelectedEvents')}</button>
        </div>
      `;
      reviewArea.querySelector('#addBulkBtn').onclick = async ()=>{
        const checked = Array.from(reviewArea.querySelectorAll('[data-bulk-idx]:checked')).map(el=>parseInt(el.dataset.bulkIdx,10));
        if(checked.length === 0){ showToast(tr('xSelectAtLeastOneEvent')); return; }
        let added = 0, skippedDupes = 0;
        checked.forEach(idx=>{
          const p = parsed[idx];
          if(!p.date) return; // need at least a date to be useful
          const candidate = { name: p.name || tr('untitledEvent'), date: p.date, store: p.store || '' };
          if(isDuplicateEvent(candidate)){ skippedDupes++; return; }
          tournaments.push({
            id: uid(), name: candidate.name, game: p.game || '', store: candidate.store, date: p.date, time: p.time || '',
            repeat: p.repeat || 'none', format: p.format || '', fee: p.fee || '', address: '', city: '', link: '',
            notes: p.notes || '', rsvp: null, result: null, occurrences: {}, lat: null, lng: null, googleEventId: null
          });
          added++;
        });
        await saveTournaments();
        overlay.remove();
        render();
        const dupeNote = skippedDupes ? ' ' + trf('skippedAlready', { n: skippedDupes }) : '';
        showToast(trf(added===1?'addedAuto1':'addedAutoN', { n: added, dupe: dupeNote }));
      };
    };
  }

  // ---------- Result modal ----------
  function openResultModal(id, date){
    const t = tournaments.find(x=>x.id===id);
    if(!t) return;
    const occ = getOcc(t, date);
    const r = occ.result || { placement:'', record:'', notes:'', deckId:'', deck:'', matches:[] };
    let matches = (r.matches || []).map(m=>({...m}));
    const isRiftbound = t.game === 'Riftbound';
    const legendDatalist = isRiftbound
      ? `<datalist id="legendOptions">${RIFTBOUND_LEGENDS.map(l=>`<option value="${escapeAttr(l)}">`).join('')}</datalist>`
      : '';
    const matchingDecks = decks.filter(d => !t.game || !d.game || d.game === t.game).sort((a,b)=>(b.active?1:0)-(a.active?1:0));
    const currentDeckId = r.deckId || '';

    const isInProgress = occ.result && occ.result.inProgress;
    const hasAnyResult = !!occ.result;
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <div class="modal" style="max-width:480px;">
        <h2>${hasAnyResult ? (isInProgress ? tr('updateRoundsTitle') : tr('editYourResult')) : tr('logYourResult')}</h2>
        <div class="modal-sub">${escapeHtml(t.name)} · ${fmtFriendly(date, t.time)}</div>
        <div class="hint" style="margin-bottom:14px;">${tr('xYouCanLogRoundsAs')}</div>
        <div class="row2">
          <div class="field"><label>${tr('xPlacement')}</label><input id="r_placement" value="${escapeAttr(r.placement)}" placeholder="${escapeAttr(tr('xEG1stTop8'))}"/></div>
          <div class="field"><label>${tr('overallRecord')}</label><input id="r_record" value="${escapeAttr(r.record)}" placeholder="e.g. 3-1"/></div>
        </div>
        <div class="field">
          <label>${tr('xYourDeck')}</label>
          <select id="r_deckSelect">
            <option value="">${tr('xNoDeckSelected')}</option>
            ${matchingDecks.map(d=>`<option value="${d.id}" ${currentDeckId===d.id?'selected':''}>${escapeHtml(d.name)}${d.active?'':' (retired)'}</option>`).join('')}
            <option value="__new__">${tr('xAddANewDeck')}</option>
          </select>
          <div id="newDeckInline" style="display:none;margin-top:8px;">
            <input id="newDeckNameInline" placeholder="${escapeAttr(tr('deckName'))}" ${isRiftbound?'list="legendOptions"':''}/>
            <button class="mini-btn" id="createDeckInlineBtn" type="button" style="margin-top:6px;">${tr('xCreateSelect')}</button>
          </div>
          ${!r.deckId && r.deck ? `<div class="hint">${trf('freeTextDeckHint', { deck: escapeHtml(r.deck) })}</div>` : ''}
        </div>
        ${legendDatalist}
        <div class="hint" style="margin:-6px 0 12px;">${tr('xRecordFillsInAutomaticallyFrom')}</div>

        <div class="section-label">${tr('xMatchLog')}</div>
        <div id="matchRows"></div>
        <button class="mini-btn" id="addMatchBtn" type="button" style="margin-bottom:14px;">${tr('xAddARound')}</button>

        <div class="field"><label>${tr('xNotes')}</label><textarea id="r_notes" placeholder="${escapeAttr(tr('xKeyMatchupsWhatToImprove'))}">${escapeHtml(r.notes)}</textarea></div>
        <div class="modal-actions">
          ${occ.result ? '<button class="btn-danger" id="clearResult" type="button">' + tr('clearResult') + '</button>' : ''}
          <button class="btn-secondary" id="cancelResult" type="button">${tr('cancel')}</button>
        </div>
        <div class="modal-actions" style="margin-top:8px;">
          <button class="btn-secondary" id="saveInProgress" type="button" style="flex:1;">${tr('xSaveProgress')}</button>
          <button class="btn-primary" id="saveResult" type="button" style="flex:1;">${tr('xMarkFinished')}</button>
        </div>
        <div class="hint" style="margin-top:8px;">${tr('xSaveProgressKeepsThisEvent')}</div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
    overlay.querySelector('#cancelResult').onclick = ()=>overlay.remove();

    function recomputeRecordFromMatches(){
      if(matches.length === 0) return;
      let w=0,l=0,d=0;
      matches.forEach(m=>{ if(m.outcome==='W') w++; else if(m.outcome==='L') l++; else if(m.outcome==='D') d++; });
      overlay.querySelector('#r_record').value = d>0 ? `${w}-${l}-${d}` : `${w}-${l}`;
    }

    const inputStyle = 'background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 10px;font-size:13px;';

    function drawMatches(){
      const rowsEl = overlay.querySelector('#matchRows');
      if(matches.length === 0){
        rowsEl.innerHTML = `<div class="modal-sub" style="margin-bottom:10px;">${tr('xNoRoundsLoggedYetAdd')}</div>`;
        return;
      }
      rowsEl.innerHTML = matches.map((m,idx)=>`
        <div class="list-item" style="align-items:flex-start;flex-wrap:wrap;">
          <div class="info" style="flex:1;min-width:220px;">
            <div class="n" style="margin-bottom:6px;">${trf('roundN', { n: idx+1 })}</div>
            <div class="row2" style="margin-bottom:6px;">
              <input data-m="${idx}" data-f="opponent" value="${escapeAttr(m.opponent||'')}" placeholder="${escapeAttr(tr('xOpponentSDeckLeader'))}" style="${inputStyle}" ${isRiftbound?'list="legendOptions"':''}/>
              <select data-m="${idx}" data-f="outcome" style="${inputStyle}">
                <option value="">${tr('xResult')}</option>
                <option value="W" ${m.outcome==='W'?'selected':''}>${tr('xWin')}</option>
                <option value="L" ${m.outcome==='L'?'selected':''}>${tr('xLoss')}</option>
                <option value="D" ${m.outcome==='D'?'selected':''}>${tr('xDraw')}</option>
              </select>
            </div>
            <div class="row2">
              <select data-m="${idx}" data-f="wentFirst" style="${inputStyle}">
                <option value="">${tr('xWentFirst')}</option>
                <option value="yes" ${m.wentFirst==='yes'?'selected':''}>${tr('xIWentFirst')}</option>
                <option value="no" ${m.wentFirst==='no'?'selected':''}>${tr('xIWentSecond')}</option>
              </select>
              <input data-m="${idx}" data-f="notes" value="${escapeAttr(m.notes||'')}" placeholder="${escapeAttr(tr('xNotesOptional'))}" style="${inputStyle}"/>
            </div>
          </div>
          <button class="icon-btn" data-remove-match="${idx}" title="${escapeAttr(tr('xRemoveRound'))}">✕</button>
        </div>`).join('');

      rowsEl.querySelectorAll('[data-m]').forEach(el=>{
        el.oninput = el.onchange = ()=>{
          const idx = parseInt(el.dataset.m,10);
          matches[idx][el.dataset.f] = el.value;
          recomputeRecordFromMatches();
        };
      });
      rowsEl.querySelectorAll('[data-remove-match]').forEach(btn=>{
        btn.onclick = ()=>{
          matches.splice(parseInt(btn.dataset.removeMatch,10), 1);
          drawMatches();
          recomputeRecordFromMatches();
        };
      });
    }
    drawMatches();

    overlay.querySelector('#addMatchBtn').onclick = ()=>{
      matches.push({ opponent:'', outcome:'', wentFirst:'', notes:'' });
      drawMatches();
    };

    const deckSelect = overlay.querySelector('#r_deckSelect');
    const newDeckInline = overlay.querySelector('#newDeckInline');
    deckSelect.onchange = ()=>{
      newDeckInline.style.display = deckSelect.value === '__new__' ? 'block' : 'none';
    };
    overlay.querySelector('#createDeckInlineBtn').onclick = async ()=>{
      const name = overlay.querySelector('#newDeckNameInline').value.trim();
      if(!name){ showToast(tr('giveDeckName')); return; }
      const newDeck = { id: deckUid(), name, game: t.game||'', notes:'', active:true, createdAt: Date.now() };
      decks.push(newDeck);
      await saveDecks();
      const opt = document.createElement('option');
      opt.value = newDeck.id; opt.textContent = newDeck.name; opt.selected = true;
      deckSelect.insertBefore(opt, deckSelect.lastElementChild);
      newDeckInline.style.display = 'none';
      showToast(tr('xDeckCreated'));
    };

    if(occ.result){
      overlay.querySelector('#clearResult').onclick = async ()=>{
        setOcc(t, date, { result: null });
        await saveTournaments();
        syncResultLogged(t, date, false);
        overlay.remove(); render();
        showToast(tr('xResultCleared'));
      };
    }
    async function doSave(markInProgress){
      const placement = overlay.querySelector('#r_placement').value.trim();
      const record = overlay.querySelector('#r_record').value.trim();
      const deckId = deckSelect.value && deckSelect.value !== '__new__' ? deckSelect.value : '';
      const notes = overlay.querySelector('#r_notes').value.trim();
      const cleanMatches = matches.filter(m=>m.opponent || m.outcome || m.notes);
      if(!placement && !record && !deckId && !r.deck && !notes && cleanMatches.length===0){ showToast(tr('xAddAtLeastOneDetail')); return; }
      const resultObj = { placement, record, notes, matches: cleanMatches };
      if(deckId) resultObj.deckId = deckId;
      else if(r.deck) resultObj.deck = r.deck; // keep old free-text entry if you didn't switch it to a tracked deck
      if(markInProgress) resultObj.inProgress = true;
      setOcc(t, date, { result: resultObj });
      await saveTournaments();
      // Only tell the "remind me to log results" job to stop nagging once
      // this is actually finished — an in-progress entry should still get
      // the reminder if it's left unfinished.
      syncResultLogged(t, date, !markInProgress);
      overlay.remove(); render();
      showToast(markInProgress ? tr('xProgressSavedAddMoreRounds') : tr('xResultSaved'));
    }
    overlay.querySelector('#saveInProgress').onclick = ()=>doSave(true);
    overlay.querySelector('#saveResult').onclick = ()=>doSave(false);
  }

  // ---------- Trend, streak and matrix sections (shared by the stats screens) ----------
  function monthLabel(ym){
    try{ return new Date(ym + '-01T00:00:00').toLocaleDateString(dateLocale(), { month: 'short' }); }
    catch(e){ return ym; }
  }
  // Bars of win rate per month. The text alternative lists every value, because a bar chart is
  // no use to a screen reader, and each bar has a tooltip with the record behind it.
  function trendChartHtml(timeline){
    if(!timeline || !timeline.length) return '';
    const W = 320, H = 130, top = 16, bottom = 22, left = 4, right = 4;
    const plotH = H - top - bottom, slot = (W - left - right) / timeline.length, barW = Math.min(34, slot * 0.7);
    const y = pct => top + plotH * (1 - pct / 100);
    const bars = timeline.map((m, i)=>{
      const cx = left + slot * i + slot / 2, h = Math.max(2, plotH * m.winRate / 100);
      const rec = m.w + '-' + m.l + (m.d ? '-' + m.d : '');
      return `<g><title>${escapeHtml(monthLabel(m.month))} ${escapeHtml(m.month.slice(0,4))}: ${m.winRate}% (${rec})</title>
        <rect x="${(cx - barW/2).toFixed(1)}" y="${(top + plotH - h).toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${m.winRate >= 50 ? 'var(--teal)' : 'var(--rose)'}" opacity="0.9"/>
        <text x="${cx.toFixed(1)}" y="${(top + plotH - h - 4).toFixed(1)}" text-anchor="middle" font-size="10" fill="currentColor">${m.winRate}%</text>
        <text x="${cx.toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.7">${escapeHtml(monthLabel(m.month))}</text></g>`;
    }).join('');
    const summary = timeline.map(m=>`${monthLabel(m.month)} ${m.month.slice(0,4)} ${m.winRate}%`).join(', ');
    return `<div class="trend-chart"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${escapeAttr(tr('winRateByMonth') + ': ' + summary)}" style="color:var(--text-dim);display:block;">
        <line x1="${left}" x2="${W - right}" y1="${y(50).toFixed(1)}" y2="${y(50).toFixed(1)}" stroke="currentColor" stroke-dasharray="3 4" opacity="0.5"/>
        ${bars}</svg>
      ${timeline.length < 2 ? `<div class="hint">${tr('trendHint')}</div>` : ''}</div>`;
  }
  function streaksHtml(st){
    if(!st || !st.events) return '';
    const cur = st.currentType === 'W' ? { v: st.currentLength, l: tr('streakWinning') }
              : st.currentType === 'L' ? { v: st.currentLength, l: tr('streakLosing') }
              : { v: '—', l: tr('streakNone') };
    return `<div class="stat-grid">
        <div class="stat-card"><div class="val">${st.currentType === 'W' ? '🔥 ' : ''}${cur.v}</div><div class="lbl">${cur.l}</div></div>
        <div class="stat-card"><div class="val">${st.bestWin || '—'}</div><div class="lbl">${tr('streakBest')}</div></div>
      </div>`;
  }
  // Rows are your decks, columns are the opponents. Colour follows win rate, but every cell also
  // states its numbers, so colour is never the only signal.
  function matrixHtml(mx){
    if(!mx || !mx.decks.length || !mx.opponents.length) return '';
    const cell = (deck, opp)=>{
      const c = (mx.cells[deck] || {})[opp];
      if(!c) return '<td class="mx-empty">·</td>';
      const decided = c.w + c.l, rate = decided ? Math.round(c.w / decided * 100) : null;
      const bg = rate == null ? 'transparent'
        : rate >= 50 ? `rgba(45,217,193,${(0.10 + (rate - 50) / 50 * 0.40).toFixed(2)})`
        : `rgba(240,103,138,${(0.10 + (50 - rate) / 50 * 0.40).toFixed(2)})`;
      const rec = c.w + '-' + c.l + (c.d ? '-' + c.d : '');
      return `<td style="background:${bg};" title="${escapeAttr(deck + ' ' + tr('vs') + ' ' + opp + ': ' + rec + (rate != null ? ' (' + rate + '%)' : ''))}"><div class="mx-rec">${rec}</div>${rate != null ? `<div class="mx-pct">${rate}%</div>` : ''}</td>`;
    };
    return `<div class="matrix-wrap" tabindex="0" role="region" aria-label="${escapeAttr(tr('matchupMatrix'))}">
      <table class="matrix"><thead><tr><th scope="col"></th>${mx.opponents.map(o=>`<th scope="col" title="${escapeAttr(o)}">${escapeHtml(o)}</th>`).join('')}</tr></thead>
      <tbody>${mx.decks.map(d=>`<tr><th scope="row" title="${escapeAttr(d)}">${escapeHtml(d)}</th>${mx.opponents.map(o=>cell(d, o)).join('')}</tr>`).join('')}</tbody></table></div>
      <div class="hint">${tr('matrixHint')}</div>`;
  }

  function storeShareCode(){
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = ''; for(let i=0;i<6;i++) s += chars[Math.floor(Math.random()*chars.length)];

  // Lets a store owner see who's actually RSVP'd "going" to their own
  // event — usernames, not just a count. Only works for events belonging
  // to a store the viewer owns (enforced by the "attendances select store
  // owner" RLS policy — this isn't just a UI-level restriction).
  // ---- Check-in ------------------------------------------------------------------
  // The QR a store shows opens /?checkin=<store event id>. It only works on a day the event
  // actually happens (so a link shared afterwards is useless) and only for the signed-in person
  // themself: it records their own attendance row with checked_in_at, which the store owner can
  // already see (owners may read attendance for their own events).
  async function performCheckin(eventId){
    try{
      const { data: ev, error } = await supabaseClient.from('store_events').select('id, name, date, time, repeat, cancelled, store_id').eq('id', eventId).maybeSingle();
      if(error) throw error;
      if(!ev){ showToast(tr('checkinInvalid')); return false; }
      if(ev.cancelled){ showToast(tr('checkinCancelled')); return false; }
      const today = todayStr();
      // getOccurrenceDates returns a one-off event's own date whatever window it is given, so the
      // date has to be compared, not just counted.
      if(!getOccurrenceDates(ev, today, today).includes(today)){ showToast(tr('checkinWrongDay')); return false; }
      const { data: store } = await supabaseClient.from('stores').select('name').eq('id', ev.store_id).maybeSingle();
      const row = { user_id: session.user.id, occurrence_key: 'store:' + ev.id + '::' + today, event_name: ev.name, event_date: today,
                    time: ev.time || null, store: (store && store.name) || null, checked_in_at: new Date().toISOString() };
      let up = await supabaseClient.from('attendances').upsert(row, { onConflict: 'user_id,occurrence_key' });
      let recorded = true;
      if(up.error && /checked_in_at/.test(up.error.message || '')){
        // Database without the newest SQL: still mark them as going, just without the check-in time.
        delete row.checked_in_at; recorded = false;
        up = await supabaseClient.from('attendances').upsert(row, { onConflict: 'user_id,occurrence_key' });
      }
      if(up.error) throw up.error;
      // Keep their own list in step: a followed copy of this event becomes "going".
      const copy = tournaments.find(x=>x.storeEventId === ev.id);
      if(copy && userDataLoaded){ setOcc(copy, today, { rsvp: 'going' }); saveTournaments(); render(); }
      showToast(tr(recorded ? 'checkedIn' : 'checkedInBasic').replace('{name}', ev.name));
      return true;
    }catch(e){
      console.error('check-in failed:', e);
      showToast(tr('checkinFailed'));
      return false;
    }
  }

  // ---- CSV ------------------------------------------------------------------------
  // A cell that starts with = + - @ (or a tab/CR) is run as a formula by spreadsheet apps, and
  // names come from other people, so those are prefixed with an apostrophe.
  function csvCell(v){
    let x = v == null ? '' : String(v);
    if(/^[=+\-@\t\r]/.test(x)) x = "'" + x;
    return /[",\n\r]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x;
  }
  function toCsv(rows){ return '\ufeff' + rows.map(r=>r.map(csvCell).join(',')).join('\r\n') + '\r\n'; }
  function downloadText(filename, text, type){
    const blob = new Blob([text], { type: type || 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }

  // Everyone who RSVP'd or checked in, grouped by the date they are going for (a recurring event
  // has one group per date), with a spreadsheet download for the store owner.
  async function openAttendeesModal(storeEventId, eventName){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `<div class="modal"><h2>${tr('xAttendees')}</h2><div class="modal-sub">${escapeHtml(eventName)}</div><div id="attendeesBody"><div class="modal-sub">${tr('loadingDots')}</div></div></div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
    const body = overlay.querySelector('#attendeesBody');
    const closeBtn = `<button class="btn-secondary" id="closeAttendees" style="flex:1;">${tr('close')}</button>`;
    try{
      let res = await supabaseClient.from('attendances').select('user_id, occurrence_key, checked_in_at').like('occurrence_key', `store:${storeEventId}::%`);
      if(res.error && /checked_in_at/.test(res.error.message || '')){
        res = await supabaseClient.from('attendances').select('user_id, occurrence_key').like('occurrence_key', `store:${storeEventId}::%`);
      }
      if(res.error) throw res.error;
      const rows = res.data || [];
      const userIds = [...new Set(rows.map(r=>r.user_id))];
      if(userIds.length === 0){
        body.innerHTML = `<div class="modal-sub">${tr('xNoOneHasRsvpD')}</div><div class="modal-actions">${closeBtn}</div>`;
      } else {
        const { data: profiles } = await supabaseClient.from('profiles').select('id, username, display_name').in('id', userIds);
        const who = {}; (profiles || []).forEach(p=>{ who[p.id] = p; });
        const nameOf = id => (who[id] && (who[id].display_name || who[id].username)) || tr('playerWord');
        // occurrence_key is  store:<event id>::<date>
        const byDate = {};
        rows.forEach(r=>{ const d = (r.occurrence_key.split('::')[1] || '').slice(0, 10); (byDate[d] = byDate[d] || []).push(r); });
        const dates = Object.keys(byDate).sort();
        const sections = dates.map(d=>{
          const list = byDate[d].slice().sort((a,b)=> nameOf(a.user_id).localeCompare(nameOf(b.user_id)));
          const here = list.filter(r=>r.checked_in_at).length;
          return `<div class="section-label">${escapeHtml(d ? fmtFriendly(d) : tr('dateUnknown'))} · ${trf('goingCountN', { n: list.length })}${here ? ' · ' + trf('checkedInCountN', { n: here }) : ''}</div>
            ${list.map(r=>{ const p = who[r.user_id] || {}; return `
              <div class="list-item"><div class="info"><div class="n">${escapeHtml(nameOf(r.user_id))}${r.checked_in_at ? ' <span title="' + escapeAttr(tr('checkedInLabel')) + '" aria-label="' + escapeAttr(tr('checkedInLabel')) + '" style="color:var(--teal);">✅</span>' : ''}</div>${p.username ? `<div class="m">@${escapeHtml(p.username)}</div>` : ''}</div></div>`; }).join('')}`;
        }).join('');
        body.innerHTML = `${sections}
          <div class="modal-actions"><button class="btn-secondary" id="downloadAttendees" style="flex:1;">${tr('xDownloadCsv')}</button>${closeBtn}</div>`;
        body.querySelector('#downloadAttendees').onclick = ()=>{
          const table = [[tr('csvDate'), tr('csvName'), tr('csvUsername'), tr('csvCheckedIn'), tr('csvCheckedInAt')]];
          dates.forEach(d=>byDate[d].slice().sort((a,b)=> nameOf(a.user_id).localeCompare(nameOf(b.user_id))).forEach(r=>{
            const p = who[r.user_id] || {};
            table.push([d, nameOf(r.user_id), p.username || '', r.checked_in_at ? tr('yesWord') : tr('noWord'), r.checked_in_at || '']);
          }));
          const slug = String(eventName || 'event').replace(/[^a-z0-9]+/gi, '_').replace(/^_+|_+$/g, '').slice(0, 50) || 'event';
          downloadText('attendees_' + slug + '.csv', toCsv(table));
        };
      }
    }catch(e){
      body.innerHTML = `<div class="modal-sub">${tr('xCouldNotLoadAttendees')}</div><div class="modal-actions">${closeBtn}</div>`;
    }
    overlay.querySelector('#closeAttendees').onclick = ()=>overlay.remove();
  }

  // ---------- Playgroups ----------
  function playgroupCode(){
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = ''; for(let i=0;i<6;i++) s += chars[Math.floor(Math.random()*chars.length)];
    return s;
  }

  // Shared by the "join with a code" box and the ?joinpg= invite link, so
  // both paths behave identically (including the already-a-member case).
  async function joinPlaygroupByCode(code, onDone){
    try{
      const { data: found, error } = await supabaseClient.rpc('find_playgroup_by_code', { code });
      if(error) throw error;
      const g = (found||[])[0];
      if(!g){ showToast(tr('xNoPlaygroupFoundWithThat')); return false; }

      const { data: existing } = await supabaseClient.from('playgroup_members')
        .select('id').eq('playgroup_id', g.id).eq('user_id', session.user.id).maybeSingle();
      if(existing){ showToast(trf('alreadyInGroup', { name: g.name })); if(onDone) onDone(); return true; }

      const { error: joinErr } = await supabaseClient.from('playgroup_members')
        .insert({ playgroup_id: g.id, user_id: session.user.id });
      if(joinErr) throw joinErr;
      showToast(tr('xJoined') + g.name + '! 🎉');
      if(onDone) onDone();
      return true;
    }catch(e){ showToast(tr('xCouldNotJoinThatPlaygroup')); return false; }
  }

  async function reportImage(imageUrl, context, subjectId, label){
    if(!imageUrl){ showToast(tr('xNothingToReportHere')); return; }
    const reason = prompt(label ? trf('reportPromptWithLabel', { label }) : tr('reportPromptNoLabel'));

        reported_by: session.user.id,

        subject_id: subjectId || null,

            repeat: e.repeat||'none', format: e.format||'', fee: e.fee||'', address: e.address||'', city:'',
            link: e.link||'', storeLink: e.storeLink||'', notes:'', rsvp:null, result:null, occurrences:{},
            isCasual: !!e.isCasual, onlineMode: e.onlineMode||'', simulatorLink: e.simulatorLink||'', contactInfo: e.contactInfo||'',
            lat:null, lng:null, googleEventId:null, readOnly:true
          });
          await saveTournaments();
          render();
          showToast(tr('xAddedToYourCalendar'));
          btn.textContent = tr('xAdded'); btn.disabled = true;
        };
      });
      body.querySelector('#pgShareEventBtn').onclick = ()=>openShareToPlaygroupModal(group);
      body.querySelector('#pgLeave').onclick = async ()=>{
        if(isOwner){
          if(!confirm(tr('xDeleteThisPlaygroupForEveryone'))) return;
          try{ await supabaseClient.from('playgroups').delete().eq('id', group.id); showToast(tr('xPlaygroupDeleted')); drawList(); }
          catch(e){ showToast(tr('xCouldNotDelete')); }
        } else {
          if(!confirm(tr('xLeaveThisPlaygroup'))) return;
          try{
            await supabaseClient.from('playgroup_members').delete().eq('playgroup_id', group.id).eq('user_id', session.user.id);
            showToast(tr('xLeftPlaygroup')); drawList();
          }catch(e){ showToast(tr('xCouldNotLeave')); }
        }
      };

      // Leaderboard — computed from each member's own data, respecting their
      // stats-sharing setting (a member who opted out simply won't appear).
      // Defaults to THIS WEEK so the rankings actually rotate and newer
      // members get a real shot, rather than one person owning an all-time
      // board forever. All-time is still available as a toggle.
      (async ()=>{
        const lbEl = body.querySelector('#pgLeaderboard');
        if(!lbEl) return;

        // Fetch each member's data once, then recompute locally when the
        // period toggle changes — avoids re-hitting the network per switch.
        const memberData = [];
        for(const m of members){
          try{
            const { data } = await supabaseClient.from('user_data').select('tournaments, decks').eq('user_id', m.id).maybeSingle();
            if(!data) continue;
            memberData.push({ m, tournaments: data.tournaments||[], decks: data.decks||[] });
          }catch(e){ /* member opted out of sharing, or load failed — skip them */ }
        }

        // Monday-start week, matching how most locals think about "this week".
        function startOfWeekStr(){
          const d = new Date();
          const day = (d.getDay() + 6) % 7; // 0 = Monday
          d.setDate(d.getDate() - day);
          return dateToStr(d);
        }
        function weekRangeLabel(){
          const start = new Date(startOfWeekStr()+'T00:00:00');
          const end = new Date(start); end.setDate(end.getDate()+6);
          const f = (x)=>x.toLocaleDateString(undefined,{month:'short', day:'numeric'});
          return `${f(start)} – ${f(end)}`;
        }

        let period = 'week'; // 'week' | 'all'

        function drawBoard(){
          const since = period === 'week' ? startOfWeekStr() : null;
          const rows = memberData.map(({m, tournaments:tt, decks:dd})=>{
            const s = computeStats(tt, dd, null, since);
            return {
              name: (m.display_name || m.username || tr('playerWord')) + (m.id===session.user.id?' '+tr('youSuffix'):''),
              winRate: s.winRate, wins: s.totalWins, losses: s.totalLosses,
              attended: s.attended, results: s.resultsLogged
            };
          });

          const periodToggle = `
            <div class="chip-row" style="margin-bottom:10px;">
              <button class="chip ${period==='week'?'active':''}" data-lb-period="week">${tr('xThisWeek')}</button>
              <button class="chip ${period==='all'?'active':''}" data-lb-period="all">${tr('rangeAll')}</button>
            </div>`;

          if(rows.length === 0){
            lbEl.innerHTML = periodToggle + `<div class="modal-sub">${tr('xNoSharedStatsYetMembers')}</div>`;
            wireToggle();
            return;
          }

          // Only rank people who actually did something this period — an
          // empty week shouldn't put someone on the podium with 0 games.
          const active = rows.filter(r=>r.wins+r.losses > 0 || r.attended > 0);
          const byWinRate = active.filter(r=>r.winRate!=null && (r.wins+r.losses)>0).sort((a,b)=>b.winRate-a.winRate || b.wins-a.wins);
          const byWins = active.slice().sort((a,b)=>b.wins-a.wins);
          const byEvents = active.slice().sort((a,b)=>b.attended-a.attended);
          const groupWins = rows.reduce((n,r)=>n+r.wins,0);
          const groupLosses = rows.reduce((n,r)=>n+r.losses,0);
          const groupEvents = rows.reduce((n,r)=>n+r.attended,0);
          const groupRate = (groupWins+groupLosses)>0 ? Math.round((groupWins/(groupWins+groupLosses))*100) : null;

          lbEl.innerHTML = `
            ${periodToggle}
            <div class="modal-sub" style="margin-bottom:10px;">${period==='week' ? `📅 ${weekRangeLabel()} · ${tr('resetsMonday')}` : tr('allTimeTotals')}</div>
            ${active.length === 0 ? `<div class="modal-sub">${tr('xNobodyHasLoggedAnythingYet')}</div>` : `
              <div class="stat-grid" style="margin-bottom:12px;">
                <div class="stat-card"><div class="val">${groupEvents}</div><div class="lbl">${tr('xEventsGroup')}</div></div>
                <div class="stat-card"><div class="val">${groupRate!=null?groupRate+'%':'—'}</div><div class="lbl">${tr('xGroupWinRate')}</div></div>
                <div class="stat-card"><div class="val">${groupWins}-${groupLosses}</div><div class="lbl">${tr('xGroupRecord')}</div></div>
                <div class="stat-card"><div class="val">${active.length}</div><div class="lbl">${period==='week'?tr('activeThisWeek'):tr('activeMembers')}</div></div>
              </div>
              ${byWinRate.length?`<div class="result-row"><div><div class="n">${tr('xBestWinRate')}</div><div class="m">${escapeHtml(byWinRate[0].name)}</div></div><div class="p">${byWinRate[0].winRate}%</div></div>`:''}
              ${byWins.length && byWins[0].wins>0?`<div class="result-row"><div><div class="n">${tr('xMostWins')}</div><div class="m">${escapeHtml(byWins[0].name)}</div></div><div class="p">${byWins[0].wins}</div></div>`:''}
              ${byEvents.length && byEvents[0].attended>0?`<div class="result-row"><div><div class="n">${tr('xMostEvents')}</div><div class="m">${escapeHtml(byEvents[0].name)}</div></div><div class="p">${byEvents[0].attended}</div></div>`:''}
              <div class="section-label">${period==='week'?tr('thisWeekLabel'):tr('allMembers')}</div>
              ${active.sort((a,b)=>(b.winRate||0)-(a.winRate||0) || b.wins-a.wins).map(r=>`
                <div class="result-row"><div><div class="n">${escapeHtml(r.name)}</div>
                  <div class="m">${r.wins}-${r.losses} · ${trf(r.attended===1?'event1':'eventsN', { n: r.attended })}</div></div>
                  <div class="p">${r.winRate!=null?r.winRate+'%':'—'}</div></div>`).join('')}
              ${rows.length > active.length ? `<div class="modal-sub" style="margin-top:8px;">${trf(rows.length-active.length===1?'membersNone1':'membersNoneN', { n: rows.length-active.length, when: period==='week' ? tr('thisWeekLower') : tr('yetWord') })}</div>` : ''}
            `}
          `;
          wireToggle();
        }

        function wireToggle(){
          lbEl.querySelectorAll('[data-lb-period]').forEach(btn=>{
            btn.onclick = ()=>{ period = btn.dataset.lbPeriod; drawBoard(); };
          });
        }

        drawBoard();
      })();
    }

    drawList();
  }

  // Picks one of your own upcoming events to share into a playgroup.

    const today = todayStr();
    const upcoming = buildInstances().filter(i=>i.date >= today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,40);

        <h2>${tr('xShareAnEvent')}</h2>
        <div class="modal-sub">${trf('shareToGroup', { name: escapeHtml(group.name) })}</div>
        ${upcoming.length ? upcoming.map((i,idx)=>`
          <div class="list-item">
            <div class="info"><div class="n">${escapeHtml(i.t.name)}</div>
              <div class="m">${fmtFriendly(i.date, i.t.time)}${i.t.store?' · '+escapeHtml(i.t.store):''}</div></div>
            <button class="mini-btn" data-share-pg="${idx}">${tr('share')}</button>
          </div>`).join('') : `<div class="modal-sub">${tr('xYouHaveNoUpcomingEvents')}</div>`}
        <div class="modal-actions"><button class="btn-secondary" id="closeSharePg" style="flex:1;">${tr('close')}</button></div>

        const i = upcoming[parseInt(btn.dataset.sharePg,10)];
        const t = i.t;
        try{
          await supabaseClient.from('playgroup_shared_events').insert({
            playgroup_id: group.id, shared_by: session.user.id,
            event: { name: t.name, game: t.game, store: t.store, date: i.date, time: t.time,
                     format: t.format, fee: t.fee, address: t.address, link: t.link,
                     storeLink: t.storeLink, repeat: isRepeating(t) ? t.repeat : 'none',
                     isCasual: !!t.isCasual, onlineMode: t.onlineMode||'', simulatorLink: t.simulatorLink||'', contactInfo: t.contactInfo||'' }
          });
          showToast(tr('xSharedWithTheGroup'));
          btn.textContent = tr('xShared'); btn.disabled = true;
        }catch(e){ showToast(tr('xCouldNotShare')); }
      };
    });
  }

  async function openStoresModal(){

    async function getMyFollowedIds(){
      try{
        const { data } = await supabaseClient.from('store_follows').select('store_id').eq('user_id', session.user.id);

      }catch(e){ return []; }

    async function renderBrowseTab(){
      body.innerHTML = `<div class="modal-sub">${tr('loadingDots')}</div>`;
      const followedIds = await getMyFollowedIds();
      body.innerHTML = `
        <div class="field"><input id="storeSearch" placeholder="${escapeAttr(tr('xSearchByStoreNameOr'))}"/></div>
        <div class="field">
          <select id="gameFilter">
            <option value="">${tr('xAllGames')}</option>
            ${GAMES.map(g=>`<option value="${escapeAttr(g)}">${escapeHtml(g)}</option>`).join('')}
          </select>
        </div>
        <div id="storeResults"><div class="modal-sub">${tr('xLoadingStores')}</div></div>
        <div class="section-label">${tr('xFollowByCode')}</div>
        <div style="display:flex;gap:8px;">
          <input id="followCodeInput" placeholder="${escapeAttr(tr('codeExample'))}" style="flex:1;text-transform:uppercase;"/>
          <button class="mini-btn" id="followCodeBtn">${tr('xFollow')}</button>
        </div>
        <div class="modal-actions"><button class="btn-secondary" id="closeStores" style="flex:1;">${tr('close')}</button></div>
      `;
      overlay.querySelector('#closeStores').onclick = ()=>overlay.remove();

      async function runSearch(term, game){
        const resultsEl = body.querySelector('#storeResults');
        resultsEl.innerHTML = `<div class="modal-sub">${tr('xSearching')}</div>`;
        try{
          let allowedIds = null;
          if(game){
            const [eventMatches, tagMatches] = await Promise.all([
              supabaseClient.from('store_events').select('store_id').ilike('game', game),
              supabaseClient.from('stores').select('id').contains('games', [game]).eq('approved', true)
            ]);
            const fromEvents = ((eventMatches.data)||[]).map(m=>m.store_id);
            const fromTags = ((tagMatches.data)||[]).map(m=>m.id);
            allowedIds = [...new Set([...fromEvents, ...fromTags])];
            if(allowedIds.length === 0){ resultsEl.innerHTML = `<div class="modal-sub">${trf('noStoresForGame', { game: escapeHtml(game) })}</div>`; return; }
          }
          let q = supabaseClient.from('stores').select('*').eq('approved', true);
          if(term && term.trim()) q = q.or(`name.ilike.%${term.trim()}%,city.ilike.%${term.trim()}%`);
          if(allowedIds) q = q.in('id', allowedIds);
          const { data, error } = await q.limit(50);
          if(error) throw error;
          if(!data || data.length===0){ resultsEl.innerHTML = `<div class="modal-sub">${tr('xNoStoresFound')}</div>`; return; }

          let countByStore = {};
          try{
            const { data: counts } = await supabaseClient.rpc('get_store_follower_counts', { store_ids: data.map(s=>s.id) });
            (counts||[]).forEach(c=>{ countByStore[c.store_id] = c.follower_count; });
          }catch(e){}

          const sorted = data.slice().sort((a,b)=>{
            if(term && term.trim()) return a.name.localeCompare(b.name); // relevance-ish: alphabetical among matches
            return (countByStore[b.id]||0) - (countByStore[a.id]||0); // default: most-followed first
          });

          resultsEl.innerHTML = sorted.map(s=>`
            <div class="list-item">
              <div class="info"><div class="n">${escapeHtml(s.name)}</div><div class="m">${escapeHtml(s.city||'')}${countByStore[s.id] ? ' · '+trf(countByStore[s.id]===1?'follower1':'followersN', { n: countByStore[s.id] }) : ''}${(s.games&&s.games.length) ? ' · '+s.games.map(g=>gameIcon(g)).join(' ') : ''}</div></div>
              <button class="mini-btn" data-follow="${s.id}" ${followedIds.includes(s.id)?'disabled':''}>${followedIds.includes(s.id)?tr('xFollowing2'):tr('followWord')}</button>
            </div>`).join('');
          resultsEl.querySelectorAll('[data-follow]').forEach(btn=>{
            btn.onclick = async ()=>{
              btn.disabled = true; btn.textContent = tr('xFollowing2');
              try{ await supabaseClient.from('store_follows').insert({ user_id: session.user.id, store_id: btn.dataset.follow }); showToast(tr('xFollowing3')); await syncFollowedStoreEvents(); render(); }
              catch(e){ showToast(tr('xCouldNotFollow')); btn.disabled=false; btn.textContent=tr('xFollow'); }
            };
          });
        }catch(e){ resultsEl.innerHTML = `<div class="modal-sub">${tr('xSearchFailedTryAgain')}</div>`; }
      }
      let searchDebounce = null;
      function currentGame(){ return body.querySelector('#gameFilter').value; }
      body.querySelector('#storeSearch').oninput = (e)=>{
        clearTimeout(searchDebounce);
        searchDebounce = setTimeout(()=>runSearch(e.target.value, currentGame()), 250);
      };
      body.querySelector('#gameFilter').onchange = ()=>{
        runSearch(body.querySelector('#storeSearch').value, currentGame());
      };
      runSearch('', '');

      body.querySelector('#followCodeBtn').onclick = async ()=>{
        const code = body.querySelector('#followCodeInput').value.trim().toUpperCase();
        if(!code){ showToast(tr('xEnterACode')); return; }
        try{
          const { data: s, error } = await supabaseClient.from('stores').select('*').eq('follow_code', code).eq('approved', true).maybeSingle();
          if(error || !s){ showToast(tr('xNoStoreFoundWithThat')); return; }
          await supabaseClient.from('store_follows').insert({ user_id: session.user.id, store_id: s.id });
          showToast(tr('xNowFollowing') + s.name);
          await syncFollowedStoreEvents();
          render();
          runSearch(body.querySelector('#storeSearch').value, currentGame());
        }catch(e){ showToast(tr('xCouldNotFollowYouMay')); }
      };
    }
