<script>
  // Apply the saved colour theme before anything is drawn (see "Themes" in the app script).
  (function(){
    try{
      var t = localStorage.getItem('pairings-theme') || '';
      if(t === 'auto') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'daylight' : 'rift';
      if(t && t !== 'rift') document.documentElement.setAttribute('data-theme', t);
    }catch(e){}
  })();
</script>

<style>
  :root{
    --void:#100e1a;
    --panel:#181528;
    --panel-2:#1f1b33;
    --line:#2c2745;
    --field-border:#726a96;   /* form-field outline: 3.3:1 on the panels (WCAG non-text contrast needs 3:1; --line is 1.3:1) */
    --text:#eeeaf7;
    --text-dim:#a49bc4;
    --rift:#8b5cf6;
    --rift-2:#c084fc;
    --teal:#2dd9c1;
    --amber:#f5b656;
    --rose:#f0678a;
    --gold:#ffd166;
    --btn-1:#7c3aed;          /* primary buttons: a gradient from --btn-1 to --btn-2 under --on-btn text (4.5:1 at both ends) */
    --btn-2:#6d28d9;
    --on-btn:#ffffff;
    --radius:14px;
    color-scheme:dark;
  }
  /* Colour themes (☰ → Theme). Each one overrides the palette above and must keep the
     same contrast (tests/accessibility.test.js checks every block). Tints elsewhere are
     color-mix() of these variables, so they follow the theme. */
  :root[data-theme="ocean"]{color-scheme:dark;
    --void:#0a1120;--panel:#101a2e;--panel-2:#15213a;--line:#223352;--field-border:#5f7699;
    --text:#e8eef8;--text-dim:#9fb2cf;--rift:#3b82f6;--rift-2:#7db4ff;--teal:#2dd4bf;
    --amber:#f5b656;--rose:#f47a95;--gold:#ffd166;--btn-1:#2563eb;--btn-2:#1d4ed8;
  }
  :root[data-theme="ember"]{color-scheme:dark;
    --void:#160d0b;--panel:#201311;--panel-2:#291916;--line:#3e2722;--field-border:#8f675c;
    --text:#f8ede9;--text-dim:#c9a79d;--rift:#f97316;--rift-2:#fb9a4b;--teal:#2dd9c1;
    --amber:#fbbf24;--rose:#fb7185;--gold:#ffd166;--btn-1:#c2410c;--btn-2:#9a3412;
  }
  :root[data-theme="forest"]{color-scheme:dark;
    --void:#0b130e;--panel:#111f17;--panel-2:#17291e;--line:#24402f;--field-border:#5e8a6c;
    --text:#e7f3eb;--text-dim:#9cc0a9;--rift:#22c55e;--rift-2:#6ee7a0;--teal:#2dd9c1;
    --amber:#f5b656;--rose:#f47a95;--gold:#ffd166;--btn-1:#15803d;--btn-2:#166534;
  }
  :root[data-theme="midnight"]{color-scheme:dark;
    --void:#000000;--panel:#0c0c0f;--panel-2:#141418;--line:#26262c;--field-border:#6c6c78;
    --text:#f2f2f5;--text-dim:#a9a9b5;--rift:#8b5cf6;--rift-2:#c4a1ff;--teal:#2dd9c1;
    --amber:#f5b656;--rose:#f0678a;--gold:#ffd166;--btn-1:#7c3aed;--btn-2:#6d28d9;
  }
  :root[data-theme="daylight"]{color-scheme:light;
    --void:#f3f1f9;--panel:#ffffff;--panel-2:#f8f6fd;--line:#e2ddef;--field-border:#857da3;
    --text:#1b1730;--text-dim:#5a5374;--rift:#7c3aed;--rift-2:#6d28d9;--teal:#0f766e;
    --amber:#9a5b06;--rose:#be123c;--gold:#8a5a00;--btn-1:#7c3aed;--btn-2:#6d28d9;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, color-mix(in srgb,var(--rift) 16%,transparent), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, color-mix(in srgb,var(--teal) 10%,transparent), transparent 55%),
      var(--void);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 90px;}

  /* ---------- Header ---------- */
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand .mark{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;letter-spacing:-0.02em;
    background:linear-gradient(90deg,var(--rift-2),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand .sub{color:var(--text-dim);font-size:12.5px;}
  .head-actions{display:flex;gap:6px;flex-wrap:wrap;}

  .btn{border:none;border-radius:10px;cursor:pointer;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13.5px;min-height:40px;}
  .add-btn{background:linear-gradient(135deg,var(--btn-1),var(--btn-2));color:var(--on-btn);padding:9px 14px;box-shadow:0 6px 18px color-mix(in srgb,var(--rift) 35%,transparent);white-space:nowrap;}
  .add-btn:hover{filter:brightness(1.08);}
  .icon-pill{background:var(--panel);border:1px solid var(--line) !important;color:var(--text);padding:9px 12px;position:relative;white-space:nowrap;}
  .icon-pill:hover{border-color:var(--teal) !important;}
  .btn:active{transform:translateY(1px);}
  .bell-badge{position:absolute;top:-5px;right:-5px;background:var(--rose);color:var(--void);font-size:10px;font-weight:700;border-radius:10px;padding:1px 5px;min-width:16px;text-align:center;line-height:1.4;}

  /* ---------- Hero / next-up ring ---------- */
  .hero{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,var(--panel),var(--panel-2));
    border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:20px;position:relative;overflow:hidden;}
  .hero::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;
    background:radial-gradient(circle,color-mix(in srgb,var(--rift) 25%,transparent),transparent 70%);}
  .ring{flex:none;position:relative;width:70px;height:70px;}
  .ring svg{transform:rotate(-90deg);}
  .ring .bg{stroke:color-mix(in srgb,var(--text) 8%,transparent);}
  .ring .fg{stroke:url(#ringGrad);stroke-linecap:round;transition:stroke-dashoffset .5s ease;}
  .ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;}
  .hero-info{flex:1;min-width:0;}
  .hero-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--teal);font-weight:600;margin-bottom:3px;}
  .hero-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hero-meta{color:var(--text-dim);font-size:12.5px;margin-top:2px;}
  .hero-empty{color:var(--text-dim);font-size:13.5px;}

  /* ---------- Quick links ---------- */
  .quick-links{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
  .pg-menu-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;
    border:none;border-bottom:1px solid var(--line);color:var(--text);font-family:inherit;font-size:14px;
    padding:12px 2px;cursor:pointer;}
  .pg-menu-row:last-of-type{border-bottom:none;}
  .pg-menu-row:hover{color:var(--teal);}
  .theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:6px 0 4px;}
  .theme-opt{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    color:var(--text);font-family:inherit;font-size:13.5px;padding:12px 10px;cursor:pointer;text-align:left;min-height:48px;}
  .theme-opt.active{border:2px solid var(--rift-2);padding:11px 9px;font-weight:600;}
  .theme-sw{display:flex;flex-shrink:0;}
  .theme-sw i{width:16px;height:16px;border-radius:50%;border:1px solid var(--field-border);margin-right:-5px;}
  .qlink{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
    color:var(--text-dim);text-decoration:none;font-size:12px;padding:7px 11px;border-radius:9px;}
  .qlink:hover{border-color:var(--rift);color:var(--text);}

  /* ---------- Toolbar ---------- */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center;}
  .search{flex:1;min-width:140px;background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:9px 12px;color:var(--text);font-size:14px;}
  .search::placeholder{color:var(--text-dim);}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--text-dim);
    padding:7px 11px;border-radius:20px;font-size:12px;cursor:pointer;white-space:nowrap;}
  .chip.active{background:color-mix(in srgb,var(--rift) 18%,transparent);border-color:var(--rift);color:var(--rift-2);}
  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-left:auto;}
  .seg button{background:none;border:none;color:var(--text-dim);padding:8px 12px;font-size:12px;cursor:pointer;}
  .seg button.active{background:var(--panel-2);color:var(--text);}

  /* ---------- List ---------- */
  .month-label{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12.5px;color:var(--text-dim);
    text-transform:uppercase;letter-spacing:.08em;margin:20px 0 10px;}
  .card{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px;margin-bottom:10px;position:relative;}
  .card.past{opacity:0.6;}
  .date-block{flex:none;width:50px;height:50px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;position:relative;}
  .date-block .dow{font-size:9.5px;color:var(--teal);text-transform:uppercase;}
  .date-block .dom{font-size:18px;font-weight:600;line-height:1.1;}
  .date-block .game-icon{position:absolute;top:-7px;left:-7px;font-size:13px;background:var(--panel);border:1px solid var(--line);
    border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;}
  .card-body{flex:1;min-width:0;}
  .card-top{display:flex;justify-content:space-between;gap:8px;}
  .card-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14.5px;}
  .card-actions{display:flex;gap:2px;flex:none;}
  .icon-btn{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:14px;padding:5px 6px;border-radius:6px;min-height:32px;min-width:32px;}
  .icon-btn:hover{color:var(--text);background:var(--panel-2);}
  .card-meta{color:var(--text-dim);font-size:12px;margin-top:3px;display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center;}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:3px 8px;border-radius:20px;font-weight:600;}
  .badge.format{background:color-mix(in srgb,var(--rift) 16%,transparent);color:var(--rift-2);}
  .badge.game{background:color-mix(in srgb,var(--teal) 16%,transparent);color:var(--teal);}
  .badge.fee{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber);}
  .badge.repeat{background:color-mix(in srgb,var(--teal) 14%,transparent);color:var(--teal);}
  .badge.result{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold);}
  .rsvp-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .rsvp-btn{font-size:11px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--text-dim);cursor:pointer;min-height:32px;}
  .rsvp-btn.going.active{background:color-mix(in srgb,var(--teal) 18%,transparent);border-color:var(--teal);color:var(--teal);}
  .rsvp-btn.maybe.active{background:color-mix(in srgb,var(--amber) 18%,transparent);border-color:var(--amber);color:var(--amber);}
  .rsvp-btn.skip.active{background:color-mix(in srgb,var(--rose) 18%,transparent);border-color:var(--rose);color:var(--rose);}
  .result-btn{font-size:11px;padding:6px 10px;border-radius:8px;border:1px dashed var(--line);background:none;color:var(--text-dim);cursor:pointer;min-height:32px;}
  .result-btn:hover{border-color:var(--gold);color:var(--gold);}
  .card-notes{font-size:12px;color:var(--text-dim);margin-top:8px;white-space:pre-wrap;}
  .card-links{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px;}
  .card-link{font-size:11.5px;color:var(--teal);text-decoration:none;}
  .card-link.gold{color:var(--gold);}

  .empty-state{text-align:center;padding:44px 18px;color:var(--text-dim);border:1px dashed var(--line);border-radius:16px;}
  .empty-state .big{font-family:'Space Grotesk',sans-serif;font-size:16px;color:var(--text);margin-bottom:6px;font-weight:700;}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(8,7,14,0.72);backdrop-filter:blur(3px);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;padding-top:env(safe-area-inset-top);}
  @media(min-width:640px){.overlay{align-items:center;}}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;
    width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom));
    position:relative;}
  /* Always-reachable close button — stays pinned as the modal scrolls, so
     long modals don't require scrolling to the bottom to get out. */
  .modal-x{position:sticky;top:0;float:right;z-index:5;background:var(--panel-2);border:1px solid var(--line);
    color:var(--text-dim);font-size:18px;line-height:1;cursor:pointer;border-radius:50%;
    width:32px;height:32px;display:flex;align-items:center;justify-content:center;margin:-4px -4px 0 0;}
  .modal-x:hover{color:var(--text);border-color:var(--rose);}
  @media(min-width:640px){.modal{border-radius:18px;}}
  .modal h2{font-family:'Space Grotesk',sans-serif;margin:0 0 4px;font-size:17px;}
  .modal .modal-sub{color:var(--text-dim);font-size:12px;margin-bottom:14px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:5px;font-weight:600;}
  .field input,.field select,.field textarea{width:100%;background:var(--panel-2);border:1px solid var(--field-border);border-radius:8px;
    padding:10px 11px;color:var(--text);font-size:16px;font-family:inherit;}
  .field textarea{resize:vertical;min-height:60px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:420px){.row2{grid-template-columns:1fr;}}
  .paste-box{background:var(--panel-2);border:1px dashed var(--rift);border-radius:10px;padding:12px;margin-bottom:16px;}
  .paste-box .lbl{font-size:12px;font-weight:700;color:var(--rift-2);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
  .paste-box textarea{width:100%;min-height:64px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
    color:var(--text);padding:9px;font-size:13px;font-family:inherit;}
  .parse-btn{margin-top:8px;background:var(--btn-2);color:var(--on-btn);border:none;border-radius:7px;padding:8px 13px;font-size:12.5px;font-weight:700;cursor:pointer;min-height:36px;}
  .modal-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .btn-primary{flex:1;min-width:120px;background:linear-gradient(135deg,var(--btn-1),var(--btn-2));color:var(--on-btn);border:none;border-radius:9px;padding:12px;font-weight:700;font-family:'Space Grotesk',sans-serif;cursor:pointer;min-height:44px;}
  .btn-secondary{background:var(--panel-2);color:var(--text-dim);border:1px solid var(--line);border-radius:9px;padding:12px 16px;cursor:pointer;min-height:44px;}
  .btn-danger{background:none;color:var(--rose);border:1px solid color-mix(in srgb,var(--rose) 40%,transparent);border-radius:9px;padding:12px 16px;cursor:pointer;min-height:44px;}
  .hint{font-size:11px;color:var(--text-dim);margin-top:4px;line-height:1.5;}

  .tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--panel-2);padding:4px;border-radius:10px;}
  .tabs button{flex:1;background:none;border:none;color:var(--text-dim);padding:9px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;min-height:38px;}
  .tabs button.active{background:var(--panel);color:var(--text);}

  .share-code-display{background:var(--panel-2);border:1px solid var(--rift);border-radius:10px;padding:16px;text-align:center;margin-top:14px;}
  .share-code-display .code{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;letter-spacing:.1em;color:var(--rift-2);}
  .list-item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel-2);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px;}
  .list-item .info{min-width:0;}
  .list-item .n{font-weight:700;font-family:'Space Grotesk',sans-serif;font-size:13px;}
  .list-item .m{color:var(--text-dim);font-size:11.5px;}
  .mini-btn{font-size:11px;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:7px;cursor:pointer;white-space:nowrap;min-height:34px;}
  .mini-btn:hover{border-color:var(--teal);}
  .mini-btn.accept{border-color:var(--teal);color:var(--teal);}
  .mini-btn.decline{border-color:var(--rose);color:var(--rose);}

<script>

          <p lang="es" style="color:var(--text-dim);line-height:1.6;">Pairings no terminó de cargar. Revisa tu conexión e inténtalo de nuevo.</p>
          <button class="btn-primary" id="loadRetry" style="width:100%;">Reload / Recargar</button>

  // Email links (password reset, sign-up confirmation) open the app as
  //   /#access_token=…&type=recovery        or, when the link is dead,
  //   /#error=access_denied&error_code=otp_expired…
  // supabase-js consumes that hash while it starts up, which finishes before the auth
  // listener at the bottom of this file exists, so read what we need first.
  const LINK_PARAMS = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
  let recoveryPending = LINK_PARAMS.get('type') === 'recovery';   // show "choose a new password"
  const emailLinkError = LINK_PARAMS.get('error_code') || LINK_PARAMS.get('error');

  // Tapping a push notification opens the app at /?open=notifications (see sw.js), or messages
  // the already-open page. Only these names are honoured; anything else in the URL is ignored.
  // decks: Brewhouse's "sync this deck" reminder links to /?open=decks (opening Decks syncs linked decks).
  const OPEN_TARGETS = { notifications: ()=>openNotificationsModal(), decks: ()=>openDecksModal() };
  const isOpenTarget = (name)=>typeof name === 'string' && Object.prototype.hasOwnProperty.call(OPEN_TARGETS, name);
  let pendingOpen = null;
  // A store's check-in QR opens the app at /?checkin=<store event id>. Only a UUID is accepted.
  let pendingCheckin = null;
  try{
    const qs = new URLSearchParams(window.location.search);
    if(qs.has('checkin')){
      const id = qs.get('checkin');
      if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id || '')) pendingCheckin = id.toLowerCase();
      qs.delete('checkin');
      const rest = qs.toString();

    }
  }catch(e){}
  // A bracket link: /?bracket=<id> (anyone), plus &p=<token> on a guest's own link. Only a UUID and a
  // 32-hex token are accepted. The token leaves the address bar at once (it's kept on this device:
  // see rememberBracketToken); the bracket id stays, so a refresh reopens the bracket.
  let pendingBracket = null, pendingBracketToken = null;
  try{
    const qs = new URLSearchParams(window.location.search);
    const id = qs.get('bracket');
    if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id || '')){
      pendingBracket = id.toLowerCase();
      if(/^[0-9a-f]{32}$/.test(qs.get('p') || '')) pendingBracketToken = qs.get('p');
    }
    if(qs.has('p')){
      qs.delete('p');
      const rest = qs.toString();
      history.replaceState(null, '', window.location.pathname + (rest ? '?' + rest : '') + window.location.hash);
    }
  }catch(e){}
  try{
    const qs = new URLSearchParams(window.location.search);
    if(qs.has('open')){
      if(isOpenTarget(qs.get('open'))) pendingOpen = qs.get('open');
      qs.delete('open');   // don't leave it in the address bar / bookmarks
      const rest = qs.toString();
      history.replaceState(null, '', window.location.pathname + (rest ? '?' + rest : '') + window.location.hash);
    }
  }catch(e){}
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const FUNCTIONS_URL = SUPABASE_URL + '/functions/v1';

  // ---------- Translations ----------
  // The strings themselves live in i18n.js (loaded just before this script).
  const TRANSLATIONS = window.PAIRINGS_TRANSLATIONS;
  function tr(key){
    return (TRANSLATIONS[currentLang] && TRANSLATIONS[currentLang][key]) || TRANSLATIONS.en[key] || key;
  }
  // tr() with {placeholders} filled in: trf('checkedIn', { name })
  function trf(key, vars){
    return tr(key).replace(/\{(\w+)\}/g, (m, k)=> (vars && k in vars) ? vars[k] : m);
  }
  // Dates follow the language chosen in the app, not the browser's (an English browser with the app
  // set to Spanish used to get English weekday names).
  const dateLocale = ()=> currentLang === 'es' ? 'es' : undefined;

  // Notification messages are written in English by database triggers and stored as text. For
  // Spanish they are matched by shape and re-rendered from their parts; anything that does not
  // match (or a store's own announcement text) is shown exactly as stored.
  const NOTIF_PATTERNS = {
    friend_request:         { re: /^(.+) sent you a friend request$/,                          key: 'notifFriendRequest',  vars: ['name'] },
    friend_accepted:        { re: /^(.+) accepted your friend request$/,                       key: 'notifFriendAccepted', vars: ['name'] },
    friend_going_same:      { re: /^(.+) is also going to (.+)$/,                              key: 'notifGoingSame',      vars: ['name', 'event'] },
    friend_going_near:      { re: /^(.+) is attending an event near you: (.+)$/,               key: 'notifGoingNear',      vars: ['name', 'event'] },
    event_invite:           { re: /^(.+) invited you to (.+)$/,                                key: 'notifInvite',         vars: ['name', 'event'] },
    store_new_event:        { re: /^(.+) posted a new event: (.+)$/,                           key: 'notifStoreEvent',     vars: ['name', 'event'] },
    log_reminder:           { re: /^Don't forget to log your result for (.+)!$/,               key: 'notifLogReminder',    vars: ['event'] },
    event_soon:             { re: /^🎯 (.+) starts in about 2 hours!$/,                         key: 'notifEventSoon',      vars: ['event'] },
    playgroup_going:        { re: /^(.+) \(playgroup\) is going to (.+)$/,                     key: 'notifPlaygroupGoing', vars: ['name', 'event'] },
    playgroup_shared_event: { re: /^(.+?) shared an event with (.+?): (.+)$/,                  key: 'notifPlaygroupShared', vars: ['name', 'group', 'event'] },
    bracket_pairing:        { re: /^Your next match in (.+): table (.+?) vs (.+)$/,            key: 'notifBracketPairing', vars: ['event', 'table', 'name'] },
    bracket_bye:            { re: /^You have a bye this round in (.+)$/,                       key: 'notifBracketBye',     vars: ['event'] },
    bracket_finished:       { re: /^(.+) has finished: add your results to your stats$/,       key: 'notifBracketFinished', vars: ['event'] },
  };
  function localizeNotification(n){
    const raw = (n && n.message) || '';
    if(currentLang === 'en') return raw;
    const p = NOTIF_PATTERNS[n.type];
    const m = p && raw.match(p.re);
    if(!m) return raw;
    const vars = {}; p.vars.forEach((v, i)=>{ vars[v] = m[i + 1]; });
    return trf(p.key, vars);
  }

  // Player IDs shown on the Player Card. Free-form storage (JSONB) so
  // adding a game later doesn't need a migration.
  const PLAYER_ID_FIELDS = [
    { key: 'bandai',   label: 'Bandai TCG+ ID',        hint: 'One Piece, Digimon, Dragon Ball' },
    { key: 'konami',   label: 'Konami ID (KCID)',      hint: 'Yu-Gi-Oh!' },

    { key: 'riftbound',get label(){ return tr('pidRiftbound'); }, hint: 'Riftbound' },
    { key: 'melee',    get label(){ return tr('pidMelee'); },     get hint(){ return tr('pidMeleeHint'); } },

  async function savePlayerIds(next){
    try{
      await supabaseClient.from('player_ids').upsert(
        { user_id: session.user.id, ids: next, updated_at: new Date().toISOString() },

  // Shared avatar upload. `folder` is the first path segment, which the
  // storage policies use to decide who's allowed to write.
  // Lets the user frame their photo before upload — drag to reposition,
  // slider to zoom. Outputs a square JPEG, which also keeps file sizes
  // predictable regardless of what they started with.
  function openImageCropper(file, onDone){
    const SIZE = 400; // output resolution
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const overlay = document.createElement('div');
        overlay.className = 'overlay';
        overlay.innerHTML = `
          <div class="modal" style="max-width:380px;text-align:center;">
            <h2>${tr('cropTitle')}</h2>
            <div class="modal-sub">${tr('cropHint')}</div>
            <div id="cropStage" style="position:relative;width:280px;height:280px;margin:0 auto 14px;
              border-radius:50%;overflow:hidden;background:var(--panel-2);border:2px solid var(--line);cursor:grab;touch-action:none;">
              <canvas id="cropCanvas" width="280" height="280" style="display:block;"></canvas>
            </div>
            <div class="field">
              <label>${tr('cropZoom')}</label>
              <input type="range" id="cropZoom" min="100" max="300" value="100" style="width:100%;"/>
            </div>
            <div class="modal-actions">
              <button class="btn-secondary" id="cropCancel" style="flex:1;">${tr('cancel')}</button>
              <button class="btn-primary" id="cropSave" style="flex:1;">${tr('cropUse')}</button>
            </div>
          </div>`;
        document.body.appendChild(overlay);

        const canvas = overlay.querySelector('#cropCanvas');
        const ctx = canvas.getContext('2d');
        const stage = overlay.querySelector('#cropStage');
        const zoomEl = overlay.querySelector('#cropZoom');

        // Start with the image scaled to just cover the circle.
        const baseScale = Math.max(280/img.width, 280/img.height);
        let zoom = 1, offX = 0, offY = 0;

        function clampOffsets(){
          const w = img.width * baseScale * zoom;
          const h = img.height * baseScale * zoom;
          const maxX = Math.max(0, (w - 280)/2);
          const maxY = Math.max(0, (h - 280)/2);
          offX = Math.max(-maxX, Math.min(maxX, offX));
          offY = Math.max(-maxY, Math.min(maxY, offY));
        }
        function draw(){
          clampOffsets();
          const w = img.width * baseScale * zoom;
          const h = img.height * baseScale * zoom;
          ctx.clearRect(0,0,280,280);
          ctx.drawImage(img, (280-w)/2 + offX, (280-h)/2 + offY, w, h);
        }
        draw();

        zoomEl.oninput = ()=>{ zoom = parseInt(zoomEl.value,10)/100; draw(); };

        // Drag to reposition (mouse + touch via pointer events).
        let dragging = false, lastX = 0, lastY = 0;
        stage.addEventListener('pointerdown', (e)=>{
          dragging = true; lastX = e.clientX; lastY = e.clientY;
          stage.style.cursor = 'grabbing';
          stage.setPointerCapture(e.pointerId);
        });
        stage.addEventListener('pointermove', (e)=>{
          if(!dragging) return;
          offX += e.clientX - lastX; offY += e.clientY - lastY;
          lastX = e.clientX; lastY = e.clientY;
          draw();
        });
        const endDrag = ()=>{ dragging = false; stage.style.cursor = 'grab'; };
        stage.addEventListener('pointerup', endDrag);
        stage.addEventListener('pointercancel', endDrag);

        overlay.querySelector('#cropCancel').onclick = ()=>overlay.remove();
        overlay.querySelector('#cropSave').onclick = ()=>{
          // Re-render at output resolution so the saved image isn't limited
          // to the 280px preview size.
          const out = document.createElement('canvas');
          out.width = SIZE; out.height = SIZE;
          const octx = out.getContext('2d');
          const ratio = SIZE/280;
          const w = img.width * baseScale * zoom * ratio;
          const h = img.height * baseScale * zoom * ratio;
          octx.drawImage(img, (SIZE-w)/2 + offX*ratio, (SIZE-h)/2 + offY*ratio, w, h);
          out.toBlob((blob)=>{
            overlay.remove();
            if(!blob){ showToast(tr('xCouldNotProcessThatImage')); return; }
            onDone(new File([blob], 'avatar.jpg', { type:'image/jpeg' }));
          }, 'image/jpeg', 0.9);
        };
      };
      img.onerror = ()=>showToast(tr('xCouldNotReadThatImage'));
      img.src = reader.result;
    };
    reader.onerror = ()=>showToast(tr('xCouldNotReadThatFile'));
    reader.readAsDataURL(file);
  }

  async function uploadAvatar(file, folder){
    if(!file) return null;
    if(file.size > 2*1024*1024){ showToast(tr('xImageMustBeUnder2mb')); return null; }
    if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type)){ showToast(tr('xUseAJpgPngWebp')); return null; }
    try{
      const ext = (file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
      const path = `${folder}/${Date.now()}.${ext}`;
      const { error } = await supabaseClient.storage.from('avatars').upload(path, file, { upsert:true, contentType:file.type });
      if(error) throw error;
      const { data } = supabaseClient.storage.from('avatars').getPublicUrl(path);
      return data.publicUrl;
    }catch(e){ console.error(e); showToast(tr('xCouldNotUploadImage')); return null; }
  }
  function avatarImg(url, size, fallbackText){
    const s = size || 40;

  // Suggestions for "your leader" and each round's opponent on the result form. The full lists come

  // at most every two weeks and kept on the device; until then (or offline) Riftbound falls back to

  // Each name also keeps its card picture (`images`, name → URL; the base printing, not a
  // signature or alternate art), which the result card draws (leaderImageUrl).
  const LEADER_CACHE_KEY = 'pairings-leaders:v1';
  const LEADER_CACHE_MS = 14 * 24 * 3600 * 1000;
  const leaderFetches = {};
  function leaderGameKey(game){
    const g = String(game || '').toLowerCase();

  function cleanLeaderName(gameKey, name, colors){
    let n = String(name || '').trim();

      n = n.replace(/(\s*\([^)]*\))+\s*$/, '');
      n = n.split(' - ')[0];
      if(n.includes(', ')) n = n.split(', ').pop(); // "Yordle, Kennen - Heart of the Tempest"
      return n.trim();

    if(gameKey === 'onepiece'){
      // Two leaders with one name and colour are the same matchup, so " / " (a two-card identity) stays.
      n = n.replace(/\s*-\s*[A-Z]{1,4}\d{0,2}-\d{3}.*$/, '').replace(/(\s*\([^)]*\))+\s*$/, '').trim();
      const cols = (Array.isArray(colors) ? colors : String(colors || '').split(/[\s/]+/)).map(c=>String(c).trim()).filter(Boolean);
      return cols.length ? `${n} (${cols.join('/')})` : n;
    }

  }
  function readLeaderCache(){
    try{ return JSON.parse(localStorage.getItem(LEADER_CACHE_KEY) || '{}') || {}; }catch(e){ return {}; }

  function cachedLeaders(gameKey){
    const entry = readLeaderCache()[gameKey];
    if(entry && Array.isArray(entry.names) && entry.names.length) return entry.names;

  async function fetchLeaderNames(gameKey){
    const getJson = async url => {
      const res = await fetch(url);

    const names = [], images = {};

    const keepImage = (name, url, alt)=>{
      if(!name || !/^https:\/\//.test(url || '')) return;
      if(!images[name] || (images[name].alt && !alt)) images[name] = { url, alt };
    };
    if(gameKey === 'riftbound'){
      const page = p => getJson(`https://api.riftcodex.com/cards?size=100&page=${p}`);
      const first = await page(1);
      const rest = [];
      for(let p = 2; p <= Math.min(first.pages || 1, 60); p++) rest.push(page(p));
      [first, ...(await Promise.all(rest))].forEach(r => (r.items || []).forEach(c=>{

          names.push(n);

  // Resolves to the list (fresh or cached); refreshes the cache when it's older than two weeks.
  function ensureLeaderList(gameKey){
    if(!gameKey) return Promise.resolve([]);
    const entry = readLeaderCache()[gameKey];
    // A list cached before pictures were kept (no `images`) is fetched again once.
    if(entry && Array.isArray(entry.names) && entry.names.length && entry.images && Date.now() - (entry.at || 0) < LEADER_CACHE_MS) return Promise.resolve(entry.names);
    if(!leaderFetches[gameKey]){
      leaderFetches[gameKey] = fetchLeaderNames(gameKey).then(({ names, images })=>{
        const unique = [...new Set(names)].sort((a,b)=>a.localeCompare(b));
        if(unique.length){
          try{
            const cache = readLeaderCache();
            cache[gameKey] = { at: Date.now(), names: unique, images };
            localStorage.setItem(LEADER_CACHE_KEY, JSON.stringify(cache));
          }catch(e){ /* storage full or blocked: the list still serves this visit */ }
          return unique;
        }
        return cachedLeaders(gameKey);
      }).catch(()=>cachedLeaders(gameKey)).finally(()=>{ delete leaderFetches[gameKey]; });
    }
    return leaderFetches[gameKey];

  // ---------- Deck versions ----------
  // A deck's list changes over time; stats can be split by version so a change can be tested.

  // version (v1). A version starts when a Brewhouse deck's card list changes (its summary.listHash,
  // see applyBrewhouseDeck) or when you start one yourself. A result records the version it was
  // logged with as `deckVersion`; one logged before versions existed falls in the version its
  // date belongs to (`from` is the day a version started; v1's is '' = since the beginning).
  function deckVersions(d){
    return d && Array.isArray(d.versions) && d.versions.length ? d.versions : [{ n: 1, from: '' }];
  }

  // In a casual event each round can name its own deck (`m.deckId`, with `m.deckVersion`) and game

  // resultPieces splits such a result into one piece per deck + game, each a result of its own with
  // its record counted from its rounds, so stats, deck stats and the result card file every round
  // under the deck it was played with. Any other result is one piece: the result itself.
  function roundGame(t, m){ return (m && m.game) || (t && t.game) || ''; }
  function isMixedResult(result){
    return !!(result && Array.isArray(result.matches) && result.matches.some(m => m && (m.deckId || m.game)));
  }

  const reportedErrors = new Set();
  function scrubErrorText(s, max){
    return String(s == null ? '' : s)
      .replace(/[^\s@<>"']+@[^\s@<>"']+\.[A-Za-z]{2,}/g, '<email>')
      .replace(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/gi, '<id>')
      .replace(/https?:\/\/[^\s)]+/g, u => u.split(/[?#]/)[0].replace(location.origin, ''))   // no query strings (share codes); our own URLs shortened
      .replace(/[0-9]{5,}/g, '<n>')

  function reportClientError(message, where){

      if(/Failed to fetch|NetworkError|Load failed|network (error|connection)|timed? ?out/i.test(m)) return;
      const key = m + '|' + w;
      if(reportedErrors.has(key) || reportedErrors.size >= 5) return;
      reportedErrors.add(key);

    }catch(_){}

  function escapeHtml(s){

  // escapeAttr only stops attribute break-out; it does NOT stop a
  // "javascript:..." value from running when the link is clicked. Every
  // user-supplied URL (event links, store links, shared events from other
  // people) must go through safeUrl before being used as an href or src.
  // Allows http(s) only; a bare "facebook.com/events/1" gets https:// added.
  function safeUrl(u){
    if(u == null) return '';
    const s = String(u).trim();
    if(!s || /[\s<>"']/.test(s)) return '';
    if(/^https?:\/\//i.test(s)) return s;
    if(/^[a-z][a-z0-9+.-]*:/i.test(s)) return ''; // some other scheme: javascript:, data:, vbscript:, file:, ...
    if(/^[^\/?#]+\.[a-z]{2,}([\/?#]|$)/i.test(s)) return 'https://' + s;
    return '';
  }

  // ---------- date helpers ----------
  function dateToStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function todayStr(){ return dateToStr(new Date()); }
  function fmtDateParts(dateStr){
    const d = new Date(dateStr + 'T00:00:00');
    if(isNaN(d)) return {dow:'--',dom:'--'};
    return { dow: d.toLocaleDateString(dateLocale(),{weekday:'short'}), dom: d.getDate() };
  }
  function fmtMonthYear(dateStr){
    const d = new Date(dateStr + 'T00:00:00');
    if(isNaN(d)) return 'Undated';
    return d.toLocaleDateString(dateLocale(),{month:'long',year:'numeric'});
  }
  function fmtFriendly(dateStr, time){
    const d = new Date(dateStr + 'T00:00:00');
    if(isNaN(d)) return '';
    let s = d.toLocaleDateString(dateLocale(),{weekday:'long', month:'short', day:'numeric'});
    if(time) s += ' · ' + time;
    return s;
  }
  function daysUntil(dateStr){
    const today = new Date(); today.setHours(0,0,0,0);
    const d = new Date(dateStr + 'T00:00:00');
    return Math.round((d - today) / 86400000);
  }
  function combineDateTime(dateStr, timeStr){
    const d = new Date(dateStr + 'T00:00:00');
    if(timeStr){
      const m = timeStr.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
      if(m){
        let h = parseInt(m[1],10);
        const min = parseInt(m[2],10);
        const ap = m[3].toUpperCase();
        if(ap==='PM' && h!==12) h += 12;
        if(ap==='AM' && h===12) h = 0;
        d.setHours(h, min, 0, 0);
      }
    }
    return d;
  }
  function hoursUntil(dateStr, timeStr){
    const target = combineDateTime(dateStr, timeStr);
    return (target.getTime() - Date.now()) / 3600000;
  }

  // ---------- recurrence ----------
  function isRepeating(t){ return t.repeat && t.repeat !== 'none'; }
  function getOccurrenceDates(t, windowStartStr, windowEndStr){
    if(!t.date) return [];
    if(!isRepeating(t)) return [t.date];
    const dates = [];
    let d = new Date(t.date + 'T00:00:00');
    const end = new Date(windowEndStr + 'T00:00:00');
    const start = new Date(windowStartStr + 'T00:00:00');
    let count = 0;
    while(d <= end && count < 500){
      if(d >= start) dates.push(dateToStr(d));
      if(t.repeat === 'weekly') d.setDate(d.getDate()+7);
      else if(t.repeat === 'biweekly') d.setDate(d.getDate()+14);
      else if(t.repeat === 'monthly') d.setMonth(d.getMonth()+1);
      else break;
      count++;
    }
    return dates;
  }
  function getOcc(t, date){
    if(!isRepeating(t)) return { rsvp: t.rsvp||null, result: t.result||null, skip:false, googleEventId: t.googleEventId||null };
    const o = (t.occurrences && t.occurrences[date]) || {};
    return { rsvp: o.rsvp||null, result: o.result||null, skip: !!o.skip, googleEventId: o.googleEventId||null };
  }
  function setOcc(t, date, patch){
    if(!isRepeating(t)){ Object.assign(t, patch); return; }
    t.occurrences = t.occurrences || {};
    t.occurrences[date] = Object.assign({}, t.occurrences[date], patch);
  }

  // Restores from a file produced by exportMyData(). Deliberately asks
  // whether to merge or replace rather than guessing — replacing is
  // destructive and should never happen by accident.
  function importMyData(){
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json,.json';
    input.onchange = async ()=>{
      const file = input.files && input.files[0];
      if(!file) return;
      let payload;
      try{
        payload = JSON.parse(await file.text());
      }catch(e){ showToast(tr('xThatFileIsNotValid')); return; }

      if(!payload || !Array.isArray(payload.tournaments)){
        showToast(tr('xThatDoesnTLookLike'));
        return;
      }
      if(!userDataLoaded){
        showToast(tr('xYourDataHasNotLoaded'));
        return;
      }

      const incoming = payload.tournaments;
      const incomingDecks = Array.isArray(payload.decks) ? payload.decks : [];

      openChoiceDialog({
        title: tr('importDataTitle'),
        message: trf('importFileHas', { what: trf(incoming.length===1?'event1':'eventsN', { n: incoming.length }) + (incomingDecks.length ? ' ' + tr('andWord') + ' ' + trf(incomingDecks.length===1?'deck1':'decksN', { n: incomingDecks.length }) : '') }),
        choices: [
          { label: tr('importMerge'), action: async ()=>{
              let added = 0, skipped = 0;
              incoming.forEach(e=>{
                if(isDuplicateEvent(e)){ skipped++; return; }
                // Give the restored event a fresh id so it can't collide
                // with anything currently in the list.
                tournaments.push({ ...e, id: uid() });
                added++;
              });
              incomingDecks.forEach(d=>{
                if(decks.some(x=>x.name === d.name && x.game === d.game)) return;
                const deck = { ...d, id: d.id || deckUid() };
                reviveIds('decks', deck.id);   // restoring a deck you once deleted must not be refused
                decks.push(deck);
              });
              await saveTournaments();
              await saveDecks();
              render();
              showToast(trf(added===1?'importedEvent1':'importedEventsN', { n: added }) + (skipped ? ' ' + trf(skipped===1?'skippedDup1':'skippedDupsN', { n: skipped }) : ''));
            } },
          { label: tr('importReplace'), danger:true, action: async ()=>{
              if(!confirm(tr('xThisWillDeleteAllYour'))) return;
              const newTournaments = incoming.map(e=>({ ...e, id: e.id || uid() }));
              const newDecks = incomingDecks.map(d=>({ ...d, id: d.id || deckUid() }));
              // What is being replaced counts as deleted (so other devices do not bring it back);
              // what the file contains counts as alive again, even if its ids were deleted before.
              markDeleted('tournaments', tournaments.map(x=>x.id).filter(id=>!newTournaments.some(n=>n.id===id)));
              markDeleted('decks', decks.map(x=>x.id).filter(id=>!newDecks.some(n=>n.id===id)));
              reviveIds('tournaments', newTournaments.map(x=>x.id));
              reviveIds('decks', newDecks.map(x=>x.id));
              tournaments = newTournaments;
              decks = newDecks;
              await saveTournaments();
              await saveDecks();
              render();
              showToast(tr('xDataReplacedFromFile'));
            } }
        ]
      });
    };
    input.click();
  }

  // Tracks whether we have genuinely loaded this user's data from the server.
  // This matters a lot: if a load FAILS (blocked network on a locked-down
  // machine, transient error, etc) we must never let an empty in-memory list
  // get written back over real server data. Every save is gated on this.
  let userDataLoaded = false;

  // Server-side version of the user_data row, used for optimistic-concurrency
  // saves (see save_user_data in master-schema.sql). null means "not
  // available" — either the column/function hasn't been added yet, or we're
  // running against an older database — and saves fall back to a plain upsert.
  let userDataVersion = null;

  // What this account has deleted, so a deletion is not undone when another device that still
  // has the item saves (the old id-based merge kept items that exist on only one side). Shape:
  //   { tournaments: { id: deletedAtMs }, decks: { id: deletedAtMs } }
  // Stored in user_data.deleted, NOT inside the arrays: an older cached copy of the app
  // renders every array item as an event. A deletion always beats a stale copy elsewhere.
  // Only takes effect once the database has the column (deletedSupported), so the app still
  // works if the newest SQL has not been run.
  let deleted = { tournaments: {}, decks: {} };
  let deletedSupported = false;
  // ids brought back on purpose (an import) since the last successful save; a server-side
  // record of the same id must not win over them when a conflict is merged.
  const revived = { tournaments: new Set(), decks: new Set() };
  const DELETED_KEEP_MS = 60 * 24 * 60 * 60 * 1000;   // after this, a device that never synced could bring the item back
  const isDeleted = (kind, id)=> id != null && Object.prototype.hasOwnProperty.call(deleted[kind], String(id));
  const dropDeleted = (kind, arr)=> (arr || []).filter(x=> !(x && isDeleted(kind, x.id)));
  function markDeleted(kind, ids){
    const now = Date.now();
    [].concat(ids).forEach(id=>{ if(id != null){ deleted[kind][String(id)] = now; revived[kind].delete(String(id)); } });
  }
  function reviveIds(kind, ids){
    [].concat(ids).forEach(id=>{ if(id != null){ delete deleted[kind][String(id)]; revived[kind].add(String(id)); } });
  }
  // Accepts whatever the server sent (or nothing) and returns a clean {tournaments, decks} pair of maps.
  function normalizeDeleted(raw){
    const out = { tournaments: {}, decks: {} };
    ['tournaments', 'decks'].forEach(kind=>{
      const m = raw && typeof raw === 'object' && raw[kind];
      if(m && typeof m === 'object' && !Array.isArray(m)){
        Object.keys(m).forEach(id=>{ const ts = Number(m[id]); if(Number.isFinite(ts)) out[kind][id] = ts; });
      }
    });
    return out;
  }
  // Union of what the server knows and what we know (latest time wins), minus anything we
  // deliberately brought back. Used when a save conflicts and the server copy is merged in.
  function mergeDeleted(serverRaw){
    const server = normalizeDeleted(serverRaw);
    ['tournaments', 'decks'].forEach(kind=>{
      Object.keys(server[kind]).forEach(id=>{
        if(revived[kind].has(id)) return;
        if(!(id in deleted[kind]) || server[kind][id] > deleted[kind][id]) deleted[kind][id] = server[kind][id];
      });
    });
  }
  function pruneDeleted(){
    const cutoff = Date.now() - DELETED_KEEP_MS;
    ['tournaments', 'decks'].forEach(kind=>{
      Object.keys(deleted[kind]).forEach(id=>{ if(deleted[kind][id] < cutoff) delete deleted[kind][id]; });
    });
    return deleted;
  }

  // ---- Offline edits ------------------------------------------------------------------
  // Changes made while the server can't be reached are kept on this device and sent later.
  //   baseSnapshot  the lists as of the last successful load/save; the common ancestor for merging
  //   pendingSync   which lists have changes the server has not confirmed
  //   offlineMode   the app opened from the local copy because the server was unreachable
  // Syncing merges THREE ways, item by item (base vs ours vs the server's), so a day offline never
  // reverts something you did not touch that another device changed meanwhile.
  let baseSnapshot = { tournaments: [], decks: [] };
  let offlineMode = false;
  const pendingSync = { tournaments: false, decks: false };
  let syncing = false, syncTimer = null;
  const SYNC_RETRY_MS = 30000;
  const cloneJSON = x => JSON.parse(JSON.stringify(x));
  const hasPending = ()=> pendingSync.tournaments || pendingSync.decks;
  // Key-order-independent text form, so "same content" compares equal after a JSON round trip.
  function canon(x){
    if(Array.isArray(x)) return '[' + x.map(canon).join(',') + ']';
    if(x && typeof x === 'object'){
      return '{' + Object.keys(x).filter(k=>x[k] !== undefined).sort().map(k=>JSON.stringify(k) + ':' + canon(x[k])).join(',') + '}';
    }
    return JSON.stringify(x);
  }
  // For each id: something WE changed or added wins; something we left alone takes the server's
  // copy (which may be newer); something recorded as deleted is dropped; something we deleted
  // stays deleted; something the server has that we never had is kept. With no base (a copy from
  // before this existed) every local item counts as changed, which is the old "local wins".
  function merge3(kind, base, local, server){
    const byId = arr => { const m = new Map(); (arr || []).forEach(x=>{ if(x && x.id != null) m.set(String(x.id), x); }); return m; };
    const b = byId(base), l = byId(local), sv = byId(server);
    const noId = [...(local || []), ...(server || [])].filter(x=>!x || x.id == null);   // very old items with no id can't be matched: keep them all
    const out = [];
    new Set([...sv.keys(), ...l.keys()]).forEach(id=>{
      if(isDeleted(kind, id)) return;
      const inL = l.has(id), inS = sv.has(id), inB = b.has(id);
      const changedHere = inL && (!inB || canon(l.get(id)) !== canon(b.get(id)));
      if(changedHere) out.push(l.get(id));
      else if(inS) { if(inL || !inB) out.push(sv.get(id)); }   // !inL && inB: we removed it -> stays removed
      // inL && inB && !inS && untouched: the server removed it elsewhere -> respect that
    });
    return out.concat(noId);
  }
  function updateSyncPill(){
    let pill = document.getElementById('syncPill');
    const show = offlineMode || hasPending();
    if(!show){ if(pill) pill.remove(); return; }
    if(!pill){ pill = document.createElement('div'); pill.id = 'syncPill'; pill.className = 'sync-pill'; pill.setAttribute('role', 'status'); document.body.appendChild(pill); }
    pill.textContent = offlineMode ? tr('syncOffline') : tr('syncWaiting');
  }
  function scheduleSync(delay){
    clearTimeout(syncTimer);
    if(hasPending()) syncTimer = setTimeout(()=>{ syncPending(); }, delay == null ? SYNC_RETRY_MS : delay);
  }

  // Last successfully loaded events/decks, kept in localStorage purely so the
  // list can still be SHOWN when the network is down (e.g. bad venue wifi).
  // It is never written back to the server: a load that falls back to this
  // leaves userDataLoaded false, which blocks every save. Cleared on sign-out.
  const OFFLINE_CACHE_PREFIX = 'pairings-offline:';
  function writeOfflineCache(){
    try{ localStorage.setItem(OFFLINE_CACHE_PREFIX + session.user.id, JSON.stringify({ tournaments, decks, deleted, base: baseSnapshot, version: userDataVersion, deletedSupported, dirty: pendingSync, at: Date.now() })); }catch(e){}
  }
  function readOfflineCache(){
    try{
      const raw = localStorage.getItem(OFFLINE_CACHE_PREFIX + session.user.id);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function clearOfflineCache(){
    try{
      Object.keys(localStorage).filter(k=>k.startsWith(OFFLINE_CACHE_PREFIX)).forEach(k=>localStorage.removeItem(k));
    }catch(e){}
  }

  // Newest column set first; an older database (SQL not run yet) errors on a missing column and
  // we retry with fewer, so the app works whichever order things were deployed.
  async function fetchUserDataRow(){
    const COLUMN_SETS = ['tournaments, decks, version, deleted', 'tournaments, decks, version', 'tournaments, decks'];
    let res, used = 0;
    for(; used < COLUMN_SETS.length; used++){
      res = await supabaseClient.from('user_data').select(COLUMN_SETS[used]).eq('user_id', session.user.id).maybeSingle();
      if(!(res.error && /version|deleted/i.test(res.error.message || ''))) break;
    }
    return { res, supported: used === 0,
             version: used <= 1 ? ((res.data && typeof res.data.version === 'number') ? res.data.version : (res.data ? null : 0)) : null };
  }

  async function loadTournaments(){
    try{
      const previous = readOfflineCache();   // read BEFORE it is overwritten below: may hold unsynced changes
      const { res, supported, version } = await fetchUserDataRow();
      deletedSupported = supported;
      if(!res.error) userDataVersion = version;
      if(res.error) throw res.error;
      const data = res.data;
      deleted = normalizeDeleted(deletedSupported && data ? data.deleted : null);
      revived.tournaments.clear(); revived.decks.clear();
      // Drop anything recorded as deleted that is still in the arrays (an older app version on
      // another device can write a deleted item back); the next save removes it from the server.
      tournaments = dropDeleted('tournaments', (data && data.tournaments) || []);
      decks = dropDeleted('decks', (data && data.decks) || []);
      baseSnapshot = { tournaments: cloneJSON(tournaments), decks: cloneJSON(decks) };
      userDataLoaded = true;
      offlineMode = false;
      // Changes from a previous visit that never reached the server: fold them into what we just
      // loaded (three-way) and send them.
      if(previous && previous.dirty && (previous.dirty.tournaments || previous.dirty.decks) && Array.isArray(previous.tournaments)){
        if(deletedSupported) mergeDeleted(previous.deleted);
        tournaments = dropDeleted('tournaments', merge3('tournaments', (previous.base || {}).tournaments, previous.tournaments, tournaments));
        decks = dropDeleted('decks', merge3('decks', (previous.base || {}).decks, previous.decks || [], decks));
        pendingSync.tournaments = !!previous.dirty.tournaments; pendingSync.decks = !!previous.dirty.decks;
        scheduleSync(0);
      }
      writeOfflineCache();
      updateSyncPill();
    }catch(e){
      // Deliberately do NOT clear tournaments/decks here — a failed load is
      // not evidence that the user has no data. Leaving userDataLoaded false
      // blocks any save until a load succeeds, so we can't overwrite the
      // server copy with an empty list.
      userDataLoaded = false;
      console.error('loadTournaments failed:', e);
      const cached = (!tournaments.length && !decks.length) ? readOfflineCache() : null;
      if(cached && Array.isArray(cached.tournaments)){
        deleted = normalizeDeleted(cached.deleted);
        tournaments = dropDeleted('tournaments', cached.tournaments);
        decks = dropDeleted('decks', Array.isArray(cached.decks) ? cached.decks : []);
        // Resume from the local copy. Edits are allowed and queued: they are merged into the
        // server's copy (three-way) when the connection comes back.
        baseSnapshot = cached.base && typeof cached.base === 'object' ? { tournaments: cached.base.tournaments || [], decks: cached.base.decks || [] }
                                                                       : { tournaments: cloneJSON(tournaments), decks: cloneJSON(decks) };
        userDataVersion = typeof cached.version === 'number' ? cached.version : null;
        deletedSupported = !!cached.deletedSupported;
        pendingSync.tournaments = !!(cached.dirty && cached.dirty.tournaments);
        pendingSync.decks = !!(cached.dirty && cached.dirty.decks);
        offlineMode = true;
        scheduleSync();
        updateSyncPill();
        showToast(tr('offlineShowingCopy'));
      } else {
        showToast(tr('xCouldNotLoadYourData'));
      }
    }
  }

  // Saves are serialized: two overlapping saves would both carry the same
  // expected version and the second would always look like a conflict.
  let saveQueue = Promise.resolve();
  function persistUserData(fields){
    const run = saveQueue.then(()=>doPersistUserData(fields));
    saveQueue = run.catch(()=>{});
    return run;
  }

  // fields: which of 'tournaments' / 'decks' this save is for. Values are read
  // from the live variables when the save actually runs, not when queued.
  async function doPersistUserData(fields){
    if(!userDataLoaded){
      if(offlineMode){
        // Working from the local copy: keep the change here and send it when we are back online.
        fields.forEach(f=>{ pendingSync[f] = true; });
        writeOfflineCache(); updateSyncPill(); scheduleSync();
        showToast(tr('savedOnDevice'));
        return true;
      }
      showToast(tr('xNotSavingYourDataHas'));
      return false;
    }
    // Recorded before the attempt, so a change is never lost if the page closes or the network drops.
    fields.forEach(f=>{ pendingSync[f] = true; });
    writeOfflineCache();
    try{
      if(userDataVersion !== null){
        for(let attempt = 0; attempt < 2; attempt++){
          const args = { p_expected_version: userDataVersion };
          if(fields.includes('tournaments')) args.p_tournaments = tournaments;
          if(fields.includes('decks')) args.p_decks = decks;
          if(deletedSupported) args.p_deleted = pruneDeleted();
          const { data, error } = await supabaseClient.rpc('save_user_data', args);
          if(error){
            // PGRST202 / 42883: function not found — migration not run yet.
            if(error.code === 'PGRST202' || error.code === '42883'){ userDataVersion = null; break; }
            throw error;
          }
          if(typeof data === 'number' && data >= 0){
            userDataVersion = data; revived.tournaments.clear(); revived.decks.clear();
            fields.forEach(f=>{ pendingSync[f] = false; baseSnapshot[f] = cloneJSON(f === 'tournaments' ? tournaments : decks); });
            writeOfflineCache(); updateSyncPill();
            return true;
          }
          // Version conflict: another device saved since we loaded. Pull its
          // copy, merge our changes onto it, and try once more.
          const { data: fresh, error: freshErr } = await supabaseClient.from('user_data').select(deletedSupported ? 'tournaments, decks, version, deleted' : 'tournaments, decks, version').eq('user_id', session.user.id).maybeSingle();
          if(freshErr || !fresh) throw (freshErr || new Error('reload after conflict failed'));
          // Learn what the other device deleted first: a deletion wins over our stale copy of the item.
          if(deletedSupported) mergeDeleted(fresh.deleted);
          tournaments = dropDeleted('tournaments', fields.includes('tournaments') ? merge3('tournaments', baseSnapshot.tournaments, tournaments, fresh.tournaments) : (fresh.tournaments || []));
          decks = dropDeleted('decks', fields.includes('decks') ? merge3('decks', baseSnapshot.decks, decks, fresh.decks) : (fresh.decks || []));
          // The server's copy is the new common ancestor for the retry (and for anything not saved here).
          baseSnapshot = { tournaments: cloneJSON(fresh.tournaments || []), decks: cloneJSON(fresh.decks || []) };
          userDataVersion = fresh.version;
          if(attempt === 1) throw new Error('save conflict persisted after merge');
          showToast(tr('xMergedChangesMadeOnAnother'));
          render();
        }
      }
      // Legacy path (database without save_user_data): plain upsert, but
      // the error is now actually checked — supabase-js returns { error }
      // rather than throwing, so the old try/catch never saw failures.
      const row = { user_id: session.user.id, updated_at: new Date().toISOString() };
      if(fields.includes('tournaments')) row.tournaments = tournaments;
      if(fields.includes('decks')) row.decks = decks;
      if(deletedSupported) row.deleted = pruneDeleted();
      const { error } = await supabaseClient.from('user_data').upsert(row, { onConflict: 'user_id' });
      if(error) throw error;
      revived.tournaments.clear(); revived.decks.clear();
      fields.forEach(f=>{ pendingSync[f] = false; baseSnapshot[f] = cloneJSON(f === 'tournaments' ? tournaments : decks); });
      writeOfflineCache(); updateSyncPill();
      return true;
    }catch(e){
      console.error('save failed:', e);
      // The change is already recorded on this device (see above); retry automatically.
      writeOfflineCache(); updateSyncPill(); scheduleSync();
      showToast(tr('saveQueued'));
      return false;
    }
  }

  // Sends changes that never reached the server: fold the server's current copy into ours
  // (three-way, item by item), then save the result. Runs on reconnect, on returning to the
  // tab, and on a timer while anything is waiting.
  async function syncPending(){
    if(syncing || !session || !hasPending()) return;
    syncing = true;
    const wasOffline = offlineMode;
    try{
      const { res, supported, version } = await fetchUserDataRow();
      if(res.error) throw res.error;               // still unreachable: try again later
      const server = res.data || { tournaments: [], decks: [] };
      deletedSupported = supported;
      if(supported) mergeDeleted(server.deleted);
      tournaments = dropDeleted('tournaments', merge3('tournaments', baseSnapshot.tournaments, tournaments, server.tournaments || []));
      decks = dropDeleted('decks', merge3('decks', baseSnapshot.decks, decks, server.decks || []));
      baseSnapshot = { tournaments: cloneJSON(server.tournaments || []), decks: cloneJSON(server.decks || []) };
      userDataVersion = version;
      userDataLoaded = true; offlineMode = false;
      const ok = await persistUserData(['tournaments', 'decks']);
      if(ok){ showToast(tr('syncedOffline')); }
      else if(wasOffline){ userDataLoaded = false; offlineMode = true; }
      render();
    }catch(e){
      console.error('sync failed:', e);
      if(wasOffline){ userDataLoaded = false; offlineMode = true; }
    }finally{
      syncing = false;
      updateSyncPill();
      scheduleSync();
    }
  }
  function saveTournaments(){ return persistUserData(['tournaments']); }
  function saveDecks(){ return persistUserData(['decks']); }

  async function syncAttendance(t, date){
    const occ = getOcc(t, date);
    // Store-synced events use a stable key based on the store event's own ID,
    // shared across everyone who follows that store — otherwise two friends
    // both attending the same store event would never be detected as
    // "going to the same event," since their local copies have different
    // randomly-generated ids.
    const key = t.storeEventId ? ('store:' + t.storeEventId + '::' + date) : (t.id + '::' + date);
    try{
      if(occ.rsvp === 'going'){
        if(t.lat == null || t.lng == null){
          const q = t.address || [t.store, t.city].filter(Boolean).join(', ');
          const geo = await geocode(q);
          if(geo){ t.lat = geo.lat; t.lng = geo.lng; saveTournaments(); }
        }
        await supabaseClient.from('attendances').upsert({
          user_id: session.user.id, occurrence_key: key, event_name: t.name, event_date: date,
          store: t.store||null, address: t.address||null, lat: t.lat||null, lng: t.lng||null,
          time: t.time || null
        }, { onConflict: 'user_id,occurrence_key' });
      } else {
        await supabaseClient.from('attendances').delete().eq('user_id', session.user.id).eq('occurrence_key', key);
      }
    }catch(e){ /* non-fatal */ }
  }

  // Marks whether a result has been logged for an attended event, so the
  // "remind me to log results" scheduled job (remind_log_results in master-schema.sql) knows to skip it.
  // Safe no-op if the reminders migration hasn't been run yet — errors are swallowed.
  async function syncResultLogged(t, date, logged){
    try{
      const key = t.storeEventId ? ('store:' + t.storeEventId + '::' + date) : (t.id + '::' + date);
      await supabaseClient.from('attendances')
        .update({ result_logged: logged, reminded: logged ? true : false })
        .eq('user_id', session.user.id)
        .eq('occurrence_key', key);
    }catch(e){ /* non-fatal, and expected until the reminders migration is run */ }
  }

  async function loadFriendsData(){
    friendsAccepted = []; pendingIncoming = []; pendingOutgoing = []; profilesById = {};
    try{
      const { data: fs } = await supabaseClient.from('friendships').select('*')
        .or(`requester_id.eq.${session.user.id},addressee_id.eq.${session.user.id}`);
      const list = fs || [];
      for(const f of list){
        const otherId = f.requester_id === session.user.id ? f.addressee_id : f.requester_id;
        if(f.status === 'accepted') friendsAccepted.push({ friendshipId: f.id, userId: otherId });
        else if(f.addressee_id === session.user.id) pendingIncoming.push({ friendshipId: f.id, userId: otherId });
        else pendingOutgoing.push({ friendshipId: f.id, userId: otherId });
      }
      const ids = [...new Set(list.map(f=>f.requester_id===session.user.id?f.addressee_id:f.requester_id))];
      if(ids.length){
        const { data: profs } = await supabaseClient.from('profiles').select('id,display_name,username').in('id', ids);
        (profs||[]).forEach(p=>profilesById[p.id]=p);
      }
    }catch(e){ /* ignore */ }
  }

  function friendLabel(userId){
    const p = profilesById[userId];
    if(!p) return tr('someone');
    return p.display_name || (p.username ? '@'+p.username : tr('someone'));
  }
  function friendSubLabel(userId){
    const p = profilesById[userId];
    if(!p) return '';
    return p.display_name && p.username ? '@'+p.username : '';
  }

  // Is this person already a friend, or is a request already in flight
  // either direction? Used to avoid offering "+ Friend" for someone you're
  // already connected to.
  function friendState(userId){
    if(friendsAccepted.some(p=>p.userId === userId)) return 'friends';
    if(pendingIncoming.some(p=>p.userId === userId)) return 'pending';
    if(pendingOutgoing.some(p=>p.userId === userId)) return 'pending';
    return 'none';
  }

  async function sendFriendRequest(identifier){
    try{
      let raw = (identifier||'').trim();
      if(!raw) return false;
      // A leading @ is a username convention, not part of the value.
      const stripped = raw.replace(/^@/, '');
      // Only treat it as an email if the @ is in the middle (a@b), not a
      // leading @username — otherwise "@someone" was being searched as email.
      const isEmail = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(raw);

      let target = null;
      let ambiguous = [];

      if(isEmail){
        // Emails aren't readable from the profiles table any more; this
        // exact-match function returns only id/username/display_name.
        let res = await supabaseClient.rpc('find_profile_by_email', { p_email: raw }).maybeSingle();
        if(res.error && (res.error.code === 'PGRST202' || res.error.code === '42883')){
          res = await supabaseClient.from('profiles').select('id, username, display_name')
            .eq('email', raw.toLowerCase()).maybeSingle();
        }
        target = res.data;
      } else {
        // Try username first (it's unique), then fall back to display name
        // (which isn't, so we may find several).
        const { data: byUser } = await supabaseClient.from('profiles').select('id, username, display_name')
          .ilike('username', stripped).maybeSingle();
        if(byUser){
          target = byUser;
        } else {
          const { data: byName } = await supabaseClient.from('profiles').select('id, username, display_name')
            .ilike('display_name', stripped).limit(5);
          if(byName && byName.length === 1) target = byName[0];
          else if(byName && byName.length > 1) ambiguous = byName;
        }
      }

      if(ambiguous.length){
        // Display names aren't unique — don't guess which person they meant.
        const names = ambiguous.map(p=>p.username ? '@'+p.username : (p.display_name||'someone')).join(', ');
        showToast(trf('severalPeople', { names }));
        return false;
      }
      if(!target){
        showToast(tr('noAccountFound'));
        return false;
      }
      if(target.id === session.user.id){ showToast(tr('thatsYou')); return false; }

      const { error } = await supabaseClient.from('friendships').insert({ requester_id: session.user.id, addressee_id: target.id, status: 'pending' });
      if(error){
        showToast(error.code === '23505' ? tr('xAlreadyFriendsOrARequest') : tr('couldNotSendRequest'));
        return false;
      }
      showToast(tr('friendRequestSent'));
      await loadFriendsData();
      return true;
    }catch(e){ showToast(tr('couldNotSendRequest')); return false; }
  }
  async function acceptFriend(friendshipId){
    try{ await supabaseClient.from('friendships').update({ status:'accepted' }).eq('id', friendshipId); await loadFriendsData(); }
    catch(e){ showToast(tr('couldNotAccept')); }
  }
  async function removeFriendship(friendshipId){
    try{ await supabaseClient.from('friendships').delete().eq('id', friendshipId); await loadFriendsData(); }
    catch(e){ showToast(tr('couldNotUpdateFriends')); }
  }

  async function loadNotifications(){
    try{
      const { data } = await supabaseClient.from('notifications').select('*').eq('user_id', session.user.id)
        .order('created_at', { ascending:false }).limit(50);
      notifications = data || [];
      const inviteIds = [...new Set(notifications.filter(n=>n.type==='event_invite' && n.related_invitation_id).map(n=>n.related_invitation_id))];
      if(inviteIds.length){
        const { data: invites } = await supabaseClient.from('event_invitations').select('id,status').in('id', inviteIds);
        (invites||[]).forEach(i=>{ invitationStatusById[i.id] = i.status; });
      }
    }catch(e){ notifications = []; }
  }
  function unreadCount(){ return notifications.filter(n=>!n.read).length; }
  async function markAllRead(){
    try{
      await supabaseClient.from('notifications').update({ read:true }).eq('user_id', session.user.id).eq('read', false);
      notifications.forEach(n=>n.read=true);
    }catch(e){}
  }
  async function deleteNotification(id){
    notifications = notifications.filter(n=>n.id!==id); // update immediately, don't wait on the network
    try{
      await supabaseClient.from('notifications').delete().eq('id', id).eq('user_id', session.user.id);
    }catch(e){ showToast(tr('couldNotDeleteRetry')); }
  }

  let realtimeSubscribed = false;
  let realtimeChannel = null;
  function subscribeRealtime(){
    if(realtimeSubscribed) return; // never try to re-subscribe an already-subscribed channel
    realtimeSubscribed = true;
    realtimeChannel = supabaseClient.channel('notif-' + session.user.id)
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'notifications', filter:`user_id=eq.${session.user.id}` }, payload=>{
        notifications.unshift(payload.new);
        showToast('🔔 ' + localizeNotification(payload.new));
        render();
      })
      .subscribe();
  }

  // iOS aggressively suspends background network connections (including the
  // realtime websocket) for installed home-screen web apps, and doesn't
  // reliably signal that it happened — so the app has no way to know its
  // live connection died. This forces a full refresh and a clean reconnect
  // every time the app becomes visible again (reopened from background,
  // switched back to from another app, etc.), which is the only reliable
  // way to recover on iOS specifically.
  // hiddenMs: how long the page was in the background. Tab-flicking back and
  // forth is common, and a full reload (3 fetches + store sync + re-render) on
  // every flick is wasteful, so the data reload only runs after 60s away.
  // The realtime reconnect ALWAYS runs — iOS can kill the socket within
  // seconds and gives no signal that it did. hiddenMs undefined = bfcache
  // restore, where we know nothing about how long it was away, so reload.
  async function refreshOnResume(hiddenMs){
    if(!session) return;
    if(hiddenMs === undefined || hiddenMs > 60000){
      try{
        await Promise.all([loadTournaments(), loadFriendsData(), loadNotifications()]);
        await syncFollowedStoreEvents();
        render();
      }catch(e){ /* non-fatal */ }
    }
    try{
      if(realtimeChannel){ await supabaseClient.removeChannel(realtimeChannel); realtimeChannel = null; }
    }catch(e){}
    realtimeSubscribed = false;
    subscribeRealtime();
  }
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'hidden'){ hiddenAt = Date.now(); return; }
    refreshOnResume(hiddenAt ? Date.now() - hiddenAt : undefined);
  });
  window.addEventListener('pageshow', (e)=>{
    if(e.persisted) refreshOnResume(); // page restored from iOS's back-forward cache
  });

  // ---------- Push notifications ----------
  function urlBase64ToUint8Array(base64String){
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g,'+').replace(/_/g,'/');
    const rawData = atob(base64);
    const arr = new Uint8Array(rawData.length);
    for(let i=0;i<rawData.length;i++) arr[i] = rawData.charCodeAt(i);
    return arr;
  }
  function registerServiceWorker(){
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('/sw.js').catch(()=>{ /* non-fatal — push just won't be available */ });
      // A notification was tapped while the app was already open (see sw.js).
      navigator.serviceWorker.addEventListener('message', (ev)=>{
        const d = ev && ev.data;
        if(d && d.type === 'open' && isOpenTarget(d.name) && session && !bootstrapping) OPEN_TARGETS[d.name]();
        // A bracket pairing push: open that bracket (an id only, checked like the ?bracket= link).
        if(d && d.type === 'bracket' && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(d.id || '') && session && !bootstrapping){
          document.querySelectorAll('.overlay').forEach(o => o.remove());
          openBracketViewModal(d.id.toLowerCase());
        }
      });
    }
  }

  async function checkPushEnabled(){
    if(!('serviceWorker' in navigator)) { pushEnabled = false; return; }
    try{
      const reg = await navigator.serviceWorker.getRegistration();
      const sub = reg ? await reg.pushManager.getSubscription() : null;
      if(!sub){ pushEnabled = false; return; }
      const { data } = await supabaseClient.from('push_subscriptions').select('id').eq('endpoint', sub.endpoint).maybeSingle();
      pushEnabled = !!data;
    }catch(e){ pushEnabled = false; }
  }
  async function enablePush(){
    if(!('serviceWorker' in navigator) || !('PushManager' in window)){
      showToast(tr('xPushNotificationsAreNotSupported')); return;
    }
    try{
      const reg = await navigator.serviceWorker.register('/sw.js');
      const perm = await Notification.requestPermission();
      if(perm !== 'granted'){ showToast(tr('xNotificationPermissionWasDenied')); return; }
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
      const j = sub.toJSON();
      const { error } = await supabaseClient.from('push_subscriptions').upsert({
        user_id: session.user.id, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth
      }, { onConflict: 'endpoint' });
      if(error){
        console.error('push_subscriptions upsert failed', error);
        showToast(tr('xSavedOnThisDeviceBut') + error.message);
        pushEnabled = false;
        render();
        return;
      }
      pushEnabled = true;
      showToast(tr('xPushNotificationsEnabledOnThis'));
      render();

  // [calendar-timing:start]
  // Reads a start time (and, for a range, a duration) out of the event's free-text time:
  //   "6:00 PM", "6pm", "7:30 p.m.", "18:00", "6:00 PM - 9:30 PM"  ->  { startTime:'18:00', durationMinutes }
  // Anything unclear returns null and the event stays all-day: a bare "6:00" could be
  // morning or evening, and a wrong time on someone's calendar is worse than none.
  const DEFAULT_EVENT_MINUTES = 180;   // most local events run about three hours
  function eventTiming(t){
    const s = String((t && t.time) || '');
    // No lookbehind (older iOS Safari can't even parse the page if one appears): a leading
    // group stops "1:30" from matching inside "11:30".
    const re = /(^|[^\d:])(\d{1,2})(?::([0-5]\d))?\s*([ap])\.?m\b\.?|(^|[^\d:])(\d{1,2}):([0-5]\d)(?!\s*[ap]\.?m\b)(?![\d:])/gi;
    const found = [];
    let m;
    while((m = re.exec(s))){
      let h, min, hourText;
      const lead = (m[1] !== undefined ? m[1] : m[5]) || '';
      if(m[4]){                                   // 12-hour, with am/pm
        h = +m[2]; min = m[3] ? +m[3] : 0;
        if(h < 1 || h > 12) continue;
        h = (h % 12) + (m[4].toLowerCase() === 'p' ? 12 : 0);
      } else {                                    // 24-hour, no am/pm
        hourText = m[6]; h = +hourText; min = +m[7];
        if(h > 23) continue;
        // 1:00-11:59 without a leading zero is ambiguous (morning or evening?) -> not usable
        if(h >= 1 && h <= 11 && hourText.length === 1) return null;
      }
      found.push({ h, min, index: m.index + lead.length, end: m.index + m[0].length });
    }
    if(!found.length) return null;
    const startMin = found[0].h * 60 + found[0].min;
    let minutes = DEFAULT_EVENT_MINUTES;
    if(found[1] && /^\s*(?:-|–|—|to|until|till)\s*$/i.test(s.slice(found[0].end, found[1].index))){
      let d = found[1].h * 60 + found[1].min - startMin;
      if(d <= 0) d += 24 * 60;                    // "9:00 PM - 1:00 AM" runs past midnight
      if(d >= 15 && d <= 24 * 60) minutes = d;
    }
    return { startTime: String(found[0].h).padStart(2,'0') + ':' + String(found[0].min).padStart(2,'0'), durationMinutes: minutes };
  }
  // Wall-clock start/end as YYYYMMDDTHHMMSS (no zone), plain arithmetic, so it runs past midnight correctly.
  function timedRangeCompact(date, timing){
    const [y, mo, d] = date.split('-').map(Number);
    const [h, mi] = timing.startTime.split(':').map(Number);
    const startMs = Date.UTC(y, mo - 1, d, h, mi);
    const fmt = ms => new Date(ms).toISOString().slice(0, 19).replace(/[-:]/g, '');
    return { start: fmt(startMs), end: fmt(startMs + timing.durationMinutes * 60000) };
  }
  function userTimeZone(){
    try{ const tz = Intl.DateTimeFormat().resolvedOptions().timeZone; if(tz) return tz; }catch(e){}
    return (profile && profile.timezone && profile.timezone !== 'UTC') ? profile.timezone : null;
  }
  // [calendar-timing:end]
  async function syncEventToGoogle(t, date){
    const occ = getOcc(t, date);
    // A readable start time makes a timed event; otherwise it stays all-day, as before.
    const timing = eventTiming(t), tz = userTimeZone();
    const timed = timing && tz ? { startTime: timing.startTime, durationMinutes: timing.durationMinutes, timeZone: tz } : {};
    try{
      const res = await fetch(FUNCTIONS_URL + '/sync-calendar-event', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + session.access_token },

        }, timed)})
      });
      const json = await res.json();
      if(json.error){ showToast(json.error); return; }
      setOcc(t, date, { googleEventId: json.googleEventId });
      saveTournaments();
